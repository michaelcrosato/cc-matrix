<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix Dashboard</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6a66; --line: #e2e1dc;
  --accent: #2f5bd3; --accent-ink: #ffffff; --soft: #eef1fb; --ok: #1f7a46; --bad: #b3261e; --warn: #9a6200;
  --chip: #f0efeb; --chip-on: #dfe7fd; --code: #f3f2ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --panel: #1e1e1d; --ink: #ecebe7; --muted: #9a9993; --line: #33332f;
    --accent: #7f9cff; --accent-ink: #0d1330; --soft: #232a40; --ok: #6fcf97; --bad: #ff8a80; --warn: #f2c063;
    --chip: #2a2a28; --chip-on: #2c3657; --code: #232321;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --panel: #1e1e1d; --ink: #ecebe7; --muted: #9a9993; --line: #33332f;
  --accent: #7f9cff; --accent-ink: #0d1330; --soft: #232a40; --ok: #6fcf97; --bad: #ff8a80; --warn: #f2c063;
  --chip: #2a2a28; --chip-on: #2c3657; --code: #232321;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; padding: 10px 16px; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; }
nav button.on { background: var(--soft); color: var(--ink); font-weight: 600; }
.pill { margin-left: auto; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 13px; }
.pill.live { background: var(--soft); color: var(--accent); font-weight: 600; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
section.tab { display: none; } section.tab.on { display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; } .card .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.invalid { border-color: var(--bad) !important; background: color-mix(in srgb, var(--bad) 8%, var(--bg)); }
.mono, textarea.mono { font-family: ui-monospace, "Cascadia Mono", "Ubuntu Mono", Menlo, monospace; font-size: 13px; }
button.btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
button.btn:hover { background: var(--chip); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.05); background: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.icon { font: inherit; border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 6px; cursor: pointer; }
button.icon:hover { background: var(--chip); color: var(--ink); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--chip); cursor: pointer; user-select: none; border: 1px solid transparent; }
.chip input { margin: 0; }
.chip.on { background: var(--chip-on); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--ok); } .tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.variant { display: grid; grid-template-columns: 140px 1fr auto; gap: 8px; align-items: start; margin-bottom: 8px; }
@media (max-width: 640px) { .variant { grid-template-columns: 1fr; } }
.dim-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.savebar { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 -6px 20px rgb(0 0 0 / .06); }
.big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
.stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
pre.log { background: var(--code); border-radius: 8px; padding: 10px; height: 260px; overflow: auto; margin: 0; font-size: 12.5px; white-space: pre-wrap; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); width: min(900px, 94vw); max-height: 86vh; padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog .dhead { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
dialog .dbody { padding: 16px; overflow: auto; max-height: calc(86vh - 56px); }
dialog pre { white-space: pre-wrap; margin: 0; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.grid2 > * { min-width: 0; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.errs { color: var(--bad); font-size: 13px; } .errs div::before { content: "• "; }
.warns { color: var(--warn); font-size: 13px; } .warns div::before { content: "• "; }
td input.score { width: 64px; } td input.notes { width: 180px; }
tr.failed td { color: var(--bad); }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Matrix Dashboard</h1>
  <nav>
    <button data-tab="setup">Setup</button>
    <button data-tab="run">Run</button>
    <button data-tab="results">Results</button>
  </nav>
  <span id="pill" class="pill">Idle</span>
  <button class="icon" id="theme" title="Toggle light/dark">Theme</button>
</header>
<main>
  <section class="tab" id="tab-setup"></section>
  <section class="tab" id="tab-run"></section>
  <section class="tab" id="tab-results"></section>
</main>
<dialog id="modal"><div class="dhead"><strong id="mtitle" class="grow"></strong><button class="icon" onclick="modal.close()">✕</button></div><div class="dbody" id="mbody"></div></dialog>

<script>
// ------------------------------------------------------------------ basics
const $ = (s, el = document) => el.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k in el && !['list', 'type'].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
async function api(path, method = 'GET', data) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: data === undefined ? undefined : JSON.stringify(data) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const fmt = (v, d = 1) => v == null || Number.isNaN(v) ? '—' : (+v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtTok = (v) => v == null ? '—' : v >= 1e6 ? fmt(v / 1e6, 2) + 'M' : v >= 1e3 ? fmt(v / 1e3, 0) + 'K' : String(v);
const fmtUsd = (v) => v == null ? '—' : '$' + fmt(v, 2);
const fmtMin = (v) => v == null ? '—' : v >= 60 ? fmt(v / 60, 1) + 'h' : fmt(v, 0) + 'm';
// Mirrors run-matrix.mjs: 'high-uc' = high effort with Ultracode on (Claude Code only).
function parseEffort(e) {
  let s = String(e ?? '').trim().toLowerCase(), uc = false;
  const m = s.match(/^(.*?)[\s+-]*(uc|ultracode)$/);
  if (m) { uc = true; s = m[1]; }
  const base = !s || s === 'default' ? null : s;
  return { base, ultracode: uc, label: `${base ?? 'default'}${uc ? '-uc' : ''}` };
}
const effName = (e) => parseEffort(e).label;
const GOAL_DIM = 'goal';
// Efforts that actually run for this model (Ultracode is skipped outside Claude Code).
const effortsOf = (a) => (a.efforts?.length ? a.efforts : ['default']).map(effName)
  .filter((e) => a.provider === 'claude' || !e.endsWith('-uc'));
const RESERVED = ['model', 'effort', 'lab', 'environment', 'stamp', 'date'];
const PROVIDERS = { claude: 'Claude Code', codex: 'Codex', grok: 'Grok', agy: 'Antigravity (agy)', muse: 'Muse Code' };
// Mirrors run-matrix.mjs. Effort levels each CLI accepts; agy and Muse narrow them per model (see the CLIs card).
const EFFORTS = { claude: ['low', 'medium', 'high', 'xhigh', 'max'], codex: ['low', 'medium', 'high', 'xhigh', 'max', 'ultra'],
  grok: ['low', 'medium', 'high', 'xhigh'], agy: ['low', 'medium', 'high', 'xhigh', 'max'],
  muse: ['none', 'minimal', 'low', 'medium', 'high', 'xhigh', 'max', 'ultra'] };
const GOAL_CLIS = ['claude', 'grok', 'agy', 'muse']; // run /goal headless; Codex only runs the empty goal variant
const DEFAULT_EXTRA = { claude: ['--dangerously-skip-permissions'], codex: ['--yolo'],
  grok: ['--always-approve'], agy: ['--dangerously-skip-permissions'], muse: ['--yolo'] };
const fmtSecs = (s) => s == null ? '—' : s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s / 60)}m` : `${fmt(s / 3600, 1)}h`;
const since = (iso) => iso ? fmtSecs((Date.now() - new Date(iso)) / 1000) : '';

// theme
const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get('matrix.theme', null));
$('#theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; applyTheme(next); store.set('matrix.theme', next);
};

// ------------------------------------------------------------------ state
const logPre = h('pre', { class: 'log mono', id: 'logpre' });
let cfg = null, savedCfg = '', tmpl = '', savedTmpl = '', meta = {}, results = [], status = {}, logSince = 0;
let clis = {}, cliCheckedAt = null, smokes = {}, smokeGoal = store.get('matrix.smokeGoal', false);
let sel = store.get('matrix.sel', { offPick: [], offOnly: {}, opts: { repeat: 1, concurrency: 2, perCli: '', budget: '', timeout: '', rerunFailed: false } });
let rv = store.get('matrix.results', { group: 'testing', filters: {}, q: '', sort: { k: 'finishedAt', d: -1 } });
const saveSel = () => store.set('matrix.sel', sel);
const saveRv = () => store.set('matrix.results', rv);
const dirty = () => JSON.stringify(cfg) !== savedCfg || tmpl !== savedTmpl;

// tabs
let tab = location.hash.slice(1) || store.get('matrix.tab', 'run');
function showTab(t) {
  tab = t; store.set('matrix.tab', t); history.replaceState(null, '', '#' + t);
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('section.tab').forEach((s) => s.classList.toggle('on', s.id === 'tab-' + t));
  if (t === 'results') renderResults();
  if (t === 'run') renderRun();
}
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => showTab(b.dataset.tab));
addEventListener('hashchange', () => { const t = location.hash.slice(1); if (cfg && ['setup', 'run', 'results'].includes(t) && t !== tab) showTab(t); });

// ------------------------------------------------------------------- CLIs
const cliModels = (p) => clis[p]?.models ?? [];
// The models Setup offers. `key` is the run name (it goes in run folders and results); efforts
// are the fallback when the CLI can't be asked, otherwise its per-model list wins.
const CATALOG = [
  { key: 'opus', provider: 'claude', model: 'claude-opus-5-5', label: 'Claude Opus 5.5' },
  { key: 'sonnet', provider: 'claude', model: 'claude-sonnet-5-5', label: 'Claude Sonnet 5.5' },
  { key: 'haiku', provider: 'claude', model: 'claude-haiku-5-5', label: 'Claude Haiku 5.5' },
  { key: 'gpt-6.1-sol', provider: 'codex', model: 'gpt-6.1-sol', label: 'GPT-6.1 Sol', efforts: ['low', 'medium', 'high', 'xhigh', 'max', 'ultra'] },
  { key: 'gpt-6.1-terra', provider: 'codex', model: 'gpt-6.1-terra', label: 'GPT-6.1 Terra', efforts: ['low', 'medium', 'high', 'xhigh', 'max', 'ultra'] },
  { key: 'gpt-6-astra', provider: 'codex', model: 'gpt-6-astra', label: 'GPT-6 Astra', efforts: ['low', 'medium', 'high', 'xhigh', 'max', 'ultra'] },
  { key: 'gpt-6-luna', provider: 'codex', model: 'gpt-6-luna', label: 'GPT-6 Luna', efforts: ['low', 'medium', 'high', 'xhigh', 'max'] },
  { key: 'grok', provider: 'grok', model: 'grok-4.7', label: 'Grok 4.7' },
  { key: 'gemini-flash', provider: 'agy', model: 'gemini-3.8-flash', label: 'Gemini 3.8 Flash', efforts: ['low', 'medium', 'high'] },
  { key: 'gemini-argon', provider: 'agy', model: 'gemini-4-argon', label: 'Gemini 4 Argon', efforts: ['low', 'medium', 'high'] },
  { key: 'muse-spark', provider: 'muse', model: 'muse-spark-1.3', label: 'Muse Spark 1.3', efforts: ['minimal', 'low', 'medium', 'high', 'xhigh', 'max'] },
  { key: 'muse-wonder', provider: 'muse', model: 'muse-wonder-1.0', label: 'Muse Wonder 1.0', efforts: ['minimal', 'low', 'medium', 'high', 'xhigh', 'max'] },
];
// Plus any newer GPT-6+ model Codex lists, keeping only the newest of each line (gpt-6.1-sol, not gpt-6-sol).
const gptVer = (id) => id.match(/^gpt-(\d+(?:\.\d+)*)(?:-(.*))?$/);
const verCmp = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] ?? 0) !== (y[i] ?? 0)) return (x[i] ?? 0) - (y[i] ?? 0);
  return 0; };
function catalog() {
  const extra = cliModels('codex').filter((m) => +(gptVer(m.id)?.[1].split('.')[0] ?? 0) >= 6 && !CATALOG.some((c) => c.model === m.id))
    .map((m) => ({ key: m.id, provider: 'codex', model: m.id, label: m.label || m.id }));
  const newest = (c) => { const v = gptVer(c.model); return !v || ![...CATALOG, ...extra].some((o) => {
    const w = gptVer(o.model); return w && (w[2] ?? '') === (v[2] ?? '') && verCmp(w[1], v[1]) > 0; }); };
  return [...CATALOG, ...extra].filter((c) => c.provider !== 'codex' || newest(c)).map((c) => {
    const live = cliModels(c.provider).find((m) => m.id === c.model)?.efforts;
    return { ...c, efforts: live?.length ? live : c.efforts ?? EFFORTS[c.provider] ?? [] };
  });
}
const entryOf = (a) => catalog().find((c) => c.provider === a.provider && c.model === a.model);
const effortsFor = (a) => entryOf(a)?.efforts ?? cliModels(a.provider).find((m) => m.id === a.model)?.efforts ?? EFFORTS[a.provider] ?? [];
const pickEffort = (ok) => [ok.includes('high') ? 'high' : ok[0]].filter(Boolean);
const slug = (s) => s.replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '');
// "Custom" entry per CLI: any model ID typed in, efforts from what the CLI reports for it (else the CLI's own list).
const customOf = (p) => ({ custom: true, key: p, provider: p, model: '', label: `Custom ${PROVIDERS[p]} model…` });
const uniqueId = (base, self) => { let id = base; for (let n = 2; cfg.agents.some((x) => x !== self && x.id === id); n++) id = `${base}-${n}`; return id; };

function addAgent(c) {
  const a = { id: uniqueId(c.key), provider: c.provider, model: c.model, efforts: [] };
  a.efforts = pickEffort(effortsFor(a));
  cfg.agents.push(a); changed(true);
}

// Switching model renames the row and keeps the efforts the new model also takes.
// Switching to Custom keeps a model ID already typed for the same CLI.
function switchModel(a, c) {
  const model = c.custom ? (a.provider === c.provider && !entryOf(a) ? a.model : '') : c.model;
  Object.assign(a, { id: uniqueId(slug(model) || c.key, a), provider: c.provider, model });
  const ok = effortsFor(a);
  a.efforts = (a.efforts || []).filter((e) => { const pe = parseEffort(e); return (!pe.base || ok.includes(pe.base)) && (c.provider === 'claude' || !pe.ultracode); });
  if (!a.efforts.length) a.efforts = pickEffort(ok);
  changed(true);
}

// One dropdown of the catalog grouped by CLI, then a Custom option per CLI. A model that isn't
// in the catalog (typed in, or from an old config) shows as Custom for its CLI.
function modelSelect(cur, onpick, attrs = {}) {
  const cat = catalog(), val = (c) => c.custom ? `custom|${c.provider}` : `${c.provider}|${c.model}`;
  const curVal = cur && (cur.custom || !entryOf(cur) ? `custom|${cur.provider}` : val(cur));
  const all = [...cat, ...Object.keys(PROVIDERS).map(customOf)];
  const opt = (c) => h('option', { value: val(c), selected: val(c) === curVal }, c.label + (clis[c.provider] && !clis[c.provider].installed ? ' (CLI not found)' : ''));
  return h('select', { ...attrs, onchange: (e) => onpick(all.find((c) => val(c) === e.target.value)) },
    Object.entries(PROVIDERS).map(([p, n]) => h('optgroup', { label: n }, cat.filter((c) => c.provider === p).map(opt))),
    h('optgroup', { label: 'Custom (type the model ID)' }, Object.keys(PROVIDERS).map((p) => opt(customOf(p)))));
}

// Effort dropdown options for this model: 'default', its levels, and on Claude Code the Ultracode version of each.
function effortOptions(a) {
  const ok = ['default', ...effortsFor(a)];
  return a.provider === 'claude' ? [...ok, ...ok.map((e) => e + '-uc')] : ok;
}
const effortLabel = (e) => e.endsWith('-uc') ? `${e.slice(0, -3)} + Ultracode` : e;

async function loadClis(refresh) {
  if (refresh) { clis = {}; cliCheckedAt = null; renderClis(); }
  try { const r = await api('/api/clis' + (refresh ? '?refresh=1' : '')); clis = r.clis; cliCheckedAt = r.checkedAt; } catch {}
  renderClis(); updateSavebar();
  $('#modelcard')?.replaceWith(modelsCard()); // per-model efforts may have changed
  if (tab === 'run') renderRun();
}

function renderClis() {
  const el = $('#clicard'); if (!el) return;
  el.replaceChildren(
    h('div', { class: 'row' }, h('h2', { class: 'grow' }, 'CLIs'),
      h('span', { class: 'muted' }, cliCheckedAt ? `checked ${new Date(cliCheckedAt).toLocaleTimeString()}` : 'checking…'),
      h('button', { class: 'btn', onclick: () => loadClis(true) }, 'Re-check')),
    h('p', { class: 'sub' }, 'What this machine has installed. Click a model to add it to Models below, then press Test there to check it works end to end.'),
    h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, ['CLI', 'Version', 'Models (click to add)', 'Global instructions'].map((t) => h('th', {}, t)))),
      h('tbody', {}, Object.entries(PROVIDERS).map(([p, name]) => {
        const c = clis[p];
        return h('tr', {},
          h('td', { style: 'white-space:nowrap' }, h('strong', {}, name), h('div', { class: 'muted mono', style: 'font-size:12px' }, c?.bin ?? cfg.bins?.[p] ?? p)),
          h('td', {}, !c ? h('span', { class: 'muted' }, 'checking…')
            : c.installed ? h('span', { class: 'ok' }, '✔ ' + c.version) : h('span', { class: 'bad', title: c.error || '' }, '✘ not found')),
          h('td', {}, h('div', { class: 'chips' }, catalog().filter((m) => m.provider === p).map((m) => {
            const unlisted = c?.models?.length && !c.suggested && !c.models.some((x) => x.id === m.model);
            return h('button', { class: 'chip', style: 'font-size:12.5px;color:inherit',
              title: `${m.model} · efforts: ${m.efforts.join(', ')}${unlisted ? ` · ${name} doesn't list this model` : ''}`,
              onclick: () => addAgent(m) }, m.label, unlisted ? h('span', { class: 'bad' }, 'not listed') : null);
          })), c?.modelsError ? h('div', { class: 'hint' }, `Couldn't list models: ${c.modelsError}`) : null),
          h('td', {}, c?.instructions?.length ? c.instructions.map((f) => h('div', { class: 'mono', style: 'font-size:12px' }, f)) : h('span', { class: 'muted' }, c ? 'none' : '')));
      })))),

// ------------------------------------------------------------ smoke tests
// Latest test of this model (any effort), unless its CLI or model ID changed since.
function smokeOf(a) {
  const list = Object.entries(smokes).filter(([k]) => k.startsWith(a.id + ':')).map(([, v]) => v);
  return list.find((s) => s.running) ?? list.filter((s) => !s.provider || (s.provider === a.provider && s.model === a.model))
    .sort((x, y) => String(y.at).localeCompare(String(x.at)))[0] ?? null;
}
function smokeBadge(a) {
  const s = smokeOf(a);
  if (!s && results.some((r) => r.agent === a.id && r.status === 'ok')) return h('span', { class: 'tag ok', title: 'Has finished runs. Test checks it again with one tiny task.' }, '✔ has run');
  if (!s) return h('span', { class: 'tag', title: 'Press Test to run one tiny task through this CLI and model' }, 'untested');
  if (s.running) return h('span', { class: 'tag warn' }, `testing… ${since(s.startedAt)}`);
  return h('button', { class: 'tag ' + (s.ok ? 'ok' : 'bad'), style: 'border:0;cursor:pointer;font:inherit;font-size:12px',
    title: (s.ok ? `Works end to end${s.goal ? ' (tested with /goal)' : ''}` : s.error || 'Some checks failed') + '. Click for details.', onclick: () => showSmoke(s) },
    s.ok ? '✔ works' : '✘ test failed');
}
const renderSmokes = () => document.querySelectorAll('[data-smoke]').forEach((el) => {
  const a = cfg.agents.find((x) => x.id === el.dataset.smoke); el.replaceChildren(a ? smokeBadge(a) : '');
});
const hasWorked = (a) => smokeOf(a)?.ok || results.some((r) => r.agent === a.id && r.status === 'ok');

async function testModels(agents) {
  if (dirty() && !(await save())) return;
  const tests = agents.map((a) => ({ key: `${a.id}:${effortsOf(a)[0]}`, goal: smokeGoal && GOAL_CLIS.includes(a.provider) }));
  try { await api('/api/smoke', 'POST', { tests }); await poll(); } catch (e) { alert(e.message); }
}

function showSmoke(s) {

// ------------------------------------------------------------- validation
function validate() {
  const errors = [], warnings = [];
  const ids = new Set();
  cfg.agents.forEach((a, i) => {
    if (!/^[\w.-]+$/.test(a.id || '')) errors.push(`Model row ${i + 1}: name must be letters, numbers, - _ or .`);
    else if (ids.has(a.id)) errors.push(`Model name "${a.id}" is used twice`);
    ids.add(a.id);
    if (!a.model) errors.push(`Model row ${i + 1}: model ID is empty`);
  });
  const dimNames = Object.keys(cfg.dimensions);
  for (const d of dimNames) {
    const vs = cfg.dimensions[d], vids = new Set();
    if (!vs.length) errors.push(`Dimension "${d}" has no variants`);
    vs.forEach((v, i) => {
      if (!/^[\w.-]+$/.test(v.id || '')) errors.push(`${d} variant ${i + 1}: short name must be letters, numbers, - _ or .`);
      else if (vids.has(v.id)) errors.push(`${d}: short name "${v.id}" is used twice`);
      vids.add(v.id);
    });
  }
  const used = new Set([...tmpl.matchAll(/\{\{(\w+)\}\}/g)].map((m) => m[1]));
  for (const u of used) if (u === GOAL_DIM) errors.push('Remove {{goal}} from the prompt: the goal dimension is sent as a /goal command, not inserted as text');
    else if (!dimNames.includes(u) && !RESERVED.includes(u)) errors.push(`Prompt uses {{${u}}}, which isn't a dimension`);
  for (const d of dimNames) if (d !== GOAL_DIM && !used.has(d)) warnings.push(`Dimension "${d}" isn't used in the prompt (add {{${d}}})`);
  for (const v of cfg.dimensions[GOAL_DIM] ?? []) if ((v.text || '').length > 3850) errors.push(`goal "${v.id}" is too long (${v.text.length} characters; /goal allows about 3,850 here)`);
  const goalVariants = cfg.dimensions[GOAL_DIM] ?? [], onlyGoals = goalVariants.length > 0 && goalVariants.every((v) => (v.text || '').trim());
  cfg.agents.forEach((a) => {
    const name = PROVIDERS[a.provider] ?? a.provider, c = clis[a.provider];
    if (a.provider !== 'claude' && (a.efforts || []).some((e) => parseEffort(e).ultracode)) warnings.push(`${a.id}: Ultracode (-uc) only applies to Claude Code, so those efforts are skipped`);
    const ok = effortsFor(a), bad = (a.efforts || []).map((e) => parseEffort(e).base).filter((b) => b && ok.length && !ok.includes(b));
    if (bad.length) warnings.push(`${a.id}: ${name}${a.model ? ` (${a.model})` : ''} doesn't take effort ${bad.join(', ')}; it takes ${ok.join(', ')}`);
    if (c && !c.installed) warnings.push(`${a.id}: the ${name} CLI ("${c.bin}") isn't installed or didn't start, so its runs are skipped`);
    else if (c?.models?.length && !c.suggested && a.model && !c.models.some((m) => m.id === a.model))
      warnings.push(`${a.id}: ${name} doesn't list "${a.model}" (it has ${c.models.map((m) => m.id).join(', ')})`);
    if (onlyGoals && !GOAL_CLIS.includes(a.provider)) warnings.push(`${a.id}: ${name} has no headless /goal and every goal variant has text, so it has nothing to run (add an empty goal variant)`);
  });
  return { errors, warnings, used };
}

async function save() {
  const v = validate();
  if (v.errors.length) { alert('Fix these first:\n\n' + v.errors.join('\n')); return false; }
  await api('/api/config', 'PUT', cfg);
  await api('/api/template', 'PUT', { text: tmpl });
  savedCfg = JSON.stringify(cfg); savedTmpl = tmpl;
  updateSavebar(); renderRun();
  return true;
}

function selection() {
  const offP = new Set(sel.offPick), pick = [], only = {};
  for (const a of cfg.agents) for (const e of effortsOf(a)) {
    const k = `${a.id}:${e}`; if (!offP.has(k)) pick.push(k);
  }
  for (const [d, vs] of Object.entries(cfg.dimensions)) {
    const off = new Set(sel.offOnly[d] || []); only[d] = vs.filter((v) => !off.has(v.id)).map((v) => v.id);
  }
  const repeat = Math.max(1, +sel.opts.repeat || 1);
  const goalOn = new Set((cfg.dimensions[GOAL_DIM] || []).filter((v) => (v.text || '').trim()).map((v) => v.id));
  const provOf = Object.fromEntries(cfg.agents.map((a) => [a.id, a.provider]));
  // Variant ids per dimension for one agent (goal variants only run on CLIs with a headless /goal).
  const listsFor = (agentId) => Object.entries(only).map(([d, l]) => d === GOAL_DIM && !GOAL_CLIS.includes(provOf[agentId]) ? l.filter((v) => !goalOn.has(v)) : l);
  const combosFor = (agentId) => listsFor(agentId).reduce((n, l) => n * l.length, 1);
  const combos = Object.values(only).reduce((n, l) => n * l.length, 1);
  const count = pick.reduce((n, k) => n + combosFor(k.split(':')[0]), 0) * repeat;
  let done = 0;
  if (count <= 50000) {
    const doneIds = new Set(results.filter((r) => r.status === 'ok' || !sel.opts.rerunFailed).map((r) => r.id));
    let lists;
    const walk = (i, acc, base) => {
      if (i === lists.length) { for (let r = 1; r <= repeat; r++) if (doneIds.has([base, ...acc, repeat > 1 ? `r${r}` : null].filter(Boolean).join('__'))) done++; return; }
      for (const v of lists[i]) walk(i + 1, [...acc, v], base);
    };
    for (const k of pick) { const [a, e] = k.split(':'); lists = listsFor(a); walk(0, [], `${a}-${e}`); }

  return { pick, only, repeat, count, done, combos };
}

async function start() {
  if (dirty() && !(await save())) return;
  const s = selection();
  const n = s.count - s.done;
  const budget = +sel.opts.budget > 0 ? ` with a $${sel.opts.budget} budget` : ' with no budget limit';
  const picked = new Set(s.pick.map((k) => k.split(':')[0]));
  const unproven = cfg.agents.filter((a) => picked.has(a.id) && !hasWorked(a)).map((a) => a.id);
  const note = unproven.length ? `\n\nNot proven to work yet (no passing test or finished run): ${unproven.join(', ')}. Test checks one in about a minute.` : '';
  if (!confirm(`Start ${n} run${n === 1 ? '' : 's'}, ${sel.opts.concurrency || 1} at a time${budget}?\n\nAgents run with permission prompts off.${note}`)) return;
  try {
    await api('/api/run', 'POST', { pick: s.pick, only: s.only, repeat: s.repeat, rerunFailed: sel.opts.rerunFailed,
      concurrency: sel.opts.concurrency, perCli: sel.opts.perCli, budget: sel.opts.budget, timeout: sel.opts.timeout });

let wasRunning = false;
async function poll() {
  try {
    const st = await api('/api/status?since=' + logSince);
    if (st.logTotal < logSince) { logSince = 0; logPre.textContent = ''; return poll(); } // a new batch reset the log
    status = st;
    const prevSmokes = JSON.stringify(smokes);
    smokes = st.smokes ?? {};
    if (JSON.stringify(smokes) !== prevSmokes || Object.values(smokes).some((s) => s.running)) renderSmokes();
    const pre = logPre;
    if (st.log.length) {
      const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
      pre.textContent += st.log.join('\n') + '\n';
      if (atBottom) pre.scrollTop = pre.scrollHeight;
    }
    logSince = st.logTotal;
    const pill = $('#pill');
    pill.textContent = st.running ? (st.stopping ? 'Stopping…' : `Running · ${st.active.length} active · ${st.finished} done`) : 'Idle';
    pill.classList.toggle('live', !!st.running);
    const finishedOne = st.log.some((l) => /^[✔✘]/.test(l));
    if (finishedOne || (wasRunning && !st.running)) { await loadResults(); if (tab === 'results') renderResults(); }
    if (tab === 'run') { if (wasRunning !== !!st.running || finishedOne) renderRun(); else renderLive(); }
    wasRunning = !!st.running;
  } catch {
    $('#pill').textContent = 'Dashboard server not reachable'; $('#pill').classList.remove('live');
  }
}
