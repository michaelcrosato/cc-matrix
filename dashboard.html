<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='7' width='7' height='7' rx='1.5'/%3E%3Crect x='18' y='7' width='7' height='7' rx='1.5'/%3E%3Crect x='7' y='18' width='7' height='7' rx='1.5'/%3E%3Crect x='18' y='18' width='7' height='7' rx='1.5' opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e1d" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6a66; --line: #e2e1dc;
  --accent: #2f5bd3; --accent-ink: #ffffff; --soft: #eef1fb; --ok: #1f7a46; --bad: #b3261e; --warn: #8a5700;
  --chip: #f0efeb; --chip-on: #dfe7fd; --code: #f3f2ee;
  /* chart marks, checked with the dataviz palette validator: finished vs failed, more vs less than a baseline */
  --mark: #2a78d6; --mark-bad: #d03b3b; --more: #eb6834; --less: #2a78d6;
  --gutter: 16px; --tap: 30px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --panel: #1e1e1d; --ink: #ecebe7; --muted: #9a9993; --line: #33332f;
    --accent: #7f9cff; --accent-ink: #0d1330; --soft: #232a40; --ok: #6fcf97; --bad: #ff8a80; --warn: #f2c063;
    --chip: #2a2a28; --chip-on: #2c3657; --code: #232321;
    --mark: #3987e5; --mark-bad: #e66767; --more: #d95926; --less: #3987e5;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --panel: #1e1e1d; --ink: #ecebe7; --muted: #9a9993; --line: #33332f;
  --accent: #7f9cff; --accent-ink: #0d1330; --soft: #232a40; --ok: #6fcf97; --bad: #ff8a80; --warn: #f2c063;
  --chip: #2a2a28; --chip-on: #2c3657; --code: #232321;
  --mark: #3987e5; --mark-bad: #e66767; --more: #d95926; --less: #3987e5;
}
:root { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; overflow-wrap: break-word; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 6px 16px; padding: 8px var(--gutter); padding-left: max(var(--gutter), env(safe-area-inset-left)); padding-right: max(var(--gutter), env(safe-area-inset-right)); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; white-space: nowrap; }
nav { display: flex; gap: 4px; min-width: 0; }
nav button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
nav button:hover { color: var(--ink); }
nav button.on { background: var(--soft); color: var(--ink); font-weight: 600; }
.pill { margin-left: auto; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 13px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pill.live { background: var(--soft); color: var(--accent); font-weight: 600; }
.pill.off { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); color: var(--bad); }
.pill .short { display: none; }
#theme { font-size: 17px; line-height: 1; min-width: var(--tap); min-height: var(--tap); }
main { max-width: 1280px; margin: 0 auto; padding: var(--gutter); padding-left: max(var(--gutter), env(safe-area-inset-left)); padding-right: max(var(--gutter), env(safe-area-inset-right)); }
@media (min-width: 1800px) { main { max-width: 1640px; } }
section.tab { display: none; } section.tab.on { display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 4px; } .card .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; max-width: 100%; }
select { text-overflow: ellipsis; }
textarea { width: 100%; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button:focus-visible, a:focus-visible, summary:focus-visible, .chip:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.invalid { border-color: var(--bad) !important; background: color-mix(in srgb, var(--bad) 8%, var(--bg)); }
.mono, textarea.mono { font-family: ui-monospace, "Cascadia Mono", "Ubuntu Mono", Menlo, monospace; font-size: 13px; }
.sub .mono { overflow-wrap: anywhere; } /* long file paths wrap on small phones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .3em; font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.icon { font: inherit; border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 6px; cursor: pointer; min-width: 26px; min-height: 26px; }
thead.srhead th { padding: 0; border: 0; height: 0; line-height: 0; }
thead.srhead { display: table-header-group; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
button.icon:hover { background: var(--chip); color: var(--ink); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; overscroll-behavior-x: contain; position: relative; } /* relative: keeps .sr-only text inside it from widening the page */
/* Wide number tables scroll sideways on small screens with their first column pinned. */
table.pin th:first-child, table.pin td:first-child { position: sticky; left: 0; z-index: 1; background: var(--panel); }
table.pin td:first-child { box-shadow: 1px 0 0 var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--chip); cursor: pointer; user-select: none; -webkit-user-select: none; border: 1px solid transparent; }
.chip input { margin: 0; }
.chip.on { background: var(--chip-on); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); color: var(--muted); white-space: nowrap; }
button.tag { border: 0; cursor: pointer; font: inherit; font-size: 12px; }
.tag.ok { color: var(--ok); } .tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.variant { display: grid; grid-template-columns: 140px 1fr auto; gap: 8px; align-items: start; margin-bottom: 8px; }
@media (max-width: 640px) { .variant { grid-template-columns: 1fr auto; } .variant textarea { grid-column: 1 / -1; grid-row: 2; } }
.dim-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.dim-head input.dimname { width: 170px; font-weight: 600; }
.savebar { position: sticky; bottom: 0; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; margin-bottom: max(0px, env(safe-area-inset-bottom)); display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 -6px 20px rgb(0 0 0 / .06); }
.savebar .msgs { flex: 1 1 260px; min-width: 0; }
.savebar .list { max-height: 30vh; overflow-y: auto; margin-bottom: 6px; }
.savebar .summary { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.savebar .actions { display: flex; gap: 8px; margin-left: auto; }
.big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
.stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
.stats { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; }
.launch { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
pre.log { background: var(--code); border-radius: 8px; padding: 10px; height: 260px; overflow: auto; margin: 0; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); width: min(900px, 94vw); max-height: 86vh; max-height: 86dvh; padding: 0; overflow: hidden; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog .dhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
dialog .dhead strong { min-width: 0; overflow-wrap: anywhere; }
dialog .dbody { padding: 16px; overflow: auto; max-height: calc(86vh - 56px); max-height: calc(86dvh - 56px); overscroll-behavior: contain; }
dialog pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.grid2 > * { min-width: 0; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.errs { color: var(--bad); font-size: 13px; } .errs div::before { content: "• "; }
.warns { color: var(--warn); font-size: 13px; } .warns div::before { content: "• "; }
input.score { width: 76px; } input.notes { width: 180px; }
table.runs td.act button.icon { padding: 4px 4px; }
tr.failed td { color: var(--bad); }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
a { color: var(--accent); }
.warn { color: var(--warn); }
button.linkish { font: inherit; border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-align: left; }
button.linkish:hover { text-decoration: underline; }
nav .badge { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--warn); color: var(--panel); font-size: 11.5px; font-weight: 700; line-height: 18px; text-align: center; }
nav .badge.info { background: var(--accent); color: var(--accent-ink); }
.tiles { display: flex; flex-wrap: wrap; gap: 14px 32px; }
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 100px; }
.tile .k { color: var(--muted); font-size: 12.5px; }
.tile .v { font-size: 24px; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .d { color: var(--muted); font-size: 12px; }
.checks > div { display: grid; grid-template-columns: 20px 1fr; gap: 0 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.checks > div:last-child { border-bottom: 0; }
.checks .ic { font-weight: 700; text-align: center; }
.why > div + div { margin-top: 3px; }
td.fx { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.fhead td { font-weight: 600; padding-top: 14px; }
.chg { font-variant-numeric: tabular-nums; } .chg.sure { font-weight: 700; }
th.plain { text-transform: none; letter-spacing: 0; }
table.cmp { width: auto; min-width: min(100%, 520px); }
table.cmp td:first-child { padding-right: 24px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; color: var(--muted); font-size: 12.5px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; } .legend i.ring { border-radius: 50%; border: 2px solid var(--mark-bad); background: var(--panel); }
.strip { display: grid; grid-template-columns: fit-content(170px) minmax(0, 1fr) auto; gap: 0 12px; align-items: center; }
.strip .lab { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .track { position: relative; height: 30px; }
.strip .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.strip .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.strip .med { position: absolute; top: 5px; bottom: 5px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.strip .dot { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; padding: 0; border: 0; background: none; cursor: pointer; }
.strip .dot::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2px var(--panel); }
.strip .dot.bad::after { background: var(--panel); border: 2px solid var(--mark-bad); }
.strip .dot:hover::after, .strip .dot:focus-visible::after { inset: 6px; }
.strip .dot:focus-visible { outline: none; }
.strip .end { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.strip .axis { position: relative; height: 18px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.strip .axis span { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; }
.cols { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--line); }
.cols .c { flex: 1 1 0; max-width: 24px; height: 100%; display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; }
.cols .c:hover, .cols .c:focus-visible { background: var(--chip); outline: none; }
.cols .ok { background: var(--mark); } .cols .no { background: var(--mark-bad); }
.xlabels { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 11px; }
#tip { position: fixed; z-index: 30; display: none; pointer-events: none; max-width: min(320px, calc(100vw - 16px)); padding: 7px 9px; border-radius: 8px; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); box-shadow: 0 6px 18px rgb(0 0 0 / .14); font-size: 12.5px; line-height: 1.35; }
#tip strong { display: block; font-size: 14px; } #tip span { display: block; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 14px; margin-bottom: 16px; border-radius: 10px;
  background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); }
.banner.bad { background: color-mix(in srgb, var(--bad) 10%, var(--panel)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.filters { display: contents; }
.filtertoggle { display: none; }
select.on { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--soft); }
.only-phone, .cardsort { display: none; }
td.br, td.errcell { display: none; }
td.scorecell { text-align: right; }
.lbl { color: var(--muted); font-size: 12px; margin-right: 4px; }
td.dimcell .lbl, td.num .lbl, td.eff .lbl { display: none; }
table.look td.run { min-width: 170px; } table.look td.why { min-width: 260px; }

/* ---- Audit tab ---- */
.finding { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
.finding.read:not([open]) { opacity: .62; }
.finding .fhead { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; cursor: pointer; list-style: none; padding: 2px 0; }
.finding .fhead::-webkit-details-marker { display: none; }
.finding .fhead::before { content: "▸"; color: var(--muted); width: 12px; flex: none; }
.finding[open] .fhead::before { content: "▾"; }
.finding .ftitle { font-weight: 650; font-size: 14.5px; flex: 1 1 260px; min-width: 0; }
.finding dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; margin: 10px 0 0; }
.finding dt { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.finding dd { margin: 0; }
.finding code, .audit-p code { font-family: ui-monospace, "Cascadia Mono", "Ubuntu Mono", Menlo, monospace; font-size: 12.5px; background: var(--code); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
.sev-critical, .sev-high { color: var(--bad); } .sev-medium { color: var(--warn); } .sev-low, .sev-info { color: var(--muted); }
.tag.sev-critical, .tag.sev-high { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.tag.sev-medium { background: color-mix(in srgb, var(--warn) 14%, var(--panel)); }
.tag.st-fixed { color: var(--ok); } .tag.st-open, .tag.st-yours { color: var(--warn); }
.audit-list { margin: 8px 0 0; padding-left: 20px; } .audit-list li + li { margin-top: 6px; }

/* ---- Touch screens: bigger targets, and 16px text in fields so iOS Safari doesn't zoom in on focus ---- */
@media (pointer: coarse) {
  :root { --tap: 40px; }
  input, select, textarea { font-size: 16px; }
  textarea.mono, input.mono { font-size: 15px; }
  button.icon, button.btn, nav button, button.linkish { min-height: var(--tap); }
  button.icon { min-width: 36px; }
  .chip { min-height: 36px; }
  input[type="checkbox"] { width: 20px; height: 20px; }
}

/* ---- Tablets and below ---- */
@media (max-width: 900px) {
  /* Runs table: one card per run */
  table.runs thead { display: none; }
  table.runs, table.runs tbody { display: block; }
  table.runs tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 0 10px 30px; position: relative; border-bottom: 1px solid var(--line); }
  table.runs td { display: block; border: 0; padding: 0; min-width: 0; }
  table.runs td.br { display: block; flex-basis: 100%; height: 0; }
  table.runs td.play { position: absolute; left: 4px; top: 10px; font-size: 16px; }
  table.runs td.who { font-weight: 650; }
  table.runs td.eff::before { content: "· "; color: var(--muted); }
  table.runs td.st { margin-left: auto; text-align: right; }
  table.runs td.st .hint { text-align: left; max-width: none !important; min-width: 0 !important; }
  table.runs td.dimcell { color: var(--muted); font-size: 12.5px; }
  table.runs td.dimcell .lbl { display: inline; font-size: 11.5px; margin-right: 2px; }
  table.runs td.num { text-align: left; }
  table.runs td.num .lbl { display: inline; }
  table.runs td.when { font-size: 12.5px; }
  table.runs td.notescell { flex: 1 1 160px; }
  table.runs td.notescell input { width: 100%; }
  table.runs td.act { margin-left: -6px; white-space: normal !important; display: flex; flex-wrap: wrap; }
  table.runs input.score { width: 84px; }
  table.runs .hide-cards { display: none; }
  table.runs td.errcell { display: block; flex-basis: 100%; font-size: 12.5px; }
  table.runs td.errcell::before { content: attr(data-err); }
  table.runs td.scorecell { text-align: left; }
  /* card lines: who · effort · status / variants / error / numbers / review / actions */
  table.runs td.who, table.runs td.eff, table.runs td.st { order: 1; }
  table.runs td.b1 { order: 2; } table.runs td.dimcell { order: 3; }
  table.runs td.errcell { order: 4; } table.runs td.b2 { order: 5; }
  table.runs td.num, table.runs td.when { order: 6; } table.runs td.b3 { order: 7; }
  table.runs td.scorecell, table.runs td.notescell { order: 8; } table.runs td.b4 { order: 9; }
  table.runs td.act { order: 10; }
  .cardsort { display: inline-flex; }
  /* Setup and Run: CLIs and models as cards */
  table.stack, table.stack tbody { display: block; }
  table.stack thead { display: none; }
  table.stack tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); }
  table.stack td { display: block; border: 0; padding: 3px 0; width: auto !important; min-width: 0 !important; }
  table.stack td[data-label]::before { content: attr(data-label); display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; margin: 4px 0 2px; }
  table.stack td.inline { display: inline-block; margin-right: 10px; vertical-align: middle; }
  table.stack td.inline[data-label]::before { display: inline; margin-right: 6px; }
  table.models td:first-child select { width: 100%; max-width: 440px; }
  table.models tr { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; }
  table.models td:nth-child(1), table.models td:nth-child(2) { flex-basis: 100%; }
  table.models td.inline { margin-right: 0; }
  table.models td.acts { display: flex; gap: 2px; margin-left: auto; }
  table.runmodels td { padding-top: 2px; }
}

/* ---- Phones ---- */

// ------------------------------------------------------------- validation
function validate() {
  const errors = [], warnings = [];
  const ids = new Set();
  cfg.agents.forEach((a, i) => {
    if (!/^[\w.-]+$/.test(a.id || '')) errors.push(`Model row ${i + 1}: name must be letters, numbers, - _ or .`);
    else if (ids.has(a.id)) errors.push(`Model name "${a.id}" is used twice`);
    ids.add(a.id);
    if (!a.model) errors.push(`Model row ${i + 1}: model ID is empty`);
  });
  const dimNames = Object.keys(cfg.dimensions);
  for (const d of dimNames) {
    const vs = cfg.dimensions[d], vids = new Set();
    if (!vs.length) errors.push(`Dimension "${d}" has no variants`);
    vs.forEach((v, i) => {
      if (!/^[\w.-]+$/.test(v.id || '')) errors.push(`${d} variant ${i + 1}: short name must be letters, numbers, - _ or .`);
      else if (vids.has(v.id)) errors.push(`${d}: short name "${v.id}" is used twice`);
      vids.add(v.id);
    });
  }
  const used = new Set([...tmpl.matchAll(/\{\{(\w+)\}\}/g)].map((m) => m[1]));
  for (const u of used) if (u === GOAL_DIM) errors.push('Remove {{goal}} from the prompt: the goal dimension is sent as a /goal command, not inserted as text');
    else if (!dimNames.includes(u) && !RESERVED.includes(u)) errors.push(`Prompt uses {{${u}}}, which isn't a dimension`);
  for (const d of dimNames) if (d !== GOAL_DIM && !used.has(d)) warnings.push(`Dimension "${d}" isn't used in the prompt (add {{${d}}})`);
  for (const v of cfg.dimensions[GOAL_DIM] ?? []) if ((v.text || '').length > 3850) errors.push(`goal "${v.id}" is too long (${v.text.length} characters; /goal allows about 3,850 here)`);
    cfg.agents.forEach((a) => {
    const name = PROVIDERS[a.provider] ?? a.provider, c = clis[a.provider];
    if (a.provider !== 'claude' && (a.efforts || []).some((e) => parseEffort(e).ultracode)) warnings.push(`${a.id}: Ultracode (-uc) only applies to Claude Code, so those efforts are skipped`);
    const ok = effortsFor(a), bad = (a.efforts || []).map((e) => parseEffort(e).base).filter((b) => b && ok.length && !ok.includes(b));
    if (bad.length) warnings.push(`${a.id}: ${name}${a.model ? ` (${a.model})` : ''} doesn't take effort ${bad.join(', ')}; it takes ${ok.join(', ')}`);
    if (c && !c.installed) warnings.push(`${a.id}: the ${name} CLI ("${c.bin}") isn't installed or didn't start, so its runs are skipped`);
    else if (c?.models?.length && !c.suggested && a.model && !c.models.some((m) => m.id === a.model))
      warnings.push(`${a.id}: ${name} doesn't list "${a.model}" (it has ${c.models.map((m) => m.id).join(', ')})`);
  });
  // No extra flags at all: permission prompts come back, and a headless run can't answer them.
  for (const p of new Set(cfg.agents.map((a) => a.provider))) if (Array.isArray(cfg.extraArgs?.[p]) && !cfg.extraArgs[p].length && DEFAULT_EXTRA[p])
    warnings.push(`${PROVIDERS[p] ?? p} has no extra flags, so it may stop at a permission prompt no one can answer (the default is ${DEFAULT_EXTRA[p].join(' ')})`);
  // A variant edited after it ran: those runs still count as done, so the new text wouldn't run.
  for (const [d, vs] of Object.entries(cfg.dimensions)) for (const v of vs) {
    const n = results.filter((r) => r[d] === v.id && r.changed?.includes(d)).length;
    if (n) warnings.push(`${d} "${v.id}": ${plural(n, 'finished run')} used different text. They count as done, so the new text won't run for them: give the variant a new short name to run it and keep the old runs apart`);
  }
  return { errors, warnings, used };
}

// -------------------------------------------------------------------- RUN
function selection() {
  const offP = new Set(sel.offPick), pick = [], only = {};
  for (const a of cfg.agents) for (const e of effortsOf(a)) {
    const k = `${a.id}:${e}`; if (!offP.has(k)) pick.push(k);
  }
  for (const [d, vs] of Object.entries(cfg.dimensions)) {
    const off = new Set(sel.offOnly[d] || []); only[d] = vs.filter((v) => !off.has(v.id)).map((v) => v.id);
  }
  const repeat = Math.max(1, +sel.opts.repeat || 1);
  const lists = Object.values(only), combos = lists.reduce((n, l) => n * l.length, 1);
  const count = pick.length * combos * repeat;
  let done = 0, doneOld = 0; // doneOld: of those, made with an older prompt or a variant's old text
  if (count <= 50000) {
    const doneRuns = new Map(results.filter((r) => r.status === 'ok' || !sel.opts.rerunFailed).map((r) => [r.id, r]));
    const walk = (i, acc, base) => {
      if (i === lists.length) {
        for (let r = 1; r <= repeat; r++) {
          const d = doneRuns.get([base, ...acc, repeat > 1 ? `r${r}` : null].filter(Boolean).join('__'));
          if (d) { done++; if (d.changed?.length || (d.promptVersion && meta.promptVersion && d.promptVersion !== meta.promptVersion)) doneOld++; }
        }
        return;
      }
      for (const v of lists[i]) walk(i + 1, [...acc, v], base);
    };
    for (const k of pick) { const [a, e] = k.split(':'); walk(0, [], `${a}-${e}`); }
  }
  return { pick, only, repeat, count, done, doneOld, combos };
}

// Progress, per-CLI tallies and warnings for the current (or last) batch, from the runs it has finished.
function batchHealth() {
  const st = status; if (!st.startedAt || !cfg) return null;
  const t0 = Date.parse(st.startedAt), per = {}, alerts = [];
  const fin = results.filter((r) => Date.parse(r.finishedAt) >= t0).sort((a, b) => String(a.finishedAt).localeCompare(String(b.finishedAt)));
  const cli = (p) => per[p] ??= { ok: 0, failed: 0, running: 0, streak: 0, last: null };
  for (const r of fin) { const c = cli(r.provider); if (r.status === 'ok') { c.ok++; c.streak = 0; } else { c.failed++; c.streak++; c.last = r; } }
  const active = (st.active ?? []).map((id) => {
    const a = agentOfId(id), mins = (Date.now() - Date.parse(st.activeSince?.[id])) / 60000, usual = usualMinutes(id);
    if (a) cli(a.provider).running++;
    return { id, mins, usual, slow: !!usual && mins >= 10 && mins >= 2 * usual };
  });
  const mostly = (p) => { const by = groupBy(fin.filter((r) => r.provider === p && r.status !== 'ok'), (r) => causeOf(r.error));
    return [...by.entries()].sort((a, b) => b[1].length - a[1].length)[0]?.[0]; };
  for (const [p, c] of Object.entries(per)) {
    if (c.streak >= 3) alerts.push(`${PROVIDERS[p] ?? p}: the last ${c.streak} runs failed (${causeOf(c.last.error)})`);
    else if (c.failed >= 3 && c.failed >= c.ok) alerts.push(`${PROVIDERS[p] ?? p}: ${c.failed} of ${c.ok + c.failed} runs failed this batch, mostly ${mostly(p).toLowerCase()}`);
  }
  for (const a of active) if (a.slow) alerts.push(`${a.id} has been running ${fmtMin(a.mins)}, ${fmtX(a.mins / a.usual)} the usual ~${fmtMin(a.usual)} for its setup`);
  const total = st.planned ?? null, left = total != null ? Math.max(0, total - st.finished - active.length) : null;
  const perMin = st.running && st.finished >= 2 ? st.finished / ((Date.now() - t0) / 60000) : null;
  return { per, active, alerts, total, left, eta: perMin && left != null ? (left + active.length / 2) / perMin : null,
    flagged: fin.filter((r) => runFlags().has(r.id) && !reviewed(r)) };
}

// Tukey's median polish over any number of factors: y ≈ mu + Σ effect(level). Medians keep it
// robust, so the odd runs it's meant to spot don't drag the baseline with them.
function polish(data, nf) {
  const eff = Array.from({ length: nf }, () => new Map()), count = Array.from({ length: nf }, () => new Map());
  for (const d of data) d.lv.forEach((l, k) => count[k].set(l, (count[k].get(l) ?? 0) + 1));
  let mu = median(data.map((d) => d.y));
  for (let it = 0; it < 8; it++) for (let k = 0; k < nf; k++) {
    const g = new Map();
    for (const d of data) {
      let rest = d.y - mu;
      for (let j = 0; j < nf; j++) if (j !== k) rest -= eff[j].get(d.lv[j]) ?? 0;
      if (!g.has(d.lv[k])) g.set(d.lv[k], []);

// What's usual for a run's exact setup (model+effort, each variant, prompt version), learned from
// every finished run in log space, so it works even when that exact combination ran only once.

const FLAG_METRICS = ['wallMinutes', 'costUsd', 'outputTokens', 'kb', 'loc'];
const usualFits = () => cached('usual', () => {
  const ok = results.filter((r) => r.status === 'ok');
  const dims = Object.keys(cfg.dimensions).filter((d) => new Set(ok.map((r) => r[d] ?? '')).size > 1);
  const facs = [(r) => r.id.split('__')[0], ...dims.map((d) => (r) => String(r[d] ?? '')), (r) => r.promptVersion ?? ''];
  return Object.fromEntries(FLAG_METRICS.map((k) => {
    const data = ok.filter((r) => r[k] > 0).map((r) => ({ y: Math.log(r[k]), lv: facs.map((f) => f(r)) }));
    if (data.length < 6) return [k, null];

    const usual = (r) => { const lv = facs.map((f) => f(r)); return lv.every((l, i) => (p.count[i].get(l) ?? 0) >= 3) ? Math.exp(p.fit(lv)) : null; };
    return [k, { usual, scale }];

// Finished runs that look off, most serious first: no game, no reply, TODOs left, a time, cost or

// whatever a view's filters.

    if (!r.delivered) items.push({ sev: 100, bad: true, tag: 'no game', text: 'Finished OK but left no game file (.html) in the work folder root' });
    if (!r.hasReply) items.push({ sev: 60, tag: 'no reply', text: r.rounds > 1 ? `No final reply: the last of its ${r.rounds} /goal rounds ended without text` : 'No final reply: its last message was empty' });

    for (const k of FLAG_METRICS) { const u = fits[k]?.usual(r); if (u && r[k] > 0) { s += Math.abs(Math.log(r[k] / u)) / fits[k].scale; n++; } }

// A → B on any field, optionally once per value of another ("for each"): opus · medium → sonnet · medium,

  const vals = valsOf(c.f);

  if (!splits.includes(c.by)) c.by = '';

    opts.map(([v, l]) => h('option', { value: v, selected: v === value }, l)));

  const none = !res.length || (c.matched && res.every((col) => !pairs(col)));

    h('h2', {}, 'Compare'),
    h('div', { class: 'row cmpctl', style: 'margin:8px 0 4px' },
      h('span', { class: 'cl only-phone' }, 'Compare'), pick(c.f, fields.map((f) => [f, fieldLabel(f)]), (f) => set({ f }), 'What differs between A and B'),
      h('span', { class: 'cl only-phone' }, 'A'), pick(c.a, vals.map((v) => [v, valLabel(c.f, v)]), (a) => set({ a }), 'A'),
      h('span', { class: 'muted hide-phone' }, '→'),
      h('span', { class: 'cl only-phone' }, 'B'), h('span', { class: 'row', style: 'gap:4px; flex-wrap:nowrap' }, pick(c.b, vals.map((v) => [v, valLabel(c.f, v)]), (b) => set({ b }), 'B'),

        h('input', { type: 'checkbox', checked: c.matched, onchange: (e) => set({ matched: e.target.checked }) }), 'Only matching variants')),
    h('p', { class: 'sub' }, 'How B differs from A in the runs shown. For example model + effort: opus · medium → sonnet · medium; or effort: medium → high for each model, to see which model gains more from extra effort. Bold: the same direction in at least 80% of 3 or more pairs.'),

// Score, notes and "looked at" all go to runs/scores.json; any of them counts as reviewed. Saved with

async function saveReview(r, patch) {
  const cur = results.find((x) => x.id === r.id) ?? r, before = { score: cur.score, notes: cur.notes, seen: cur.seen };
  Object.assign(cur, patch); if (cur !== r) Object.assign(r, patch);
  try { await api('/api/score', 'PUT', { id: cur.id, score: cur.score ?? '', notes: cur.notes ?? '', seen: !!cur.seen, startedAt: cur.startedAt }); }
  catch (e) { Object.assign(cur, before); if (cur !== r) Object.assign(r, before); alert(`Couldn't save: ${e.message}`); }

// A score is 0 to 10 (halves are fine); anything else is pulled into range.
function saveScore(r, input) {
  if (input.value === '') return saveReview(r, { score: null });
  const n = Math.min(10, Math.max(0, Math.round(+input.value * 10) / 10));
  if (!Number.isFinite(n)) { input.value = r.score ?? ''; return; }
  input.value = n; saveReview(r, { score: n });
}
// The Insights tab shows how many flagged runs nobody has reviewed yet.

        : h('span', { class: 'tag', title: r.changed?.includes(d) ? 'This variant\'s text was edited after the run' : null }, `${d}=${r[d] ?? '—'}${r.changed?.includes(d) ? ' (old text)' : ''}`))),
    r.error ? h('p', { class: 'errs' }, `${causeOf(r.error)}: ${r.error}`) : null,
    fl ? h('div', { class: 'warns', style: 'margin-bottom:10px' }, fl.items.map((i) => h('div', {}, i.text))) : null,
    h('div', { class: 'grid2' },
      h('table', {}, h('tbody', {},
        line('Time', fmtMin(r.wallMinutes), usual('wallMinutes')),

        line('Input tokens', tok('inputTokens'), r.inputTokens != null ? `${fmtTok(r.cachedTokens ?? 0)} cache read${r.cacheWriteTokens != null ? ` · ${fmtTok(r.cacheWriteTokens)} cache write` : ''}` : ''),
        line('Total tokens', tok('totalTokens')),
        line('Turns', r.turns, r.rounds > 1 ? `in the last of ${r.rounds} /goal rounds` : ''),
        line('Subagents', r.subagents))),
      h('table', {}, h('tbody', {},
        line('Game file', r.delivered ? fmtKb(r.kb) : 'none', r.delivered ? usual('kb') : ''),
        line('Lines', r.loc != null ? fmtNum(r.loc) : null, usual('loc')),
        line('Dev files', r.files),
        line('TODO / FIXME', r.todos),
        line('Reply', r.hasReply ? (r.replyChars ? `${fmtNum(r.replyChars)} characters` : 'yes') : 'none'),
        line('CLI version', r.cli),
        line('Prompt', promptLabel(r.promptVersion)),
        line('Started', when(r.startedAt)), line('Finished', when(r.finishedAt))))),
    r.gone ? null : h('div', { class: 'row', style: 'margin-top:12px' },
      h('label', { class: 'muted', for: 'dlg-score' }, 'Score'),
      h('input', { type: 'number', id: 'dlg-score', min: 0, max: 10, step: 0.5, inputmode: 'decimal', class: 'score', value: r.score ?? '', onchange: (e) => saveScore(r, e.target) }),
      h('input', { class: 'grow', value: r.notes ?? '', placeholder: 'notes', 'aria-label': 'Notes', style: 'min-width:min(160px, 100%)', onchange: (e) => saveReview(r, { notes: e.target.value }) }),
      h('label', { class: 'row', style: 'gap:6px' }, h('input', { type: 'checkbox', checked: !!r.seen, onchange: (e) => saveReview(r, { seen: e.target.checked }) }), 'Looked at')),
    r.gone ? null : h('div', { class: 'row', style: 'margin-top:10px' },

      fileButtons(r)));
}

// ------------------------------------------------------------------- AUDIT
// audit.json, written by whoever audits the repo: what was found, what was done about it, what's left to
// decide, and how it was checked. Read marks stay in this browser.
const SEVS = ['critical', 'high', 'medium', 'low', 'info'];
const STATUS = { fixed: 'Fixed', yours: 'Your call', open: 'Not fixed', note: 'Note' };
// Plain text with `code` spans and blank-line paragraphs.
const prose = (t) => String(t ?? '').split(/\n{2,}/).map((para) => h('p', { class: 'audit-p', style: 'margin:0 0 6px' },
  para.split('`').map((bit, i) => i % 2 ? h('code', {}, bit) : bit)));
const inline = (t) => String(t ?? '').split('`').map((bit, i) => i % 2 ? h('code', {}, bit) : bit);
const openFindings = (on) => document.querySelectorAll('#tab-audit details.finding').forEach((d) => { d.open = on; });
function markRead(ids, on) {
  for (const id of ids) on ? auditRead.add(id) : auditRead.delete(id);
  store.set('matrix.auditRead', [...auditRead]); updateBadge(); render();
}
function renderAudit() {
  const root = $('#tab-audit');
  if (!audit) return morph(root, h('div', { class: 'card', key: 'none' }, h('p', { class: 'muted', style: 'margin:0' }, 'No audit.json next to dashboard.mjs.')));
  const all = audit.findings ?? [], f = ui.auditFilter ??= {};
  const shown = all.filter((x) => (!f.sev || x.severity === f.sev) && (!f.area || x.area === f.area) && (!f.status || x.status === f.status) && (!f.unread || !auditRead.has(x.id)));
  const count = (fn) => all.filter(fn).length, read = count((x) => auditRead.has(x.id));
  const setF = (patch) => { Object.assign(f, patch); saveUi(); renderAudit(); };
  const sel = (key, label, opts) => h('select', { 'aria-label': label, class: f[key] ? 'on' : null, onchange: (e) => setF({ [key]: e.target.value }) },
    h('option', { value: '' }, `${label}: all`), opts.map(([v, l]) => h('option', { value: v, selected: f[key] === v }, `${label}: ${l}`)));
  const tile = (k, v, d) => h('div', { class: 'tile' }, h('span', { class: 'k' }, k), h('span', { class: 'v' }, v), d ? h('span', { class: 'd' }, d) : null);
  const areas = [...new Set(all.map((x) => x.area))];
  const t = audit.tests ?? {}, sc = audit.screens ?? {};
  morph(root,
    h('div', { class: 'card', key: 'head' },
      h('div', { class: 'row' }, h('h2', { class: 'grow' }, audit.title ?? 'Audit'), audit.date ? h('span', { class: 'muted' }, audit.date) : null),
      audit.summary ? h('div', { style: 'margin:6px 0 12px' }, prose(audit.summary)) : null,
      h('div', { class: 'tiles' },
        tile('Findings', all.length, `${count((x) => x.status === 'fixed')} fixed`),
        audit.decisions?.length ? tile('Your call', audit.decisions.length, 'decisions left for you') : null,
        t.passed != null ? tile('Tests', `${t.passed} ✔`, t.failed ? `${t.failed} failing` : 'all passing') : null,
        sc.rows ? tile('Screens checked', sc.rows.length, sc.note ?? '') : null,
        tile('Read', `${read} / ${all.length}`, read === all.length ? 'all read ✔' : 'tick each finding as you go'))),
    audit.decisions?.length ? h('div', { class: 'card', key: 'decisions' },
      h('h2', {}, 'Your call'),
      h('p', { class: 'sub' }, 'Things I left for you to decide, most important first.'),
      h('ol', { class: 'audit-list' }, audit.decisions.map((d) => h('li', { key: d.title }, h('strong', {}, inline(d.title)), h('div', {}, prose(d.detail)))))) : null,
    h('div', { class: 'card', key: 'findings' },
      h('div', { class: 'row' }, h('h2', { class: 'grow' }, 'Findings'),
        h('button', { class: 'btn', onclick: () => openFindings(true) }, 'Expand all'),
        h('button', { class: 'btn', onclick: () => openFindings(false) }, 'Collapse all'),
        h('button', { class: 'btn', disabled: !shown.some((x) => !auditRead.has(x.id)), onclick: () => markRead(shown.map((x) => x.id), true) }, 'Mark shown as read')),
      h('div', { class: 'row', style: 'margin:8px 0 2px' },
        sel('sev', 'Severity', SEVS.filter((v) => all.some((x) => x.severity === v)).map((v) => [v, v])),
        sel('area', 'Area', areas.map((v) => [v, v])),
        sel('status', 'Status', Object.entries(STATUS).filter(([k]) => all.some((x) => x.status === k))),
        h('label', { class: 'row', style: 'gap:6px' }, h('input', { type: 'checkbox', checked: !!f.unread, onchange: (e) => setF({ unread: e.target.checked }) }), 'Unread only')),
      h('p', { class: 'hint' }, `${shown.length} of ${all.length} shown, most serious first. High ones and your calls start open; click a title to open or close it.`),
      shown.length ? shown.map((x) => { const read = auditRead.has(x.id);
        return h('details', { class: 'finding' + (read ? ' read' : ''), key: x.id, id: 'finding-' + x.id, open: x.severity === 'high' || x.status === 'yours' },
          h('summary', { class: 'fhead' },
            h('span', { class: `tag sev-${x.severity}` }, x.severity),
            h('span', { class: `tag st-${x.status}` }, STATUS[x.status] ?? x.status),
            h('span', { class: 'tag' }, x.area),
            h('span', { class: 'ftitle' }, inline(x.title)),
            read ? h('span', { class: 'ok', title: 'Read' }, '✓ read') : null),
          h('dl', {},
            x.found ? [h('dt', {}, 'What I found'), h('dd', {}, prose(x.found))] : null,
            x.did ? [h('dt', {}, x.status === 'fixed' ? 'What I did' : 'Why not / next'), h('dd', {}, prose(x.did))] : null,
            x.check ? [h('dt', {}, 'How I checked'), h('dd', {}, prose(x.check))] : null,
            x.where?.length ? [h('dt', {}, 'Where'), h('dd', {}, x.where.map((w, i) => [i ? ', ' : '', h('code', {}, w)]))] : null),
          h('label', { class: 'row', style: 'gap:6px; margin-top:10px; justify-content:flex-end' },
            h('input', { type: 'checkbox', checked: read, onchange: (e) => markRead([x.id], e.target.checked) }), 'Read'));
      }) : h('p', { class: 'muted' }, 'Nothing matches these filters.')),
    audit.changes?.length ? h('div', { class: 'card', key: 'changes' },
      h('h2', {}, 'What\'s new'),
      h('ul', { class: 'audit-list' }, audit.changes.map((c) => h('li', { key: c.title }, h('strong', {}, inline(c.title)), c.detail ? h('div', { class: 'muted' }, prose(c.detail)) : null)))) : null,
    t.suites?.length ? h('div', { class: 'card', key: 'tests' },
      h('h2', {}, 'How it was tested'), t.summary ? h('div', { class: 'sub' }, prose(t.summary)) : null,
      h('div', { class: 'scroll' }, h('table', { class: 'pin' },
        h('thead', {}, h('tr', {}, ['Suite', 'Result', 'What it covers'].map((x) => h('th', {}, x)))),
        h('tbody', {}, t.suites.map((x) => h('tr', { key: x.name }, h('td', { style: 'min-width:140px' }, h('strong', {}, inline(x.name))),
          h('td', { style: 'white-space:nowrap' }, h('span', { class: 'tag ' + (x.result === 'pass' ? 'ok' : 'bad') }, x.result === 'pass' ? `✔ ${x.count ?? ''} passed` : `✘ ${x.result}`)),
          h('td', { style: 'min-width:240px' }, prose(x.detail)))))))) : null,
    sc.rows?.length ? h('div', { class: 'card', key: 'screens' },
      h('h2', {}, 'Screens checked'), sc.summary ? h('div', { class: 'sub' }, prose(sc.summary)) : null,
      h('div', { class: 'scroll' }, h('table', { class: 'pin' },
        h('thead', {}, h('tr', {}, ['Screen', 'Engine', 'Size', 'Result'].map((x) => h('th', {}, x)))),
        h('tbody', {}, sc.rows.map((x) => h('tr', { key: x.device + x.engine }, h('td', {}, x.device), h('td', {}, x.engine), h('td', { class: 'num' }, x.size),
          h('td', {}, h('span', { class: 'tag ' + (x.result === 'ok' ? 'ok' : 'warn') }, x.result === 'ok' ? '✔ ok' : x.result)))))))) : null);
}

// ------------------------------------------------------------------- data
async function loadSetup() {
  const c = await api('/api/config');
  meta = { path: c.path, outDir: c.outDir, platform: c.platform };
  cfg = c.config || { templateFile: 'prompt-template.md', agents: [], dimensions: {} };
  cfg.agents ??= []; cfg.dimensions ??= {}; cfg.bins ??= {}; cfg.extraArgs ??= {};
  savedCfg = JSON.stringify(cfg);
  const t = await api('/api/template'); tmpl = t.text; savedTmpl = tmpl; meta.templatePath = t.path; meta.promptVersion = t.version;
  if (c.rev) Object.assign(rev, { config: c.rev.config, template: c.rev.template, results: rev.results ?? c.rev.results });
  onDisk = false; cache = {};
}
async function loadResults() {
  const rows = await api('/api/results');
  for (const r of rows) {
    r.ultracode = r.ultracode === true || r.ultracode === 'on' ? 'on' : 'off';
    if (r.cliVersion) r.cli = `${SHORT[r.provider] ?? r.provider} ${r.cliVersion}`; // versions only compare within a CLI
  }
  results = rows; cache = {}; updateBadge();
}
async function loadAudit() { try { audit = await api('/api/audit'); } catch { audit = null; } updateBadge(); }

// Every 2 s (10 s while the page is hidden): batch progress and the log, plus signatures of the results,
// config, prompt and tests. Whatever changed is reloaded and the open tab redrawn, wherever the change
// came from: this page, another tab, `node run-matrix.mjs` in a terminal, or a hand edit. One poll at
// a time, so a slow answer can't add the same log lines twice.
let pollChain = Promise.resolve(), pollTimer = null, wasRunning = false, logFollow = true;
function poll() {
  clearTimeout(pollTimer);
  const p = pollChain = pollChain.then(pollOnce, pollOnce).catch((e) => console.error(e)).finally(() => {
    if (p === pollChain) pollTimer = setTimeout(poll, document.hidden ? 10000 : 2000);
  });
  return p;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg) poll(); });

async function pollOnce() {
  let st;
  try { st = await api(`/api/status?since=${logSince}&smokes=${rev.smokes ?? ''}`, 'GET', undefined, 15000); }
  catch { if (!offline) { offline = true; setPill(); } return; }
  const back = offline; offline = false;
  if (st.logTotal < logSince) { resetLog(); return pollOnce(); } // a new batch (or a restarted server) started a new log
  status = st;
  let changed = back || wasRunning !== !!st.running;
  if (st.smokes) { smokes = st.smokes; changed = true; }
  if (st.rev?.smokes != null) rev.smokes = st.rev.smokes;
  if (st.log.length) {
    const add = st.log.join('\n') + '\n', pre = $('#logpre');
    logText += add;
    if (logText.length > 500000) { logText = logText.slice(-400000); if (pre) pre.textContent = logText; } else pre?.append(add);
    if (pre && logFollow) pre.scrollTop = pre.scrollHeight;
  }
  logSince = st.logTotal;
  // What changed on disk since the last poll.
  const r = st.rev ?? {};
  const setupChanged = rev.config != null && (r.config !== rev.config || r.template !== rev.template);
  if (setupChanged) {
    rev.config = r.config; rev.template = r.template;
    if (dirty()) onDisk = true; else await loadSetup();
    changed = true;
  }
  if (r.results !== rev.results || setupChanged) { rev.results = r.results; await loadResults(); changed = true; }
  wasRunning = !!st.running;
  setPill();
  if (changed) { render(); refreshModal(); }
  else if (tab === 'run') renderLive(); // the timers tick
  if (Object.values(smokes).some((x) => x.running)) renderSmokes(); // "testing… 12s"
}

// The pill and the browser tab's title show progress and live warnings, so a background tab shows them too.
function setPill() {
  const pill = $('#pill'), st = status, hb = cfg ? batchHealth() : null, warn = st.running ? hb?.alerts.length ?? 0 : 0;
  let full, short, cls = '';
  if (offline) { full = short = 'Dashboard server not reachable'; cls = ' off'; }
  else if (st.running) {
    full = st.stopping ? 'Stopping…' : `Running · ${st.active.length} active · ${st.finished}${hb?.total ? ` of ${hb.total}` : ''} done${warn ? ` · ⚠ ${warn}` : ''}`;
    short = st.stopping ? 'Stopping…' : `● ${st.finished}${hb?.total ? `/${hb.total}` : ''} done${warn ? ` ⚠${warn}` : ''}`; cls = ' live';
  } else full = short = st.updating ? `Updating ${PROVIDERS[st.updating] ?? st.updating}…` : 'Idle';
  morph(pill, h('span', { class: 'full' }, full), h('span', { class: 'short' }, short));
  pill.className = 'pill' + cls; pill.title = full;
  document.title = `${offline || warn ? '⚠ ' : ''}${st.running && hb?.total ? `${st.finished}/${hb.total} · ` : ''}Matrix Dashboard`;
}

(async () => {
  // Opened by double-clicking the file: there's no server to talk to.
  if (location.protocol === 'file:') {
    $('main').replaceChildren(h('div', { class: 'card', style: 'max-width:720px;margin:40px auto' },
      h('h2', {}, 'Start the dashboard server first'),
      h('p', {}, 'This page needs its small local server, so it can\'t be opened as a file. In your Ubuntu (WSL) terminal:'),
      h('pre', { class: 'mono', style: 'background:var(--code);padding:12px;border-radius:8px' }, 'cd ~/dev/cc-matrix\nnode dashboard.mjs'),
      h('p', {}, 'Then open ', h('a', { href: 'http://localhost:4173' }, 'http://localhost:4173'), ' in your browser.')));
    $('#pill').textContent = 'Not started';
    return;
  }
  // The server may still be starting (or was restarted): keep trying instead of showing a blank page.
  for (let tries = 0; ; tries++) {
    try { await loadSetup(); await loadResults(); break; }
    catch (e) {
      offline = true; setPill();
      morph($('#tab-run'), h('div', { class: 'card', key: 'wait' }, h('h2', {}, 'Waiting for the dashboard server…'),
        h('p', { class: 'muted' }, `Start it with node dashboard.mjs in this folder. Trying again every few seconds (${e.message}).`)));
      $('#tab-run').classList.add('on');
      await new Promise((r) => setTimeout(r, Math.min(10000, 1500 * (tries + 1))));
    }
  }
  offline = false;
  await loadAudit();
  loadClis(); // takes a few seconds (it asks each CLI); the page works meanwhile
  await poll(); // batch status first, so a view of the last batch opens on it
  showTab(tab);
})();
</script>
