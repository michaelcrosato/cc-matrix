<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Auto Lap Happy transport test</title></head>
<body>
<script src="../src/network.js"></script>
<script>
window.events=[];window.inputs=[];window.snaps=[];
window.net=new HappyNetwork({onStart:c=>events.push(['start',c]),onSnapshot:s=>snaps.push(s),onInput:(seat,i)=>inputs.push([seat,i]),onFinish:s=>events.push(['finish',s]),onEnd:r=>events.push(['end',r]),onStatus:t=>events.push(['status',t])});
</script>
</body>
</html>
