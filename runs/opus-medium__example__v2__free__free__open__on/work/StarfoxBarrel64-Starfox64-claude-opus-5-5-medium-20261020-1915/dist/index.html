<!--
STARFOX BARREL 64 · single-file demo
Source Information
- Date: 2026-10-20 19:15
- Source: Starfox 64 for N64 (Nintendo, 1997). Starfox Barrel 64 is an original spiritual successor and parody title; no original assets, names or audio are used.
- Tech: Three.js r180 (three/webgpu WebGPURenderer, TSL node materials, toonOutlinePass, BloomNode, PostProcessing) · WebGPU only, no fallback · Rapier 0.19.3 (@dimforge/rapier3d-compat) for colliders, ray-cast lasers, shape overlap tests, dynamic debris and zero-g asteroids · Web Audio API (fully synthesized SFX, procedural music tracker, radio voice blips) · Gamepad API (PS5 standard mapping + vibration) · vanilla ES modules bundled with esbuild 0.25 into one HTML file · Three.js and Rapier loaded from the jsDelivr CDN.
- Art Direction: stylized cel shading. 3-step toon ramp, faceted flat-shaded low-poly models, screen-space inverted-hull ink outlines, banded sky gradient, emissive bloom on lasers and engines, cartoon fireball explosions.
- Animation: procedural code-driven animation. Spline rails with arc-length parameterisation, quaternion flight dynamics (bank, barrel roll, somersault, U-turn), sinusoidal walk-cycle rig for the walker boss, ribbon trails, pooled particles and physics-simulated debris. No keyframe files.
- Testing: the prompt placed no restrictions on testing ("No restriction on testing"). It asked for checks across small phones, tablets and wide screens and in WebKit. Automated checks ran in headless Chromium (SwiftShader WebGPU) via Playwright. Real iOS Safari was not available.
- Environment: Claude Code CLI (headless); Linux; browser unknown.
- Model: Anthropic, claude-opus-5-5, reasoning effort medium.
- Usage: unknown (no reliable cost/token meter available in-session).

Engine Feedback
- Liked most: TSL + WebGPURenderer make custom effects (ocean waves via positionNode, the sky shader, a vignette/flash post chain) short and composable, and toonOutlinePass gave ink lines almost for free. Rapier's query API (castRay, intersectionsWithShape) maps neatly onto arcade lasers and hit-boxes.
- Stuck / guessed wrong: Object3D.lookAt points +Z at the target, unlike cameras, which matters for quaternion flight math. navigator.gpu only exists in secure contexts, so about:blank testing silently fails. Rapier ray hits renamed toi to timeOfImpact.
- Most important thing built by hand: the rail system (arc-length Catmull-Rom frames, branching routes, a closed boss loop) plus the event timeline that drives spawns, radio and checkpoints.
- Hardest part: toon outlines on hard-edged boxes need merged-vertex smooth normals for a closed hull, while faceted shading still needs flat normals (flatShading on the toon node material).
- Would remove or overhaul: WebGPURenderer's silent automatic WebGL2 fallback. A strict-mode flag would make a WebGPU-only requirement explicit.
- Would change: ship a per-object outline thickness/colour on toonOutlinePass and an official BVH raycast helper for large terrain meshes.

Prompt Feedback
- Prompt: TASK.md, which asks for an original spiritual successor to Starfox 64 as a feature-complete single-file demo.
- Liked most: clear "feature-complete demo" reference points (MGS2 Tanker, Doom E1) and the controller-first 10-foot UX direction.
- Confusing: "[PROMPT]" under Prompt Feedback looks like an unfilled template slot. The GameTitle-SOURCE file naming does not say how to format spaces or punctuation.
- Hardest: fitting rail mode, all-range mode, two bosses, wingmen, branching, attract mode and full menus into one coherent, bug-free slice in a single session.
- One test to run: a long soak test on real hardware with a DualSense, playing both missions start to finish on all three difficulties while logging frame time, memory and any console errors.

  { h: "Source Information", p: [
    "Date: 2026-10-20 19:15",
    "Source: Starfox 64 for N64 (Nintendo, 1997). Starfox Barrel 64 is an original spiritual successor and parody title; no original assets, names or audio are used.",
    "Tech: Three.js r180 (three/webgpu WebGPURenderer, TSL node materials, toonOutlinePass, BloomNode, PostProcessing) \xB7 WebGPU only, no fallback \xB7 Rapier 0.19.3 (@dimforge/rapier3d-compat) for colliders, ray-cast lasers, shape overlap tests, dynamic debris and zero-g asteroids \xB7 Web Audio API (fully synthesized SFX, procedural music tracker, radio voice blips) \xB7 Gamepad API (PS5 standard mapping + vibration) \xB7 vanilla ES modules bundled with esbuild 0.25 into one HTML file \xB7 Three.js and Rapier loaded from the jsDelivr CDN.",

    "Animation: procedural code-driven animation. Spline rails with arc-length parameterisation, quaternion flight dynamics (bank, barrel roll, somersault, U-turn), sinusoidal walk-cycle rig for the walker boss, ribbon trails, pooled particles and physics-simulated debris. No keyframe files.",

    "Stuck / guessed wrong: Object3D.lookAt points +Z at the target, unlike cameras, which matters for quaternion flight math. navigator.gpu only exists in secure contexts, so about:blank testing silently fails. Rapier ray hits renamed toi to timeOfImpact.",

.reticle.r1{width:5.6vmin;height:5.6vmin}.reticle.r2{width:3.6vmin;height:3.6vmin;opacity:.85}
.reticle.hot{border-color:#ff4d5e;box-shadow:0 0 1.4vmin #f45}
.reticle .ch{position:absolute;left:50%;top:50%;width:.6vmin;height:.6vmin;background:#6aff9a;transform:translate(-50%,-50%);border-radius:50%}
.chargering{position:absolute;width:9vmin;height:9vmin;border-radius:50%;transform:translate(-50%,-50%);border:.5vmin solid rgba(200,255,120,.9);box-shadow:0 0 2vmin #af6}
.lock{position:absolute;width:8vmin;height:8vmin;transform:translate(-50%,-50%) rotate(45deg);border:.45vmin solid #ff4d5e;box-shadow:0 0 1.5vmin #f45;animation:lockspin 1s linear infinite}
@keyframes lockspin{to{transform:translate(-50%,-50%) rotate(405deg)}}
.radar{position:absolute;right:5vmin;bottom:4.5vmin;width:24vmin;height:24vmin}
.bossbar{position:absolute;left:50%;top:4vmin;transform:translateX(-50%);width:56vmin;text-align:center}
.bossbar .name{font-size:2.4vmin;font-weight:900;letter-spacing:.2em;color:#ffb0b8;text-shadow:0 0 1vmin #f24}
.bossbar .b{height:2vmin;margin-top:.6vmin;background:rgba(0,0,0,.6);border:.3vmin solid #ff8a96;border-radius:1vmin;overflow:hidden}
.bossbar .b i{display:block;height:100%;background:linear-gradient(90deg,#ff3050,#ff9a60);transform-origin:left;transition:transform .2s}
.radio{position:absolute;left:5vmin;bottom:15vmin;min-width:min(62vmin,56vw);display:flex;gap:1.6vmin;align-items:stretch;max-width:min(78vmin,60vw);padding:1.2vmin;animation:pop .2s}
.radio canvas{width:13vmin;height:13vmin;border-radius:1vmin;border:.3vmin solid #9fe3ff;background:#0a1630;flex:none}
.radio .nm{font-weight:900;font-size:2.4vmin;letter-spacing:.08em}
.radio .tx{font-size:calc(2.7vmin * var(--sub));line-height:1.3;margin-top:.5vmin;text-shadow:0 .2vmin 0 #000}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.hint{position:absolute;left:50%;bottom:12vmin;transform:translateX(-50%);padding:1.2vmin 2.4vmin;font-size:2.7vmin;font-weight:700;white-space:nowrap;animation:pop .25s}
.toasts{position:absolute;left:50%;top:22vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1vmin}
.toast{font-size:3.6vmin;font-weight:900;font-style:italic;letter-spacing:.08em;text-shadow:0 .35vmin 0 #000,0 0 1.5vmin currentColor;animation:toast 2.2s forwards}
@keyframes toast{0%{transform:scale(1.6);opacity:0}10%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-2vmin)}}
.pop{position:absolute;font-weight:900;font-size:3vmin;color:#fff;text-shadow:0 0 1vmin #39d0ff,0 .3vmin 0 #000;transform:translate(-50%,-50%);animation:rise .9s forwards}
@keyframes rise{to{transform:translate(-50%,-260%);opacity:0}}
.card-big{position:absolute;left:0;right:0;top:30vh;text-align:center}
.card-big .k{font-size:3vmin;letter-spacing:.5em;color:#9fe3ff}
.card-big .t{font-size:11vmin;font-weight:900;font-style:italic;line-height:1;text-shadow:0 .6vmin 0 #062048,0 0 3vmin rgba(60,190,255,.9);animation:slidein .5s}
.card-big .s{font-size:3vmin;letter-spacing:.2em;margin-top:1.2vmin}
@keyframes slidein{from{transform:translateX(-30vw) skewX(-20deg);opacity:0}}
.warning{position:absolute;left:0;right:0;top:40vh;text-align:center;font-size:9vmin;font-weight:900;letter-spacing:.3em;color:#ff3a4a;text-shadow:0 0 3vmin #f00;animation:blink .5s 6}
.attract{position:absolute;left:0;right:0;top:3vh;text-align:center;font-size:3.4vmin;font-weight:900;letter-spacing:.4em;color:#fff;text-shadow:0 0 1.5vmin #39d0ff}
.attract2{position:absolute;left:0;right:0;bottom:17vh;text-align:center;font-size:3vmin;font-weight:800;animation:blink 1.4s infinite}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.results{width:min(110vmin,90vw);padding:3vmin 4vmin;pointer-events:auto}
.results h2{font-size:5vmin;margin:0;font-style:italic}
.rrow{display:flex;justify-content:space-between;font-size:3vmin;padding:.8vmin 0;border-bottom:.15vmin solid rgba(120,160,255,.25)}
.rrow b{color:var(--gold)}
.medalbig{font-size:4vmin;font-weight:900;margin:2vmin 0;color:var(--gold);text-shadow:0 0 2vmin #fa0}
.teamres{display:flex;gap:3vmin;justify-content:center;margin:2vmin 0}
.teamres div{text-align:center;font-size:2.2vmin}.teamres canvas{width:11vmin;height:11vmin;border-radius:1vmin;border:.3vmin solid #9fe3ff;display:block;margin:0 auto .6vmin}
.brief{width:min(120vmin,90vw);padding:3vmin 4vmin;pointer-events:auto}
.brief .line{text-align:left;display:flex;gap:2vmin;align-items:center;margin:1.4vmin 0;font-size:2.8vmin;opacity:.25;transition:opacity .3s}
.brief .line.on{opacity:1}
.brief canvas{width:10vmin;height:10vmin;border-radius:1vmin;border:.25vmin solid #9fe3ff;flex:none}
.block{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#0c2050,#02040c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;text-align:center;padding:6vmin;pointer-events:auto}
.block h1{font-size:6vmin;margin:0}.block p{font-size:3vmin;max-width:80vmin;color:#cfe3ff}
.btn{pointer-events:auto;font-size:3.4vmin;font-weight:800;padding:2vmin 5vmin;border-radius:1.6vmin;border:.35vmin solid var(--accent);background:rgba(57,208,255,.2);color:#fff;cursor:pointer}
.fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .4s;pointer-events:none}.fade.on{opacity:1}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3vmin;letter-spacing:.3em;background:#02040c}

  drawRadar(g) {
    const x = this.radar, P = g.player, W = 240, R = 112;
    x.clearRect(0, 0, W, W);
    x.save();
    x.translate(W / 2, W / 2);
    x.fillStyle = "rgba(6,14,34,0.75)";
    x.strokeStyle = "rgba(120,200,255,0.8)";
    x.lineWidth = 3;
    x.beginPath();
    x.arc(0, 0, R, 0, Math.PI * 2);
    x.fill();
    x.stroke();
    x.strokeStyle = "rgba(120,200,255,0.25)";
    x.lineWidth = 1.5;
    x.beginPath();
    x.arc(0, 0, R * 0.5, 0, Math.PI * 2);
    x.moveTo(-R, 0);
    x.lineTo(R, 0);
    x.moveTo(0, -R);
    x.lineTo(0, R);
    x.stroke();
    const yaw = Math.atan2(P.forward.x, P.forward.z);
    const range = 900;
    const plot = (p, col, size, shape = "dot") => {
      const dx = p.x - P.pos.x, dz = p.z - P.pos.z;
      const rx = dx * Math.cos(-yaw) + dz * Math.sin(-yaw);
      const rz = -dx * Math.sin(-yaw) + dz * Math.cos(-yaw);
      let px = -rx / range * R, py = -rz / range * R;
      const L = Math.hypot(px, py);
      if (L > R - 4) {
        px *= (R - 4) / L;
        py *= (R - 4) / L;
      }
      x.fillStyle = col;
      x.beginPath();
      if (shape === "tri") {
        x.moveTo(px, py - size);
        x.lineTo(px + size, py + size);
        x.lineTo(px - size, py + size);
        x.closePath();
      } else x.arc(px, py, size, 0, Math.PI * 2);
      x.fill();
      const dy = p.y - P.pos.y;
      if (Math.abs(dy) > 40) {
        x.fillRect(px - 1, py, 2, -Math.sign(dy) * 8);
      }
    };
    for (const it of g.items) if (it.alive) plot(it.pos, "#ffd050", 3.5);
    for (const e of g.enemies) if (e.alive && e.sensor) plot(e.pos, e.kind === "ace" ? "#ff9a30" : "#ff4050", e.kind === "ace" ? 7 : 4.5, e.kind === "ace" ? "tri" : "dot");
    for (const w of g.wingmen) if (w.state !== "gone") plot(w.pos, w.state === "rescue" ? "#ffee50" : "#60ff90", 5, "tri");
    if (g.boss && g.boss.alive) plot(g.boss.pos, "#c070ff", 11);
    x.fillStyle = "#fff";
    x.beginPath();
    x.moveTo(0, -9);
    x.lineTo(7, 7);
    x.lineTo(-7, 7);
    x.closePath();
    x.fill();
    if (P.pos.length() > g.arena * 0.85) {
      x.strokeStyle = "#ff5060";
      x.lineWidth = 4;
      x.beginPath();
      x.arc(0, 0, R - 2, 0, Math.PI * 2);
      x.stroke();
    }
    x.restore();
  }

    if (u.acesDown && this.aces.length && this.aces.every((a) => a.down)) done = true;
    if (u.bossDead) done = this.boss && !this.boss.alive;
    if (u.time && this.stepT >= u.time && !u.bossDead) done = true;
    if (done && !u.bossDead) this.stepAdvance();

  update(rawDt) {

    if (this.slowT > 0) {
      this.slowT -= rawDt;
      if (this.slowT <= 0) this.timeScale = 1;
    }
    const dt = Math.min(rawDt, 1 / 20) * this.timeScale;
    this.time += dt;
    this.missionTime += dt;
    this.stateT += dt;
    const P = this.player;
    if (this.titleMode) {
      this.titleUpdate(dt, rawDt);
      return;
    }

    if (this.state === "intro") {
      const len = this.mode === "rail" ? 4.2 : 3.2;
      if (this.mode === "allrange") {
        const k = smooth2(Math.min(1, this.stateT / 2.6));

        P.speed = lerp(600, 78, k);

          P.speed = 78;

        this.state = "play";
        P.control = true;
        this.ui.bossCard(null);

      if (this.stateT > 2.6) this.respawnOrGameOver();
    } else if (this.state === "bossdown") {
      if (this.stateT > 2.6) {
        this.state = "clear";
        this.stateT = 0;
        P.control = false;
        P.invuln = 99;
        audio.playMusic("results");
        this.ui.clearCard(this.m);
      }
    } else if (this.state === "clear") {
      if (this.stateT > 6.5) {
        this.finishMission();
        return;
      }
    }
    if (this.state === "gameover" || this.state === "results") return;
    if (this.mode === "rail" && (this.state === "clear" || this.state === "bossdown")) this.forcedSpeed = this.stateT > 3 && this.state === "clear" ? 260 : 0;

      }

      if (it.alive) it.update(dt);

        if (this.state === "clear" && this.stateT > 3) pos.copy(this.camPos);
        look.copy(P.pos);
        k = 4;
        fov = 58;
        if (this.state === "bossdown" && this.boss) {
          look.copy(this.boss.pos).setY(30);
          pos.copy(P.pos).addScaledVector(f.t, -30).addScaledVector(f.u, 10);
        }
      }
      if (this.state === "dying") {
        pos.copy(this.camPos);
        look.copy(P.pos);
        k = 2;
      }
    } else {
      pos.copy(P.pos).addScaledVector(P.forward, -24).addScaledVector(P.up, 6.5);
      look.copy(P.pos).addScaledVector(P.forward, 26);
      up.copy(P.up);
      fov = P.boosting ? 76 : P.braking ? 56 : 64;
      k = P.uturnT || P.loopT ? 2.2 : 5;
      if (this.state === "intro") {
        pos.set(30, 14, 560);
        look.copy(P.pos);
        k = 30;
        up.set(0, 1, 0);
      }
      if (this.state === "bossintro" && this.boss) {
        pos.copy(this.boss.pos).add(V3(90, 40, 120).applyQuaternion(this.boss.obj.quaternion));
        look.copy(this.boss.pos);
        k = 3;
        up.set(0, 1, 0);
        fov = 58;
      }
      if (this.state === "clear" || this.state === "bossdown") {
        const a = this.stateT * 0.5;
        pos.copy(P.pos).add(V3(Math.cos(a) * 30, 9, Math.sin(a) * 30));
        if (this.state === "clear" && this.stateT > 3) pos.copy(this.camPos);
        look.copy(this.state === "bossdown" && this.boss ? this.boss.pos : P.pos);
        k = 3;
        up.set(0, 1, 0);
      }
      if (this.state === "dying") {
        pos.copy(this.camPos);
        look.copy(P.pos);
        k = 2;
      }
    }
    if (snap) {
      this.camPos.copy(pos);
      this.camLook.copy(look);
      this.camUp.copy(up);
    } else {
      this.camPos.lerp(pos, 1 - Math.exp(-k * rawDt));
      this.camLook.lerp(look, 1 - Math.exp(-k * 1.4 * rawDt));
      this.camUp.lerp(up, 1 - Math.exp(-4 * rawDt)).normalize();
    }
    cam.position.copy(this.camPos);
    if (this.shakeAmt > 1e-3) {
      cam.position.add(V3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(this.shakeAmt * 1.2));
      this.shakeAmt *= Math.exp(-6 * rawDt);
    }
    cam.up.copy(this.camUp);
    cam.lookAt(this.camLook);
    cam.fov = damp(cam.fov, fov, 4, rawDt);
    cam.updateProjectionMatrix();
    cam.updateMatrixWorld();
  }
};

var gameOverTimer = 0;
var ATTRACT = [
  { m: 0, jump: { s: 0 }, dur: 40 },
  { m: 0, jump: { s: 1850 }, dur: 32 },
  { m: 0, jump: { s: 3300, arches: 5 }, dur: 30, route: "canyon" },
  { m: 0, jump: { boss: true }, dur: 38 },
  { m: 1, jump: { step: 1 }, dur: 34 },
  { m: 1, jump: { step: 3 }, dur: 34 },
  { m: 1, jump: { step: 5 }, dur: 40 }

function startAttract() {
  state = "attract";
  ui.closeMenu();
  ui.title(false);
  attract = { i: -1, t: 0 };

function nextAttractScene() {
  attract.i = (attract.i + 1) % ATTRACT.length;
  attract.t = 0;
  const sc = ATTRACT[attract.i];
  game.titleMode = false;
  if (game.mi !== sc.m || !game.attract || sc.jump.s === 0) game.loadMission(sc.m, { attract: true, jump: sc.jump });

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1e3);
  lastT = now;
  input.update(dt);
  switch (state) {
    case "boot":
      if (input.anyPressed || Math.abs(input.lx) + Math.abs(input.ly) > 0.5) {
        audio.ensure();
        audio.playMusic("title");
        audio.menuConfirm();
        const ps = document.getElementById("pressStart");
        ps && ps.remove();
        input.consume();
        mainMenu();
      } else if (input.idleSeconds() > 10 && !touchBlock) startAttract();
      game.update(dt);
      break;
    case "menu":
      ui.updateMenu();
      if (input.idleSeconds() > 10 && !touchBlock) startAttract();
      game.update(dt);
      break;
    case "attract":
      if (input.anyPressed || Math.abs(input.lx) + Math.abs(input.ly) > 0.5) {
        audio.ensure();
        input.consume();
        exitAttract();
        break;
      }
      attract.t += dt;
      game.update(dt);
      if (attract.t > ATTRACT[attract.i].dur || game.state === "results" || game.state === "gameover") nextAttractScene();
      break;
    case "briefing":
      ui.updateMenu();
      break;
    case "playing":
      if (input.pressed("pause")) {
        pauseMenu();
        break;
      }
      game.update(dt);
      if (game.state === "results") {
        state = "results";
        input.consume();
      } else if (game.state === "gameover") gameOverMenu();
      break;
    case "paused":
      ui.updateMenu();
      break;
    case "results":
      if (input.pressed("confirm") || input.pressed("fire")) {
        audio.menuConfirm();
        afterResults();
      }
      break;
    case "gameover":
      ui.updateMenu();
      gameOverTimer -= dt;
      if (gameOverTimer <= 0 && state === "gameover") toTitle();
      break;

      ui.updateMenu();
      break;

async function boot() {
