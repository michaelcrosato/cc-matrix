[[tape]]
place = "bar"
name = "Rope and tallow"
lines = ["A chandler sells what a ship needs.", "Rope. Tallow. Lamp oil.", "Nobody ever blamed the rope.", "Moyo: A rifle is not rope.", "No. Rope lasts longer.", "Moyo: Who paid for this shipment?", "Ask me who did not.", "The list is shorter."]

[[tape]]
place = "mission"
name = "The cost of water"
lines = ["Moyo: They closed the clinic road.", "An administrative decision.", "Moyo: People died on the other road.", "Every road has a price.", "Mine happens to be printed.", "Moyo: Does that help you sleep?", "Nothing helps me sleep.", "I have bought rather a lot of nights."]

[[tape]]
place = "depot"
name = "The interview"
lines = ["Moyo: He asked me to note he is not a monster.", "I have noted it.", "The Chandler: Accuracy matters.", "Moyo: So does ammunition.", "You sell both sides the same promise.", "I sell them the means to disagree.", "Moyo: And the bill?", "Always itemised."]

[[tape]]
place = "hotel"
name = "A finite resource"
lines = ["You call the war a fire.", "A fire stops when nothing remains.", "This war has suppliers.", "Moyo: You could stop supplying it.", "Another man would find my chair.", "Moyo: That is your answer?", "It is my excuse.", "You asked for accuracy."]

[[tape]]
place = "works"
name = "The ledger"
lines = ["Every name. Every account.", "The junta. The schoolteacher.", "The firm that sent you.", "I hired my own replacement.", "Moyo: Or your killer.", "The invoice does not distinguish.", "There is a radio upstairs.", "You might finally say something."]

[[tape]]
place = "town"
name = "The empty stool"
lines = ["Moyo: The bar is gone.", "The chairs were already empty.", "Moyo: You supplied the shells.", "Yes.", "Moyo: Do not improve that sentence.", "I was not going to.", "There are names in the ash.", "Try to keep one."]
