<!doctype html>
<!-- @file Wobble Fit: HTML first, procedural WebGPU world, code-written sound. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3e8" />
    <link rel="icon" href="data:," />
    <title>Wobble Fit · Little Fulcrum</title>
    <script>
      window.__engine = { ready: false, errors: [] };
      if (!globalThis.GPUShaderStage) globalThis.GPUShaderStage = Object.freeze({ VERTEX: 1, FRAGMENT: 2, COMPUTE: 4 });
      addEventListener('error', function (event) {
        var msg = document.getElementById('msg');
        if (msg) {
          msg.hidden = false;
          msg.textContent = 'The retreat could not open. ' + event.message;
        }
      });
    </script>
  </head>
  <body>
    <canvas id="view" aria-label="Little Fulcrum Wellness Retreat"></canvas>
    <div id="msg" role="status">Calibrating a small island…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
