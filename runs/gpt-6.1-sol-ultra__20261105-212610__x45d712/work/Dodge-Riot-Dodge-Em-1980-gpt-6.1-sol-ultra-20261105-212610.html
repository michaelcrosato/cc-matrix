/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

			// Let the browser finish resetting its graphics process before requesting another context.
			await new Promise((resolve) => setTimeout(resolve, 1000));
			let canvas, context;
			for (let i = 0; i < 5; i++) {
				canvas = document.createElement("canvas");
				context = canvas.getContext("webgl2", {
					antialias: true,
					alpha: true,
					depth: true,
					stencil: false,
				});
				if (context) break;
				await new Promise((resolve) => setTimeout(resolve, 400));
			}
			if (!context)
				throw new Error("The browser could not restore its graphics context.");
			canvas.id = "recovery-canvas";
			canvas.setAttribute("aria-hidden", "true");
			canvas.style.cssText =
				"position:fixed;inset:0;width:100%;height:100%;pointer-events:none";
			const previous = document.getElementById("recovery-canvas");
			this.canvas.before(canvas);
			previous?.remove();
			this.canvas.style.opacity = "0";
			this.renderer = new THREE.WebGPURenderer({
				canvas,
				context,
				antialias: true,
				forceWebGL: true,
			});
			this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
			this.renderer.outputColorSpace = THREE.SRGBColorSpace;
			await this.renderer.init();
			this.renderer.onDeviceLost = (event) => {
				this.recovering = false;
				this.recoverDevice(event);
			};
			this.scene.traverse((object) => {
				const materials = object.material
					? Array.isArray(object.material)
						? object.material
						: [object.material]
					: [];
				for (const material of materials) {
					material.needsUpdate = true;
					for (const value of Object.values(material))
						if (value?.isTexture) value.needsUpdate = true;
				}
			});
			this.backend = "WebGPU → WebGL 2 recovery";
			this.ready = true;
			this.resize();
			console.warn(
				"WebGPU device lost; recovered the complete scene with Three.js WebGL 2.",
				info.message,
			);
			this.retiredRenderer = old;
		} catch (error) {
			console.error("Graphics recovery failed", error);
		}

	mat(color, unlit = false) {

				? new THREE.MeshBasicMaterial({ color })
				: new THREE.MeshToonMaterial({ color, gradientMap: this.gradient() });

	}
	gradient() {

	ringShape(w, h, r) {
		const s = new THREE.Shape();
		s.moveTo(-w + r, -h);
		s.lineTo(w - r, -h);
		s.quadraticCurveTo(w, -h, w, -h + r);
		s.lineTo(w, h - r);
		s.quadraticCurveTo(w, h, w - r, h);
		s.lineTo(-w + r, h);
		s.quadraticCurveTo(-w, h, -w, h - r);
		s.lineTo(-w, -h + r);
		s.quadraticCurveTo(-w, -h, -w + r, -h);
		return s;
	}
	linePath(lane, offset, y, color, width = 1) {
		const l = LANES[lane];
		const shape = this.ringShape(l.w + offset, l.h + offset, l.r + offset);
		const points = shape
			.getPoints(80)
			.map((p) => new THREE.Vector3(p.x, y, p.y));
		const line = new THREE.LineLoop(
			new THREE.BufferGeometry().setFromPoints(points),
			new THREE.LineBasicMaterial({ color, linewidth: width }),

		const inner = this.ringShape(w - thick / 2, h - thick / 2, r - thick / 2);
		outer.holes.push(new THREE.Path(inner.getPoints(80).reverse()));
		const m = this.mesh(new THREE.ShapeGeometry(outer, 64), color);
		m.rotation.x = Math.PI / 2;
		m.position.y = y;

	}
	textTexture(text, bg = "#e9dfbd", fg = "#183435", w = 1024, h = 256) {

		g.fillStyle = bg;
		g.fillRect(0, 0, w, h);
		g.fillStyle = fg;
		g.textAlign = "center";
		g.textBaseline = "middle";
		g.font = `900 ${h * 0.72}px Arial, sans-serif`;
		g.fillText(text, w / 2, h * 0.55, w * 0.92);

	syncRound(sim) {
		if (this.serial === sim.serial) return;
		this.serial = sim.serial;
		for (const c of this.cars) {
			this.root.remove(c.root);
		}
		this.cars = [
			...sim.players.map((p, i) => this.makeCar(i ? "#91dfba" : "#fa9a45")),
			...sim.enemies.map((e, i) =>
				this.makeCar(["#ca8eab", "#d78d57", "#a4b3da"][i], true),
			),
		];
		for (const m of this.dotMeshes) this.root.remove(m);
		this.dotMeshes = [];
		sim.dots.forEach((d) => {
			const geo = d.shield
				? new THREE.OctahedronGeometry(0.43)
				: new THREE.SphereGeometry(0.19, 8, 5);
			const m = new THREE.Mesh(
				geo,
				this.mat(d.shield ? "#91e7ca" : "#f7ce68", true),
			);
			m.position.set(d.x, 0.4, d.z);
			this.root.add(m);
			this.dotMeshes.push(m);
		});
	}
	burst(x, z, color, count = 12) {
		for (let i = 0; i < count; i++) {
			const m = this.mesh(new THREE.BoxGeometry(0.12, 0.12, 0.23), color);
			m.position.set(x, 0.6, z);
			const a = Math.random() * Math.PI * 2;
			this.effects.push({
				m,
				vx: Math.cos(a) * (2 + Math.random() * 3),
				vz: Math.sin(a) * (2 + Math.random() * 3),
				vy: 2 + Math.random() * 4,
				life: 0.45 + Math.random() * 0.45,
				max: 1,
			});
		}
	}
	update(dt, sim, screen) {
		this.clock += dt;
		if (!this.ready) return;
		this.syncRound(sim);
		this.flagMixer.update(dt);
		const title = screen === "title" || sim.attract;
		const targetX = title && innerWidth > 850 ? 6.7 : 0;
		this.root.position.x = lerp(
			this.root.position.x,
			targetX,
			Math.min(1, dt * 3),
		);
		this.root.rotation.y = lerp(
			this.root.rotation.y,
			title ? -0.12 : 0,
			Math.min(1, dt * 2),
		);
		const all = [...sim.players, ...sim.enemies];
		all.forEach((c, i) => {
			const m = this.cars[i];
			if (!m) return;
			const p = carPoint(c);
			m.root.position.set(p.x, 0, p.z);
			m.root.rotation.y = carHeading(c);
			m.model.rotation.z = lerp(
				m.model.rotation.z,
				c.change ? 0.13 * Math.sin(c.change.t * Math.PI) : 0,
				0.15,
			);
			m.mixer.timeScale = c.boosting ? 2.8 : c.braking ? 0.7 : 1.5;
			m.mixer.update(dt);
			m.glow.visible = !m.enemy && (c.invuln > 0 || c.boosting);
			m.glow.scale.setScalar(
				c.boosting ? 1.35 : 1 + Math.sin(this.clock * 8) * 0.1,
			);
			m.model.visible =
				(screen === "title" && !attract) ||
				!(!m.enemy && c.invuln > 0 && Math.floor(this.clock * 14) % 2 === 0);
			if (c.boosting && Math.random() < 0.5) {
				const behind = trackPoint(c.lane, c.progress - 0.012);
				this.burst(behind.x, behind.z, "#f8cd67", 1);
			}
		});
		this.dotMeshes.forEach((m, i) => {
			m.visible = !sim.dots[i]?.collected;
			if (sim.dots[i]?.shield) {
				m.rotation.y += dt * 2;
				m.position.y = 0.55 + Math.sin(this.clock * 4) * 0.12;
			}
		});
		this.effects = this.effects.filter((e) => {
			e.life -= dt;
			if (e.life <= 0) {
				this.root.remove(e.m);
				e.m.geometry.dispose();
				return false;
			}
			e.m.position.x += e.vx * dt;
			e.m.position.z += e.vz * dt;
			e.m.position.y += e.vy * dt;
			e.vy -= 14 * dt;
			e.m.rotation.x += dt * 8;
			e.m.rotation.z += dt * 5;

function pollPads(dt) {

		const old = padStates.get(p.index) || {};
		const down = (i) => p.buttons[i]?.pressed;
		const axis = Math.abs(p.axes[0] || 0) > 0.45 ? (p.axes[0] > 0 ? 1 : -1) : 0;
		const vertical =
			Math.abs(p.axes[1] || 0) > 0.55 ? (p.axes[1] > 0 ? 1 : -1) : 0;
		const lane = down(14) ? -1 : down(15) ? 1 : axis;
		const nav = down(12) ? -1 : down(13) ? 1 : vertical;
		const scrollAxis = p.axes[3] || 0;
		const any =
			p.buttons.some((b) => b.pressed) ||
			axis ||
			vertical ||
			Math.abs(scrollAxis) > 0.3;
		if (any) {
			const switched = inputType !== "gamepad";
			if (inputActivity("gamepad")) {
				padStates.set(p.index, {
					lane,
					nav,
					confirm: down(0),
					back: down(1),
					pause: down(9),
				});
				return;
			}
			if (switched && screen !== "play") renderScreen();
			audio.unlock();
		}
		if (screen === "play") {
			if (down(9) && !old.pause && !down(8)) pause();
			out[index] = {
				boost: !!(down(7) || down(0)),
				brake: !!(down(6) || down(2)),
				lane: lane && lane !== old.lane ? lane : 0,
			};
		} else if (index === 0) {
			if (Math.abs(scrollAxis) > 0.2) {
				const panel = dom.screens.querySelector(".panel");
				if (panel) panel.scrollTop += scrollAxis * dt * 650;
			}
			if (down(0) && !old.confirm) document.activeElement?.click();
			if ((down(1) && !old.back) || (down(9) && !old.pause && !down(8))) back();
			if (nav && (nav !== old.nav || gamepadTime - old.repeat > 0.2)) {
				focusMenu(menuFocus + nav);
				old.repeat = gamepadTime;
			}
			if (lane && lane !== old.lane) adjustFocused(lane);
		}
		padStates.set(p.index, {
			...old,
			lane,
			nav,

			pause: down(9),
		});

}

function tick(dt, inputs) {

		}
		if (attract && (sim.phase === "won" || sim.phase === "lost")) {
			sim.countdown -= dt;
			if (sim.countdown <= 0) startGame(1, true);
		}
	}
	const playing =
		screen === "play" || attract || (network.active && network.started);
	if (playing && !gameEnded) {
		if (network.active) {
			if (netCountdown) {
				if (network.time() < 0) return;
				netCountdown = false;
				sim.phase = "running";
				sim.countdown = 0;
			}
			const local = screen === "play" ? inputs[0] : {};
			if (network.isHost) {
				const inputsByPlayer = networkSeats.map((id, i) => {
					if (!network.players.some((p) => p.id === id) && sim.players[i])
						sim.players[i].ai = true;
					if (!network.server && id === network.me) return local;
					const remote = remoteInputs.get(id);
					if (!remote) return {};

		tick(
			Math.min(1 / 60, max - t),
			t === 0 ? input : input.map((p) => ({ ...p, lane: 0 })),
		);

function frame(now) {
	const dt = Math.min(0.06, (now - lastTime) / 1000 || 0.016);
	lastTime = now;

	const inputs = readInputs(pads);
	if (inputs[0].lane) {
		networkLaneSeq++;
		networkLaneValue = inputs[0].lane;
	}
	accumulator += dt;
	let first = true;
	while (accumulator >= 1 / 60) {
		tick(1 / 60, first ? inputs : inputs.map((p) => ({ ...p, lane: 0 })));
		first = false;
		accumulator -= 1 / 60;
	}
	if (!first) pending = [0, 0];
	if (ready) {
		audio.tick(dt, sim.players.some((p) => p.boosting) ? 1.5 : 1);
		scene.update(dt, sim, screen);
		scene.render();

			updateHud();
		updateToast();
	}

}

g Feedback, Engine Feedback and Prompt Feedback in your chat reply and an in-game About/Credits screen. Write \"unknown\" for anything you can't confirm.\n- Date: {{date}}\n- Source: the work it's based on\n- Plan: the file name of the plan you were given to build from, or none\n- Genre and Perspective: genre and camera perspective used\n- Tech: stack, libraries/engines, with versions if applicable\n- Art Direction: style used\n- Animation: system used\n- Audio: music, sound effects and voice used\n- Online: network features used, or none\n- Testing: testing parameters allowed\n- Research: research done, or none\n- Environment: {{environment}}\n- Model: {{lab}}, {{model}}, reasoning effort {{effort}}\n- Usage: write \"added on import\". You can't see your own cost, so don't estimate it: the runner records the real cost, tokens and time, and the agent that imports the game into AI Hub puts them on your About/Credits screen.\n\nExit interview: before you finish, also save these answers as exit-interview.json in this folder's root, beside the game's .html: one JSON object in exactly the shape below, every value filled in (\"unknown\" for anything you can't confirm). Tools read it (the game's run record and the AI Hub catalogue), so write plain text, and check that the file parses as JSON.\n{\n  \"sourceInformation\": {\"date\": \"\", \"source\": \"\", \"plan\": \"\", \"genre\": \"\", \"perspective\": \"\", \"tech\": \"\", \"artDirection\": \"\", \"animation\": \"\", \"audio\": \"\", \"online\": \"\", \"testing\": \"\", \"research\": \"\", \"environment\": \"\", \"model\": \"\", \"usage\": \"added on import\"},\n  \"testingFeedback\": [\"your answer to each Testing Feedback question, in order\"],\n  \"engineFeedback\": [\"your answer to each Engine Feedback question, in order\"],\n  \"promptFeedback\": [\"your answer to each Prompt Feedback question, in order\"],\n  \"aiHub\": {\n    \"name\": \"the game's title, as on its title screen\",\n    \"tagline\": \"a few words to go under the title\",\n    \"description\": \"one or two sentences for the catalogue\",\n    \"type\": \"Game, Tech demo or Tool\",\n    \"genre\": \"one of Action, Adventure, Fighting, Flight, Horror, Kids & Learning, Life Sim, Platformer, Puzzle, Racing, RPG, Shooter, Simulation, Sports, Stealth, Strategy\",\n    \"source\": \"the work it's based on, e.g. Moby-Dick\",\n    \"series\": \"its franchise, e.g. Star Fox, or empty\",\n    \"players\": \"how many can play: 1, 1–2 or 1–4\",\n    \"controls\": \"the controls, in one line\",\n    \"tags\": [\"3 to 6 lowercase tags, e.g. 2d, 3d, arcade, story, co-op, versus, first-person, third-person, top-down, side-scrolling, pixel art, low-poly, retro, sci-fi, fantasy, comedy, vehicles, boss fights, exploration\"]\n  }\n}\nThe catalogue's model, effort, CLI, date and usage come from the run's record after you finish, so they aren't asked here.","hash":"8fe63a44"},"testingFeedback":{"id":"tf-4q","text":"- How many issues did testing catch?\n- How many would be considered critical issues / game breaking?\n- What was the most helpful test you ran?\n- What was the least helpful test you ran?","hash":"95f71baf"},"engineFeedback":{"id":"ef-6q-v2","text":"- What did you like most about the engine?\n- Did you get stuck or guess wrong?\n- What was the most important thing you had to build yourself?\n- What was the hardest part about using the engine?\n- What did you change in the engine, and why? (none if nothing)\n- If you could change one thing about the engine, what would it be?","hash":"25041b09"},"promptFeedback":{"id":"pf-4q-v2","text":"- What did you like most about this prompt?\n- What was confusing?\n- What was the hardest thing to do?\n- What would you change in this prompt?","hash":"7ce5dc6e"},"goal":{"id":"on-exit-v2","text":"the bundled single .html file exists in this folder's root, every feature in TASK.md that can be done on this computer is implemented with no TODOs, placeholders or stubs, exit-interview.json in this folder's root parses as JSON and answers every field, and your final reply contains the Source Information, Testing Feedback, Engine Feedback and Prompt Feedback sections.","hash":"7559d614"}}},"interview":{"file":"exit-interview.json","answers":{"sourceInformation":{"date":"2026-11-05 21:26:10","source":"Dodge Em (1980)","plan":"none","genre":"Arcade action / lane-chase racing","perspective":"Angled top-down orthographic 3D","tech":"Three.js r180 (0.180.0) WebGPURenderer with WebGL 2 fallback; Rapier 0.19.3 WebAssembly; Gamepad API; Web Audio; WebRTC; AI Hub session client 1.4.0","artDirection":"Procedural cel-shaded 3D toy cars and circuit; thick ink edges; parchment, tangerine and mint motor-club palette","animation":"Three.js AnimationMixer and AnimationClip keyframe tracks for car suspension, wheels and club flag; procedural steering, particles and camera motion","audio":"Code-written swing-funk music at 10% default volume, synthesized effects and engine, formant-filter Animalese-style gibberish voices; no audio files","online":"1–2 player cooperative AI Hub shared-world sessions with authoritative host snapshots; standalone direct WebRTC connection codes; local couch co-op","testing":"Headless Chromium WebGPU, actual Rapier simulation, scripted full-run playthroughs, emulated standard gamepads, touch profiles, Web Audio signal analysis and two-page network sessions; no physical controller, listening test or real mobile hardware","research":"none; source interpreted from native model knowledge. Only required pinned dependencies and user-specified AI Hub integration files were fetched.","environment":"Codex CLI (headless); Linux","model":"OpenAI, gpt-6.1-sol, reasoning effort ultra","usage":"added on import"},"testingFeedback":[{"question":"How many issues did testing catch?","answer":"Six confirmed issue classes were corrected: duplicate bundled helper declarations, exhausted-boost reactivation, minimum-charge bypass, missing Hub metadata, touch pause wiring, and device-reset recovery. Additional review corrected network input and end-state edge cases."},{"question":"How many would be considered critical issues / game breaking?","answer":"Two were game breaking: a bundle syntax error prevented startup, and lost graphics devices left the circuit invisible. Both were corrected."},{"question":"What was the most helpful test you ran?","answer":"Actual Rapier AI playthroughs collected all 288 fares across three rounds in solo and co-op. Raw WebGPU pixel-readback canaries isolated the headless graphics flag problem; two-page tests checked shared inputs and identical terminal results."},{"question":"What was the least helpful test you ran?","answer":"Screenshots captured before GPU presentation were least helpful: they could show an empty canvas despite initialized gameplay. State assertions, GPU readiness and pixel readback were more informative."}],"engineFeedback":[{"question":"What did you like most about the engine?","answer":"Three.js combines procedural geometry, cel-shaded materials, native AnimationMixer tracks and WebGPU rendering without an asset pipeline."},{"question":"Did you get stuck or guess wrong?","answer":"The pinned Rapier entry point is rapier.mjs rather than the older rapier.es.js name. Headless Chromium also needed an explicit ANGLE backend; raw WebGPU canaries confirmed the launch configuration was responsible."},{"question":"What was the most important thing you had to build yourself?","answer":"The lane-junction simulation, rival behavior, controller-first menus and authoritative cooperative lifecycle."},{"question":"What was the hardest part about using the engine?","answer":"Coordinating kinematic sensor collisions and restoring presentation and textures after a graphics-device reset."},{"question":"What did you change in the engine, and why? (none if nothing)","answer":"none; all game systems and graphics recovery are application code."},{"question":"If you could change one thing about the engine, what would it be?","answer":"A built-in device-loss recovery path that preserves scene materials when changing graphics backends."}],"promptFeedback":[{"question":"What did you like most about this prompt?","answer":"The source-inspired design freedom, concrete controller-first requirements and explicit automated-testing stand-ins."},{"question":"What was confusing?","answer":"The no-research rule and required online integration URL needed a distinction between research and fetching integration files."},{"question":"What was the hardest thing to do?","answer":"Delivering a complete three-round arcade loop with local, direct-peer and AI Hub co-op in one shareable HTML file."},{"question":"What would you change in this prompt?","answer":"Specify whether standalone online co-op should use a hosted room service or manual peer connection codes."}],"aiHub":{"name":"Dodge Riot","tagline":"Four lanes. A full tank of trouble.","description":"Sweep four nested circuits, slip past oncoming rivals and zip your way into the motor club. Three escalating arcade rounds for a solo driver or a cooperative pair.","type":"Game","genre":"Racing","source":"Dodge Em (1980)","series":"","players":"1–2","controls":"P1: arrows / A D steer, Space / W zip, Down / S brake; local P2: A D steer, W zip, S brake; pad: D-pad / stick steer, R2 zip, L2 brake, Options pause; touch: left thumb steer, right ZIP button.","tags":["3d","arcade","top-down","co-op","retro","vehicles"]}},"reply":"[**Play Dodge Riot**](~/dev/cc-matrix/runs/gpt-6.1-sol-ultra__20261105-212610__x45d712/work/Dodge-Riot-Dodge-Em-1980-gpt-6.1-sol-ultra-20261105-212610.html) · [Exit interview JSON](~/dev/cc-matrix/runs/gpt-6.1-sol-ultra__20261105-212610__x45d712/work/exit-interview.json)\n\nComplete three-round demo with solo, couch/online co-op, controller/touch controls, attract mode, and live dev tools under Pause. Opening the HTML requires internet for its pinned libraries. **61 checks passed, 0 failed.**\n\n**Source Information:** Date: 2026-11-05 21:26:10. Source: Dodge Em (1980). Plan: none. Genre: arcade action/racing. Perspective: angled top-down orthographic 3D. Tech: Three.js r180, WebGPU with WebGL 2 fallback, Rapier 0.19.3, Gamepad API, Web Audio, WebRTC, AI Hub client 1.4.0. Art: procedural cel shading and ink outlines. Animation: native AnimationMixer/keyframe clips plus procedural effects. Audio: coded music, effects and gibberish voices; music defaults to 10%. Online: cooperative AI Hub and direct WebRTC sessions. Testing: headless browser, physics playthroughs, emulated controllers/touch, audio analysis and two-page networking. Research: none; required dependencies/integration files fetched. Environment: Codex CLI, headless Linux. Model: OpenAI gpt-6.1-sol, reasoning effort ultra. Usage: added on import.\n\n**Testing Feedback:** Six issue classes corrected; two were game breaking. Most helpful: complete Rapier playthroughs and actual WebGPU scene pixel readback. Least helpful: headless compositor screenshots, which remained unreliable.\n\n**Engine Feedback:** I liked the procedural geometry, cel materials and native animation. Rapier’s entry filename and headless graphics setup needed correction. I built the lane simulation, rivals, menus and cooperative lifecycle. Graphics recovery was hardest. Engine changes: none. I would add built-in device-loss recovery.\n\n**Prompt Feedback:** The design freedom and controller requirements were useful. The research restriction alongside required integration documentation needed interpretation. The hardest part was complete multiplayer in one HTML package. I would specify the preferred standalone online transport.\n\nAll required information and feedback are also included in the in-game Credits."}}</script>
