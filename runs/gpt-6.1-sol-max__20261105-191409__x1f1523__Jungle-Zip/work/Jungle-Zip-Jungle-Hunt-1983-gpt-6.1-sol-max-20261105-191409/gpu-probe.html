<!doctype html><html><head><meta charset="utf-8"><title>Jungle Zip GPU diagnostic</title></head><body><canvas width="64" height="64"></canvas><script type="module">
window.probe={done:false,lost:false};
try{
window.gpu=navigator.gpu;window.adapter=await gpu.requestAdapter();probe.adapter={vendor:adapter.info.vendor,architecture:adapter.info.architecture,device:adapter.info.device,description:adapter.info.description};window.device=await adapter.requestDevice();device.lost.then(i=>{probe.lost=true;probe.reason=i.message;});
const c=document.querySelector('canvas').getContext('webgpu');c.configure({device,format:gpu.getPreferredCanvasFormat()});
const shader=device.createShaderModule({code:`@vertex fn vertex(@builtin(vertex_index) i:u32)->@builtin(position) vec4f {var p=array<vec2f,3>(vec2f(0.,.8),vec2f(-.8,-.8),vec2f(.8,-.8));return vec4f(p[i],0.,1.);} @fragment fn fragment()->@location(0) vec4f{return vec4f(.9,.7,.3,1.);}`});
const pipeline=device.createRenderPipeline({layout:'auto',vertex:{module:shader,entryPoint:'vertex'},fragment:{module:shader,entryPoint:'fragment',targets:[{format:gpu.getPreferredCanvasFormat()}]}});
const enc=device.createCommandEncoder();const pass=enc.beginRenderPass({colorAttachments:[{view:c.getCurrentTexture().createView(),clearValue:[.1,.2,.1,1],loadOp:'clear',storeOp:'store'}]});pass.setPipeline(pipeline);pass.draw(3);pass.end();device.queue.submit([enc.finish()]);await device.queue.onSubmittedWorkDone();await new Promise(r=>setTimeout(r,300));probe.webgl=!!document.createElement('canvas').getContext('webgl2');probe.done=true;
}catch(e){probe.error=String(e);probe.done=true;}
</script></body></html>
