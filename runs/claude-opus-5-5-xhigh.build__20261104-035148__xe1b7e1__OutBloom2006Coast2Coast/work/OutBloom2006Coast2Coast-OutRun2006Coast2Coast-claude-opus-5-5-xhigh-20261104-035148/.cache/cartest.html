<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#4a6a8a">
<canvas id="screen" style="display:none"></canvas><canvas id="out" width="1400" height="760" style="image-rendering:pixelated"></canvas>
<script src="../engine/my-3d2dge.js"></script>
<script src="../src/00-core.js"></script><script src="../src/01-data-cars.js"></script><script src="../src/11-art.js"></script>
<script>
const g = document.getElementById('out').getContext('2d'); g.imageSmoothingEnabled = false;
const ids = OB.CAR_ORDER; let y = 0;
ids.forEach((id, row) => {
  const bank = OB.Art.car(id, OB.CARS[id].paints[0]);
  [-0.9, -0.45, -0.15, 0, 0.3, 0.7].forEach((yaw, i) => { const f = bank.frame(yaw); g.drawImage(f.full, i * 230, row * 150, f.w * .7, f.h * .7); });
});
const t = OB.Art.traffic('sedan', '#3a4a6a'); g.drawImage(t.frame(0).full, 1380 - 260, 0);
const t2 = OB.Art.traffic('bus', '#ff8a4a'); g.drawImage(t2.frame(.3).full, 1380 - 300, 200);
const t3 = OB.Art.traffic('truck', '#3a8a5a'); g.drawImage(t3.frame(-.3).full, 1380 - 300, 420);
document.title = 'done';
</script></body></html>
