<!doctype html><html><head><meta charset="utf-8"><title>Keystone network integration tests</title></head><body><script type="module">
import { createNetwork } from './net.js';
window.nets=[];window.events=[];window.create=()=>{
 const events=[];const callbacks=Object.fromEntries(['onStatus','onInput','onState','onStart','onFinish','onEnd','onTimeUp','onDisconnect','onLeave'].map(name=>[name,(...args)=>events.push({name,args})]));
 const net=createNetwork(callbacks);window.nets.push(net);window.events.push(events);return window.nets.length-1;
};window.ready=true;
</script></body></html>
