<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- HUB_CLIENT -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8d66f">
<meta name="description" content="Ka-Whoosh! A little panic. A lot of splash. An original rooftop arcade catch game inspired by Kaboom! (1981).">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="1-4">
<meta name="hub:session-mode" content="ghost">
<meta name="hub:session-goal" content="Catch falling bombs in your water tubs. Clear six shifts and earn the highest score. Center catches build a multiplier; gold bombs refill your emergency douse.">
<meta name="hub:session-howto" content="Move: left stick / D-pad, A-D / arrows, mouse, or drag. Douse: Cross / A, Space, click, or second touch. Options / Escape opens the menu.">
<meta name="hub:session-minutes" content="3">
<title>Ka-Whoosh! — A little panic. A lot of splash.</title>
<style>/* STYLES */</style>
</head>
<body>
<div id="world"></div><div id="paper"></div>
<div id="ui">
 <div id="hud" hidden>
  <div class="hud-top"><div class="score-card"><div class="hud-caption">SHIFT SCORE</div><div id="score" class="score-value">000000</div></div><div class="wave-card"><div id="wave-number" class="wave-number">SHIFT 01 / 06</div><div id="wave-name" class="wave-name">A little drip</div><div id="wave-pips" class="wave-pips"></div></div><div class="hud-right"><div class="record">BEST SHIFT<b id="best">0</b></div><button type="button" id="pause-button" class="pause-button" aria-label="Pause game">Ⅱ</button></div></div>
  <div class="hud-bottom"><button type="button" id="douse-button" class="douse-button ready" aria-label="Emergency douse"><span class="douse-icon">≋</span><span id="douse-label" class="douse-label">DOUSE <span class="glyph">SPACE</span></span><span><span class="douse-bar"><i id="douse-fill"></i></span><span id="douse-tip" class="douse-tip">A little rain, right when you need it.</span></span></button><div id="control-hint" class="control-hint"></div></div>
  <div id="combo" class="combo-card"><b>×1</b> MULTIPLIER<small>Center the catch. Stack the score.</small></div>
  <div id="net-scores"></div><div id="dev-indicator" hidden>DEV SHIFT · SCORE UNRANKED</div><div id="debug-state" hidden></div>
 </div>
 <div id="announcement" hidden><div id="announce-over" class="announce-over"></div><div id="announce-title" class="announce-title"></div><div id="announce-sub" class="announce-sub"></div></div>
 <div id="attract-label" hidden>ON THE HOUSE · DEMO<small>Press any button to take over</small></div>
 <div id="toast" hidden></div><div id="screen"></div>
</div>
<div id="loading"><div class="loader-bomb"></div><strong>FILLING THE TUBS…</strong><small>Rooftop mischief is on the way.</small></div>
<script type="module">/* BUNDLE */</script>
</body>
</html>
