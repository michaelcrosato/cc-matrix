# Set: channel. Local space; the game moves it 200 m apart from the others.
name = "fit-channel"
about = "A set of Tippy Cay."
entrance = { at = [0, 0], facing = "south" }

[camera]
tilt = 22
yaw = 0
distance = 10
fov = 40

[view]
sky = "#cfeaf6"
exposure = 1.0
saturation = 0.95
bloom = 0.15
bloom_threshold = 1.3
outlines_on = "objects"
outline_px = 1.0
outline_darken = 0.55
rim = 0.3
fog = true
fog_start = 25.0
fog_end = 110.0
wind = 0.5
"light.sun_elevation" = 56
"light.sun_azimuth" = 150
"light.sun_intensity" = 0.65
"light.ambient" = 1.15
"cutaway.height_cut" = false
"cutaway.front_cut" = false
"cutaway.fade" = false

[layout]
origin = [0.0, 0.0, 0.0]

[[layout.layer]]
y = 0
map = '''
.
'''

