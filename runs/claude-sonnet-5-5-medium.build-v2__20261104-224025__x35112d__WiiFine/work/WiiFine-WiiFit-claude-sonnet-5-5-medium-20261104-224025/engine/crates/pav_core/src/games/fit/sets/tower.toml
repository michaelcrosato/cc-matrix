# Set: tower. Local space; the game moves it 200 m apart from the others.
name = "fit-tower"
about = "A set of Tippy Cay."
entrance = { at = [0, 0], facing = "south" }

[camera]
tilt = 6
yaw = 0
distance = 14
fov = 40

[view]
sky = "#cfeaf6"
exposure = 1.0
saturation = 0.95
bloom = 0.15
bloom_threshold = 1.3
outlines_on = "objects"
outline_px = 1.0
outline_darken = 0.55
rim = 0.3
fog = true
fog_start = 25.0
fog_end = 110.0
wind = 0.5
"light.sun_elevation" = 56
"light.sun_azimuth" = 190
"light.sun_intensity" = 0.7
"light.ambient" = 1.15
"cutaway.height_cut" = false
"cutaway.front_cut" = false
"cutaway.fade" = false

[layout]
origin = [0.0, 0.0, 0.0]

[[layout.layer]]
y = 0
map = '''
.
'''

[layout.legend.'.']
blocks = [{ y0 = -3.0, y1 = -2.9, color = "#8fdde0" }]

[[object]]
name = "far_sea"
shape = { type = "cylinder", half_height = 0.05, radius = 600.0 }
pos = [0.0, -0.12, 0.0]
color = "#8fdde0"
look = "flat"
body = "fixed"

[[object]]
name = "tower_base"
shape = { type = "rounded_box", half = [2.5, 4.0, 2.5], radius = 0.08 }
pos = [-5, 4.0, 0]
color = "#fbfaf6"
body = "fixed"

[[object]]
name = "diving_board"
shape = { type = "rounded_box", half = [2.2, 0.08, 0.45], radius = 0.08 }
pos = [-1.8, 8.1, 0]
color = "#46bec8"
body = "fixed"

[[object]]
name = "dive_pool"
shape = { type = "cylinder", half_height = 0.15, radius = 14 }
pos = [6, -0.3, 0]
color = "#8fdde0"
body = "fixed"

[[object]]
name = "ring"
asset = "LIB/core/floatie_ring"
pos = [5, 0.0, 0.0]
yaw = 0
body = "fixed"
