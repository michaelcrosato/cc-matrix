d2 = ["The trick is to stop trying to leave. Then you can."]
d3 = ["I have seen the Big Stand. I will not describe it. I will only say: bring patience."]
d4 = ["Everyone who stood still got out. Everyone who did not is also here. We are fine."]
d5 = ["You are ready. You were ready on day one. That is just how the week works."]

