]
age_better = [
  "Down to {age}. That was your best attempt so far. I am as surprised as you are.",
  "{age}! You are getting younger at an alarming rate. Please be careful.",
  "Balance Age {age}. Yesterday you were older. Today you are less. Good for you.",
]
age_same = [
  "Balance Age {age}. The same as yesterday. Consistency is a skill. A small one.",
  "{age}. Exactly as expected. I expected it.",
]
age_worse = [
  "Balance Age {age}. Up a little. Everyone has a Tuesday.",
  "{age} today. I am not saying anything. I am only saying the number.",
]
worst_still = [
  "You leaned left 64% of the time. Is everything all right on the right?",
