# ---- coaches ----
[tips.breath_bloom]
a = ["In through the nose. Out through the metaphor.", "The ring is the sea. Follow the sea.", "Longer on the last one. It is a long one.", "Breathing is the only exercise that involves nothing. Do it fully."]
[tips.pose_parade]
a = ["Three poses. The bird is optional. Not the heron. The bird.", "Stay in the ring. The ring has opinions about drift.", "There is a bird on you. Accept the bird.", "Every pose has a name. Say it to yourself. Quietly."]
[tips.tempo_squats]
a = ["Down for two. Up for one. Rest for the rest.", "Ten. Also eleven. That is a joke. I am proud of it.", "Keep your middle. The middle is where the rep lives.", "A low bell marks the bottom. Listen for it."]
[tips.plank_standoff]
a = ["Hold both steps. I cannot hold anything. Hold for me.", "At thirty seconds the floor trembles. It is not an earthquake. It is encouragement.", "I will laugh at forty-five. It is my best joke. It is a plank.", "Release and you fall. This is also true of life, but with a mat."]
[tips.step_party]
a = ["On the beat! On the beat! On the- yes! Yes!", "Both feet for the big ones. Both!", "The guests clap on one. Clap with them. In your heart.", "Left right left right and again and again and again!"]
[tips.floatie_spin]
a = ["Circle the lean! Round and round and round!", "The sweet band is a feeling. Find the feeling!", "Catch the rings guests throw. Left side, left step. Right side, right step!", "Switch! Switch! The other way!"]
[tips.morning_lap]
a = ["Alternate your steps! Left right left right!", "Too fast and you get a stitch! Too slow and I get away!", "Dodge the crabs! Grab the ribbons! Mind the towels!", "I roll ahead. I always roll ahead. It is a character trait."]
[tips.tide_table]
a = ["Tilt the raft. Roll the shells into the pools. Hermit crabs do not mind. They are inside.", "Fast shells skip over the pool. Slow it down. Not you. The shell.", "The tide rises on board three. Nobody has told the shells.", "Seven shells. That is a lot of crabs. Respect the crabs."]
[tips.paddle_slalom]
a = ["Pass the buoys. Pass them in the middle. Passing at the edge is a gesture.", "Lean forward for speed. Lean back for the brakes. Lean nowhere for a nap.", "Gusts push the dot. They are not personal.", "A missed gate adds two seconds. I count them. I am legally required to count them."]
[tips.tray_trek]
a = ["Five smoothies. Zero spills. That is the dream.", "Waves, gaps, gulls. In that order. Then again.", "Tilt against the jolt. Keep the glasses on the tray. Keep the tray on the arm.", "Marjorie receives what is left and comments. She has never been impressed. She has never been unimpressed."]
[tips.cannonball_cup]
a = ["Press at the bottom of three bounces. The fourth press leaps. It is a lot of presses.", "Tuck at the top. Enter tucked and high. We are not here for form. We are here for splash.", "Judges hold up cards. The cards are honest. Sometimes they say 'See me'.", "The splash must be huge. This is not advice. It is the law."]

