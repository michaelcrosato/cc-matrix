# All the game's text. Keys are dotted paths; each value is a list of lines picked in order.
# Fill-ins: {name} {age} {n} {score} {minutes} {goal} {day}. At most two lines fit on screen.

[pip]
intro = [
  "Welcome! You have won a complimentary stay. You did not enter. Nobody enters.",
  "I am Pip. I am a wobble cushion. I remember everything.",
  "Checkout requires a Balance Age of 40 or better. Nobody has asked to leave yet.",
  "Each morning you stand on me. Gently. I will tell you a number.",
]
greet_1 = [
  "Good morning, {name}! Day one. The sea is on. The sun is on. You are on me.",
  "Welcome to Tippy Cay, {name}. Please stand on me. Gently. I remember everything.",
]
greet_2 = [
  "Day two, {name}. Yesterday I wrote down everything. Everything.",
  "Good morning! Iron Gazebo is open today. Big Kettle is looking forward to you. He has no way to show it.",
]
greet_3 = [
  "Day three. Boardwalk opens. Bounce has been awake since the beginning of time.",
  "Good morning, {name}. A reminder: I am not comparing you. I am only recording you.",
]
greet_4 = [
  "Day four. The Lagoon is open. Commodore Gull would like a word. He always would.",
  "Good morning. The guests are whispering about something called the Big Stand. I have not been told.",
]
greet_5 = [
  "Day five, {name}. After the check, the Big Stand. I would wish you luck, but luck is not stable.",
  "Good morning. Today is the last day. For you. I have been here for a while.",
]
absence = [
  "You were away for {n} days. I did not count them. There were {n}.",
  "Oh. You are back. It has been {n} days. I kept your spot warm. It is a cushion. It is always warm.",
  "{n} days. I am not upset. I do not have the parts.",
]
age_first = [
  "Your Balance Age today is {age}. That is a number. Numbers cannot hurt you. This one is trying.",
