[coach.posey]
tip = ["The floor is also breathing. Very slowly.", "Be water. Be a still pond. Be a sink. Be anything with a drain.", "Softly. Softer. There. That is the width of a thought.", "Let the dot find its own centre. It knows the way. It has been there before.", "I have no eyes. I see everything you do. This has not been discussed."]
mid = ["Hm. A middle result. Middles are where people live.", "The pond is neutral. The pond is always neutral. The pond is lying."]
more = ["Breathe in the sea. Not literally.", "A heron does not hurry. A heron is late on purpose.", "Close what is open. Open what is closed. Leave the doors.", "I will hold the pose beside you. I will not tell you how long. I do not know."]

intro = ["Breathe in the sea. Not literally.", "Be the heron. The heron does not check the score."]
good = ["Hm. Yes.", "The pond approves. It said nothing."]
bad = ["The floor was ready. You were not.", "This has not been discussed."]

[coach.kettle]
tip = ["BOOM. That is my encouragement. It has volume.", "I would lift you if I had arms. I would lift you with sincerity.", "Lift with your legs. I cannot. I have none. Lift for both of us.", "Straight back. Soft knees. Loud heart. I am told I have one. It is a weight.", "I am not a motivational speaker. I am a kettlebell. The difference is mass."]
mid = ["Solid. As iron. Not as strong, but as solid.", "Respectable! I would applaud. I have no hands. So: BOOM."]
more = ["Rep after rep after rep after rep. I count in my head. It is a very full head.", "Ten reps. Ten. I counted. I always count. It is all I do.", "Plank means plank. Not hover. Not lean. Plank.", "I would lift the whole resort if I had arms. It is a small resort.", "A kettlebell is a cannonball with a handle and a plan.", "Slow is smooth. Smooth is strong. Strong is also loud.", "No spills. No wobbles. Okay, some wobbles. That is allowed. I was joking.", "Do not hold your breath. Hold the weight. Hold the plank. Breathe, then hold.", "I believe in you. I do not have a way to show it. I believe loudly."]

intro = ["Lift with your legs. I cannot. I have none. Lift for both of us."]
good = ["BOOM. That is the sound of me being proud."]
bad = ["I believe in you. I have no arms to show it."]

[coach.bounce]
tip = ["Yes yes yes and again and again and- wait is that your pulse? Mine is just air!", "Hop hop hop it is not exercise it is a lifestyle!", "Keep going keep going keep going-- oh the beat! Oh the beat!", "I never stop. I have never stopped. It is a feeling. It is a flaw.", "Left right left right and left and- right!"]
mid = ["Good good good keep keep keep it up!", "Nice nice nice nice nice nice!"]
more = ["Higher higher higher! No wait lower! Lower is also good! Hop!", "Left foot right foot left foot- stitch! Slow down slow down slow-", "I pace. I roll. I pace. I roll. It is my entire personality!", "Ribbon ribbon ribbon! Grab it! Grab it! You grabbed it!", "Do not look at the crabs! Look at the crabs! Step around the crabs!", "Everybody claps on one! One! Clap! Everybody!"]

intro = ["Keep going keep going keep- is that your heartbeat? Mine is just air!"]
good = ["Yes yes yes yes and again!"]
bad = ["Oops oops oops it is fine we go again!"]

[coach.gull]
tip = ["Noted. I am legally required to note it.", "This is a lagoon. We do things properly. We do them also quickly.", "Snacks are not a requirement. They are a courtesy. Do I have a snack?", "I wear the cap. The cap is real. It is also a symbol.", "Form is optional. Splash is not. I did not make the rules. I enforce them."]
mid = ["Adequate. I will file it under Adequate. That is a folder.", "A dive. I am legally required to say so."]
more = ["The channel is long. The channel is also short. It depends on your attitude.", "The pier has a plank missing. It has had a plank missing since the second week. We call it character."]

intro = ["That was a dive. I am legally required to say so."]
good = ["Splash noted. Splash approved. Snack?"]
bad = ["See me. Bring snacks."]

