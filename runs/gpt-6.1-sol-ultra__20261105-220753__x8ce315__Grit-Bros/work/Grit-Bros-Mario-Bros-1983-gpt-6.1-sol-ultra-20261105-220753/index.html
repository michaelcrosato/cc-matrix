<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<!--HUB_CLIENT-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#142d38">
<meta name="hub:session" content="1"><meta name="hub:session-players" content="1-2"><meta name="hub:session-mode" content="shared-world">
<meta name="hub:session-goal" content="Work together: bump pests from below, kick them away, and conquer five shifts in the Grit Works.">
<meta name="hub:session-howto" content="Stick / A,D: move. Cross / Space: jump and bump. Walk into flipped pests to kick. Square / E: emergency thump. Options / Esc: pause.">
<meta name="hub:session-minutes" content="8"><meta name="hub:webgpu" content="required">
<title>Grit Bros · The night shift bites back</title><style>/*STYLES*/</style></head>
<body><canvas id="world" aria-label="Grit Bros game world"></canvas><div class="grain"></div><div class="vignette"></div>
<div id="loading"><div class="loading-mark">GB<span>GRIT WORKS</span></div><p id="load-status">Opening the night shift…</p><div class="load-line"></div></div>
<header id="hud" hidden><div class="hud-left"><span class="mini-logo">GRIT<span>BROS</span></span><div><small>TEAM SCORE</small><strong id="score">000000</strong></div></div><div class="hud-center"><small id="shift-label">SHIFT 01 / 05</small><strong id="shift-name">FIRST THINGS THIRST</strong><div id="shift-progress"></div></div><div class="hud-right"><div id="lives" aria-label="Lives"></div><button data-action="pause" class="icon-button" title="Pause">Ⅱ</button></div></header>
<div id="banner" hidden><small id="banner-kicker">CLOCKING IN</small><h2 id="banner-text"></h2><p id="banner-sub"></p></div>
<div id="combo" hidden><strong></strong><span>BOOT STREAK</span><i></i></div>
<div id="game-footer" hidden><span id="control-prompts"></span><span id="pow-status"></span></div>
<div id="toast" role="status"></div><div id="attract-label" hidden><span>LIVE FROM THE GRIT WORKS</span><strong>DEMO SHIFT</strong><p>Press anything to clock in</p></div>
<main id="overlay"></main>
<div id="touch-controls" hidden><button id="touch-thump" aria-label="Emergency thump">THUMP<span></span></button><button id="touch-menu" aria-label="Pause game">Ⅱ</button></div>
<script type="module">/*BUNDLE*/</script></body></html>
