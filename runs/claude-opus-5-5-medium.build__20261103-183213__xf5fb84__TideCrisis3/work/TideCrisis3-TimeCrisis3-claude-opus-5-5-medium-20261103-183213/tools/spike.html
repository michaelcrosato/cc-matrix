<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head>
<body><canvas id="screen"></canvas><script src="../engine/my-3d2dge.js"></script><script src="../build/game.js"></script>
<script>
(() => {
const E = My3D2dge, TC = E.TC;
const env = { ambient: .35, sun: { dir: [-.35, .45, .82], k: .45, color: '#a8b8ff' }, fog: ['#1a2242', 300, 1600], ambientColor: '#8090d0' };
const G = new TC.Builder(env);
G.box(-200, -200, -4, 600, 200, 0, 'planks', { collide: false });
G.box(-200, -220, 0, 600, -200, 80, 'brick');
G.box(100, -30, 0, 115, -15, 14, 'crate', { fit: true });
G.box(100, -15, 0, 115, 0, 14, 'crate', { fit: true });
G.box(160, 40, 0, 258, 79, 42, 'container-red');
G.shape('barrel', 80, 40, 0, {});
G.cyl(200, -80, 0, 60, 3, 3, 8, 'iron', {});
G.box(196,-84,60,204,-76,68,'lantern',{});
G.light(200, -80, 64, 120, .9, '#ffb347');
G.box(600, -2000, -30, 2600, 2000, -24, 'sea-night', { collide: false });
const batches = G.bake();
const R = new TC.Rail3D();
const rig = new E.Humanoid({ size: 1, build: 'heroic', weapon: 'rifle', outfit: 'shirt', hat: 'cap', colors: { cloth: '#2a3a5a', pants: '#2a2a33', hat: '#1a1a22' } });
const game = new E.Game({ canvas: 'screen', res: 'ps1', expand: true });
let t = 0;
game.start({ update(dt) { t += dt; rig.update(dt, { x: 130, y: -10, z: 0, facing: Math.PI, point: true, aim: 0 }); },
  draw(r) { r.overlay(g => {
    const cam = { x: 0, y: -10, z: 24, yaw: Math.sin(t * .3) * .3, pitch: -.05, fov: 55 };
    const t0 = performance.now();
    R.begin(cam, r.W, r.H, env, t);
    for (const b of batches) R.drawBatch(b);
    R.sky({ stops: ['#0b1026', '#1b2a52', '#3a3060'], stars: true, moon: { az: .3, el: .5, color: '#fff3d0' }, clouds: { color: '#2a3060', cover: .35, k: .6 }, sil: [{ color: '#141a34', lit: '#ffd070', h: az => .03 + .05 * Math.abs(Math.sin(az * 9)) * (Math.cos(az) > 0 ? 1 : 0) }] });
    R.billboard({ x: 130, y: -10, z: 0, chest: 16, h: 32, draw: (g2, ox, oy, view) => rig.draw(g2, ox, oy, view), light: [.9, .9, 1.1] });
    R.splat([180, -60, 30], 3, [255, 200, 120], 'add');
    R.line([10, 0, 20], [300, -40, 30], [255, 230, 150]);
    R.present(g, 0, 0);
    E.font.text(g, (performance.now() - t0).toFixed(1) + 'ms tris ' + R.stats.tris, 4, 4, '#fff');
  }); } });
window.__R = R;
})();
</script></body></html>
