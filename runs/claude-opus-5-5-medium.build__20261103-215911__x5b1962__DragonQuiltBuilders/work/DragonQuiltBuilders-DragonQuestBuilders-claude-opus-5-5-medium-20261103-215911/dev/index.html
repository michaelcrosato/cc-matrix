ielded, not equipping crafted weapons, ignoring the Knot Cage, not clearing plants, residents in the way); and menu hover only worked after a mouse click.","8 were game breaking for a player: the Hall room not forming (softlocks quest M10), damaged blocks healing between hits (mining could become impossible), Gnarlgrim falling into the void (the siege ends without its boss), the ballista dismount on any hit (the boss nearly impossible to Tangle), the results never showing after a skipped finale, invisible monsters for co-op clients, the player hidden in the opening area, and silenced audio after the attract mode.","The scripted playthrough with the Autopilot: it plays the real systems from New Game to Chapter Clear and found the block-healing, ballista, siege-flow and finale bugs that no single-system check caught.","The world-generation determinism check: it never failed and only confirmed what the design already guaranteed."],"engineFeedback":["Its views are plain linear projections with exact whole-pixel control, so a voxel renderer could plug straight into its depth-sorted queue, x-ray, lighting and particles; the Humanoid rigs, dialog, menus, saves and settings came for free.","Yes: queued occluders need a screen box for the x-ray pass, which I only found by reading the flush code; and the default iso view's height step is not a whole number of pixels, so I made my own views.","The voxel world: storage, a face-sprite atlas renderer with column runs, cutaway and water, circle-body physics with stairs, and A* navigation, because the engine's TileMap is a heightmap.","Depth sorting real 3D blocks with a 2D painter's queue built for heightmap walls: lifting actors over the blocks they stand on and keeping roofs in front.","Small, marked // DQB: an input wheelSteps() accessor that works while the camera wheel is off and a right-stick flick(), a Dialog onLetter hook for per-letter voices, a Voices audio bus, and tool kinds (stick, club, Seam Ripper) drawn on the Huma
