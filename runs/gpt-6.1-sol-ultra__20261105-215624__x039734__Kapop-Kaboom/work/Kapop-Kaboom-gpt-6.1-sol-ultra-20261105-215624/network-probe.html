<!doctype html><meta charset="utf-8"><title>Kapop network probe</title><script type="module">
import {Network} from './network.js';
window.probe={events:[],states:[],inputs:[],statuses:[]};
window.net=new Network({onStatus:s=>probe.statuses.push(s),onStart:s=>probe.events.push(s),onState:s=>probe.states.push(s),onInput:(id,s)=>probe.inputs.push({id,...s})});
window.ready=true;
</script>
