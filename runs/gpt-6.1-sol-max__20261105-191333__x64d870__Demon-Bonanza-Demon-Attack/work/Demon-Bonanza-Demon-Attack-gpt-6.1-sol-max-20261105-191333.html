<script>/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

	sync(source, dt) {
		const list =
			source.entities instanceof Map
				? [...source.entities.values()]
				: decodeSnapshot(source);
		const ids = new Set();
		for (const e of list) {
			ids.add(e.id);
			let m = this.models.get(e.id);
			if (!m) m = this.makeEntity(e);
			m.position.x = THREE.MathUtils.lerp(
				m.position.x,
				e.x,
				Math.min(1, dt * 24),
			);
			m.position.y = THREE.MathUtils.lerp(
				m.position.y,
				e.y,
				Math.min(1, dt * 24),
			);
			if (m.userData.mixer) m.userData.mixer.update(dt);
			if (e.kind === "player") {
				m.userData.barrel.rotation.z = -(e.aim || 0);
				m.visible = !(e.invul > 0 && Math.floor(this.time * 12) % 3 === 0);
				m.userData.flame.scale.y = -1 * (1 + Math.sin(this.time * 25) * 0.25);
				m.rotation.z = -(e.x - m.position.x) * 0.035;
			}
			if (e.kind === "enemy") {
				m.rotation.z = Math.sin(this.time * 2 + e.id) * 0.07;
				if (e.type === "imp" && e.diving) m.rotation.z = Math.PI;
				if (e.hp < e.maxHp) {
					const stretch = 1 + Math.sin(this.time * 3 + e.id) * 0.016;
					m.scale.setScalar(m.userData.baseScale * stretch);
				}
			}
			if (e.kind === "pickup") m.rotation.y = this.time * 2;
		}
		for (const [id, m] of this.models) {
			if (!ids.has(id)) {
				m.userData.mixer?.stopAllAction();
				this.root.remove(m);
				const geos = new Set();
				m.traverse((o) => {
					if (o.geometry) geos.add(o.geometry);
				});
				for (const geo of geos) geo.dispose();
				this.models.delete(id);
			}
		}
	}

					armor: C.gold,
					boss: C.coral,
					imp: C.coral,
					seal: C.gold,
				}[e.enemyType] || C.cream,
				e.enemyType === "boss" ? 70 : 18,
				e.enemyType === "boss" ? 2 : 1,
			);
			this.ring(e.x, e.y, C.cream, e.enemyType === "boss" ? 8 : 2.2, 0.35);

		}
		if (e.type === "hit") {
			const m = this.models.get(e.id);
			if (m) {
				this.burst(e.x, e.y, C.cream, 4, 0.55);
				m.scale.multiplyScalar(1.09);
			}
		}
		if (e.type === "fire")
			this.models
				.get(
					[...this.models.keys()].find(
						(id) =>
							this.models.get(id).userData.kind === "player" &&
							Math.abs(this.models.get(id).position.x - e.x) < 2,
					),
				)
				?.userData.recoil?.reset()
				.play();
		if (e.type === "pulse") {
			this.ring(e.x, e.y, C.mint, 10, 0.65);
			this.ring(e.x, e.y, C.cream, 8, 0.5);
			this.burst(e.x, e.y, C.mint, 24);
			this.shake = 0.25;
		}
		if (e.type === "hurt") {
			this.burst(e.x, e.y, C.coral, 25);
			this.ring(e.x, e.y, C.coral, 4, 0.5);
			this.shake = 0.45;
		}
		if (e.type === "split") {
			this.ring(e.x, e.y, C.lilac, 3, 0.4);
		}
		if (e.type === "dash") {
			this.burst(e.x, e.y, C.mint, 8);
		}
		if (e.type === "pickup") {
			this.ring(e.x, e.y, C.gold, 4, 0.6);

	update(dt) {
		this.time += dt;
		this.skyRing.rotation.z = this.time * 0.022;
		if (this.hero.visible) {
			this.hero.userData.mixer.update(dt);
			this.hero.position.y = 1.6 + Math.sin(this.time * 1.6) * 0.4;
			this.hero.rotation.z = Math.sin(this.time * 0.7) * 0.07;
		}
		for (const s of this.snow) {
			s.position.x += dt * 0.24;
			s.position.y -= dt * 0.55;
			if (s.position.y < -9) {
				s.position.y = 14;
				s.position.x = (Math.random() - 0.5) * 37;
			}
		}
		for (let i = this.particles.length - 1; i >= 0; i--) {
			const p = this.particles[i];
			p.life -= dt;
			p.m.position.x += p.vx * dt;
			p.m.position.y += p.vy * dt;
			p.vy -= dt * 8;
			p.m.rotation.z += dt * 6;
			p.m.scale.multiplyScalar(Math.max(0.1, 1 - dt * 1.8));
			if (p.life <= 0) {
				this.root.remove(p.m);
				p.m.geometry.dispose();
				this.particles.splice(i, 1);
			}
		}
		for (let i = this.rings.length - 1; i >= 0; i--) {
			const p = this.rings[i];
			p.age += dt;
			const f = p.age / p.duration;
			if (p.warning) {
				p.m.material.opacity = 0.08 + Math.abs(Math.sin(f * 24)) * 0.22;
			} else {
				p.m.scale.setScalar(0.2 + f * p.scale);
				p.m.material.opacity = 1 - f;
			}
			if (f >= 1) {
				this.root.remove(p.m);
				p.m.material.dispose();
				p.m.geometry.dispose();
				this.rings.splice(i, 1);
			}
		}
		this.shake = Math.max(0, this.shake - dt * 2);
		this.camera.position.x = (Math.random() - 0.5) * this.shake;
		this.camera.position.y = 3.8 + (Math.random() - 0.5) * this.shake;
	}

		this.camera.top = height / 2;
		this.camera.bottom = -height / 2;
		this.camera.zoom = aspect < 1.3 ? Math.min(1, aspect / 1.25) : 1;
		this.camera.updateProjectionMatrix();
		this.camera.updateMatrixWorld();
	}

		);

	}
}


class Synth {
	constructor(settings = {}) {
		this.settings = { music: 0.1, sfx: 0.7, voices: 0.45, ...settings };
		this.ctx = null;
		this.steps = 0;
		this.next = 0;
		this.calls = { music: 0, shot: 0, voice: 0, effects: 0 };

	}
	async unlock() {
		if (!this.ctx) {
			const A = window.AudioContext || window.webkitAudioContext;
			if (!A) return;
			this.ctx = new A();
			this.master = this.ctx.createGain();
			this.master.gain.value = 0.68;
			this.master.connect(this.ctx.destination);
			this.music = this.ctx.createGain();
			this.sfx = this.ctx.createGain();
			this.voice = this.ctx.createGain();
			this.music.connect(this.master);
			this.sfx.connect(this.master);
			this.voice.connect(this.master);
			this.analyser = this.ctx.createAnalyser();
			this.analyser.fftSize = 512;
			this.master.connect(this.analyser);

	apply() {
		if (!this.ctx) return;
		const t = this.ctx.currentTime;
		this.music.gain.setTargetAtTime(this.settings.music, t, 0.05);
		this.sfx.gain.setTargetAtTime(this.settings.sfx, t, 0.03);
		this.voice.gain.setTargetAtTime(this.settings.voices, t, 0.03);
	}
	tone(
		freq,
		end,
		duration = 0.12,
		volume = 0.1,
		type = "triangle",
		bus = this.sfx,
		when = null,
	) {
		if (!this.ctx || this.muted) return;
		const t = when ?? this.ctx.currentTime;
		const o = this.ctx.createOscillator(),
			gain = this.ctx.createGain();
		o.type = type;
		o.frequency.setValueAtTime(freq, t);
		o.frequency.exponentialRampToValueAtTime(Math.max(20, end), t + duration);
		gain.gain.setValueAtTime(0.0001, t);
		gain.gain.linearRampToValueAtTime(volume, t + 0.006);
		gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
		o.connect(gain);
		gain.connect(bus);
		o.start(t);
		o.stop(t + duration + 0.02);

	noise(duration = 0.2, volume = 0.15, cutoff = 1800, when = null) {
		if (!this.ctx || this.muted) return;

				1,
				Math.ceil(this.ctx.sampleRate * duration),
				this.ctx.sampleRate,
			);

		for (let i = 0; i < data.length; i++)
			data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);

			f = this.ctx.createBiquadFilter(),
			g = this.ctx.createGain();

		g.gain.setValueAtTime(volume, t);
		g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
		src.connect(f);
		f.connect(g);
		g.connect(this.sfx);
		src.start(t);
		src.stop(t + duration);
	}
	speak(seed = 1) {
		if (!this.ctx || this.muted) return;
		this.calls.voice++;
		const now = this.ctx.currentTime;
		for (let i = 0; i < 5; i++) {
			const t = now + i * 0.11,
				d = 0.075 + (i % 2) * 0.025,
				f = 150 + ((seed * 31 + i * 77) % 160),
				o = this.ctx.createOscillator(),
				g = this.ctx.createGain();
			o.type = "sawtooth";
			o.frequency.setValueAtTime(f, t);
			o.frequency.exponentialRampToValueAtTime(f * (i % 2 ? 0.77 : 1.3), t + d);
			g.gain.setValueAtTime(0.0001, t);
			g.gain.linearRampToValueAtTime(0.065, t + 0.012);
			g.gain.exponentialRampToValueAtTime(0.0001, t + d);
			const vowel = [650, 1100, 400, 850, 1400][(i + seed) % 5],
				f1 = this.ctx.createBiquadFilter(),
				f2 = this.ctx.createBiquadFilter();
			f1.type = f2.type = "bandpass";
			f1.frequency.value = vowel;
			f2.frequency.value = vowel * 2.7;
			f1.Q.value = 5;
			f2.Q.value = 3;
			o.connect(f1);
			o.connect(f2);
			f1.connect(g);
			f2.connect(g);
			g.connect(this.voice);
			o.start(t);
			o.stop(t + d + 0.01);
		}
	}
	tick(intensity = 0) {
		if (!this.ctx || this.muted || this.ctx.state !== "running") return;
		if (this.next < this.ctx.currentTime - 0.4)
			this.next = this.ctx.currentTime;
		const beat = 60 / (112 + intensity * 8) / 2;
		const melody = [
			0, 7, 12, 10, 7, 3, 5, 7, 0, 7, 15, 12, 10, 7, 5, 3, 0, 3, 7, 12, 15, 12,
			10, 7, 5, 7, 10, 7, 3, 5, 7, -5,
		];
		while (this.next < this.ctx.currentTime + 0.14) {
			const s = this.steps++,
				t = this.next,
				root = [146.83, 130.81, 174.61, 110][Math.floor(s / 16) % 4];

				const n = melody[s % melody.length],
					f = root * 2 * Math.pow(2, n / 12);

				this.calls.music++;

			if (s % 4 === 0) this.tone(92, 38, 0.14, 0.14, "sine", this.music, t);
			if (s % 4 === 2)
				this.tone(210, 95, 0.055, 0.045, "square", this.music, t);
			if (s % 2 === 1)
				this.tone(4200, 2100, 0.018, 0.015, "triangle", this.music, t);
			this.next += beat;
		}
	}
	event(e) {
		if (!this.ctx) return;
		this.calls.effects++;
		if (e.type === "fire") {
			this.calls.shot++;
			this.tone(980, 260, 0.085, 0.065, "square");
		}
		if (e.type === "hit") this.tone(310, 130, 0.07, 0.06, "triangle");
		if (e.type === "kill") {
			this.noise(e.enemyType === "boss" ? 0.7 : 0.13, 0.15, 2000);
			this.tone(170, 50, 0.19, 0.09, "sawtooth");
		}
		if (e.type === "split") {
			this.tone(300, 700, 0.16, 0.12, "square");
			this.tone(600, 250, 0.2, 0.06, "triangle");
		}
		if (e.type === "hurt") {
			this.noise(0.3, 0.25, 800);
			this.tone(140, 35, 0.45, 0.19, "sawtooth");
		}
		if (e.type === "pulse") {
			this.tone(80, 1100, 0.28, 0.2, "sine");
			this.noise(0.3, 0.12, 5000);
		}
		if (e.type === "dash") this.noise(0.12, 0.08, 3000);
		if (e.type === "pickup" || e.type === "blessing")
			for (let i = 0; i < 4; i++)
				this.tone(
					440 * Math.pow(2, (i * 3) / 12),
					440 * Math.pow(2, (i * 3) / 12),
					0.19,
					0.1,
					"triangle",
					this.sfx,
					this.ctx.currentTime + i * 0.055,
				);
		if (e.type === "wave" || e.type === "bossPhase") {
			this.speak(e.wave ?? e.phase ?? 1);
		}
		if (e.type === "warning") this.tone(660, 660, 0.11, 0.06, "square");
		if (["victory", "clear", "clean"].includes(e.type))
			for (let i = 0; i < 4; i++)
				this.tone(
					[440, 554, 659, 880][i],
					[440, 554, 659, 880][i],
					0.3,
					0.08,
					"triangle",
					this.sfx,
					this.ctx.currentTime + i * 0.1,
				);
		if (e.type === "gameover") {
			this.speak(7);
			this.tone(220, 55, 0.8, 0.14, "triangle");
		}
	}
	ui() {
		this.tone(720, 960, 0.045, 0.065, "triangle");
	}
	level() {
		if (!this.analyser) return 0;
		const data = new Float32Array(this.analyser.fftSize);
		this.analyser.getFloatTimeDomainData(data);
		return Math.sqrt(data.reduce((s, v) => s + v * v, 0) / data.length);
	}
	stop() {
		this.muted = true;
		this.ctx?.suspend();
	}
	static async offlineProbe() {
		const C = window.OfflineAudioContext || window.webkitOfflineAudioContext;
		if (!C) return { supported: false };
		const ctx = new C(1, 48000, 48000);
		const synth = new Synth();
		synth.ctx = ctx;
		synth.sfx = ctx.createGain();
		synth.sfx.gain.value = 0.7;
		synth.sfx.connect(ctx.destination);
		synth.voice = synth.sfx;
		synth.tone(880, 220, 0.25, 0.2, "square");
		synth.noise(0.25, 0.1);
		synth.speak(3);
		const buffer = await ctx.startRendering();
		const d = buffer.getChannelData(0);
		let energy = 0,
			peak = 0;
		for (const v of d) {
			energy += v * v;
			peak = Math.max(peak, Math.abs(v));
		}
		return {
			supported: true,
			rms: Math.sqrt(energy / d.length),
			peak,
			samples: d.length,
		};
	}
}


class Network {
	constructor(callbacks) {
		this.cb = callbacks;
		this.hub = window.AIHub;
		this.active = false;
		this.authority = true;
		this.me = 0;
		this.ids = [0];
		this.sent = 0;
		this.received = 0;
		this.lastSend = 0;
		this.sequence = 0;
		this.lastSequence = -1;
		this.ended = false;
		this.finished = false;
		this.kind = "solo";
		this.peer = null;
		this.channel = null;
		this.status = "";
	}
	async init() {
		if (!this.hub?.active) return null;
		const info = await (window.__bonanzaHubLink ||
			this.hub.connect({ mode: "shared-world", seats: [1, 4] }));
		if (!info) return null;
		this.info = info;
		this.active = true;
		this.kind = "hub";
		this.authority = info.isHost;
		this.me = info.me;
		this.ids = info.players.map((p) => p.id);
		this.server = info.server;
		this.hub.on("start", () => {
			this.hubStarting = true;
		});
		this.hub.on("message", (data, from) => {
			if (!this.ended) this.receive(data, from);
		});
		this.hub.on("leave", ({ id }) => {
			this.ids = this.ids.filter((n) => n !== id);
			this.cb.leave?.(id);
		});
		this.hub.on("time-up", () => {
			if (this.authority && !this.finished) this.cb.timeup?.();
		});
		this.hub.on("end", (data) => {
			this.ended = true;
			this.cb.end?.(data);
		});
		return info;
	}
	tick(now, snapshot, input, events = []) {
		if (this.ended || !this.active) return;
		if (this.hubStarting && !this.started && this.hub.time() >= 0) {
			this.started = true;
			this.cb.start?.(this.info.players.length);
		}
		if (!this.started || now - this.lastSend < 100) return;
		this.lastSend = now;
		if (this.authority && snapshot)
			this.send({
				t: "s",
				n: ++this.sequence,
				s: snapshot,
				e: events.slice(-12),
			});
		else if (!this.authority) this.send({ t: "i", i: input || {} });
	}
	send(data) {
		if (this.ended) return false;
		this.sent++;
		if (this.kind === "hub") return this.hub.send(data, { reliable: true });
		if (this.channel?.readyState === "open") {
			this.channel.send(JSON.stringify(data));
			return true;
		}
		return false;
	}
	receive(data, from) {
		if (!data || typeof data !== "object") return;
		this.received++;
		if (data.t === "i" && this.authority && this.ids.includes(from))
			this.cb.input?.(from, data.i);
		if (
			data.t === "s" &&
			!this.authority &&
			(this.kind !== "hub" || from === this.info.host) &&
			Number.isInteger(data.n) &&
			data.n > this.lastSequence
		) {
			this.lastSequence = data.n;
			this.cb.snapshot?.(data.s, data.e || []);
		}
		if (
			data.t === "upgrade" &&
			this.authority &&
			this.ids.includes(from) &&
			["twin", "cool", "repair"].includes(data.key)
		)
			this.cb.upgrade?.(data.key);
		if (
			data.t === "restart" &&
			this.kind === "peer" &&
			this.authority &&
			this.ids.includes(from) &&
			["retry", "encore"].includes(data.mode)
		)
			this.cb.restart?.(data.mode);
	}
	chooseUpgrade(key) {
		if (this.authority) this.cb.upgrade?.(key);
		else this.send({ t: "upgrade", key });
	}
	finish(game, won) {
		if (this.finished || this.ended) return;
		this.finished = true;
		if (this.kind === "hub" && this.authority) {
			const scores = {},
				stats = {};
			for (const id of this.ids) {
				const p = game.players.find((p) => p.seat === id);
				scores[id] = p?.score || 0;
				stats[id] = {
					"Demons banished": game.stats.kills,
					"Waves cleared": game.wave + (won ? 1 : 0),
					"Pulse returns": game.stats.reflected,
				};
			}
			this.hub.finish({ standings: [this.ids], scores, won, stats });
		}
	}
	async createPeer(host) {
		if (this.hub?.active)
			throw new Error("Use the Hub lobby for this expedition.");
		this.closePeer();
		this.authority = host;
		this.me = host ? 0 : 1;
		this.ids = [0, 1];
		this.kind = "peer";
		this.lastSequence = -1;
		this.peer = new RTCPeerConnection({
			iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
		});
		this.peer.onconnectionstatechange = () => {
			this.status = this.peer?.connectionState || "closed";
			this.cb.status?.(this.status);
			if (["failed", "disconnected"].includes(this.status)) {
				this.cb.disconnect?.();
			}
		};
		this.peer.ondatachannel = (e) => this.bindChannel(e.channel);
		if (host)
			this.bindChannel(
				this.peer.createDataChannel("demon-bonanza", { ordered: true }),
			);
	}
	bindChannel(channel) {
		this.channel = channel;
		channel.onmessage = (e) => {
			try {
				this.receive(JSON.parse(e.data), this.authority ? 1 : 0);
			} catch {}
		};
		channel.onopen = () => {
			this.active = true;
			this.started = true;
			this.finished = false;
			this.status = "connected";
			this.cb.status?.(this.status);
			this.cb.start?.(2);
		};
		channel.onclose = () => {
			if (this.active) {
				this.active = false;
				this.cb.disconnect?.();
			}
		};
	}
	async gather() {
		if (this.peer.iceGatheringState === "complete") return;
		await new Promise((resolve) => {
			let done = false;
			const timer = setTimeout(() => {
				done = true;
				resolve();
			}, 4500);
			const listener = () => {
				if (this.peer?.iceGatheringState === "complete" && !done) {
					done = true;
					clearTimeout(timer);
					resolve();
				}
			};
			this.peer.addEventListener("icegatheringstatechange", listener);
		});
	}
	async pack(description) {
		const text = JSON.stringify(description);
		if (typeof CompressionStream === "undefined")
			return "DB0." + btoa(unescape(encodeURIComponent(text)));
		const bytes = await new Response(
			new Blob([text]).stream().pipeThrough(new CompressionStream("deflate")),
		).arrayBuffer();
		return "DB1." + btoa(String.fromCharCode(...new Uint8Array(bytes)));
	}
	async unpack(code) {
		if (code.length > 40000) throw new Error("That code is too long.");
		const [prefix, payload] = code.trim().split(".");
		if (!["DB0", "DB1"].includes(prefix) || !payload)
			throw new Error("Paste a complete Demon Bonanza connection code.");
		const bytes = Uint8Array.from(atob(payload), (c) => c.charCodeAt(0));
		const text =
			prefix === "DB1"
				? await new Response(
						new Blob([bytes])
							.stream()
							.pipeThrough(new DecompressionStream("deflate")),
					).text()
				: new TextDecoder().decode(bytes);
		const desc = JSON.parse(text);
		if (
			!["offer", "answer"].includes(desc.type) ||
			typeof desc.sdp !== "string"
		)
			throw new Error("This connection code is invalid.");
		return desc;
	}
	async offer() {
		await this.createPeer(true);
		await this.peer.setLocalDescription(await this.peer.createOffer());
		await this.gather();
		return this.pack(this.peer.localDescription);
	}
	async answer(code) {
		const desc = await this.unpack(code);
		if (desc.type !== "offer")
			throw new Error("Join with the host’s invitation code.");
		await this.createPeer(false);
		await this.peer.setRemoteDescription(desc);
		await this.peer.setLocalDescription(await this.peer.createAnswer());
		await this.gather();
		return this.pack(this.peer.localDescription);
	}
	async accept(code) {
		const desc = await this.unpack(code);
		if (desc.type !== "answer" || !this.peer)
			throw new Error("Paste your partner’s reply code.");
		await this.peer.setRemoteDescription(desc);
		return true;
	}
	closePeer() {
		this.active = false;
		if (this.channel) {
			this.channel.onclose = null;
			this.channel.close();
		}
		if (this.peer) this.peer.onconnectionstatechange = null;
		this.peer?.close();
		this.channel = null;
		this.peer = null;
		if (this.kind !== "hub") {
			this.kind = "solo";
			this.authority = true;
			this.me = 0;
			this.ids = [0];
			this.server = false;
			this.started = false;
			this.finished = false;
			this.ended = false;
			this.lastSequence = -1;
		}
	}
}


class Input {
	constructor(callbacks) {
		this.cb = callbacks;
		this.keys = new Set();
		this.mode = matchMedia("(pointer:coarse)").matches ? "touch" : "keyboard";
		this.pointer = {
			x: innerWidth / 2,
			y: innerHeight / 3,
			down: false,
			active: false,
		};
		this.touch = null;
		this.pads = [];
		this.oldButtons = [];
		this.lastInput = performance.now();
		this.navAt = 0;
		this.touchPulse = false;
		const notify = (mode) => {
			const changed = this.mode !== mode;
			this.mode = mode;
			this.lastInput = performance.now();
			if (changed) this.cb.mode?.(mode);
			return this.cb.activity?.();
		};

			if (e.repeat) return;
			const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(
				document.activeElement?.tagName,
			);
			if (typing) {
				if (e.code === "Escape") {
					document.activeElement.blur();
					this.cb.back?.();
				}
				return;
			}
			if (notify("keyboard")) return;
			this.keys.add(e.code);
			if (
				[
					"Space",
					"ArrowLeft",
					"ArrowRight",
					"ArrowUp",
					"ArrowDown",
					"Tab",
				].includes(e.code)
			)
				e.preventDefault();
			if (e.code === "Escape" || e.code === "KeyP") this.cb.back?.();
			else if (this.cb.menu?.()) {
				if (e.code === "PageDown" || e.code === "PageUp") {
					e.preventDefault();
					document
						.querySelector("#overlay .panel")
						?.scrollBy({
							top: (e.code === "PageDown" ? 1 : -1) * innerHeight * 0.55,
						});
				}
				if (["ArrowUp", "KeyW"].includes(e.code)) this.navigate(0, -1);
				if (["ArrowDown", "KeyS", "Tab"].includes(e.code)) this.navigate(0, 1);
				if (["ArrowLeft", "KeyA"].includes(e.code)) this.navigate(-1, 0);
				if (["ArrowRight", "KeyD"].includes(e.code)) this.navigate(1, 0);
				if (e.code === "Enter" || e.code === "Space") this.activate();
			}
		});

					const speed = ((e.clientX - this.touch.lastX) * 1000) / elapsed;
					this.touch.x = e.clientX;
					this.touch.y = e.clientY;
					if (
						Math.abs(speed) > 700 &&
						Math.abs(e.clientX - this.touch.startX) > 45
					)
						this.touch.dashRequested = true;
					this.touch.lastX = e.clientX;
					this.touch.lastAt = e.timeStamp;
				}
			} else {
				if (
					Math.hypot(e.clientX - this.pointer.x, e.clientY - this.pointer.y) > 1
				)
					notify("keyboard");
				this.pointer = {
					...this.pointer,
					x: e.clientX,
					y: e.clientY,
					active: true,
				};
			}
		});

function handleEvent(e) {
	graphics.event(e);
	audio.event(e);
	if (
		net?.authority &&
		net.active &&
		!["spawn", "remove", "hit", "fire", "block"].includes(e.type)
	) {
		const copy = { ...e };
		delete copy.entity;
		netEvents.push(copy);
	}
	if (e.type === "wave") {
		showBanner(
			`WAVE ${String(e.wave + 1).padStart(2, "0")} / 06`,
			e.name,
			e.hint,
			3600,
		);
	}
	if (e.type === "clear")
		showBanner(
			e.clean ? "CLEAN WAVE · RESERVE EARNED" : "WAVE COMPLETE",
			"SKY CLEARED.",
			"Keep the cannon warm.",
			2300,
		);
	if (e.type === "pulse") {
		callout(
			e.reflected ? `${e.reflected} SHOTS · RETURN TO SENDER` : "COLD SNAP",
		);
		input?.rumble(0.25);
	}
	if (e.type === "hurt") {
		callout(
			e.lives > 0 ? "BUNKER LOST · KEEP MOVING" : "LAST CANNON · NO RESERVES",
		);
		input?.rumble(0.6);
	}
	if (e.type === "pickup") callout("OVERDRIVE · NINE SECONDS OF BAD NEWS");
	if (e.type === "bossPhase")
		callout(`PHASE ${e.phase} · BREAK THE SEALS`, 3000);
	if (e.type === "kill") {
		const point = graphics.worldToScreen(e.x, e.y);
		const span = document.createElement("span");
		span.className = "score-pop";
		span.textContent = "+" + e.points;
		span.style.left = point.x + "px";
		span.style.top = point.y + "px";
		$("floating-text").append(span);
		setTimeout(() => span.remove(), 850);
	}
	if (e.type === "victory" || e.type === "gameover") {
		best = Math.max(best, view().score || 0);
		store();
		resultAt = performance.now();
		if (net.kind === "hub" && net.authority)
			net.finish(game, e.type === "victory");
	}
}
$("overlay").addEventListener("click", async (e) => {
	if (e.target.closest("a") && net.kind === "hub") {
		e.preventDefault();
		return;
	}
	const target = e.target.closest("button");
	if (!target || target.disabled) return;
	input.lastInput = performance.now();
	audio.unlock();
	audio.ui();
	if (target.dataset.guide !== undefined) {
		guideTab = Number(target.dataset.guide);
		setScreen("guide");
		return;
	}
	if (target.dataset.about !== undefined) {
		aboutTab = Number(target.dataset.about);
		setScreen("about");
		return;
	}
	if (target.dataset.upgrade) {
		if (net.active) net.chooseUpgrade(target.dataset.upgrade);
		else game.chooseUpgrade(target.dataset.upgrade);
		return;
	}
	const a = target.dataset.action;
	if (a === "start") begin(1);
	if (a === "couch") begin(2);
	if (a === "resume") {
		isManualPause = false;
		setScreen("play");
	}
	if (a === "back") goBack();
	if (a === "quit") {
		if (net.kind !== "hub") setTitle();
	}
	if (["settings", "guide", "about"].includes(a)) {
		returnTo = screen === "pause" ? "pause" : "title";
		setScreen(a);
	}
	if (a === "dev") {
		returnTo = "pause";
		setScreen("dev");
	}
	if (a === "coop") setScreen("coop");
	if (a === "retry" || a === "encore") restartExpedition(a);
	if (["glyphs", "assist", "shake"].includes(a)) {
		if (a === "glyphs") prefs.glyphs = prefs.glyphs === "ps" ? "xbox" : "ps";
		else prefs[a] = !prefs[a];
		store();
		setScreen("settings");
	}
	if (a === "fullscreen") {
		try {
			if (document.fullscreenElement) await document.exitFullscreen();
			else await document.documentElement.requestFullscreen();
		} catch {
			toast("Fullscreen is unavailable in this browser.");
		}
	}
	if (a === "god") {
		game.god = !game.god;
		setScreen("dev");
	}
	if (a === "bot") {
		game.bot = !game.bot;
		setScreen("dev");
	}
	if (a === "heal") {
		game.lives = 6;
		toast("Reserve bunkers restored.");
	}
	if (a === "prevwave" || a === "nextwave" || a === "restartwave") {
		game.beginWave(
			Math.max(
				0,
				Math.min(
					5,
					game.wave + (a === "nextwave" ? 1 : a === "prevwave" ? -1 : 0),
				),
			),
		);
		toast(WAVES[game.wave].name);
	}
	if (a === "clearfire") {
		for (const entity of [...game.entities.values()])
			if (entity.kind === "bomb") game.remove(entity);
		toast("Enemy fire cleared.");
	}
	if (a === "step") {
		for (let i = 0; i < 60; i++) game.update(1 / 60);
		toast("Advanced one simulation second.");
	}
	if (a === "resetdev") {
		game.tuning = { ...DEFAULTS };
		game.god = false;
		game.bot = false;
		setScreen("dev");
	}
	if (a === "join") {
		peerAnswer = "";
		setScreen("join");
	}
	if (a === "offer") {
		peerCode = "";
		setScreen("offer");
		target.disabled = true;
		try {
			peerCode = await net.offer();
			if (screen === "offer") {
				renderPeer();
				input.focusFirst();
			}
		} catch (err) {
			toast(err.message);
		}
	}
	if (a === "makeanswer") {
		target.disabled = true;
		try {
			peerAnswer = await net.answer($("peer-in").value);
			setScreen("answer");
		} catch (err) {
			target.disabled = false;
			toast(err.message);
		}
	}
	if (a === "connectpeer") {
		target.disabled = true;
		try {
			await net.accept($("peer-in").value);
			$("peer-status").textContent = "Connecting cannons…";
		} catch (err) {
			target.disabled = false;
			toast(err.message);
		}
	}
	if (a === "copycode") {
		try {
			await navigator.clipboard.writeText($("peer-out").value);
			toast("Connection code copied.");
		} catch {
			$("peer-out").select();
			toast("Code selected. Copy it with your device’s copy command.");
		}
	}
	if (a === "selectcode") {
		$("peer-out").focus();
		$("peer-out").select();
	}
});

function frame(now) {

sentences for the catalogue\",\n    \"type\": \"Game, Tech demo or Tool\",\n    \"genre\": \"one of Action, Adventure, Fighting, Flight, Horror, Kids & Learning, Life Sim, Platformer, Puzzle, Racing, RPG, Shooter, Simulation, Sports, Stealth, Strategy\",\n    \"source\": \"the work it's based on, e.g. Moby-Dick\",\n    \"series\": \"its franchise, e.g. Star Fox, or empty\",\n    \"players\": \"how many can play: 1, 1–2 or 1–4\",\n    \"controls\": \"the controls, in one line\",\n    \"tags\": [\"3 to 6 lowercase tags, e.g. 2d, 3d, arcade, story, co-op, versus, first-person, third-person, top-down, side-scrolling, pixel art, low-poly, retro, sci-fi, fantasy, comedy, vehicles, boss fights, exploration\"]\n  }\n}\nThe catalogue's model, effort, CLI, date and usage come from the run's record after you finish, so they aren't asked here.\n\nTesting Feedback\n\n- How many issues did testing catch?\n- How many would be considered critical issues / game breaking?\n- What was the most helpful test you ran?\n- What was the least helpful test you ran?\n\nEngine Feedback\n\n- What did you like most about the engine?\n- Did you get stuck or guess wrong?\n- What was the most important thing you had to build yourself?\n- What was the hardest part about using the engine?\n- What did you change in the engine, and why? (none if nothing)\n- If you could change one thing about the engine, what would it be?\n\nPrompt Feedback\n\n- What did you like most about this prompt?\n- What was confusing?\n- What was the hardest thing to do?\n- What would you change in this prompt?\n","goal":null,"sections":{"source":{"id":"DemonAttack1982","text":"Demon Attack - 1982","hash":"6a435adc"},"genre":{"id":"genre-v3","text":"Pick the game genre(s) that best fit the source and would make the best game.","hash":"5917dd6a"},"perspective":{"id":"pov-engine-v4","text":"Pick the camera perspective(s) that best fit the genre and source and would make the best game.","hash":"69673a49"},"gameTitle":{"id":"ttl-ri ython3 -m http.server 0 --bind 127.0.0.1` prints it) and confirm the page is your game before trusting a result. Stop only processes you started, by their PID: never pkill, killall, fuser -k, or kill whatever holds a port.","hash":"2dd7c02e"},"performance":{"id":"perf-max-v2","text":"Treat the performance budget as unlimited. Add as much detail, enemies, effects, lights, and shadows as the scene needs. Out of scope (handled later): FPS targets, optimization.","hash":"b911bf18"},"testing":{"id":"test-tools-v3","text":"Test as much as you like with headless tools: scripts that play the game and check its state, including a scripted playthrough of the whole game. Keep them behind one command that prints only failures and a one-line count, and rerun it only after changing the code it covers. Use screenshots only for what a script can’t check.","hash":"42631416"},"spend":{"id":"spend-free","text":"Spend effort however you see fit.","hash":"9511cae8"},"premise":{"id":"prem-inspired","text":"Build an original game inspired by the source.","hash":"cc0f429b"},"scope":{"id":"scope-inspired","text":"Create a feature-complete demo. Capture what makes the source distinctive (its world, characters, themes and tone) and turn it into the mechanics, pacing and UX of a great game. The demo must be long enough to show ALL features and gameplay mechanics so a player can clearly understand how the game plays and feels, and what they can and cannot do. Treat the demo as a complete, polished vertical slice. It should contain all the infrastructure, systems, and polish needed so the remainder of the game could later be built out with normal designer tools.\n\nInclude a dev mode, reachable from the pause menu, with the standard tools for testing the game quickly. Balance is key, so expose the most important gameplay variables as live sliders, with a reset to defaults.","hash":"46b0fba2"},"attractMode":{"id":"attr-10s","text":"After 10 seconds without input on the title/menu screen, start a looping AI-played demo or scripted replay (arcade/kiosk style); any input exits it. The AI (or replay) can be simple and may cheat freely (infinite health, ammo, abilities, no clip, etc). Its only job is to show as much of the demo as possible, the attract mode is not meant to balance the game.","hash":"0d642414"},"multiplayer":{"id":"mp-hub","text":"Follow https://github.com/michaelcrosato/ai-hub/tree/main/lib/hub for multiplayer integration into ai-hub as well as for the game on its own.","hash":"b62eb499"},"tone":{"id":"tone-src-v2","text":"Use a writing style similar to the source’s.","hash":"3bfc327e"},"uiux":{"id":"ui-10ft-v4","text":"10-Foot Controller-First Philosophy\nDesign the game around a PS5 DualSense (or any pad the browser reports in its standard mapping) played on a TV at 10 feet. With keyboard and mouse it's the same game on the same screens, not a separate desktop layout, but they should feel native, not like stand-ins for controller buttons. The keyboard uses the keys PC players expect for the genre. The mouse aims, looks, and clicks menu items and things in the world (hover moves the focus) wherever the genre uses it. On-screen prompts follow the input used last: PlayStation glyphs for the controller (with a Settings option to show Xbox glyphs, A B X Y, instead), keys and mouse buttons for keyboard and mouse.\n\nDo not use overly dense, web-style data screens.\n\nTouch-only devices: to keep the screen clear bare minimum or no UI (other than a menu button), invisible thumb sticks, multitouch, automate/assist with everything you need to accommodate the challenges of mobile/touch controls, use contact sensitive pop action and button on screen while possible","hash":"f4edc796"},"done":{"id":"done-full","text":"No TODOs, placeholders, or stubbed features. The demo is complete.","hash":"cb3a46b6"},"sourceInfo":{"id":"info-exit-v3","text":"CRITICAL: Put Source Information, Testing Feedback, Engine Feedback and Prompt Feedback in your chat reply and an in-game About/Credits screen. Write \"unknown\" for anything you can't confirm.\n- Date: {{date}}\n- Source: the work it's based on\n- Plan: the file name of the plan you were given to build from, or none\n- Genre and Perspective: genre and camera perspective used\n- Tech: stack, libraries/engines, with versions if applicable\n- Art Direction: style used\n- Animation: system used\n- Audio: music, sound effects and voice used\n- Online: network features used, or none\n- Testing: testing parameters allowed\n- Research: research done, or none\n- Environment: {{environment}}\n- Model: {{lab}}, {{model}}, reasoning effort {{effort}}\n- Usage: write \"added on import\". You can't see your own cost, so don't estimate it: the runner records the real cost, tokens and time, and the agent that imports the game into AI Hub puts them on your About/Credits screen.\n\nExit interview: before you finish, also save these answers as exit-interview.json in this folder's root, beside the game's .html: one JSON object in exactly the shape below, every value filled in (\"unknown\" for anything you can't confirm). Tools read it (the game's run record and the AI Hub catalogue), so write plain text, and check that the file parses as JSON.\n{\n  \"sourceInformation\": {\"date\": \"\", \"source\": \"\", \"plan\": \"\", \"genre\": \"\", \"perspective\": \"\", \"tech\": \"\", \"artDirection\": \"\", \"animation\": \"\", \"audio\": \"\", \"online\": \"\", \"testing\": \"\", \"research\": \"\", \"environment\": \"\", \"model\": \"\", \"usage\": \"added on import\"},\n  \"testingFeedback\": [\"your answer to each Testing Feedback question, in order\"],\n  \"engineFeedback\": [\"your answer to each Engine Feedback question, in order\"],\n  \"promptFeedback\": [\"your answer to each Prompt Feedback question, in order\"],\n  \"aiHub\": {\n    \"name\": \"the game's title, as on its title screen\",\n    \"tagline\": \"a few words to go under the title\",\n    \"description\": \"one or two sentences for the catalogue\",\n    \"type\": \"Game, Tech demo or Tool\",\n    \"genre\": \"one of Action, Adventure, Fighting, Flight, Horror, Kids & Learning, Life Sim, Platformer, Puzzle, Racing, RPG, Shooter, Simulation, Sports, Stealth, Strategy\",\n    \"source\": \"the work it's based on, e.g. Moby-Dick\",\n    \"series\": \"its franchise, e.g. Star Fox, or empty\",\n    \"players\": \"how many can play: 1, 1–2 or 1–4\",\n    \"controls\": \"the controls, in one line\",\n    \"tags\": [\"3 to 6 lowercase tags, e.g. 2d, 3d, arcade, story, co-op, versus, first-person, third-person, top-down, side-scrolling, pixel art, low-poly, retro, sci-fi, fantasy, comedy, vehicles, boss fights, exploration\"]\n  }\n}\nThe catalogue's model, effort, CLI, date and usage come from the run's record after you finish, so they aren't asked here.","hash":"8fe63a44"},"testingFeedback":{"id":"tf-4q","text":"- How many issues did testing catch?\n- How many would be considered critical issues / game breaking?\n- What was the most helpful test you ran?\n- What was the least helpful test you ran?","hash":"95f71baf"},"engineFeedback":{"id":"ef-6q-v2","text":"- What did you like most about the engine?\n- Did you get stuck or guess wrong?\n- What was the most important thing you had to build yourself?\n- What was the hardest part about using the engine?\n- What did you change in the engine, and why? (none if nothing)\n- If you could change one thing about the engine, what would it be?","hash":"25041b09"},"promptFeedback":{"id":"pf-4q-v2","text":"- What did you like most about this prompt?\n- What was confusing?\n- What was the hardest thing to do?\n- What would you change in this prompt?","hash":"7ce5dc6e"},"goal":{"id":"on-exit-v2","text":"the bundled single .html file exists in this folder's root, every feature in TASK.md that can be done on this computer is implemented with no TODOs, placeholders or stubs, exit-interview.json in this folder's root parses as JSON and answers every field, and your final reply contains the Source Information, Testing Feedback, Engine Feedback and Prompt Feedback sections.","hash":"7559d614"}}},"interview":{"file":"exit-interview.json","answers":{"sourceInformation":{"date":"2026-11-05 19:13:33","source":"Demon Attack (Imagic, 1982), chiefly the Atari 2600 version by Rob Fulop","plan":"none","genre":"Arcade fixed-screen shooter / shoot ’em up","perspective":"Fixed orthographic, side-on 2.5D arena","tech":"Three.js 0.180.0 (R180), WebGPURenderer with WebGL 2 fallback; Rapier 2D 0.19.3 WASM; Web Audio; Gamepad API; WebRTC; AI Hub Session Protocol v1, client 1.4.0","artDirection":"Procedural cel-shaded polygonal demons, bold ink contours, ice-moon diorama and printed arcade typography","animation":"Three.js AnimationMixer, AnimationClip and keyframe tracks for wings, breathing, crowns, seals and cannon recoil; procedural movement and particles","audio":"Original code-written chiptune music (10% default), oscillator/noise effects and formant-synthesized gibberish voices; no audio files","online":"1–4-player authoritative shared-world AI Hub co-op; 2-player standalone WebRTC with manual invitation/reply codes; 2-player couch co-op","testing":"Headless scripts, deterministic full campaign simulation, synthetic controller, touch emulation, generated-audio analysis, two-page network tests and official AI Hub harness; screenshots for visual composition; WebKit compatibility and direct file URL verified. Physical controller feel, real iOS behavior, audible mix quality and arbitrary cross-internet peer connectivity: unknown.","research":"Original Imagic manual; archived screenshots and gameplay footage at Atarimania; sound-effect source-code reference; official Three.js, Rapier and AI Hub documentation","environment":"Codex CLI (headless); Linux, Ubuntu 26.04.1 on WSL2","model":"OpenAI, gpt-6.1-sol, reasoning effort max","usage":"added on import"},"testingFeedback":[{"question":"How many issues did testing catch?","answer":"4 implementation issues were caught by automated tests; multiplayer flow review found 2 more. All were fixed. Headless timing and screenshot failures were addressed in the test harness separately."},{"question":"How many would be considered critical issues / game breaking?","answer":"3 automated-test issues were game breaking: a wave-transition physics exception, a startup syntax error, and multi-view renderer initialization failure. Review also found a critical peer-to-solo state reset issue."},{"question":"What was the most helpful test you ran?","answer":"The deterministic full-campaign bot playthrough: all six waves, split/diving demons, beam attacks, pulse returns, pickups, both upgrade stops, boss phases, victory and endless encore."},{"question":"What was the least helpful test you ran?","answer":"Initial software-WebGPU screenshots were blank. They were replaced by state/draw-call checks and WebGL captures for visual inspection."}],"engineFeedback":[{"question":"What did you like most about the engine?","answer":"Three’s native animation clips and toon materials work well together for an entirely procedural cast."},{"question":"Did you get stuck or guess wrong?","answer":"A Rapier WASM stack overflow appeared at a wave transition; creating a fresh world per wave resolved it. Multiple software GPU views also needed initialization recovery to WebGL."},{"question":"What was the most important thing you had to build yourself?","answer":"The fixed-step arcade simulation, controller-focused screens, and authoritative cooperative networking."},{"question":"What was the hardest part about using the engine?","answer":"Coordinating physics lifetimes and renderer startup with the Hub session lifecycle across several browser views."},{"question":"What did you change in the engine, and why? (none if nothing)","answer":"none"},{"question":"If you could change one thing about the engine, what would it be?","answer":"An integrated toon-outline effect with consistent WebGPU and WebGL behavior."}],"promptFeedback":[{"question":"What did you like most about this prompt?","answer":"The source-first brief, complete-demo scope and controller-first requirement made the design direction clear."},{"question":"What was confusing?","answer":"The scope of standalone online play versus Hub sessions required a choice; both were implemented."},{"question":"What was the hardest thing to do?","answer":"Combining a single-file package, modern GPU rendering, complete progression and several input/network paths."},{"question":"What would you change in this prompt?","answer":"Specify the target standalone online signaling service, and distinguish required from optional cross-browser fallbacks."}],"aiHub":{"name":"Demon Bonanza","tagline":"Cold moon. Hot cannon. Bad company.","description":"An ice-moon arcade shooter full of winged trouble: slide, steer tracer fire and reflect the barrage. Survive six waves, dethrone a three-phase demon monarch, and share your bunker stock with friends.","type":"Game","genre":"Shooter","source":"Demon Attack (1982)","series":"","players":"1–4","controls":"A/D or left stick: slide; mouse or right stick: aim; Space/LMB or R2: fire; E/RMB or Square: pulse; Shift or Circle: dash; Esc or Options: pause. Touch: drag, assisted auto-fire; two fingers: pulse.","tags":["arcade","2.5d","co-op","retro","sci-fi","boss fights"]}},"reply":"Built [**Demon Bonanza — play the HTML**](~/dev/cc-matrix/runs/gpt-6.1-sol-max__20261105-191333__x64d870/work/Demon-Bonanza-Demon-Attack-gpt-6.1-sol-max-20261105-191333.html). First load needs internet for CDN dependencies.\n\nSix waves, a three-phase boss, endless encore, co-op, attract mode, and live development tools. **39 checks passed; zero failures.**\n\n[Exit interview JSON](~/dev/cc-matrix/runs/gpt-6.1-sol-max__20261105-191333__x64d870/work/exit-interview.json) · [README and controls](~/dev/cc-matrix/runs/gpt-6.1-sol-max__20261105-191333__x64d870/work/Demon-Bonanza-Demon-Attack-gpt-6.1-sol-max-20261105-191333/README.md)\n\n**Source Information:** Also included in-game under About & credits.\n\n- **Date:** 2026-11-05 19:13:33. **Source:** Demon Attack, Imagic, 1982. **Plan:** none supplied. **Genre:** fixed-screen arcade shooter. **Perspective:** side-on, orthographic 2.5D.\n- **Tech:** Three.js R180/WebGPU with WebGL fallback, Rapier 2D 0.19.3, Gamepad API, Web Audio, WebRTC, AI Hub Protocol v1/client 1.4.0. **Art:** procedural cel shading and ink contours. **Animation:** native Three.js clips and mixers. **Audio:** coded music at 10% default, synthesized effects and gibberish voices.\n- **Online:** 1–4-player Hub co-op; two-player peer and couch co-op. **Testing:** campaign simulations, browser/input/audio checks and all four Hub harness scenarios. **Research:** [original manual](https://atariage.com/manual_html_page.php?SoftwareLabelID=135), [archived visuals and footage](https://www.atarimania.com/games/atari-2600-games-demon-attack-7282), sound-code reference and official engine/Hub documentation.\n- **Environment:** Codex CLI, headless Linux. **Model:** OpenAI, gpt-6.1-sol, reasoning effort max. **Usage:** added on import. Physical controller feel, real iOS behavior, audible mix quality and arbitrary cross-internet connectivity: **unknown**.\n\n**Testing Feedback:** Automated tests caught four implementation issues, three critical. Multiplayer review found two more, one critical; all were fixed. Most helpful: the complete campaign playthrough. Least helpful: blank software-WebGPU screenshots; visual inspection used WebGL captures.\n\n**Engine Feedback:** Best feature: native animation with toon materials. Difficulties: a physics transition exception and GPU initialization failures. Built myself: gameplay simulation, controller UI and cooperative synchronization. Hardest part: coordinating physics, rendering and network lifecycles. Engine changes: none. Desired improvement: consistent built-in ink outlines across backends.\n\n**Prompt Feedback:** Best part: source research and controller-first requirements. Confusing part: standalone online signaling expectations. Hardest part: completing every input, progression and network path in one HTML. Suggested change: specify a signaling service and clarify fallback expectations."}}</script>
