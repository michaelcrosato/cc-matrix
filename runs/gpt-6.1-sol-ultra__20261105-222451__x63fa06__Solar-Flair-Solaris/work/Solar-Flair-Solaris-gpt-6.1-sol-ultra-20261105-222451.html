<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><script>/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#091120"><meta name="description" content="Solar Flair — a cel-shaded frontier rescue shooter inspired by Solaris (1986).">
<meta name="hub:session" content="1"><meta name="hub:session-players" content="1-2"><meta name="hub:session-mode" content="shared-world"><meta name="hub:session-goal" content="Rescue 5 survivors, recover Red Echo and Rift Gate signals, then destroy the siege carrier at Solaris."><meta name="hub:session-howto" content="WASD / left stick fly; mouse / right stick aim; Space / R2 fire; Shift / L2 boost; Q / Square pulse; E / Triangle tractor; Esc / Options menu. Wingmate shares the mission."><meta name="hub:session-minutes" content="7">
<title>Solar Flair · Frontier Rescue</title>
<style>:root {
	--ink: #090f20;
	--paper: #f5eedb;
	--muted: #a5b3c5;
	--amber: #ffb85f;
	--mint: #8fe8d0;
	--red: #ff6d69;
	--line: rgba(218, 233, 239, 0.23);
}
* {
	box-sizing: border-box;
}
html,
body {
	margin: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: var(--ink);
	color: var(--paper);
	font-family: "Trebuchet MS", Arial, sans-serif;
	user-select: none;
}
button,
input,
textarea {
	font: inherit;
}
button {
	cursor: pointer;
	color: inherit;
}
button:focus-visible {
	outline: 3px solid var(--mint);
	outline-offset: 5px;
}
button:hover {
	filter: brightness(1.15);
}
#world {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	display: block;
}
#grain {
	position: absolute;
	inset: 0;
	pointer-events: none;
	opacity: 0.12;
	background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.87' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.8' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
	mix-blend-mode: soft-light;
}
#vignette {
	position: absolute;
	inset: 0;
	pointer-events: none;
	background: radial-gradient(
		ellipse at 55% 40%,
		transparent 35%,
		#04081780 100%
	);
	box-shadow: inset 0 0 100px #02061577;
}
#app {
	position: absolute;
	inset: 0;
	pointer-events: none;
}
#app > * {
	pointer-events: auto;
}
.screen {
	position: absolute;
	inset: 0;
	padding: 4.5vh 4.5vw;
	display: flex;
	flex-direction: column;
}
.hidden {
	display: none !important;
}
.eyebrow {
	font-size: clamp(11px, 1.1vw, 18px);
	text-transform: uppercase;
	letter-spacing: 0.22em;
	color: var(--mint);
	font-weight: bold;
	line-height: 1.6;
}
.topline {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 20px;
}
.brandmark {
	border: 1px solid var(--line);
	border-radius: 50%;
	display: inline-grid;
	place-content: center;
	width: 36px;
	height: 36px;
	margin-right: 12px;
	color: var(--amber);
	font-size: 24px;
	vertical-align: middle;
}
.badge {
	font-size: 12px;
	letter-spacing: 0.18em;
	display: flex;
	align-items: center;
	gap: 9px;
	text-transform: uppercase;
	color: var(--muted);
}
.dot {
	width: 6px;
	height: 6px;
	display: inline-block;
	background: var(--mint);
	border-radius: 100%;
	box-shadow: 0 0 12px var(--mint);
}
.title-shade {
	background: linear-gradient(
		90deg,
		#080f20f2 0%,
		#080f20b0 36%,
		transparent 75%
	);
}
.hero {
	margin-top: auto;
	margin-bottom: auto;
	max-width: 650px;
	padding-top: 3vh;
}
.hero h1 {
	font-size: clamp(72px, 10vw, 158px);
	line-height: 0.8;
	letter-spacing: -0.065em;
	margin: 24px 0 30px;
	font-weight: 900;
}
.hero h1 em {
	color: var(--amber);
	font-family: Georgia, serif;
	font-weight: normal;
	letter-spacing: -0.085em;
}
.hero .tagline {
	font-size: clamp(19px, 1.8vw, 29px);
	line-height: 1.5;
	max-width: 490px;
	color: #d6dce0;
	margin: 0 0 28px;
}
.hero .small {
	max-width: 400px;
}
.small {
	font-size: 15px;
	line-height: 1.6;
	color: var(--muted);
}
.actions {
	display: flex;
	gap: 12px;
	flex-wrap: wrap;
}
.btn {
	border: 1px solid var(--line);
	background: #131e33bb;
	padding: 14px 22px;
	min-height: 54px;
	border-radius: 3px;
	text-transform: uppercase;
	font-size: 14px;
	font-weight: 700;
	letter-spacing: 0.09em;
	transition:
		background 0.15s,
		transform 0.15s;
	display: inline-flex;
	gap: 18px;
	align-items: center;
	justify-content: space-between;
}
.btn:hover,
.btn.focused {
	background: #24344a;
	border-color: var(--mint);
}
.btn:active {
	transform: scale(0.98);
}
.btn.primary {
	background: var(--amber);
	border-color: var(--amber);
	color: #171622;
	min-width: 250px;
}
.btn.primary:hover,
.btn.primary.focused {
	background: #ffd294;
	border-color: #ffdfa6;
}
.btn.subtle {
	border-color: transparent;
	background: transparent;
	color: var(--muted);
	padding: 10px 14px;
}
.btn.danger {
	color: var(--red);
}
.btn:disabled {
	opacity: 0.35;
	cursor: default;
}
.bottomline {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 20px;
}
.key {
	display: inline-grid;
	place-content: center;
	min-width: 26px;
	height: 26px;
	padding: 0 6px;
	border: 1px solid #98b4c580;
	border-radius: 4px;
	font-size: 13px;
	letter-spacing: 0;
	color: var(--paper);
	font-weight: 700;
}
.glyph {
	font-size: 20px;
	border-radius: 50%;
	width: 28px;
	padding: 0;
}
.bottomline .hint {
	font-size: 12px;
	letter-spacing: 0.12em;
	color: var(--muted);
	text-transform: uppercase;
}
.annotation {
	position: absolute;
	right: 5vw;
	top: 28%;
	display: flex;
	align-items: center;
	gap: 15px;
	color: var(--paper);
	text-align: right;
	font-size: 12px;
	letter-spacing: 0.15em;
	line-height: 1.8;
	text-transform: uppercase;
}
.annotation:after {
	content: "";
	width: 65px;
	height: 1px;
	background: var(--mint);
}
.annotation strong {
	font-size: 20px;
	font-weight: 400;
	letter-spacing: 0.25em;
	color: var(--amber);
}
.planet-label {
	position: absolute;
	right: 24%;
	bottom: 15%;
	font-size: 11px;
	letter-spacing: 0.2em;
	color: #b2c3c3aa;
	text-transform: uppercase;
}
.rule {
	height: 1px;
	background: var(--line);
	margin: 20px 0;
}
.overlay {
	background: #070d1bd9;
	backdrop-filter: blur(10px);
	align-items: center;
	justify-content: center;
}
.panel {
	width: min(700px, 92vw);
	max-height: 90vh;
	overflow-y: auto;
	border: 1px solid var(--line);
	background: #0c1628f2;
	padding: 36px 42px;
	box-shadow: 0 24px 100px #0007;
}
.panel.wide {
	width: min(1040px, 94vw);
}
h2 {
	font-size: clamp(32px, 4vw, 56px);
	font-weight: 500;
	letter-spacing: -0.04em;
	margin: 10px 0 20px;
}
h3 {
	font-size: 22px;
	font-weight: 500;
	margin: 22px 0 12px;
}
p {
	line-height: 1.6;
}
.menu-stack {
	display: grid;
	gap: 10px;
}
.menu-stack .btn {
	width: 100%;
}
.row {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 20px;
	padding: 13px 0;
	border-bottom: 1px solid #ffffff12;
	font-size: 17px;
}
.row label {
	flex: 1;
}
.row output {
	min-width: 50px;
	text-align: right;
	color: var(--amber);
}
input[type="range"] {
	width: 45%;
	accent-color: var(--amber);
	height: 28px;
}
input[type="checkbox"] {
	accent-color: var(--mint);
	width: 24px;
	height: 24px;
}
.control-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 0 30px;
}
.control-grid div {
	border-bottom: 1px solid var(--line);
	padding: 12px 0;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
}
.control-grid b {
	color: var(--mint);
	font-weight: normal;
}
.info-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 12px 28px;
	font-size: 14px;
}
.info-grid strong {
	display: block;
	color: var(--mint);
	font-size: 11px;
	text-transform: uppercase;
	letter-spacing: 0.16em;
	margin-bottom: 4px;
}
.feedback p {
	font-size: 14px;
	color: var(--muted);
	margin: 9px 0;
}
.feedback b {
	color: var(--paper);
}
.credits-scroll {
	max-height: 52vh;
	overflow-y: auto;
	padding-right: 12px;
	user-select: text;
}
.chart-screen {
	background: linear-gradient(90deg, #081120ef, #081120bc 60%, #081120d9);
	padding-bottom: 3vh;
}
.chart-top {
	display: flex;
	align-items: end;
	justify-content: space-between;
	gap: 24px;
}
.chart-top h2 {
	margin: 8px 0;
}
.chart-info {
	max-width: 410px;
}
.chart-layout {
	flex: 1;
	display: grid;
	grid-template-columns: minmax(0, 1fr) 300px;
	gap: 30px;
	min-height: 0;
	margin: 15px 0;
}
.chart {
	position: relative;
	min-height: 230px;
	background-image:
		linear-gradient(#93a8bb0b 1px, transparent 1px),
		linear-gradient(90deg, #93a8bb0b 1px, transparent 1px);
	background-size: 50px 50px;
	border: 1px solid #b0c2d31b;
}
.chart svg {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	overflow: visible;
	pointer-events: none;
}
.sector {
	position: absolute;
	transform: translate(-50%, -50%);
	width: 140px;
	max-width: 27%;
	border: none;
	background: none;
	text-align: center;
	padding: 8px;
	color: var(--muted);
}
.sector .orb {
	width: 42px;
	height: 42px;
	display: grid;
	place-content: center;
	border: 1px solid #a2b6cb65;
	background: #10213a;
	box-shadow: 0 0 0 6px #0e1b2e;
	transform: rotate(45deg);
	margin: 0 auto 14px;
	transition: 0.2s;
}
.sector .orb span {
	transform: rotate(-45deg);
	font-size: 20px;
	color: var(--mint);
}
.sector .name {
	font-size: 11px;
	letter-spacing: 0.11em;
	text-transform: uppercase;
	white-space: nowrap;
}
.sector:hover .orb,
.sector.focused .orb,
.sector.selected .orb {
	background: #3c3229;
	border-color: var(--amber);
	box-shadow:
		0 0 0 6px #ffb85f13,
		0 0 30px #ffb85f1a;
}
.sector.selected {
	color: var(--paper);
}
.sector.locked {
	opacity: 0.4;
}
.sector.complete .orb {
	border-color: var(--mint);
}
.sector.current .orb:after {
	content: "";
	position: absolute;
	inset: -12px;
	border: 1px dashed var(--amber);
}
.sector-details {
	display: flex;
	flex-direction: column;
	justify-content: center;
}
.sector-details .number {
	font-size: 60px;
	font-weight: 100;
	color: #ffffff16;
	line-height: 1;
}
.sector-details h3 {
	font-size: 32px;
	margin: 10px 0;
}
.sector-details .desc {
	color: var(--muted);
	font-size: 16px;
	line-height: 1.6;
	min-height: 82px;
}
.resource-strip {
	display: flex;
	gap: 30px;
	border-top: 1px solid var(--line);
	padding-top: 16px;
}
.resource-strip strong {
	color: var(--amber);
	font-size: 22px;
	font-weight: 400;
}
.resource-strip span {
	display: block;
	font-size: 10px;
	letter-spacing: 0.16em;
	text-transform: uppercase;
	color: var(--muted);
	margin-top: 5px;
}
#hud {
	position: absolute;
	inset: 0;
	pointer-events: none;
	padding: 3.5vh 4vw;
}
#hud > * {
	pointer-events: none;
}
.hud-top {
	display: flex;
	justify-content: space-between;
	align-items: start;
}
.sector-heading .eyebrow {
	font-size: 11px;
}
.sector-heading h3 {
	font-size: 23px;
	margin: 5px 0 12px;
	text-transform: uppercase;
	letter-spacing: 0.06em;
}
.objective {
	font-size: 16px;
	color: var(--mint);
}
.obj-line {
	height: 3px;
	width: 230px;
	background: #ffffff22;
	margin-top: 10px;
}
.obj-line div {
	height: 100%;
	background: var(--mint);
	transition: width 0.3s;
}
.hud-top-right {
	text-align: right;
	display: flex;
	gap: 25px;
	align-items: start;
}
.score {
	font-size: 25px;
	color: var(--amber);
	font-variant-numeric: tabular-nums;
}
.score small {
	display: block;
	color: var(--muted);
	font-size: 10px;
	letter-spacing: 0.2em;
	margin-bottom: 6px;
}
.hud-bottom {
	position: absolute;
	bottom: 4vh;
	left: 4vw;
	right: 4vw;
	display: flex;
	justify-content: space-between;
	align-items: end;
	gap: 30px;
}
.ship-status {
	width: 235px;
}
.ship-status .row {
	font-size: 11px;
	padding: 5px 0;
	border: none;
	text-transform: uppercase;
	letter-spacing: 0.12em;
}
.bar {
	height: 5px;
	background: #abbfd525;
	margin: 0 0 10px;
	border-radius: 3px;
	overflow: hidden;
}
.bar > div {
	height: 100%;
	background: var(--mint);
	transition: width 0.15s;
}
.bar.hull > div {
	background: var(--paper);
}
.bar.fuel > div {
	background: var(--amber);
}
.bar.heat > div {
	background: var(--red);
}
.hud-prompts {
	font-size: 12px;
	display: flex;
	gap: 22px;
	color: #bdcad7;
	align-items: center;
	flex-wrap: wrap;
	max-width: 540px;
	justify-content: center;
}
.hud-prompts > span {
	white-space: nowrap;
}
.pulse-count {
	color: var(--amber);
	font-size: 13px;
	letter-spacing: 0.12em;
}
.radar {
	width: 135px;
	height: 135px;
	border: 1px solid #8fe8d044;
	border-radius: 50%;
	position: relative;
	background:
		radial-gradient(transparent 48%, #8fe8d022 49%, transparent 50%),
		linear-gradient(90deg, transparent 49.5%, #8fe8d022 50%, transparent 50.5%),
		linear-gradient(transparent 49.5%, #8fe8d022 50%, transparent 50.5%),
		#0715229c;
	overflow: hidden;
}
.radar::after {
	position: absolute;
	content: "▲";
	left: calc(50% - 5px);
	bottom: 8px;
	font-size: 10px;
	color: var(--paper);
}
.blip {
	position: absolute;
	width: 4px;
	height: 4px;
	background: var(--red);
	border-radius: 50%;
}
.blip.pod {
	background: var(--mint);
}
.blip.base {
	background: var(--amber);
	width: 7px;
	height: 7px;
}
.radar-label {
	font-size: 9px;
	color: var(--muted);
	text-align: center;
	letter-spacing: 0.16em;
	margin-top: 7px;
}
.reticle {
	position: absolute;
	left: 50%;
	top: 50%;
	width: 40px;
	height: 40px;
	transform: translate(-50%, -50%);
	border: 1px solid #f4eddb80;
	border-radius: 50%;
	pointer-events: none;
}
.reticle:before,
.reticle:after {
	position: absolute;
	content: "";
	background: var(--amber);
}
.reticle:before {
	width: 4px;
	height: 4px;
	left: 17px;
	top: 17px;
	border-radius: 100%;
}
.reticle:after {
	width: 60px;
	height: 1px;
	left: -11px;
	top: 19px;
	background: linear-gradient(
		90deg,
		var(--amber) 0 12%,
		transparent 12% 88%,
		var(--amber) 88%
	);
}
.reticle.lock {
	border-color: var(--red);
	box-shadow: 0 0 20px #ff6d6922;
}
.hud-message {
	position: absolute;
	left: 50%;
	top: 24%;
	transform: translateX(-50%);
	text-align: center;
	width: min(600px, 80vw);
	text-shadow: 0 2px 6px #000;
	font-size: 18px;
	color: var(--paper);
	line-height: 1.6;
}
.hud-message .sender {
	font-size: 10px;
	display: block;
	color: var(--mint);
	letter-spacing: 0.22em;
	margin-bottom: 6px;
}
.target-label {
	position: absolute;
	transform: translate(-50%, -50%);
	font-size: 10px;
	color: var(--mint);
	letter-spacing: 0.16em;
	white-space: nowrap;
	text-shadow: 0 2px 4px #000;
}
.target-label::before {
	content: "◇";
	display: block;
	text-align: center;
	font-size: 32px;
	margin-bottom: 8px;
}
.target-label.boss {
	color: var(--red);
}
.target-label .bossbar {
	height: 4px;
	width: 180px;
	background: #ffffff22;
	margin-top: 8px;
}
.target-label .bossbar i {
	height: 100%;
	display: block;
	background: var(--red);
}
#pause-button {
	pointer-events: auto;
	background: #071522aa;
	border: 1px solid var(--line);
	border-radius: 50%;
	width: 42px;
	height: 42px;
	display: grid;
	place-content: center;
}
.warp-title {
	position: absolute;
	left: 50%;
	top: 40%;
	transform: translate(-50%, -50%);
	text-align: center;
	pointer-events: none;
}
.warp-title h2 {
	font-size: 58px;
	text-transform: uppercase;
	letter-spacing: 0.15em;
	margin: 15px 0;
}
.warp-bar {
	width: 280px;
	height: 2px;
	background: #fff3;
	margin: 25px auto;
}
.warp-bar div {
	height: 100%;
	background: var(--amber);
	transition: width 0.1s;
}
#flash {
	position: absolute;
	inset: 0;
	pointer-events: none;
	background: radial-gradient(ellipse, transparent 30%, #ff6655aa);
	opacity: 0;
	transition: opacity 0.1s;
}
#attract {
	position: absolute;
	inset: 0;
	border: 7px solid #ffb85f80;
	pointer-events: none;
	display: flex;
	align-items: end;
	justify-content: center;
	padding: 5vh;
	background: linear-gradient(transparent 70%, #081120d9);
}
#attract .label {
	text-align: center;
	font-size: 13px;
	letter-spacing: 0.2em;
	text-transform: uppercase;
}
#attract strong {
	display: block;
	font-family: Georgia, serif;
	font-style: italic;
	font-size: 45px;
	letter-spacing: 0;
	color: var(--amber);
	margin-bottom: 10px;
}
.toast {
	position: absolute;
	bottom: 17vh;
	left: 50%;
	transform: translateX(-50%);
	border: 1px solid var(--line);
	background: #0c192ce8;
	padding: 13px 25px;
	font-size: 14px;
	color: var(--mint);
	max-width: 80vw;
	text-align: center;
	pointer-events: none;
}
#load {
	position: absolute;
	inset: 0;
	background: #091120;
	display: grid;
	place-content: center;
	text-align: center;
	z-index: 50;
}
.loader {
	width: 70px;
	height: 70px;
	border: 1px solid #8fe8d033;
	border-top-color: var(--mint);
	transform: rotate(45deg);
	animation: spin 2s linear infinite;
	margin: 25px auto;
}
.loading-text {
	font-size: 13px;
	color: var(--muted);
	letter-spacing: 0.14em;
}
.load-title {
	font:
		italic 50px Georgia,
		serif;
	color: var(--amber);
}
@keyframes spin {
	to {
		transform: rotate(405deg);
	}
}
textarea {
	width: 100%;
	resize: vertical;
	min-height: 95px;
	max-height: 200px;
	background: #07101e;
	border: 1px solid var(--line);
	color: var(--mint);
	padding: 12px;
	user-select: text;
	font-family: monospace;
	font-size: 12px;
}
.coop-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 25px;
}
.stamp {
	font-size: 12px;
	color: var(--mint);
	letter-spacing: 0.17em;
	text-transform: uppercase;
}
.end-stats {
	display: flex;
	gap: 45px;
	margin: 25px 0 35px;
}
.end-stats strong {
	font-size: 36px;
	display: block;
	color: var(--amber);
	font-weight: 400;
}
.end-stats span {
	font-size: 11px;
	letter-spacing: 0.15em;
	text-transform: uppercase;
	color: var(--muted);
}
.touch-action {
	display: none;
	position: absolute;
	right: 7vw;
	bottom: 28vh;
	pointer-events: auto;
	border: 1px solid #8fe8d055;
	color: var(--mint);
	background: #10233488;
	width: 65px;
	height: 65px;
	border-radius: 50%;
	font-size: 11px;
	letter-spacing: 0.1em;
}
.touch-hint {
	display: none;
}
.dev-note {
	font-size: 12px;
	color: var(--muted);
	line-height: 1.7;
}
.version {
	font-size: 10px;
	letter-spacing: 0.15em;
	color: #a8b4c780;
}
.scroll-hint {
	font-size: 10px;
	color: var(--muted);
	text-transform: uppercase;
	letter-spacing: 0.1em;
	margin: 12px 0;
}
body.touch #hud .hud-prompts,
body.touch #hud .ship-status .heat,
body.touch #hud .radar-wrap {
	display: none;
}
body.touch .touch-action {
	display: block;
}
body.touch .touch-hint {
	display: block;
}
body.touch .ship-status {
	width: 120px;
}
body.touch .ship-status .row {
	font-size: 9px;
}
body.touch .bar {
	height: 3px;
	margin-bottom: 5px;
}
body.touch .hud-top-right .score {
	display: none;
}
body.touch .sector-heading h3 {
	font-size: 16px;
}
body.touch .objective {
	font-size: 12px;
}
body.touch .obj-line {
	width: 150px;
}
body.touch #hud .hud-bottom {
	bottom: 3vh;
}
body.touch .hud-message {
	font-size: 14px;
	top: 20%;
}
body.touch .hud-message .sender {
	font-size: 8px;
}
body.touch #hud {
	padding: 3vh 4vw;
}
@media (max-width: 800px) {
	.screen {
		padding: 4vh 5vw;
	}
	.hero {
		max-width: 75%;
		padding-top: 0;
	}
	.hero h1 {
		font-size: clamp(65px, 14vw, 110px);
		margin: 20px 0;
	}
	.hero .tagline {
		font-size: 18px;
		margin: 0 0 22px;
	}
	.hero .small {
		font-size: 12px;
	}
	.title-shade {
		background: linear-gradient(90deg, #081120ee, #08112080 65%, transparent);
	}
	.annotation {
		display: none;
	}
	.badge {
		font-size: 9px;
	}
	.eyebrow {
		font-size: 10px;
	}
	.btn {
		font-size: 11px;
		min-height: 44px;
		padding: 12px 16px;
		gap: 12px;
	}
	.btn.primary {
		min-width: 190px;
	}
	.bottomline .hint {
		font-size: 9px;
	}
	.planet-label {
		right: 8%;
		bottom: 20%;
		font-size: 8px;
	}
	.chart-layout {
		grid-template-columns: minmax(0, 1fr) 210px;
		gap: 20px;
	}
	.chart-info {
		font-size: 12px;
		max-width: 300px;
	}
	.chart-top h2 {
		font-size: 32px;
	}
	.sector-details h3 {
		font-size: 23px;
	}
	.sector-details .desc {
		font-size: 13px;
		min-height: 65px;
	}
	.sector-details .number {
		font-size: 40px;
	}
	.resource-strip {
		gap: 18px;
	}
	.sector .name {
		font-size: 8px;
		letter-spacing: 0.02em;
	}
	.sector .orb {
		width: 32px;
		height: 32px;
		margin-bottom: 12px;
	}
	.sector .orb span {
		font-size: 17px;
	}
	.panel {
		padding: 24px;
	}
	.control-grid {
		font-size: 12px;
	}
	.info-grid {
		font-size: 12px;
	}
	.coop-grid {
		gap: 15px;
	}
	.hud-prompts {
		font-size: 9px;
		gap: 12px;
	}
	.ship-status {
		width: 160px;
	}
	.radar {
		width: 95px;
		height: 95px;
	}
	.hud-message {
		font-size: 15px;
	}
	.panel h2 {
		font-size: 34px;
	}
	.row {
		font-size: 14px;
	}
	.info-grid {
		gap: 12px 20px;
	}
	.warp-title h2 {
		font-size: 36px;
	}
}
@media (max-width: 600px) and (orientation: portrait) {
	.hero {
		max-width: 100%;
		margin-top: 8vh;
	}
	.hero h1 {
		font-size: 92px;
	}
	.hero .tagline {
		max-width: 270px;
	}
	.hero .small {
		max-width: 260px;
	}
	.title-shade {
		background: linear-gradient(90deg, #081120de, #08112044);
	}
	.actions {
		gap: 8px;
	}
	.bottomline {
		align-items: end;
	}
	.bottomline .hint {
		max-width: 130px;
		line-height: 1.7;
	}
	.hero .actions {
		max-width: 300px;
	}
	.chart-layout {
		display: flex;
		flex-direction: column;
		gap: 12px;
	}
	.chart {
		flex: 1;
		min-height: 240px;
	}
	.sector-details {
		position: relative;
		padding: 10px 0;
	}
	.sector-details .number {
		display: none;
	}
	.sector-details h3 {
		font-size: 24px;
		margin: 5px 0;
	}
	.sector-details .desc {
		font-size: 12px;
		min-height: 0;
		margin: 5px 0 15px;
	}
	.sector-details .btn {
		position: absolute;
		right: 0;
		top: 10px;
		min-width: 100px;
	}
	.sector-details .stamp {
		font-size: 9px;
	}
	.sector-details h3,
	.sector-details .desc {
		max-width: 60%;
	}
	.resource-strip {
		padding-top: 10px;
	}
	.chart-top {
		display: block;
	}
	.chart-info {
		max-width: 100%;

				break;
			case "boost":
				noise(0.42, 0.13, 2400, 500);
				tone(90, 0.38, 0.14, "sawtooth", 200);
				break;
			default:
				tone(440, 0.1, 0.1);
		}
	}

	sfx(name = "ui") {
		if (!this.enabled || !this.ctx || this.ctx.state !== "running") return;
		const now = this.ctx.currentTime;
		const minimum = name === "laser" ? 0.045 : name === "boost" ? 0.25 : 0.025;
		if (now - (this.lastEffects[name] ?? -100) < minimum) return;
		this.lastEffects[name] = now;
		this.effectCount++;
		this._fx(name, this.ctx, this.sfxGain, now + 0.004);
	}

	_phrase(c, destination, t, mood = "radio") {
		const high = mood === "rescue" || mood === "happy" || mood === "win";
		const base = high ? 220 : mood === "warning" ? 120 : 165;
		const syllables = high
			? [1, 1.5, 1.25, 1.75, 1.4]
			: [1, 0.88, 1.2, 1.05, 0.82, 1.12];
		const formants = [
			[700, 1200],
			[350, 1900],
			[550, 1450],
			[420, 2300],
			[800, 1150],
			[310, 2100],
		];
		this._noise(c, destination, t, 0.06, 0.08, 2200, 900);
		syllables.forEach((pitch, i) => {
			const start = t + 0.07 + i * 0.11;
			const source = c.createOscillator();
			source.type = "sawtooth";
			source.frequency.setValueAtTime(base * pitch, start);
			source.frequency.exponentialRampToValueAtTime(
				base * pitch * 0.88,
				start + 0.085,
			);
			const envelope = c.createGain();
			envelope.gain.setValueAtTime(0.00001, start);
			envelope.gain.linearRampToValueAtTime(0.13, start + 0.012);
			envelope.gain.exponentialRampToValueAtTime(0.00001, start + 0.095);
			const f1 = c.createBiquadFilter();
			f1.type = "bandpass";
			f1.frequency.value = formants[i % 6][0];
			f1.Q.value = 6;
			const f2 = c.createBiquadFilter();
			f2.type = "bandpass";
			f2.frequency.value = formants[i % 6][1];
			f2.Q.value = 5;
			source.connect(f1);
			source.connect(f2);
			f1.connect(envelope);
			f2.connect(envelope);
			envelope.connect(destination);
			source.start(start);
			source.stop(start + 0.1);
			source.onended = () => {
				source.disconnect();
				f1.disconnect();
				f2.disconnect();
				envelope.disconnect();
			};
		});
		this._noise(c, destination, t + 0.8, 0.07, 0.04, 3000, 1400);
	}

	voice(mood = "radio") {
		if (!this.enabled || !this.ctx || this.ctx.state !== "running") return;
		if (this.ctx.currentTime - (this.lastVoice ?? -100) < 0.9) return;
		this.lastVoice = this.ctx.currentTime;
		this.voiceCount++;
		this._phrase(this.ctx, this.sfxGain, this.ctx.currentTime + 0.005, mood);
	}

	inspect() {
		let rms = 0,
			peak = 0;
		if (this.analyser) {
			const samples = new Float32Array(this.analyser.fftSize);
			this.analyser.getFloatTimeDomainData(samples);
			for (const n of samples) {
				rms += n * n;
				peak = Math.max(peak, Math.abs(n));
			}
			rms = Math.sqrt(rms / samples.length);
		}
		return {
			unlocked: !!this.ctx,
			state: this.ctx?.state || "locked",
			musicVolume: this.musicVolume,
			sfxVolume: this.sfxVolume,
			noteCount: this.noteCount,
			effectCount: this.effectCount,
			voiceCount: this.voiceCount,
			rms,
			peak,
		};
	}

	async selfTest() {
		const Offline =
			globalThis.OfflineAudioContext || globalThis.webkitOfflineAudioContext;
		if (!Offline)
			return {
				supported: false,
				audible: false,
				reason: "OfflineAudioContext unavailable",
			};
		const names = [
			"laser",
			"hit",
			"explode",
			"warp",
			"rescue",
			"shield",
			"ui",
			"win",
			"lose",
			"boost",
		];
		const c = new Offline(1, 44100 * 18, 44100);
		const gain = c.createGain();
		gain.gain.value = 0.5;
		gain.connect(c.destination);
		names.forEach((name, i) => this._fx(name, c, gain, 0.1 + i * 1.5));
		this._phrase(c, gain, 15.4, "rescue");
		const rendered = await c.startRendering();
		const samples = rendered.getChannelData(0);
		const segments = {};
		let total = 0,
			peak = 0,
			nonFinite = 0;
		for (let i = 0; i < samples.length; i++) {
			const v = samples[i];
			if (!Number.isFinite(v)) nonFinite++;
			total += v * v;
			peak = Math.max(peak, Math.abs(v));
		}
		for (let i = 0; i <= names.length; i++) {
			const start = Math.floor(
				(i < names.length ? 0.1 + i * 1.5 : 15.4) * 44100,
			);
			let energy = 0;
			for (let j = start; j < start + 44100; j++)
				energy += samples[j] * samples[j];
			segments[i < names.length ? names[i] : "voice"] = Math.sqrt(
				energy / 44100,
			);
		}
		return {
			supported: true,
			audible: Object.values(segments).every((n) => n > 0.0001),
			rms: Math.sqrt(total / samples.length),
			peak,
			nonFinite,
			clipped: peak >= 1,
			segments,
		};
	}
}

/* Solar Flair: authoritative shared-world co-op. AI Hub Session Protocol v1. */
class SolarNetwork {
	constructor(callbacks = {}) {
		this.cb = callbacks;
		this.role = "solo";
		this.transport = "none";
		this.connected = false;
		this.hub = Boolean(globalThis.AIHub?.active);
		this.info = null;
		this.started = false;
		this.ended = false;
		this.finished = false;
		this.readyRequested = false;
		this.tick = 0;
		this.seq = 0;
		this.lastSeq = -1;
		this.sent = 0;
		this.received = 0;
		this.maxPacketBytes = 0;
		this.oversizeDropped = 0;
		this.peerInput = { x: 0, y: 0, fire: false, boost: false, pulse: false };
		this.peerIds = new Set();
		this.latestSnapshot = null;
		this.pc = null;
		this.channel = null;
		this.listeners = [];
	}
	async init() {
		if (!this.hub) return null;
		const h = globalThis.AIHub;
		this.transport = "hub";
		this.cb.onStatus?.("AI Hub · linking flight computers");
		this.listeners.push(
			h.on("start", () => {
				this.startPending = true;
			}),
		);
		this.listeners.push(
			h.on("message", (data, from) => this.receive(data, from)),
		);
		this.listeners.push(
			h.on("leave", ({ id, reason }) => {
				this.peerIds.delete(id);
				this.cb.onInput?.(
					{ x: 0, y: 0, fire: false, boost: false, pulse: false },
					id,
				);
				this.cb.onPeer?.(this.peerIds.size > 0);
				this.cb.onStatus?.(`Wingmate left: ${reason}`);
			}),
		);
		this.listeners.push(
			h.on("time-up", () => {
				this.cb.onTimeUp?.();
				if (this.role === "host" && !this.finished)
					this.finish(
						false,
						this.latestSnapshot?.score || this.latestSnapshot?.s?.score || 0,
					);
			}),
		);
		this.listeners.push(
			h.on("end", ({ reason }) => {
				this.ended = true;
				this.started = false;
				this.cb.onEnd?.(reason);
				this.cb.onStatus?.("AI Hub · round ended");
			}),
		);
		this.info = await h.connect({ mode: "shared-world", seats: [1, 2] });
		if (!this.info) {
			this.hub = false;
			this.transport = "none";
			for (const off of this.listeners) off();
			this.listeners = [];
			return null;
		}
		this.role = this.info.isHost ? "host" : "guest";
		this.connected = true;
		for (const p of this.info.players)
			if (p.id !== this.info.me) this.peerIds.add(p.id);
		this.cb.onRole?.(this.role, this.info);
		this.cb.onPeer?.(this.info.players.length > 1 || this.info.server);
		this.cb.onStatus?.(
			this.info.server
				? "AI Hub · flight server"
				: `AI Hub · ${this.role === "host" ? "flight lead" : "wingmate"}`,
		);
		if (this.readyRequested) h.ready();
		return this.info;
	}
	ready() {
		if (this.readyRequested) return;
		this.readyRequested = true;
		if (this.hub && this.info) globalThis.AIHub.ready();
	}
	update(dt, snapshot, input) {
		if (this.ended) return;
		if (
			this.hub &&
			this.startPending &&
			!this.started &&
			globalThis.AIHub.time() >= 0
		) {
			this.started = true;
			this.cb.onStart?.();
		}
		if (snapshot) this.latestSnapshot = snapshot;
		if (!this.connected || !this.started) return;
		this.tick += dt;
		if (this.tick < 1 / 12) return;
		this.tick %= 1 / 12;
		if (this.role === "host" && snapshot)
			this.send({
				kind: "state",
				seq: this.seq++,
				packed: 1,
				state: this.packState(snapshot),
			});
		else if (this.role === "guest")
			this.send({ kind: "input", input: this.sanitizeInput(input) });
	}
	sanitizeInput(input = {}) {
		return {
			x: Math.max(-1, Math.min(1, Number(input.x) || 0)),
			y: Math.max(-1, Math.min(1, Number(input.y) || 0)),
			fire: Boolean(input.fire),
			boost: Boolean(input.boost),
			pulse: Boolean(input.pulse),
			aimX: Math.max(-55, Math.min(55, Number(input.aimX) || 0)),
			aimY: Math.max(-35, Math.min(35, Number(input.aimY) || 0)),
		};
	}
	packState(snapshot) {
		// Millimetre precision preserves flight while keeping Hub packets beneath 16 KB.
		const state = JSON.parse(
			JSON.stringify(snapshot, (_key, value) =>
				typeof value === "number" && Number.isFinite(value)
					? Math.round(value * 1000) / 1000
					: value,
			),
		);
		for (const key of ["entities", "bullets"]) {
			if (!Array.isArray(state[key]) || !state[key].length) continue;
			const keys = [
				...new Set(state[key].flatMap((item) => Object.keys(item))),
			];
			state[key] = {
				solarTable: 1,
				keys,
				rows: state[key].map((item) => keys.map((k) => item[k] ?? null)),
			};
		}
		return state;
	}
	unpackState(state) {
		for (const key of ["entities", "bullets"]) {
			const table = state[key];
			if (
				table?.solarTable !== 1 ||
				!Array.isArray(table.keys) ||
				!Array.isArray(table.rows)
			)
				continue;
			state[key] = table.rows.map((row) =>
				Object.fromEntries(
					table.keys.flatMap((k, i) => (row[i] === null ? [] : [[k, row[i]]])),
				),
			);
		}
		return state;
	}
	send(payload) {
		if (this.ended || !this.connected) return false;
		const data = { solarFlair: 1, ...payload };
		const text = JSON.stringify(data);
		const bytes = new TextEncoder().encode(text).byteLength;
		this.maxPacketBytes = Math.max(this.maxPacketBytes, bytes);
		if (this.transport === "hub") {
			if (bytes > 16000) {
				this.oversizeDropped++;
				return false;
			}
			const options =
				this.role === "guest"
					? { to: this.info.host, reliable: false }
					: { reliable: false };
			const ok = globalThis.AIHub.send(data, options);
			if (ok !== false) this.sent++;
			return ok;
		}
		if (this.channel?.readyState === "open") {
			if (this.channel.bufferedAmount > 262144) return false;
			this.channel.send(text);
			this.sent++;
			return true;
		}
		return false;
	}
	receive(data, from = "wingmate") {
		if (!data || data.solarFlair !== 1 || this.ended) return;
		this.received++;
		if (data.kind === "input" && this.role === "host") {
			this.peerInput = this.sanitizeInput(data.input);
			this.cb.onInput?.(this.peerInput, from);
		} else if (data.kind === "state" && this.role === "guest") {
			if (this.transport === "hub" && from !== this.info.host) return;
			if (Number(data.seq) <= this.lastSeq) return;
			this.lastSeq = Number(data.seq);
			this.cb.onState?.(
				data.packed ? this.unpackState(data.state) : data.state,
			);
		} else if (data.kind === "start" && this.role === "guest") {
			this.started = true;
			this.cb.onStart?.();
		} else if (data.kind === "finish") {
			this.cb.onFinish?.(Boolean(data.won), Number(data.score) || 0);
		}
	}
	finish(won, score = 0) {
		if (this.finished || this.role !== "host" || this.ended) return;
		this.finished = true;
		if (this.hub) {
			const ids = this.info.players
				.filter((p) => p.id === this.info.me || this.peerIds.has(p.id))
				.map((p) => p.id);
			const scores = Object.fromEntries(
				ids.map((id) => [id, Number(score) || 0]),
			);
			globalThis.AIHub.finish({ standings: [ids], scores, won: Boolean(won) });
		} else
			this.send({
				kind: "finish",
				won: Boolean(won),
				score: Number(score) || 0,
			});
	}
	async createPeer(role) {
		if (this.hub) throw new Error("AI Hub manages the squadron connection.");
		this.closePeer();
		if (!globalThis.RTCPeerConnection)
			throw new Error(
				"This browser does not support direct co-op connections.",
			);
		this.role = role;
		this.transport = "webrtc";
		this.ended = false;
		this.finished = false;
		this.started = false;
		this.seq = 0;
		this.lastSeq = -1;
		this.tick = 0;
		this.pc = new RTCPeerConnection({
			iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
		});
		this.pc.ondatachannel = (event) => this.attachChannel(event.channel);
		this.pc.onconnectionstatechange = () => {
			const state = this.pc?.connectionState;
			if (
				state === "failed" ||
				state === "disconnected" ||
				state === "closed"
			) {
				this.connected = false;
				this.peerInput = this.sanitizeInput();
				this.cb.onInput?.(this.peerInput, "wingmate");
				this.cb.onPeer?.(false);
				this.cb.onStatus?.(
					state === "disconnected"
						? "Wingmate signal lost · reconnecting"
						: "Wingmate disconnected",
				);
			}
		};
		this.cb.onRole?.(role, { server: false });
	}
	attachChannel(channel) {
		this.channel = channel;
		channel.onmessage = (event) => {
			try {
				this.receive(JSON.parse(event.data));
			} catch (_) {
				/* Ignore malformed remote packets. */
			}
		};
		channel.onopen = () => {
			this.connected = true;
			this.cb.onPeer?.(true);
			this.cb.onStatus?.("Squadron linked · two pilots, one mission");
			if (this.role === "host") {
				this.started = true;
				this.send({ kind: "start" });
				this.cb.onStart?.();
			}
		};
		channel.onclose = () => {
			this.connected = false;
			this.cb.onPeer?.(false);
		};
	}
	waitForIce() {
		const pc = this.pc;
		if (pc.iceGatheringState === "complete") return Promise.resolve();
		return new Promise((resolve) => {
			const timer = setTimeout(done, 7000);
			function check() {
				if (pc.iceGatheringState === "complete") done();
			}
			function done() {
				clearTimeout(timer);
				pc.removeEventListener("icegatheringstatechange", check);
				resolve();
			}
			pc.addEventListener("icegatheringstatechange", check);
		});
	}
	encodeDescription(description) {
		return (
			"SF1." +
			btoa(JSON.stringify({ type: description.type, sdp: description.sdp }))
		);
	}
	decodeDescription(code, expected) {
		try {
			const clean = String(code).trim();
			if (!clean.startsWith("SF1.")) throw new Error("Invalid code");
			const description = JSON.parse(atob(clean.slice(4)));
			if (description.type !== expected || typeof description.sdp !== "string")
				throw new Error("Wrong code type");
			return description;
		} catch (_) {
			throw new Error(`Paste a complete Solar Flair ${expected} code.`);
		}
	}
	async host() {
		await this.createPeer("host");
		this.cb.onStatus?.("Preparing invitation · gathering connection routes");
		this.attachChannel(
			this.pc.createDataChannel("solar-flair", { ordered: true }),
		);
		await this.pc.setLocalDescription(await this.pc.createOffer());
		await this.waitForIce();
		this.cb.onStatus?.("Invitation ready · send it to your wingmate");
		return this.encodeDescription(this.pc.localDescription);
	}
	async join(code) {
		const offer = this.decodeDescription(code, "offer");
		await this.createPeer("guest");
		this.cb.onStatus?.("Preparing reply · gathering connection routes");
		await this.pc.setRemoteDescription(offer);
		await this.pc.setLocalDescription(await this.pc.createAnswer());
		await this.waitForIce();
		this.cb.onStatus?.("Reply ready · send it back to the flight lead");
		return this.encodeDescription(this.pc.localDescription);
	}
	async accept(code) {
		if (this.role !== "host" || !this.pc)
			throw new Error("Create an invitation first.");
		await this.pc.setRemoteDescription(this.decodeDescription(code, "answer"));
		this.cb.onStatus?.("Reply accepted · linking flight computers");
	}
	closePeer() {
		if (this.channel) {
			this.channel.onclose = null;
			this.channel.close();
			this.channel = null;
		}
		if (this.pc) {
			this.pc.onconnectionstatechange = null;
			this.pc.close();
			this.pc = null;
		}
		this.connected = false;
	}
	leave() {
		if (this.hub) return false;
		this.closePeer();
		this.role = "solo";
		this.transport = "none";
		this.started = false;
		this.cb.onPeer?.(false);
		this.cb.onRole?.("solo", null);
		this.cb.onStatus?.("Solo flight");
		return true;
	}
	inspect() {
		return {
			role: this.role,
			transport: this.transport,
			hub: this.hub,
			connected: this.connected,
			started: this.started,
			ended: this.ended,
			finished: this.finished,
			sent: this.sent,
			received: this.received,
			maxPacketBytes: this.maxPacketBytes,
			oversizeDropped: this.oversizeDropped,
			server: Boolean(this.info?.server),
			peerInput: this.peerInput,
		};
	}
}

	_updateSector(dt) {

			(e) => e.type === "enemy",
		).length;

				(e) => e.type === "pod",
			).length;
			if (
				this.podTimer <= 0 &&
				pods < 2 &&
				this.sectorProgress + pods < this.objective.target
			) {
				this.spawnPod();
				this.podTimer = 7.8;
			}
			if (this.rockTimer <= 0) {
				this.spawnRock();
				this.rockTimer = this.sector === "shard" ? 1.25 : 2.7;
			}
			if (this.sector === "chorus" && this.spawnTimer <= 0 && enemies < 3) {
				this.spawnEnemy();
				this.spawnTimer = 8;
			}
		} else if (this.sector === "echo" || this.sector === "rift") {
			if (
				this.spawnTimer <= 0 &&
				enemies < (this.sector === "rift" ? 5 : 4) &&
				this.sectorProgress + enemies < this.objective.target
			) {
				this.spawnEnemy(this.random() < 0.2 ? "interceptor" : "fighter");
				this.spawnTimer = this.sector === "rift" ? 3.3 : 4.0;
			}
			if (this.rockTimer <= 0) {
				if (this.sector === "rift") this.spawnRock();
				this.rockTimer = 5;
			}
		} else if (this.sector === "solaris") {
			if (this.spawnTimer <= 0 && enemies < 2) {
				this.spawnEnemy("interceptor");
				this.spawnTimer = 13;
			}
			if (this.rockTimer <= 0) {

			}

	_flushRemoved() {

	botInput() {
		const out = {
			x: 0,
			y: 0,
			aimX: 0,
			aimY: 0,
			fire: true,
			boost: false,
			pulse: false,
			interact: true,
		};
		const pods = [...this.entities.values()]
			.filter((e) => e.type === "pod")
			.sort((a, b) => b.z - a.z);
		const targets = [...this.entities.values()]
			.filter((e) => e.type === "enemy" || e.type === "boss")
			.sort((a, b) =>
				a.type === "boss" ? -1 : b.type === "boss" ? 1 : b.z - a.z,
			);
		const target = targets[0];
		if (pods.length) {
			out.x = Math.max(-1, Math.min(1, (pods[0].x - this.player.x) * 0.5));
			out.y = Math.max(-1, Math.min(1, (pods[0].y - this.player.y) * 0.5));
		} else {
			out.x = Math.cos(this.stageTime * 0.65) * 0.35;
			out.y = Math.sin(this.stageTime * 0.7) * 0.3;
		}

			out.aimY = this.player.y + (target.y - this.player.y) * f;

	}
	snapshot() {

			type: e.type,
			kind: e.kind,
			x: e.x,
			y: e.y,
			z: e.z,
			hp: e.hp,
			maxHp: e.maxHp,
			rot: e.rot,
			scale: e.scale,
			age: e.age,
			phase: e.phase || 0,
		});

			state: this.state,
			sector: this.sector,
			pendingSector: this.pendingSector,
			time: this.time,
			stageTime: this.stageTime,
			warpTime: this.warpTime,
			warpProgress: Math.min(1, this.warpTime / 2.4),
			returnTimer: this.returnTimer,
			player: { ...this.player },
			wingman: {
				...this.wingman,
				hp: this.player.hp,
				shield: this.player.shield,
			},
			entities: [...this.entities.values()].map(clean),
			bullets: [...this.bullets.values()].map((b) => ({
				id: b.id,
				owner: b.owner,
				x: b.x,
				y: b.y,
				z: b.z,
				vx: b.vx,
				vy: b.vy,
				vz: b.vz,
			})),
			sectors: this.sectors,
			completed: [...this.completed],
			rescued: this.rescued,
			kills: this.kills,
			objective: { ...this.objective },
			sectorDone: this.sectorDone,
			bossUnlocked: this.bossUnlocked(),
			lastMessage: this.lastMessage,
			stats: { ...this.stats, sectorsVisited: [...this.stats.sectorsVisited] },
		};
	}
	dispose() {
		this._clearSpace();
		this.queue.free();
		this.world.free();
		this.world = null;
	}

	removeObject(id, mesh) {
		this.scene.remove(mesh);
		this.objects.delete(id);
		const mix = this.mixers.find((x) => x.root === mesh);
		if (mix) {
			mix.mixer.stopAllAction();
			this.mixers.splice(this.mixers.indexOf(mix), 1);
		}
		mesh.traverse((o) => {
			if (o.isMesh) {
				o.geometry?.dispose();
				if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose());
				else o.material?.dispose();
			}
		});
	}
	clearDynamic() {
		for (const [id, mesh] of this.objects) this.removeObject(id, mesh);
		for (const f of this.fx) {
			this.scene.remove(f.mesh);
			f.mesh.geometry.dispose();
			f.mesh.material.dispose();
		}
		this.fx.length = 0;
		this.pulseLife = 0;
	}
	bounds(id) {
		const object = this.objects.get(id);
		if (!object) return null;
		const size = new THREE.Box3()
			.setFromObject(object)
			.getSize(new THREE.Vector3());
		return { width: size.x, height: size.y, depth: size.z };
	}
	event(e) {
		if (e.type === "reset") this.clearDynamic();
		if (e.type === "hit") {
			this.shake = Math.max(this.shake, 0.25);
			if (e.target === "player" || e.owner === "player") {
				this.flash = 0.45;
			}
		}
		if (e.type === "explode" || e.type === "rescue") {
			const color = e.type === "rescue" ? "#8fe8d0" : "#ffad67";
			const x = e.x || 0,
				y = e.y || 0,
				z = e.z ?? -40;
			this.burst(x, y, z, color, e.type === "rescue" ? 12 : 22);
			this.shake = Math.max(this.shake, 0.15);
		}
		if (e.type === "pulse") {
			this.pulseLife = 1;
			this.pulseRing.position.set(e.x || 0, e.y || 0, -15);
		}
		if (e.type === "shield") this.shield.material.opacity = 0.3;
		if (e.type === "warp") this.shake = 0.35;
	}
	burst(x, y, z, color, n) {
		for (let i = 0; i < n; i++) {
			const mesh = new THREE.Mesh(
				new THREE.OctahedronGeometry(0.12 + Math.random() * 0.4),
				new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 }),
			);
			mesh.position.set(x, y, z);
			this.scene.add(mesh);
			this.fx.push({
				mesh,
				v: new THREE.Vector3(
					(Math.random() - 0.5) * 17,
					(Math.random() - 0.5) * 17,
					(Math.random() - 0.5) * 17,
				),
				life: 0.7 + Math.random() * 0.7,
				max: 1.4,
			});
		}
		const ring = new THREE.Mesh(
			new THREE.RingGeometry(0.8, 1, 32),
			new THREE.MeshBasicMaterial({
				color,
				side: THREE.DoubleSide,
				transparent: true,
				opacity: 0.8,
			}),
		);
		ring.position.set(x, y, z);
		this.scene.add(ring);
		this.fx.push({
			mesh: ring,
			v: new THREE.Vector3(),
			life: 0.5,
			max: 0.5,
			ring: true,
		});
	}
	resize() {
		if (!this.renderer) return;
		this.camera.aspect = innerWidth / innerHeight;
		this.camera.updateProjectionMatrix();
		this.renderer.setSize(innerWidth, innerHeight);
	}
	aim(x, y) {
		this.ray.setFromCamera(new THREE.Vector2(x, y), this.camera);
		const t = (-65 - this.ray.ray.origin.z) / this.ray.ray.direction.z;
		this.tmp
			.copy(this.ray.ray.direction)
			.multiplyScalar(t)
			.add(this.ray.ray.origin);
		return {
			aimX: THREE.MathUtils.clamp(this.tmp.x, -55, 55),
			aimY: THREE.MathUtils.clamp(this.tmp.y, -35, 35),
		};
	}
	project(x, y, z) {
		this.tmp.set(x, y, z).project(this.camera);
		return {
			x: (this.tmp.x * 0.5 + 0.5) * innerWidth,
			y: (-0.5 * this.tmp.y + 0.5) * innerHeight,
			visible: this.tmp.z < 1 && this.tmp.z > 0,
		};
	}
	update(s, dt, menu, boost = false) {
		this.t += dt;
		const title = menu === "title" || menu === "about-title" || !s;
		const flight = s && (s.state === "flight" || s.state === "warp") && !title;
		this.planet.rotation.y += dt * 0.008;
		const region = s?.pendingSector || s?.sector;
		const home = region === "solaris" && !title;
		this.homeworld.visible = home;
		if (home) this.homeworld.rotation.y += dt * 0.012;
		this.planet.position.x = title ? 95 : home ? 185 : 105;
		const tint = {
			anchor: "#d9c5a0",
			shard: "#efd0b3",
			echo: "#d9908e",
			haven: "#a0d3c5",
			chorus: "#a9b6b1",
			rift: "#ab859f",
			solaris: "#a3bdce",
		};
		this.planet.children[1].material.color.set(
			title ? "#e0b185" : tint[region] || "#e0b185",
		);
		this.rings.position.copy(this.planet.position);
		this.titleFormation.forEach((m, i) => {
			m.visible = title;
			m.position.y = 7 + i * 2 + Math.sin(this.t * 0.3 + i) * 2;
		});
		const p = s?.player || { x: 0, y: 0 };
		if (title) {
			this.player.position.set(
				10 + Math.sin(this.t * 0.3),
				-2 + Math.sin(this.t * 0.5) * 0.4,
				-15,
			);
			this.player.rotation.set(
				-0.05,
				-0.25,
				Math.sin(this.t * 0.4) * 0.055 - 0.12,
			);
			this.player.scale.setScalar(2.1);
			this.camera.position.lerp(new THREE.Vector3(0, 6, 30), 0.04);
			this.camera.lookAt(0, 0, -50);
		} else {
			this.player.scale.setScalar(1);
			this.player.position.set(p.x, p.y, 0);
			const roll = -(p.vx || 0) * 0.018;

		if (!this.scene || !this.audio) return;
		this.scene.event(e);
		if (e.type === "fire" && e.owner === "player") this.audio.sfx("laser");
		if (e.type === "hit") {
			this.audio.sfx("hit");
			if (e.owner === "player") this.scene.shield.material.opacity = 0.3;
		}
		if (e.type === "explode") this.audio.sfx("explode");
		if (e.type === "rescue") {
			this.audio.sfx("rescue");
			this.toast(`SURVIVOR ABOARD · ${e.rescued} SAFE`);
		}
		if (e.type === "warp") this.audio.sfx("warp");
		if (e.type === "pulse") this.audio.sfx("shield");
		if (e.type === "shield") this.audio.sfx("shield");
		if (e.type === "complete") this.audio.sfx("rescue");
		if (e.type === "message") {
			this.message = e.text;
			this.messageTimer = 5.5;
			this.audio.voice(e.kind);
		}
		if (e.type === "victory") {
			this.audio.sfx("win");
			this.scene.burst(0, 3, -40, "#ffb85f", 70);
			if (this.net?.role === "host" && !this.attract)
				this.net.finish(true, e.score);
		}
		if (e.type === "defeat") {
			this.audio.sfx("lose");
			if (this.net?.role === "host" && !this.attract)
				this.net.finish(false, e.score);
		}
	}
	onRemote(s) {
		if (this.remoteState !== s.state) {
			this.remoteState = s.state;
			if (s.state === "map") this.show("map");
			else if (["victory", "defeat"].includes(s.state)) this.show("end");
			else if (this.page !== "pause" && this.page !== "settings")
				this.show("flight");
		}
		if (s.lastMessage !== this.remoteMessage) {
			this.remoteMessage = s.lastMessage;
			this.message = s.lastMessage;
			this.messageTimer = 5;
			this.audio.voice("radio");
		}
		const ids = new Set(s.entities.map((e) => e.id));
		const newWingShots = s.bullets.filter(
			(b) => b.owner === "wing" && !this.remoteBulletIds?.has(b.id),
		);
		if (newWingShots.length) this.audio.sfx("laser");
		this.remoteBulletIds = new Set(s.bullets.map((b) => b.id));
		if (this.remoteEntityIds)
			for (const id of this.remoteEntityIds)
				if (!ids.has(id)) {
					const e = this.remoteEntityCache?.get(id);
					if (e && ["enemy", "asteroid"].includes(e.type)) {
						this.scene.burst(e.x, e.y, e.z, "#ffb85f", 15);
						this.audio.sfx("explode");
					}
				}
		this.remoteEntityIds = ids;
		this.remoteEntityCache = new Map(s.entities.map((e) => [e.id, e]));
	}
	bindUI() {
		this.ui.addEventListener("click", (e) => {
			const btn = e.target.closest("button");
			if (!btn || btn.disabled) return;
			this.input.activity(
				this.input.touch && e.pointerType === "touch"
					? "touch"
					: this.input.last,
			);
			this.audio.unlock();
			this.audio.sfx("ui");
			this.action(btn.dataset.action, btn.dataset.value);
		});
		this.ui.addEventListener("pointerover", (e) => {
			const btn = e.target.closest("button");
			if (
				btn &&
				!btn.disabled &&
				performance.now() - (this.input.lastPointerMove || 0) < 150
			) {
				this.focus(btn, false);
				if (btn.dataset.action === "select")
					this.select(btn.dataset.value, false);
			}
		});
		this.ui.addEventListener("input", (e) => {
			const setting = e.target.dataset.setting,
				tuning = e.target.dataset.tuning;
			if (setting) {
				const value =
					e.target.type === "checkbox"
						? e.target.checked
						: Number(e.target.value);
				this.settings[setting] = value;
				if (setting === "music") this.audio.setMusic(value);
				if (setting === "sfx") this.audio.setSfx(value);
				this.save();
				const out = e.target.parentElement.querySelector("output");
				if (out)
					out.textContent =
						setting === "music" || setting === "sfx"
							? Math.round(value * 100) + "%"
							: value;
			}
			if (tuning) {
				this.sim.tuning[tuning] =
					e.target.type === "checkbox"
						? e.target.checked
						: Number(e.target.value);
				const out = e.target.parentElement.querySelector("output");
				if (out) out.textContent = Number(e.target.value).toFixed(2) + "×";
			}
		});
		$("#pause-button").onclick = () => {
			this.input.activity(this.input.last);
			this.pause();
		};
		$("#touch-pulse").onclick = (e) => {
			e.stopPropagation();
			this.input.pulseTap = true;
			this.audio.unlock();
		};
		$("#touch-context").onclick = () => {
			if (this.snapshot().sectorDone) this.sim.finishSector();
			else this.input.pulseTap = true;
		};
		addEventListener("resize", () => this.scene.resize());
	}
	command(name, value) {
		if (name === "start") this.start();
		else if (name === "sector") {
			this.sim.dev.warp(value);
			this.syncPage();
		} else if (name === "pause") this.pause();
		else if (name === "attract") this.startAttract();
		else if (name === "complete") this.sim.dev.complete();
		else if (name === "refill") this.sim.dev.refill();
		else if (name === "bot") this.autoPilot = !!value;
		else if (name === "resume") {
			this.paused = false;
			this.syncPage();
		}
		return this.snapshot();
	}
	focus(el, scroll = true) {
		if (!el) return;
		this.ui
			.querySelectorAll(".focused")
			.forEach((n) => n.classList.remove("focused"));
		el.classList.add("focused");
		this.focused = el;
		if (scroll) el.scrollIntoView({ block: "nearest" });
		if (el.dataset.action === "select" && this.selected !== el.dataset.value)
			this.select(el.dataset.value, false);
	}
	focusables() {
		return [...this.ui.querySelectorAll("button:not(:disabled),input")].filter(
			(e) => e.offsetParent !== null,
		);
	}
	moveFocus(d) {
		const f = this.focusables();
		if (!f.length) return;
		let i = f.indexOf(this.focused);
		i = (i + d + f.length) % f.length;
		this.focus(f[i]);
		this.audio.sfx("ui");
	}
	horizontal(d) {
		if (this.page === "map") {
			this.moveFocus(d);
			return;
		}
		const el = this.focused;
		if (el?.matches("input[type=range]")) {
			el.value = String(
				clamp(
					Number(el.value) + d * Number(el.step || 0.01),
					Number(el.min),
					Number(el.max),
				),
			);
			el.dispatchEvent(new Event("input", { bubbles: true }));
		} else if (el?.type === "checkbox") {
			el.checked = !el.checked;
			el.dispatchEvent(new Event("input", { bubbles: true }));
		} else this.moveFocus(d);
	}
	activateFocus() {
		if (this.focused?.matches("button")) {
			if (this.page === "map" && this.focused.dataset.action === "select") {
				this.jump(this.selected);
				return;
			}
			this.focused.click();
		} else if (this.focused?.type === "checkbox") {
			this.horizontal(1);
		}
	}
	refreshPrompts() {
		const stamp = this.input.last + this.settings.glyphs;
		if (this.promptStamp === stamp) return;
		this.promptStamp = stamp;
		document
			.querySelectorAll("[data-prompt]")
			.forEach((el) => (el.innerHTML = this.input.chip(el.dataset.prompt)));
		if (this.page === "flight") this.hudTimer = 0;
	}
	toast(text) {
		this.toastTimer = 3.5;
		$("#toast").textContent = text;
		$("#toast").classList.remove("hidden");
	}
	start() {
		this.attract = false;
		this.training = false;
		this.paused = false;
		this.autoPilot = false;
		this.remote = null;
		this.sim.tuning = { ...this.sim.defaults };
		this.sim.start();
		if (this.net.connected) this.sim.setPeerInput({}, true);
		this.messageTimer = 0;
		this.selectBest();
		this.show("map");
		this.audio.unlock();
	}
	selectBest() {
		const s = this.snapshot();
		this.selected = !s.completed.includes("shard")
			? "shard"
			: !s.completed.includes("echo")
				? "echo"
				: s.player.fuel < 35
					? "haven"
					: !s.completed.includes("chorus")
						? "chorus"
						: !s.completed.includes("rift")
							? "rift"
							: "solaris";
	}
	select(id, rebuild = true) {
		this.selected = id;
		if (this.page === "map") {
			this.ui
				.querySelectorAll(".sector")
				.forEach((el) =>
					el.classList.toggle("selected", el.dataset.value === id),
				);
			const details = $("#sector-details");
			if (details) details.innerHTML = this.sectorDetails();
			if (rebuild)
				this.focus(this.ui.querySelector(`.sector[data-value="${id}"]`), false);
		}
	}
	jump(id) {
		if (this.net.role === "guest") {
			this.toast("Flight lead is plotting the route. You fly the wingmate.");
			return;
		}
		if (this.sim.selectSector(id)) {
			this.paused = false;
			this.show("flight");
		} else this.toast(this.sim.lastMessage);
	}
	pause() {
		if (this.net.ended || (this.net.hub && !this.started)) return;
		if (this.attract) {
			this.endAttract();
			return;
		}
		if (["flight", "map"].includes(this.page)) {
			this.previous = this.page;
			this.paused = !this.net.connected;
			this.show("pause");
		}
	}
	back() {
		if (this.net?.ended) return;
		if (this.attract) {
			this.endAttract();
			return;
		}
		if (this.page === "flight" || this.page === "map") this.pause();
		else if (this.page === "pause") {
			this.paused = false;
			this.show(this.previous);
		} else if (["settings", "dev", "about"].includes(this.page)) {
			const p = this.returnTo || "title";
			this.show(p);
		} else if (["controls", "coop"].includes(this.page)) {
			this.show("title");
		} else if (this.page === "end" && !this.net.hub) this.show("title");
	}
	action(action, value) {
		if (this.net.ended) return;
		switch (action) {
			case "start":
				this.start();
				break;
			case "controls":
				this.show("controls");
				break;
			case "training":
				this.start();
				this.sim.tuning.god = true;
				this.training = true;
				this.jump("shard");
				this.toast("TRAINING · shields protected · follow the green pods");
				break;
			case "coop":
				this.show("coop");
				break;
			case "settings":
				this.returnTo = this.page;
				this.show("settings");
				break;
			case "about":
				this.returnTo = this.page;
				this.show("about");
				break;
			case "dev":
				this.returnTo = "pause";
				this.show("dev");
				break;
			case "back":
				this.back();
				break;
			case "resume":
				this.paused = false;
				this.show(this.previous);
				break;
			case "title":
				if (!this.net.hub) {
					this.net.leave();
					this.started = false;
					this.training = false;
					this.sim.tuning = { ...this.sim.defaults };
					this.show("title");
				}
				break;
			case "select":
				this.select(value);
				break;
			case "jump":
				this.jump(this.selected);
				break;
			case "tow":
				this.sim.emergencyTow();
				this.paused = false;
				this.selectBest();
				this.show("map");
				break;
			case "retreat":
				this.sim.finishSector(true);
				this.paused = false;
				this.show("map");
				break;
			case "glyphs":
				this.settings.glyphs =
					this.settings.glyphs === "xbox" ? "playstation" : "xbox";
				this.save();
				this.show("settings");
				break;
			case "fullscreen":
				document.fullscreenElement
					? document.exitFullscreen()
					: document.documentElement
							.requestFullscreen?.()
							.catch(() =>
								this.toast("Fullscreen is unavailable in this browser"),
							);
				break;
			case "defaults":
				this.settings = {
					music: 0.1,
					sfx: 0.65,
					glyphs: "playstation",
					shake: true,
				};
				this.audio.setMusic(0.1);
				this.audio.setSfx(0.65);
				this.save();
				this.show("settings");
				break;
			case "dev-reset":
				this.sim.tuning = { ...this.sim.defaults };
				this.autoPilot = false;
				this.show("dev");
				break;
			case "dev-refill":
				this.sim.refill();
				this.toast("Flight systems restored");
				break;
			case "dev-complete":
				this.sim.dev.complete();
				this.toast("Objective advanced");
				break;
			case "dev-spawn":
				this.sim.dev.spawn("jammer");
				this.toast("Jammer spawned");
				break;
			case "dev-warp":
				this.sim.dev.warp(value);
				this.paused = false;
				this.show("flight");
				break;
			case "dev-bot":
				this.autoPilot = !this.autoPilot;
				this.show("dev");
				break;
			case "dev-victory":
				this.sim.dev.victory();
				this.paused = false;
				this.show("end");
				break;
			case "host":
				this.host();
				break;
			case "join":
				this.join();
				break;
			case "accept":
				this.accept();
				break;
			case "copy":
				this.copy(value);
				break;
			case "leave":
				this.net.leave();
				this.show("coop");
				break;
			case "practice-again":
				this.start();
				break;
			case "watch":
				this.startAttract();
				break;
		}
	}

iv></section>`;
