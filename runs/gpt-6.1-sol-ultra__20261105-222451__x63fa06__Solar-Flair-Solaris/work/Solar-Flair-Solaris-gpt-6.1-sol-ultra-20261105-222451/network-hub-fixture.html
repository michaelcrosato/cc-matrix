  attachChannel(channel) {

  }
  async host() {
    await this.createPeer('host');

    this.attachChannel(this.pc.createDataChannel('solar-flair', { ordered: true }));

  }
  async join(code) {

    return this.encodeDescription(this.pc.localDescription);
  }
  async accept(code) {

  closePeer() {

    }

  }
  leave() {

    this.transport = 'none';

  }
  inspect() {
    return { role: this.role, transport: this.transport, hub: this.hub, connected: this.connected, started: this.started, ended: this.ended, finished: this.finished, sent: this.sent, received: this.received, maxPacketBytes: this.maxPacketBytes, oversizeDropped: this.oversizeDropped, server: Boolean(this.info?.server), peerInput: this.peerInput };
  }
}
