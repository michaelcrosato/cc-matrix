<!doctype html><meta charset="utf-8"><title>HERO procedural module checks</title><button id="unlock">Unlock sound</button><script type="module">
import {Sound} from './audio.js';import {Online} from './online.js';
window.audio=new Sound();window.messages=[];window.starts=0;window.ends=0;
window.online=new Online({onInput:(i,f)=>messages.push({input:i,from:f}),onSnapshot:s=>messages.push({snapshot:s}),onStart:()=>starts++,onEnd:()=>ends++});
document.querySelector('button').onclick=()=>audio.unlock();window.modulesReady=true;
</script>
