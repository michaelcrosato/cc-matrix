<!doctype html><meta charset="utf-8"><title>Star Riders network smoke test</title><script type="module">
import {Network} from './network.js';
window.smoke={statuses:[],starts:[],ghosts:[]};
window.net=new Network({onStatus:(text)=>smoke.statuses.push(text),onStart:(seed)=>smoke.starts.push(seed),onGhost:(data,from)=>smoke.ghosts.push({data,from})});
await net.init();window.smoke.ready=true;
</script>
