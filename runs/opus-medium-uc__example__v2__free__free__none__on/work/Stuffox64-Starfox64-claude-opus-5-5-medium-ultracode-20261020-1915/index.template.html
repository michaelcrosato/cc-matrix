<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stuffox 64</title>
<style>
:root { --ink: #0c0d1f; --hud: #7dffa0; --gold: #ffd34d; --panel: rgba(12, 18, 48, 0.82); --accent: #ff8a3d; --blue: #4d8dff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f24; color: #fff; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
#app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #1f3a8a, #0a0f24); z-index: 100; }
#boot .loading { text-align: center; }
#boot-status { margin-top: 1rem; font-size: clamp(16px, 2vw, 22px); opacity: 0.8; }
.fatal { text-align: center; max-width: 720px; padding: 2rem; }
.fatal h2 { font-size: clamp(22px, 3vw, 34px); }
.logo { font-weight: 900; font-size: clamp(56px, 11vw, 150px); letter-spacing: 0.02em; line-height: 0.9; color: #fff; text-shadow: 0 6px 0 var(--accent), 0 10px 0 var(--ink), 0 0 40px rgba(255, 140, 60, 0.5); -webkit-text-stroke: 3px var(--ink); font-style: italic; }
.logo span { color: var(--gold); margin-left: 0.15em; font-size: 0.7em; vertical-align: top; }
.logo.small { font-size: clamp(40px, 6vw, 80px); }
.muted { opacity: 0.75; }

/* ---------- menus ---------- */
#menu { position: fixed; inset: 0; z-index: 20; display: none; }
#menu.show { display: block; }
#menu.s-pause, #menu.s-gameover, #menu.s-results, #menu.s-demoend, #menu.s-briefing, #menu.s-settings, #menu.s-howto, #menu.s-about, #menu.s-select, #menu.s-touch { background: rgba(6, 10, 30, 0.72); backdrop-filter: blur(4px); }
#menu.s-main { background: linear-gradient(90deg, rgba(6, 10, 30, 0.85) 0%, rgba(6, 10, 30, 0.55) 45%, rgba(6, 10, 30, 0) 75%); }
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; text-align: center; }
.tagline { font-size: clamp(18px, 2.4vw, 30px); font-weight: 700; text-shadow: 0 3px 0 var(--ink); }
.press { margin-top: 3vh; font-size: clamp(20px, 2.6vw, 34px); font-weight: 800; animation: pulse 1.4s ease-in-out infinite; text-shadow: 0 3px 0 var(--ink); }
@keyframes pulse { 50% { opacity: 0.35; transform: scale(0.97); } }
.best { font-size: clamp(14px, 1.5vw, 20px); opacity: 0.85; text-shadow: 0 2px 0 var(--ink); margin-top: 1rem; }
.hidden { display: none !important; }
.menu-wrap { position: absolute; left: 7vw; top: 50%; transform: translateY(-50%); width: min(560px, 86vw); max-height: 88vh; display: flex; flex-direction: column; gap: 1.2rem; }
.menu-wrap.wide { left: 50%; transform: translate(-50%, -50%); width: min(1100px, 92vw); }
.menu-wrap h1, .brief h1 { font-size: clamp(30px, 4vw, 56px); margin: 0; font-style: italic; text-shadow: 0 4px 0 var(--ink); }
.menu-wrap h1.red { color: #ff5a6a; }
.list { display: flex; flex-direction: column; gap: 0.6rem; }
.list.narrow { max-width: 460px; }
.mi { position: relative; padding: 0.9rem 1.4rem; font-size: clamp(20px, 2.3vw, 30px); font-weight: 800; border-radius: 14px; background: rgba(255, 255, 255, 0.07); border: 3px solid transparent; cursor: pointer; transition: transform 0.12s, background 0.12s, border-color 0.12s; }
.mi small { display: block; font-size: 0.55em; font-weight: 600; opacity: 0.7; margin-top: 0.15rem; }
.mi.focus { background: linear-gradient(90deg, rgba(255, 138, 61, 0.95), rgba(255, 90, 106, 0.85)); border-color: #fff; transform: translateX(10px) scale(1.02); box-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(255, 138, 61, 0.45); }
.mi.focus::before { content: '▶'; position: absolute; left: -1.6rem; top: 50%; transform: translateY(-50%); font-size: 0.8em; color: var(--gold); }
.settings { max-height: 64vh; overflow-y: auto; padding: 0 0.5rem 0 2rem; }
.mi.row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: clamp(17px, 1.8vw, 24px); padding: 0.7rem 1.2rem; }
.mi.row .val { display: flex; align-items: center; gap: 0.7rem; white-space: nowrap; }
.arrow-l, .arrow-r { opacity: 0.4; font-size: 0.8em; padding: 0 0.2rem; }
.mi.focus .arrow-l, .mi.focus .arrow-r { opacity: 1; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 10px; height: 20px; background: var(--hud); border-radius: 2px; display: inline-block; }
.meter i.off { background: rgba(255, 255, 255, 0.2); }
.footer { position: absolute; bottom: 3vh; left: 50%; transform: translateX(-50%); display: flex; gap: 2.4rem; font-size: clamp(15px, 1.6vw, 22px); font-weight: 700; white-space: nowrap; text-shadow: 0 2px 0 var(--ink); }
.glyph { display: inline-flex; align-items: center; justify-content: center; min-width: 1.8em; height: 1.8em; padding: 0 0.45em; border-radius: 0.9em; background: #fff; color: var(--ink); font-weight: 900; font-size: 0.85em; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.5); vertical-align: middle; }
.g-fire, .g-confirm { color: #3b6fe8; } .g-back { color: #e8433b; } .g-bomb { color: #d65ad6; } .g-loop { color: #2fa86a; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.4rem; }
.card { padding: 1.6rem; min-height: 260px; display: flex; flex-direction: column; gap: 0.5rem; }
.card.c1 { background: linear-gradient(160deg, rgba(108, 192, 90, 0.45), rgba(20, 40, 80, 0.6)); }
.card.c2 { background: linear-gradient(160deg, rgba(176, 122, 255, 0.45), rgba(20, 20, 60, 0.6)); }
.card .num { font-size: 0.6em; opacity: 0.8; letter-spacing: 0.15em; }
.card .nm { font-size: 1.4em; font-style: italic; }
.card .ds { font-size: 0.6em; font-weight: 600; opacity: 0.85; line-height: 1.35; flex: 1; }
.card .rec { font-size: 0.6em; }
.medal, .got { color: var(--gold); }
.tabs { display: flex; gap: 0.8rem; align-items: center; font-size: clamp(16px, 1.8vw, 24px); font-weight: 800; }
.tabs span.ui-tab { padding: 0.4rem 1rem; border-radius: 999px; background: rgba(255, 255, 255, 0.08); cursor: pointer; }
.tabs span.ui-tab.on { background: var(--accent); box-shadow: 0 4px 0 var(--ink); }
.page { min-height: 46vh; }
.ctls { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 0.8rem 2rem; }
.ctl { display: flex; align-items: center; gap: 1rem; font-size: clamp(16px, 1.8vw, 24px); font-weight: 700; padding: 0.6rem 0.8rem; background: rgba(255, 255, 255, 0.06); border-radius: 12px; }
.ctl .k { min-width: 7.5em; text-align: center; }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.tip { background: rgba(255, 255, 255, 0.07); border-radius: 14px; padding: 1rem 1.2rem; font-size: clamp(15px, 1.5vw, 20px); line-height: 1.4; }
.tip b { display: block; font-size: 1.25em; color: var(--gold); margin-bottom: 0.2rem; }
.scroll { overflow-y: auto; max-height: 68vh; padding-right: 1rem; }
.about h2 { color: var(--gold); font-size: clamp(22px, 2.4vw, 32px); margin: 1.4rem 0 0.4rem; }
.about p { font-size: clamp(15px, 1.5vw, 20px); line-height: 1.5; margin: 0.45rem 0; }
.brief { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 3vw; padding: 4vw; }
.brief-l { text-align: center; }
.brief-l canvas { width: clamp(140px, 18vw, 240px); height: auto; border-radius: 16px; border: 4px solid #fff; box-shadow: 0 8px 0 var(--ink); }
.brief-l .who { margin-top: 0.6rem; font-weight: 800; font-size: clamp(16px, 1.8vw, 24px); }
.brief-r { max-width: 760px; display: flex; flex-direction: column; gap: 0.6rem; }
.brief-r p { font-size: clamp(16px, 1.8vw, 24px); line-height: 1.45; margin: 0; }
.brief-r .num, .results .num { letter-spacing: 0.2em; opacity: 0.8; font-weight: 800; }
.brief-r canvas.map { width: 100%; height: auto; border-radius: 12px; border: 3px solid rgba(255, 255, 255, 0.4); margin: 0.6rem 0; }
.center-card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; text-align: center; padding: 2rem; }
.big-msg { font-size: clamp(24px, 5vw, 48px); font-weight: 900; }
.tally { display: flex; flex-direction: column; gap: 0.7rem; font-size: clamp(17px, 1.9vw, 26px); }
.tally .big { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
.tally .big b { font-size: 2.6em; color: var(--hud); }
.medalrow { font-weight: 900; font-size: 1.2em; opacity: 0.7; }
.medalrow.got { color: var(--gold); opacity: 1; text-shadow: 0 0 20px rgba(255, 211, 77, 0.6); }
.team { display: flex; gap: 1.2rem; }
.tm { text-align: center; font-weight: 800; }
.tm canvas { width: 72px; height: 72px; border-radius: 10px; border: 3px solid #fff; display: block; margin-bottom: 0.3rem; }
.tm.down { opacity: 0.45; filter: grayscale(1); }
.line b { color: var(--gold); }
.line.big { font-size: clamp(22px, 2.6vw, 36px); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; display: none; font-weight: 800; text-shadow: 0 2px 0 var(--ink), 0 0 6px rgba(0, 0, 0, 0.6); }
#hud.show { display: block; }
.hud-tl { position: absolute; left: 3vw; top: 3vh; display: flex; flex-direction: column; gap: 0.7rem; }
.shield { display: flex; align-items: center; gap: 0.6rem; }
.label { font-size: clamp(12px, 1.2vw, 16px); letter-spacing: 0.12em; }
.bar { position: relative; width: clamp(160px, 22vw, 320px); height: clamp(14px, 1.6vw, 20px); background: rgba(0, 0, 0, 0.5); border: 3px solid #fff; border-radius: 999px; overflow: hidden; box-shadow: 0 3px 0 var(--ink); }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #3bd16f, #9dff7a); border-radius: 999px; transition: width 0.15s; z-index: 1; }
.bar .fill.low { background: linear-gradient(90deg, #ff3b3b, #ff8a5a); animation: blink 0.5s infinite; }
.bar .ext { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255, 255, 255, 0.12); }
@keyframes blink { 50% { opacity: 0.4; } }
.gold { display: flex; gap: 4px; }
.gold i.ring { width: 18px; height: 18px; border-radius: 50%; border: 4px solid var(--gold); display: inline-block; box-shadow: 0 0 8px var(--gold); }
.gold i.ring.empty { border-color: rgba(255, 255, 255, 0.25); box-shadow: none; }
.wings { display: flex; gap: 0.5rem; }
.wing { width: clamp(44px, 4.2vw, 60px); position: relative; transition: opacity 0.3s; }
.wing canvas { width: 100%; height: auto; border-radius: 8px; border: 2px solid #fff; display: block; }
.wing .whp { height: 6px; background: rgba(0, 0, 0, 0.5); margin-top: 3px; border-radius: 3px; overflow: hidden; }
.wing .whp div { height: 100%; background: #7ad8ff; }
.wing.gone { opacity: 0.3; filter: grayscale(1); }
.wing.trouble canvas { border-color: #ff4d6a; animation: blink 0.4s infinite; }
.hud-tr { position: absolute; right: 3vw; top: 3vh; text-align: right; }
.hud-tr .score { font-size: clamp(26px, 3vw, 44px); letter-spacing: 0.06em; }
.hud-tr .hits { font-size: clamp(16px, 1.8vw, 24px); color: var(--hud); }
.hud-tr .hits b { font-size: 1.5em; }
.medal-goal { font-size: clamp(12px, 1.2vw, 16px); opacity: 0.8; }
.hud-bl { position: absolute; left: 3vw; bottom: 4vh; display: flex; flex-direction: column; gap: 0.6rem; }
.boost { display: flex; align-items: center; gap: 0.6rem; }
.boost .bar { width: clamp(120px, 15vw, 220px); }
.boost .fill { background: linear-gradient(90deg, #3b8dff, #8ad8ff) !important; }
.boost .fill.lock { background: linear-gradient(90deg, #ff3b3b, #ff8a5a) !important; }
.hud-bl .row { display: flex; align-items: center; gap: 1.2rem; font-size: clamp(14px, 1.4vw, 18px); }
.bombs { display: flex; gap: 3px; }
.bombs i.bomb { width: 16px; height: 16px; border-radius: 50%; background: #d63c3c; border: 2px solid #fff; display: inline-block; }
.lz { padding: 0.15rem 0.6rem; border-radius: 999px; border: 2px solid #fff; }
.lz.l0 { background: #2f8a4a; } .lz.l1 { background: #3bd16f; color: var(--ink); text-shadow: none; } .lz.l2 { background: #4d8dff; }
.wingwarn { margin-left: 0.5rem; color: #ff6a6a; animation: blink 0.6s infinite; }
.lives i.life { display: inline-block; width: 18px; height: 18px; background: var(--accent); clip-path: polygon(50% 0, 100% 100%, 0 100%); margin-right: 3px; vertical-align: -2px; }
.hud-boss { position: absolute; top: 3vh; left: 50%; transform: translateX(-50%); text-align: center; display: none; }
.hud-boss.show { display: block; }
.hud-boss .name { font-size: clamp(14px, 1.5vw, 20px); letter-spacing: 0.18em; color: #ff8aa8; margin-bottom: 0.3rem; }
.hud-boss .bar { width: clamp(220px, 34vw, 520px); }
.hud-boss .fill { background: linear-gradient(90deg, #ff3b6a, #ffb04d) !important; }
.attract-tag { position: absolute; bottom: 12vh; left: 50%; transform: translateX(-50%); font-size: clamp(28px, 4vw, 56px); text-align: center; display: none; animation: pulse 1.6s infinite; }
.attract-tag.show { display: block; }
.attract-tag small { display: block; font-size: 0.45em; letter-spacing: 0.1em; }
#comm { position: fixed; left: 50%; bottom: 3vh; transform: translate(-50%, 140%); z-index: 7; display: flex; gap: 1rem; align-items: center; background: var(--panel); border: 3px solid #fff; border-radius: 16px; padding: 0.7rem 1.2rem 0.7rem 0.7rem; width: min(760px, 90vw); transition: transform 0.25s cubic-bezier(.2, 1.4, .4, 1); box-shadow: 0 6px 0 var(--ink); pointer-events: none; }
#comm.show { transform: translate(-50%, 0); }
#comm.enemy { background: rgba(70, 10, 30, 0.88); border-color: #ff8aa8; }
#comm canvas { width: clamp(64px, 7vw, 96px); height: auto; border-radius: 10px; border: 2px solid #fff; flex: none; }
#comm .who { font-weight: 900; color: var(--gold); font-size: clamp(14px, 1.4vw, 19px); letter-spacing: 0.08em; }
#comm.enemy .who { color: #ff8aa8; }
#comm .txt { font-size: clamp(16px, 1.75vw, 23px); font-weight: 700; line-height: 1.3; min-height: 2.6em; }
#banner { position: fixed; left: 0; right: 0; top: 30vh; text-align: center; z-index: 8; pointer-events: none; opacity: 0; transform: scale(0.9); transition: opacity 0.3s, transform 0.3s; text-shadow: 0 4px 0 var(--ink); }
#banner.show { opacity: 1; transform: scale(1); }
#banner .top { font-size: clamp(16px, 2vw, 28px); letter-spacing: 0.3em; color: var(--gold); font-weight: 900; }
#banner .main { font-size: clamp(40px, 7vw, 100px); font-weight: 900; font-style: italic; -webkit-text-stroke: 2px var(--ink); }
#banner .sub { font-size: clamp(16px, 2vw, 28px); font-weight: 700; }
#banner.warn .main, #banner.boss .main { color: #ff5a6a; }
#banner.warn { animation: blink 0.5s 5; }
#hint { position: fixed; left: 50%; top: 16vh; transform: translateX(-50%); z-index: 8; pointer-events: none; padding: 0.6rem 1.4rem; background: var(--panel); border: 2px solid var(--hud); border-radius: 999px; font-size: clamp(15px, 1.6vw, 22px); font-weight: 800; opacity: 0; transition: opacity 0.3s; white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }
#hint.show { opacity: 1; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; }
#flash.dmg { background: radial-gradient(circle, transparent 40%, rgba(255, 30, 60, 0.7)); }
#flash.bomb { background: rgba(255, 240, 220, 0.9); }
#flash.go { animation: flash 0.5s ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
@media (max-width: 700px) { .footer { gap: 1rem; } .brief { flex-direction: column; } .menu-wrap { left: 50%; transform: translate(-50%, -50%); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/rapier.mjs"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<canvas id="overlay"></canvas>
<div id="flash"></div>
<div id="hud"></div>
<div id="comm"><canvas width="128" height="128"></canvas><div><div class="who"></div><div class="txt"></div></div></div>
<div id="banner"></div>
<div id="hint"></div>
<div id="menu"></div>
<div id="boot"><div class="loading"><div class="logo">STUFFOX<span>64</span></div><div id="boot-status">Loading...</div></div></div>
<script type="module">
/*__BUNDLE__*/

</body>
