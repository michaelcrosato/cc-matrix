<!doctype html><html><head><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}body{background:#eaddbc}</style><script type="importmap">{"imports":{"three/webgpu":"./node_modules/three/build/three.webgpu.js","three/tsl":"./node_modules/three/build/three.tsl.js","three":"./node_modules/three/build/three.core.js"}}</script></head><body><div id="view"></div><script type="module">import{createScene}from'./scene.js';import{Game,trackPoint}from'./core.js';import*as THREE from'three/webgpu';const scene=await createScene(document.querySelector('#view'));const game=new Game();game.start(2,true);game.state.mode='playing';game.state.invincible=0;game.state.gateOpen=[true,false,true,true];game.state.players.forEach(p=>{p.invincible=0;p.pulse=1;p.boost=true;});game.state.enemies.push({...game.state.enemies[0],id:'e1',t:.30,lane:1,renderLane:1});window.test={scene,game,THREE,trackPoint};scene.update(game.state,.016);window.ready=true;let previous=performance.now();function frame(now){scene.update(game.state,Math.min(.05,(now-previous)/1000));previous=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);window.addEventListener('resize',()=>scene.resize());</script></body></html>
