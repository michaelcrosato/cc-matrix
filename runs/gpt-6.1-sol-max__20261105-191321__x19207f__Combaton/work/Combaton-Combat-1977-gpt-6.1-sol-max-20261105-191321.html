(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

.loading h1 span {
  display: block;
  font:
    700 18px "DM Sans",
    sans-serif;
  letter-spacing: 0.3em;
  text-align: center;
}
.loading p {
  margin-top: 22px;
  color: var(--muted);
}
.load-line {
  width: 230px;
  height: 5px;
  margin-top: 40px;
  background: #d9d5bc;
  overflow: hidden;
}
.load-line i {
  display: block;
  height: 100%;
  width: 45%;
  background: var(--orange);
  animation: load 1s infinite alternate;
}
@keyframes load {
  to {
    transform: translateX(130%);
  }
}
.title-screen {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(243, 235, 214, 1) 0%,
    rgba(243, 235, 214, 0.98) 24%,
    rgba(243, 235, 214, 0.85) 38%,
    rgba(243, 235, 214, 0) 61%
  );
}
.topbar {
  position: absolute;
  left: 4%;
  right: 4%;
  top: 4.4%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.brandmark {
  display: flex;
  gap: 12px;
  align-items: center;
}
.brandmark b {
  background: var(--ink);
  color: var(--paper);
  font:
    800 23px "Barlow Condensed",
    sans-serif;
  letter-spacing: -2px;
  padding: 2px 8px;
}
.edition {
  border: 2px solid var(--ink);
  padding: 8px 12px;
  background: var(--paper);
  font-family: "Barlow Condensed", sans-serif;
  font-size: 21px;
  transform: rotate(4deg);
}
.title-copy {
  position: absolute;
  left: 6%;
  top: 18%;
  width: 37%;
  max-width: 650px;
}
.title-copy h1 {
  font-size: clamp(84px, 10vw, 190px);
  line-height: 0.84;
  font-weight: 900;
  letter-spacing: -0.045em;
  font-style: italic;
  margin: 25px 0 20px;
  transform: rotate(-3deg);
  transform-origin: left center;
  text-shadow: 3px 4px 0 var(--yellow);
}
.title-copy .strap {
  font:
    600 clamp(25px, 2.45vw, 47px) / 1.05 "Barlow Condensed",
    sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.035em;
  margin: 0 0 24px;
}
.title-copy .intro {
  font-size: clamp(16px, 1.15vw, 23px);
  line-height: 1.6;
  max-width: 430px;
  margin-bottom: 27px;
}
.title-buttons {
  display: grid;
  gap: 15px;
  max-width: 390px;
}
.title-buttons .secondary {
  padding: 12px 22px;
  min-height: 54px;
}
.title-buttons .secondary em {
  font-size: 13px;
  font-style: normal;
  font-weight: 500;
  opacity: 0.7;
}
.title-links {
  display: flex;
  gap: 25px;
  margin-top: 28px;
  flex-wrap: wrap;
}
.title-links button {
  font-size: clamp(14px, 1vw, 19px);
  font-weight: 700;
  padding: 5px 0;
  border-bottom: 2px solid var(--line);
}
.title-links button:hover {
  border-color: var(--orange);
}
.title-footer {
  position: absolute;
  bottom: 4%;
  left: 6%;
  right: 4%;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.title-callout {
  position: absolute;
  right: 10%;
  top: 21%;
  transform: rotate(7deg);
  background: var(--yellow);
  border: 2px solid var(--ink);
  box-shadow: 4px 4px 0 var(--ink);
  padding: 10px 23px;
  font:
    800 clamp(22px, 2.1vw, 40px) "Barlow Condensed",
    sans-serif;
  letter-spacing: 0.02em;
}
.title-callout:after {
  content: "↙";
  position: absolute;
  top: 100%;
  left: 12%;
  font-size: 60px;
}
.title-caption {
  position: absolute;
  right: 7%;
  bottom: 15%;
  font-size: 13px;
  letter-spacing: 0.13em;
  font-weight: 800;
  border-top: 2px solid var(--ink);
  padding-top: 10px;
}
.title-caption span {
  color: var(--orange);
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(28, 44, 43, 0.48);
  backdrop-filter: blur(6px);
  padding: 30px;
}
.panel {
  width: min(750px, 92vw);
  max-height: 91vh;
  overflow: auto;
  background: var(--paper);
  border: 2px solid var(--ink);
  box-shadow: 9px 9px 0 rgba(22, 35, 32, 0.65);
  padding: clamp(24px, 3vw, 54px);
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: var(--green) transparent;
}
.panel.wide {
  width: min(1030px, 94vw);
}
.panel .eyebrow {
  color: var(--orange);
  margin-bottom: 18px;
}
.panel h2 {
  margin-bottom: 22px;
}
.panel > p {
  font-size: 19px;
  line-height: 1.6;
  margin: 12px 0 24px;
}
.panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}
.back {
  border: 1.5px solid var(--ink);
  width: 44px;
  height: 44px;
  font-size: 26px;
  flex-shrink: 0;
  background: var(--yellow);
}
.menu-list {
  display: grid;
  gap: 12px;
}
.menu-list > button {
  width: 100%;
}
.panel-footer {
  display: flex;
  gap: 14px;
  margin-top: 28px;
  flex-wrap: wrap;
}
.panel-footer button {
  flex: 1;
  min-width: 160px;
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  font-size: 21px;
  font-weight: 600;
  padding: 19px 0;
  border-bottom: 1px solid var(--line);
}
.settings-row label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
}
.settings-row small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.settings-row input[type="range"] {
  width: 210px;
  accent-color: var(--orange);
}
.settings-row output {
  font: 700 23px "Barlow Condensed";
  min-width: 43px;
  text-align: right;
}
.settings-row select {
  background: var(--paper);
  border: 2px solid var(--ink);
  padding: 9px;
  font-size: 18px;
  max-width: 230px;
}
.toggle {
  background: var(--ink);
  color: var(--paper);
  min-width: 80px;
  min-height: 44px;
  font-size: 17px;
  font-weight: 700;
}
.toggle.on {
  background: var(--green);
}
.controls-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.control-card {
  border: 1.5px solid var(--ink);
  padding: 25px;
  background: #e9e4cd;
}
.control-card .number {
  display: block;
  font: 800 45px "Barlow Condensed";
  color: var(--orange);
  margin-bottom: 12px;
}
.control-card p {
  font-size: 18px;
  line-height: 1.5;
  margin-top: 12px;
}
.howto-prompts {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 24px;
  font-size: 16px;
}
.briefing {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 35px;
  align-items: center;
}
.briefing .diagram {
  height: 250px;
  position: relative;
  background: var(--mint);
  border: 2px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 800 110px "Barlow Condensed";
  overflow: hidden;
}
.diagram:before,
.diagram:after {
  content: "";
  position: absolute;
  inset: 14px;
  border: 1px dashed var(--ink);
}
.diagram:after {
  inset: 30%;
  border: 8px solid var(--ink);
  transform: rotate(-22deg);
}
.briefing h2 {
  font-size: 60px;
}
.briefing p {
  font-size: 20px;
  line-height: 1.5;
}
.round-stamp {
  font: 800 clamp(90px, 10vw, 150px) / 0.8 "Barlow Condensed";
  color: var(--orange);
  transform: rotate(-4deg);
  text-shadow: 3px 3px 0 var(--yellow);
  margin: 25px 0;
}
.round-score {
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 30px;
  font: 800 80px "Barlow Condensed";
  border-top: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  padding: 15px;
}
.round-score small {
  font: 700 15px "DM Sans";
  display: block;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.round-score .sep {
  font-size: 35px;
  color: var(--muted);
}
.round-notes {
  font-size: 18px;
  line-height: 1.6;
  margin-top: 20px;
}
.results-ribbons {
  display: flex;
  gap: 10px;
  margin: 26px 0;
}
.ribbon {
  flex: 1;
  text-align: center;
  border: 1px solid var(--ink);
  background: #dedfc7;
  padding: 15px 5px;
  font: 800 23px "Barlow Condensed";
}
.ribbon.won {
  background: var(--yellow);
}
.ribbon small {
  display: block;
  font: 700 11px "DM Sans";
  margin-top: 8px;
}
.scoreboard {
  display: flex;
  gap: 30px;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.scoreboard strong {
  font: 800 65px "Barlow Condensed";
}
.scoreboard span {
  font-size: 15px;
  font-weight: 600;
}
.credits-sections {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  font-size: 15px;
  line-height: 1.6;
}
.credits-sections h3 {
  font-size: 28px;
  margin-bottom: 12px;
}
.credits-sections dl {
  margin: 0;
}
.credits-sections dt {
  font-weight: 800;
  margin-top: 11px;
}
.credits-sections dd {
  margin: 0;
  color: #536255;
}
.credits-sections ul {
  padding-left: 20px;
}
.credits-sections li {
  margin-bottom: 12px;
}
.credits-sections a {
  display: inline-block;
  margin-right: 15px;
  font-weight: 700;
}
.codebox {
  width: 100%;
  resize: vertical;
  min-height: 100px;
  padding: 15px;
  border: 2px solid var(--ink);
  background: #e8e3cc;
  color: var(--ink);
  font: 15px / 1.5 monospace;
  touch-action: auto;
  user-select: text;
}
.network-status {
  padding: 13px 17px;
  background: var(--yellow);
  font-weight: 700;
  margin: 18px 0;
  line-height: 1.4;
}
.network-steps {
  display: flex;
  gap: 16px;
  margin: 25px 0;
}
.network-steps span {
  flex: 1;
  font-size: 15px;
  border-top: 2px solid var(--line);
  padding-top: 12px;
}
.network-steps b {
  display: block;
  font: 800 29px "Barlow Condensed";
  margin-bottom: 5px;
}
.stage-picker {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin: 25px 0;
}
.stage-card {
  border: 2px solid var(--ink);
  padding: 14px 7px;
  text-align: center;
  min-height: 100px;
  background: #e5e1c9;
}
.stage-card.active {
  background: var(--yellow);
}
.stage-card b {
  font: 800 38px "Barlow Condensed";
  display: block;
}
.stage-card span {
  font-size: 12px;
  font-weight: 700;
  display: block;
  margin-top: 8px;
}
.key-note {
  font-size: 14px !important;
  color: var(--muted);
}
#hud {
  z-index: 4;
  pointer-events: none;
  padding: 28px 4%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hud-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 25px;
}
.player-score {
  min-width: 220px;
  display: flex;
  align-items: center;
  gap: 17px;
  background: var(--paper);
  border: 2px solid var(--ink);
  box-shadow: 4px 4px 0 var(--ink);
  padding: 10px 18px;
}
.player-score.p2 {
  flex-direction: row-reverse;
  text-align: right;
}
.player-score .num {
  font: 800 65px / 0.9 "Barlow Condensed";
}
.player-score .name {
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
  max-width: 160px;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}
.player-score .bars {
  display: flex;
  gap: 5px;
  margin-top: 9px;
}
.bars i {
  width: 20px;
  height: 6px;
  background: var(--orange);
}
.p2 .bars i {
  background: var(--green);
}
.bars i.empty {
  background: #cdcdb4;
}
.hud-center {
  text-align: center;
  background: var(--paper);
  border: 2px solid var(--ink);
  padding: 8px 26px;
  min-width: 210px;
}
.hud-center .time {
  font: 800 37px "Barlow Condensed";
  line-height: 1;
}
.hud-center .stage {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.1em;
  margin-top: 4px;
}
.hud-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
}
.hud-rule {
  padding: 10px 16px;
  background: var(--paper);
  border-left: 6px solid var(--orange);
  font-size: 16px;
  font-weight: 600;
  box-shadow: 2px 2px 0 rgba(35, 54, 53, 0.3);
}
.hud-rule b {
  font: 800 25px "Barlow Condensed";
  display: block;
  margin-bottom: 3px;
}
.hud-actions {
  display: flex;
  gap: 21px;
  background: var(--paper);
  padding: 12px 16px;
  font-size: 14px;
  border: 1px solid var(--ink);
}
.trick-ready {
  color: var(--green);
}
#pause-button {
  position: absolute;
  right: 20px;
  bottom: 100px;
  width: 52px;
  height: 48px;
  background: var(--paper);
  border: 2px solid var(--ink);
  z-index: 6;
  font-size: 23px;
  box-shadow: 3px 3px 0 var(--ink);
}
#announcements {
  position: absolute;
  top: 42%;
  width: 100%;
  z-index: 4;
  text-align: center;
  pointer-events: none;
  font: 900 clamp(70px, 9vw, 160px) / 0.9 "Barlow Condensed";
  text-transform: uppercase;
  color: var(--paper);
  -webkit-text-stroke: 2px var(--ink);
  text-shadow: 5px 5px 0 var(--orange);
  transform: rotate(-4deg);
}
#announcements small {
  display: block;
  font: 800 18px "DM Sans";
  -webkit-text-stroke: 0;
  letter-spacing: 0.15em;
  text-shadow: 2px 2px 0 var(--ink);
  margin-top: 16px;
}
.attract-banner {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--yellow);
  padding: 15px 28px;
  border: 2px solid var(--ink);
  font-size: 18px;
  font-weight: 800;
  box-shadow: 5px 5px 0 var(--ink);
  white-space: nowrap;
}
.attract-banner span {
  font-weight: 500;
  margin-left: 20px;
}
.attract-top {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  font: 800 36px "Barlow Condensed";
  background: var(--paper);
  padding: 5px 25px;
  border: 2px solid var(--ink);
}
#toast {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translate(-50%, 120px);
  transition: transform 0.2s;
  z-index: 15;
  padding: 15px 25px;
  background: var(--ink);
  color: var(--paper);
  font-size: 18px;
  border: 2px solid var(--yellow);
  pointer-events: none;
  max-width: 90vw;
  text-align: center;
}
#toast.visible {
  transform: translate(-50%, 0);
}
#touch-trick {
  position: absolute;
  bottom: 15%;
  right: 5%;
  z-index: 6;
}
#touch-trick button {
  width: 68px;
  height: 68px;
  border: 2px solid var(--paper);
  border-radius: 50%;
  background: rgba(35, 54, 53, 0.6);
  color: var(--paper);
  font-size: 37px;
  box-shadow: 0 0 0 3px var(--ink);
}
.touch-stick {
  position: absolute;
  width: 100px;
  height: 100px;
  border: 2px solid rgba(243, 235, 214, 0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 4;
}
.touch-stick:after {
  content: "";
  position: absolute;
  left: 33px;
  top: 33px;
  width: 30px;
  height: 30px;
  background: rgba(243, 235, 214, 0.6);
  border: 1px solid var(--ink);
  border-radius: 50%;
}
.touch-only .hud-actions,
.touch-only .hud-rule {
  display: none;
}
.touch-only #hud {
  padding: 16px;
}
.touch-only .player-score {
  min-width: 90px;
  padding: 7px 10px;
  gap: 9px;
  box-shadow: 2px 2px 0 var(--ink);
}
.touch-only .player-score .num {
  font-size: 39px;
}
.touch-only .player-score .name {
  font-size: 10px;
  max-width: 100px;
}
.touch-only .hud-center {
  min-width: 110px;
  padding: 6px 10px;
}
.touch-only .hud-center .time {
  font-size: 28px;
}
.touch-only .hud-center .stage {
  font-size: 9px;
}
.touch-only #pause-button {
  bottom: 20px;
  right: 20px;
  width: 46px;
  height: 43px;
}
@media (min-width: 1700px) {
  .title-copy {
    top: 19%;
  }
  .title-buttons {
    max-width: 450px;
  }
  .title-links {
    margin-top: 35px;
  }
  .panel {
    width: 800px;
  }
  .panel.wide {
    width: 1120px;
  }
  .panel > p {
    font-size: 23px;
  }
  .settings-row {
    font-size: 24px;
  }
  .control-card p {
    font-size: 21px;
  }
  .credits-sections {
    font-size: 18px;
  }
  .hud-rule {
    font-size: 19px;
  }
  .hud-actions {
    font-size: 17px;
  }
  .hud-center .stage {
    font-size: 14px;
  }
}
@media (max-height: 760px) and (min-width: 800px) {
  .title-copy {
    top: 16%;
  }
  .title-copy h1 {
    font-size: 10vw;
    margin: 16px 0;
  }
  .title-copy .strap {
    font-size: 2.2vw;
    margin-bottom: 14px;
  }
  .title-copy .intro {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .title-buttons {
    gap: 11px;
    max-width: 330px;
  }
  .title-buttons button {
    font-size: 17px;
    min-height: 48px;
    padding: 10px 18px;
  }
  .title-links {
    margin-top: 18px;
    gap: 20px;
  }
  .panel {
    padding: 28px 35px;
  }
  .panel h2 {
    font-size: 50px;
    margin-bottom: 15px;
  }
  .settings-row {
    padding: 13px 0;
  }
  .hud-top {
    gap: 15px;
  }
  .hud-actions {
    font-size: 12px;
  }
  .player-score .num {
    font-size: 50px;
  }
  .player-score {
    min-width: 170px;
  }
  .title-footer {
    font-size: 11px;
  }
}
@media (max-width: 800px) {
  .topbar {
    font-size: 10px;
    top: 24px;
    left: 6%;
    right: 6%;
  }
  .edition {
    font-size: 16px;
  }
  .title-screen {
    background: linear-gradient(
      90deg,
      rgba(243, 235, 214, 0.98),
      rgba(243, 235, 214, 0.93) 45%,
      rgba(243, 235, 214, 0.2)
    );
  }
  .title-copy {
    width: 75%;
    top: 19%;
  }
  .title-copy h1 {
    font-size: 19vw;
  }
  .title-copy .strap {
    font-size: 30px;
  }
  .title-copy .intro {
    font-size: 16px;
    max-width: 300px;
  }
  .title-buttons {
    max-width: 300px;
  }
  .title-links {
    gap: 20px;
  }
  .title-links button {
    font-size: 14px;
  }
  .title-callout,
  .title-caption {
    display: none;
  }
  .title-footer {
    font-size: 10px;
    bottom: 24px;
  }
  .title-footer > span:last-child {
    display: none;
  }
  .panel {
    padding: 25px;
    max-height: 92vh;
  }
  .panel h2 {
    font-size: 46px;
  }
  .panel > p {
    font-size: 17px;
  }
  .briefing {
    grid-template-columns: 1fr;
  }
  .briefing .diagram {
    display: none;
  }
  .settings-row {
    font-size: 17px;
    gap: 10px;
    padding: 15px 0;
  }
  .settings-row input[type="range"] {
    width: 120px;
  }
  .settings-row select {
    font-size: 15px;
    max-width: 170px;
  }
  .controls-grid {
    gap: 12px;
  }
  .control-card {
    padding: 15px;
  }
  .control-card p {
    font-size: 15px;

      mx = Number(this.keys.has('ArrowRight')) - Number(this.keys.has('ArrowLeft'));
      mz = Number(this.keys.has('ArrowDown')) - Number(this.keys.has('ArrowUp'));
      const ax = Number(this.keys.has('KeyL')) - Number(this.keys.has('KeyJ')),
        az = Number(this.keys.has('KeyK')) - Number(this.keys.has('KeyI'));
      if (ax || az) aim = Math.atan2(az, ax);
      fire = this.keys.has('Enter') || this.keys.has('ControlRight');
      trick = this.keys.has('ShiftRight');

    let pad = null;
    if (local) {
      if (this.pads.length >= 2) pad = this.pads[id];
      else if (id === 1) pad = this.pads[0];
    } else pad = this.pads[0];
    if (pad && (local || this.last === 'pad')) {
      const dead = (v) => (Math.abs(v) > 0.18 ? ((Math.abs(v) - 0.18) / 0.82) * Math.sign(v) : 0);

        pz = dead(pad.axes[1] || 0),
        ax = dead(pad.axes[2] || 0),
        az = dead(pad.axes[3] || 0);
      if (Math.hypot(px, pz) > 0.01) {
        mx = px;
        mz = pz;
      }
      if (Math.hypot(ax, az) > 0.15) aim = Math.atan2(az, ax);
      fire =
        fire ||
        !!(pad.buttons[7]?.pressed || pad.buttons[7]?.value > 0.35 || pad.buttons[5]?.pressed);

    }
    if (this.last === 'touch' && !right) {
      let touchAim = false;
      for (const t of this.touches.values()) {
        if (t.left) {
          mx = clamp((t.x - t.ox) / 55, -1, 1);
          mz = clamp((t.y - t.oy) / 55, -1, 1);
        } else {
          const p = app.view.pointer(t.x, t.y);
          aim = Math.atan2(p.z - e.z, p.x - e.x);
          fire = true;
          touchAim = true;
          if (app.game.stage.air && !Array.from(this.touches.values()).some((t) => t.left)) {
            mx = Math.cos(aim);
            mz = Math.sin(aim);
          }
        }
      }
      if (app.settings.assist && !app.game.isHidden(app.game.entities[1 - id])) {

        if (app.game.stage.bank && !touchAim) {
          const bank = app.game.bankAim(e, target);
          if (bank) {
            aim = bank.aim;
            fire = true;
          }
        }
      }
    }
    return { mx, mz, aim, fire: !!fire, trick: !!trick };
  }
}

class DuelWire {
  constructor(app) {
    this.app = app;
    this.mode = 'none';
    this.isHost = true;
    this.me = 0;
    this.ready = false;
    this.stopped = false;
    this.inputs = new Map();
    this.lastSeq = 0;
    this.lastReceive = 0;
    this.sendClock = 0;
    this.players = [
      { id: 0, name: 'RED' },
      { id: 1, name: 'GREEN' },
    ];
    this.activePlayers = new Set([0, 1]);
  }
  async initHub() {
    if (!window.AIHub?.active) return false;
    const info = await AIHub.connect({ mode: 'shared-world', seats: [2, 2] });
    if (!info) return false;
    this.mode = 'hub';
    this.isHost = info.isHost;
    this.me = info.me;
    this.server = info.server;
    this.players = info.players;
    this.host = info.host;
    this.ready = true;
    this.activePlayers = new Set(info.players.map((p) => p.id));
    this.app.mode = 'hub';
    this.app.game.start('hub');
    this.app.state = 'waiting';
    this.app.overlay = null;
    this.app.render();
    AIHub.on('start', () => {
      if (this.stopped) return;
      this.app.countdownEnd = performance.now() + Math.max(0, -AIHub.time());
      this.app.state = 'countdown';
      this.app.render();
    });
    AIHub.on('message', (data, from) => this.receive(data, from));
    AIHub.on('leave', ({ id }) => {
      this.activePlayers.delete(id);
      this.inputs.delete(id);
      this.app.toast('Rival left the field. Autopilot takes over.');
    });
    AIHub.on('time-up', () => {
      if (this.isHost) this.finishHub();
    });
    AIHub.on('end', (data) => {
      this.stopped = true;
      this.app.state = 'ended';
      this.app.overlay = null;
      this.app.sound.stop();
      this.app.input.keys.clear();
      this.app.input.pointer.down = false;
      this.app.render();
      this.endReason = data.reason;
    });
    AIHub.ready();
    return true;
  }
  receive(data, from) {
    if (this.stopped || !data || typeof data !== 'object') return;
    if (this.isHost && data.type === 'input' && this.activePlayers.has(from)) {
      const c = data.command || {};
      this.inputs.set(from, {
        mx: clamp(Number(c.mx) || 0, -1, 1),
        mz: clamp(Number(c.mz) || 0, -1, 1),
        aim: Number.isFinite(c.aim) ? c.aim : null,
        fire: !!c.fire,
        trick: !!c.trick,
        at: performance.now(),
      });
    } else if (
      !this.isHost &&
      data.type === 'world' &&
      (this.mode !== 'hub' || from === this.host)
    ) {
      if (!Number.isFinite(data.seq) || data.seq <= this.lastSeq) return;
      this.lastSeq = data.seq;
      this.lastReceive = performance.now();
      this.app.game.applySnapshot(data);
      this.app.acceptRemoteState(data);
    }
  }
  send(data) {
    if (!this.ready || this.stopped) return;
    if (this.mode === 'hub') AIHub.send(data, { reliable: false });
    else if (this.channel?.readyState === 'open') this.channel.send(JSON.stringify(data));
  }
  update(dt) {
    if (this.mode === 'none' || !this.ready || this.stopped) return;
    this.sendClock -= dt;
    if (this.sendClock > 0) return;
    this.sendClock = 1 / 12;
    if (this.isHost) {
      const s = this.app.game.snapshot(this.app.state);
      s.wait = Math.max(0, (this.app.countdownEnd - performance.now()) / 1000);
      this.send(s);
    } else if (this.app.state !== 'ended')
      this.send({
        type: 'input',
        command: this.app.isMenu()
          ? { mx: 0, mz: 0, aim: null, fire: false, trick: false }
          : this.app.input.command(this.me),
      });
  }
  commands() {
    const out = {};
    for (const e of this.app.game.entities) {
      if (e.id === this.me && !this.server)
        out[e.id] = this.app.isMenu()
          ? { mx: 0, mz: 0, aim: e.aim, fire: false, trick: false }
          : this.app.input.command(e.id);
      else {
        const c = this.inputs.get(e.id);
        if (c && performance.now() - c.at < 900) out[e.id] = c;
        else if (this.activePlayers.has(e.id))
          out[e.id] = { mx: 0, mz: 0, aim: e.aim, fire: false, trick: false };

    return out;
  }
  finishHub() {
    if (this.mode !== 'hub' || !this.isHost || this.finished || this.stopped) return;
    this.finished = true;
    const game = this.app.game;
    const scores = {};
    for (const id of this.activePlayers)
      scores[id] = game.totals[id] + (game.phase === 'playing' ? game.entities[id].score : 0);

      scores,

        sorted.map((id) => [

      throw new Error('This browser does not support direct link play.');

    this.isHost = host;
    this.me = host ? 0 : 1;
    this.host = 0;
    this.stopped = false;
    this.lastSeq = 0;
    this.activePlayers = new Set([0, 1]);

      if (['failed', 'disconnected'].includes(this.peer?.connectionState)) {
        this.app.linkStatus = 'Connection interrupted. Return here to make a new invite.';
        this.app.toast('Link interrupted. Reconnect from Versus → Link play.');
        if (this.app.state === 'playing') {
          this.app.overlay = 'link';
          this.app.render();
        }
      }
    };
    if (host)
      this.bindChannel(
        this.peer.createDataChannel('combaton', { ordered: false, maxRetransmits: 0 }),
      );
    else this.peer.ondatachannel = (e) => this.bindChannel(e.channel);
  }
  bindChannel(channel) {
    this.channel = channel;
    channel.onmessage = (e) => {
      try {
        this.receive(JSON.parse(e.data), this.isHost ? 1 : 0);
      } catch {}
    };

      this.ready = true;
      this.app.overlay = null;
      this.app.mode = 'rtc';
      if (this.isHost) this.app.start('rtc', this.app.selectedStage);
      else {
        this.app.state = 'waiting';
        this.app.render();
      }
      this.app.toast('Direct link established. Good luck, hotshot.');
    };
    channel.onclose = () => {
      this.ready = false;
    };
  }
  async iceDone() {
    if (this.peer.iceGatheringState === 'complete') return;
    await new Promise((resolve) => {
      const timer = setTimeout(done, 6500),
        peer = this.peer;
      function done() {
        clearTimeout(timer);
        peer.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
      function check() {
        if (peer.iceGatheringState === 'complete') done();
      }
      peer.addEventListener('icegatheringstatechange', check);
    });
  }
  async createOffer() {
    await this.makePeer(true);
    await this.peer.setLocalDescription(await this.peer.createOffer());
    await this.iceDone();
    return this.encode(this.peer.localDescription);
  }
  async acceptOffer(code) {
    const d = this.decode(code);
    if (d.type !== 'offer') throw new Error('Paste the host’s invite first.');
    await this.makePeer(false);
    await this.peer.setRemoteDescription(d);
    await this.peer.setLocalDescription(await this.peer.createAnswer());
    await this.iceDone();
    return this.encode(this.peer.localDescription);
  }
  async acceptAnswer(code) {
    const d = this.decode(code);
    if (!this.peer || !this.isHost || d.type !== 'answer')
      throw new Error('Create an invite, then paste your rival’s reply.');
    await this.peer.setRemoteDescription(d);
  }
  close(reset = true) {
    this.ready = false;
    this.channel?.close();
    this.peer?.close();
    this.channel = null;
    this.peer = null;
    this.inputs.clear();
    if (reset) {
      this.mode = 'none';
      this.me = 0;
      this.isHost = true;
      this.stopped = false;
    }
  }
}

class CombatonApp {
  constructor(view, sound) {
    this.view = view;
    this.sound = sound;
    this.game = new FieldGame(view, sound);
    this.state = 'title';
    this.overlay = null;
    this.returnOverlay = null;
    this.mode = 'solo';
    this.selectedStage = 0;
    this.idleSince = performance.now();
    this.countdownEnd = 0;
    this.roundEndAt = 0;
    this.attractAt = 0;
    this.accumulator = 0;
    this.manual = false;
    this.lastHud = 0;
    this.focused = null;
    this.linkStatus = 'Create an invite or paste one from a friend.';
    this.linkOutput = '';
    try {
      this.settings = {
        ...settingsDefaults,
        ...JSON.parse(localStorage.getItem('combaton-settings') || '{}'),
      };
      this.best = Number(localStorage.getItem('combaton-best')) || 0;
    } catch {
      this.settings = { ...settingsDefaults };
      this.best = 0;
    }
    this.sound.musicVolume = clamp(this.settings.music, 0, 1);
    this.sound.effectsVolume = clamp(this.settings.effects, 0, 1);
    this.game.aimGuide = this.settings.aimGuide;
    this.view.reducedMotion =
      !this.settings.shake || matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.input = new FieldInput(this);
    this.net = new DuelWire(this);
    this.game.onEvent = (e) => this.event(e);
    this.game.initStage(0, { title: true });
  }
  isNetwork() {
    return this.net.mode !== 'none' && this.net.ready;
  }
  isMenu() {
    return (
      !!this.overlay ||
      ['title', 'briefing', 'roundEnd', 'results', 'waiting', 'ended'].includes(this.state)
    );
  }
  glyph(action) {
    if (this.input.last === 'touch') {
      const touch = {
        confirm: 'Tap',
        back: '←',
        fire: 'Hold',
        trick: '↻',
        pause: 'Ⅱ',
        move: 'Drag',
        aim: 'Touch',
      };
      return `<span class="glyph">${touch[action] || action}</span>`;
    }
    const p = this.input.last === 'pad',
      x = this.settings.glyphs === 'xbox';
    const map = p
      ? {
          confirm: x ? 'A' : '×',
          back: x ? 'B' : '○',
          fire: 'RT',
          trick: x ? 'LB' : 'L1',
          pause: '☰',
          move: 'LS',
          aim: 'RS',
        }
      : {
          confirm: 'Enter',
          back: 'Esc',
          fire: 'LMB',
          trick: 'Space',
          pause: 'Esc',
          move: 'WASD',
          aim: 'Mouse',
        };
    if (p && !x && action === 'fire') map.fire = 'R2';
    return `<span class="glyph ${p && ['confirm', 'back'].includes(action) ? 'pad' : ''}">${map[action] || action}</span>`;
  }
  prompt(action, text) {
    return `<span class="prompt"><span data-prompt="${action}">${this.glyph(action)}</span><span>${text}</span></span>`;
  }
  refreshPrompts() {
    document
      .querySelectorAll('[data-prompt]')
      .forEach((el) => (el.innerHTML = this.glyph(el.dataset.prompt)));
    this.updateHud(true);
  }
  saveSettings() {
    try {
      localStorage.setItem('combaton-settings', JSON.stringify(this.settings));
    } catch {}
  }
  focus(el) {
    if (!el || el.disabled) return;
    this.focused?.classList.remove('focused');
    this.focused = el;
    el.classList.add('focused');
  }
  focusables() {
    return Array.from(
      $('#ui').querySelectorAll('button:not(:disabled),input,select,textarea'),
    ).filter((e) => e.offsetParent !== null);
  }
  navigate(direction) {
    const els = this.focusables();
    if (!els.length) return;
    let i = els.indexOf(this.focused);
    i = (i + direction + els.length) % els.length;
    this.focus(els[i]);
    els[i].scrollIntoView({ block: 'nearest' });
    this.sound.effect('ui');
  }
  adjust(dir) {
    const f = this.focused;
    if (f?.matches('input[type=range]')) {
      const step = Number(f.step) || 1;
      f.value = clamp(Number(f.value) + dir * step, Number(f.min), Number(f.max));
      this.onSlider(f);
      return;
    }
    if (f?.matches('select')) {
      f.selectedIndex = clamp(f.selectedIndex + dir, 0, f.options.length - 1);
      this.onSetting(f);
      return;
    }
    this.navigate(dir);
  }
  activate() {
    const f = this.focused || this.focusables()[0];
    if (f?.matches('button')) f.click();
    else if (f) f.focus();
  }
  toast(text) {
    const el = $('#toast');

    el.classList.add('visible');

    this.toastTimer = setTimeout(() => el.classList.remove('visible'), 3300);
  }
  event(e) {
    if (e.type === 'fire' || e.type === 'remoteFire') this.sound.effect(e.air ? 'gun' : 'fire');
    if (e.type === 'bounce') this.sound.effect('bounce');
    if (e.type === 'deny') this.sound.effect('deny');
    if (e.type === 'trick') this.sound.effect('trick');
    if (e.type === 'hit' || e.type === 'remoteHit') this.sound.effect('hit');
    if (e.type === 'hit' || e.type === 'remoteHit') this.input.rumble(0.75, 180);
    else if (
      (e.type === 'fire' || e.type === 'remoteFire') &&
      e.id === (this.net.mode === 'none' ? 0 : this.net.me)
    )
      this.input.rumble(0.14, 45);
    else if (e.type === 'trick') this.input.rumble(0.35, 120);
    if (e.type === 'roundEnd') {
      this.state = 'roundEnd';
      this.roundEndAt = performance.now();

  start(mode = 'solo', stage = 0) {
    this.mode = mode;
    this.overlay = null;
    this.input.pointer.down = false;

      this.settings[data.key] = !this.settings[data.key];
      this.applySettings();
      this.render();
    } else if (action === 'dev-toggle') {
      this.game[data.key] = !this.game[data.key];
      this.render();
    } else if (action === 'reset-tuning') {
      this.game.resetTuning();
      this.render();

      this.overlay = null;

      defaults: DEFAULTS,
      ready: true,
      versions: { three: THREE.REVISION, rapier: RAPIER.version(), backend: view.backend },
      offlineAudio: SoundDesk.offlineCheck,
    };
    const hub = await app.net.initHub();
    if (!hub) app.render();
    let before = performance.now();
    function loop(now) {
      const dt = Math.min(0.12, Math.max(0.001, (now - before) / 1000));
      before = now;
      if (!app.manual) app.frame(dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    if (window.AIHub?.active) AIHub.fail('Combaton could not initialize: ' + e.message);

      `<div class="loading"><div class="eyebrow">FIELD EQUIPMENT / INITIALIZATION</div><h2>ENGINE TROUBLE.</h2><p style="max-width:650px;text-align:center;padding:24px">${esc(e.message)}<br>Check the connection to the pinned engine dependencies, then reload.</p><button class="primary" onclick="location.reload()">TRY AGAIN ↗</button></div>`;

  }
}

"text":"For ease of deployment and sharing provide a single html file [GameTitle-SOURCE-{{model}}-{{effort}}-{{stamp}}].html. Dependencies that can be downloaded do not have to be included in the html file if that is easier.","hash":"dd8f52ae"},"techStack":{"id":"tech-v6","text":"Use Three.js R180, WEBGPU, rapier 0.19.3 for physics, Gamepad API; The rest of the tech stack is yours to choose.","hash":"84a623aa"},"artDirection":{"id":"art-cel-v2","text":"Use a stylized cel-shaded / ink look for the game.","hash":"59b07781"},"animation":{"id":"ani-engine-v2","text":"Use the engine’s native animation system as the base. Make new animations for whatever makes the game feel like the source.","hash":"25672c4c"},"audio":{"id":"aud-code-v3","text":"All music, sound effects and voices are written in code, with no audio files. Voices are Animalese/Simlish-style gibberish. Music is to be set to 10% volume by default.","hash":"0abe1411"},"online":{"id":"multi-ai-hub","text":"https://github.com/michaelcrosato/ai-hub/tree/main/lib/hub","hash":"7601bd74"},"workspace":{"id":"ws-sub-v3","text":"Create a subfolder called [GameTitle-SOURCE-{{model}}-{{effort}}-{{stamp}}] to keep all your dev files in. You can develop separate modules, then bundle into a single file [GameTitle-SOURCE-{{model}}-{{effort}}-{{stamp}}].html in root when you’re done. You may use external CDN dependencies. Do not read files outside what you need: other agents work in the folders beside this one. They share this machine’s ports and processes too. Prefer file:// and the engine’s headless tools. If you need a server (the AI Hub harness does), bind 127.0.0.1 on a port the OS picks (`python3 -m http.server 0 --bind 127.0.0.1` prints it) and confirm the page is your game before trusting a result. Stop only processes you started, by their PID: never pkill, killall, fuser -k, or kill whatever holds a port.","hash":"2dd7c02e"},"performance":{"id":"perf-max-v2","text":"Treat the performance budget as unlimited. Add as much detail, enemies, effects, lights, and shadows as the scene needs. Out of scope (handled later): FPS targets, optimization.","hash":"b911bf18"},"testing":{"id":"test-tools-v3","text":"Test as much as you like with headless tools: scripts that play the game and check its state, including a scripted playthrough of the whole game. Keep them behind one command that prints only failures and a one-line count, and rerun it only after changing the code it covers. Use screenshots only for what a script can’t check.","hash":"42631416"},"spend":{"id":"spend-free","text":"Spend effort however you see fit.","hash":"9511cae8"},"premise":{"id":"prem-inspired","text":"Build an original game inspired by the source.","hash":"cc0f429b"},"scope":{"id":"scope-inspired","text":"Create a feature-complete demo. Capture what makes the source distinctive (its world, characters, themes and tone) and turn it into the mechanics, pacing and UX of a great game. The demo must be long enough to show ALL features and gameplay mechanics so a player can clearly understand how the game plays and feels, and what they can and cannot do. Treat the demo as a complete, polished vertical slice. It should contain all the infrastructure, systems, and polish needed so the remainder of the game could later be built out with normal designer tools.\n\nInclude a dev mode, reachable from the pause menu, with the standard tools for testing the game quickly. Balance is key, so expose the most important gameplay variables as live sliders, with a reset to defaults.","hash":"46b0fba2"},"attractMode":{"id":"attr-10s","text":"After 10 seconds without input on the title/menu screen, start a looping AI-played demo or scripted replay (arcade/kiosk style); any input exits it. The AI (or replay) can be simple and may cheat freely (infinite health, ammo, abilities, no clip, etc). Its only job is to show as much of the demo as possible, the attract mode is not meant to balance the game.","hash":"0d642414"},"multiplayer":{"id":"mp-hub","text":"Follow https://github.com/michaelcrosato/ai-hub/tree/main/lib/hub for multiplayer integration into ai-hub as well as for the game on its own.","hash":"b62eb499"},"tone":{"id":"tone-src-v2","text":"Use a writing style similar to the source’s.","hash":"3bfc327e"},"uiux":{"id":"ui-10ft-v4","text":"10-Foot Controller-First Philosophy\nDesign the game around a PS5 DualSense (or any pad the browser reports in its standard mapping) played on a TV at 10 feet. With keyboard and mouse it's the same game on the same screens, not a separate desktop layout, but they should feel native, not like stand-ins for controller buttons. The keyboard uses the keys PC players expect for the genre. The mouse aims, looks, and clicks menu items and things in the world (hover moves the focus) wherever the genre uses it. On-screen prompts follow the input used last: PlayStation glyphs for the controller (with a Settings option to show Xbox glyphs, A B X Y, instead), keys and mouse buttons for keyboard and mouse.\n\nDo not use overly dense, web-style data screens.\n\nTouch-only devices: to keep the screen clear bare minimum or no UI (other than a menu button), invisible thumb sticks, multitouch, automate/assist with everything you need to accommodate the challenges of mobile/touch controls, use contact sensitive pop action and button on screen while possible","hash":"f4edc796"},"done":{"id":"done-full","text":"No TODOs, placeholders, or stubbed features. The demo is complete.","hash":"cb3a46b6"},"sourceInfo":{"id":"info-exit-v3","text":"CRITICAL: Put Source Information, Testing Feedback, Engine Feedback and Prompt Feedback in your chat reply and an in-game About/Credits screen. Write \"unknown\" for anything you can't confirm.\n- Date: {{date}}\n- Source: the work it's based on\n- Plan: the file name of the plan you were given to build from, or none\n- Genre and Perspective: genre and camera perspective used\n- Tech: stack, libraries/engines, with versions if applicable\n- Art Direction: style used\n- Animation: system used\n- Audio: music, sound effects and voice used\n- Online: network features used, or none\n- Testing: testing parameters allowed\n- Research: research done, or none\n- Environment: {{environment}}\n- Model: {{lab}}, {{model}}, reasoning effort {{effort}}\n- Usage: write \"added on import\". You can't see your own cost, so don't estimate it: the runner records the real cost, tokens and time, and the agent that imports the game into AI Hub puts them on your About/Credits screen.\n\nExit interview: before you finish, also save these answers as exit-interview.json in this folder's root, beside the game's .html: one JSON object in exactly the shape below, every value filled in (\"unknown\" for anything you can't confirm). Tools read it (the game's run record and the AI Hub catalogue), so write plain text, and check that the file parses as JSON.\n{\n  \"sourceInformation\": {\"date\": \"\", \"source\": \"\", \"plan\": \"\", \"genre\": \"\", \"perspective\": \"\", \"tech\": \"\", \"artDirection\": \"\", \"animation\": \"\", \"audio\": \"\", \"online\": \"\", \"testing\": \"\", \"research\": \"\", \"environment\": \"\", \"model\": \"\", \"usage\": \"added on import\"},\n  \"testingFeedback\": [\"your answer to each Testing Feedback question, in order\"],\n  \"engineFeedback\": [\"your answer to each Engine Feedback question, in order\"],\n  \"promptFeedback\": [\"your answer to each Prompt Feedback question, in order\"],\n  \"aiHub\": {\n    \"name\": \"the game's title, as on its title screen\",\n    \"tagline\": \"a few words to go under the title\",\n    \"description\": \"one or two sentences for the catalogue\",\n    \"type\": \"Game, Tech demo or Tool\",\n    \"genre\": \"one of Action, Adventure, Fighting, Flight, Horror, Kids & Learning, Life Sim, Platformer, Puzzle, Racing, RPG, Shooter, Simulation, Sports, Stealth, Strategy\",\n    \"source\": \"the work it's based on, e.g. Moby-Dick\",\n    \"series\": \"its franchise, e.g. Star Fox, or empty\",\n    \"players\": \"how many can play: 1, 1–2 or 1–4\",\n    \"controls\": \"the controls, in one line\",\n    \"tags\": [\"3 to 6 lowercase tags, e.g. 2d, 3d, arcade, story, co-op, versus, first-person, third-person, top-down, side-scrolling, pixel art, low-poly, retro, sci-fi, fantasy, comedy, vehicles, boss fights, exploration\"]\n  }\n}\nThe catalogue's model, effort, CLI, date and usage come from the run's record after you finish, so they aren't asked here.","hash":"8fe63a44"},"testingFeedback":{"id":"tf-4q","text":"- How many issues did testing catch?\n- How many would be considered critical issues / game breaking?\n- What was the most helpful test you ran?\n- What was the least helpful test you ran?","hash":"95f71baf"},"engineFeedback":{"id":"ef-6q-v2","text":"- What did you like most about the engine?\n- Did you get stuck or guess wrong?\n- What was the most important thing you had to build yourself?\n- What was the hardest part about using the engine?\n- What did you change in the engine, and why? (none if nothing)\n- If you could change one thing about the engine, what would it be?","hash":"25041b09"},"promptFeedback":{"id":"pf-4q-v2","text":"- What did you like most about this prompt?\n- What was confusing?\n- What was the hardest thing to do?\n- What would you change in this prompt?","hash":"7ce5dc6e"},"goal":{"id":"on-exit-v2","text":"the bundled single .html file exists in this folder's root, every feature in TASK.md that can be done on this computer is implemented with no TODOs, placeholders or stubs, exit-interview.json in this folder's root parses as JSON and answers every field, and your final reply contains the Source Information, Testing Feedback, Engine Feedback and Prompt Feedback sections.","hash":"7559d614"}}},"interview":{"file":"exit-interview.json","answers":{"sourceInformation":{"date":"2026-11-05 19:13:21","source":"Combat (Atari, 1977)","plan":"none","genre":"Arcade vehicle shooter; competitive arena duels","perspective":"Orthographic top-down tanks and jets; orthographic side-view biplanes","tech":"Three.js r180 (0.180.0), WebGPURenderer and TSL; Rapier 3D 0.19.3; Gamepad API; Web Audio; WebRTC; AI Hub Session Protocol v1 client 1.4.0; HTML/CSS/JavaScript","artDirection":"Stylized cel shading, ink outlines, warm printed field-manual graphics and procedural 3D toy dioramas","animation":"Native Three.js AnimationMixer and AnimationClip keyframe tracks for recoil, suspension, antenna sway, propellers, barrel rolls and jet flames","audio":"Code-generated swing march at 10% music volume by default; synthesized engines, weapons, ricochets and explosions; formant-filtered gibberish voices; no audio files","online":"Host-authoritative shared-world AI Hub sessions for 2 players; standalone direct WebRTC invite/reply duels; same-screen 2-player versus","testing":"Headless Chromium WebGPU state and geometry submission; WebGL visual captures; WebKit touch-profile gameplay; complete scripted five-round playthrough; virtual standard gamepad; touch input; OfflineAudioContext signal analysis; two-page WebRTC movement and scoring; two-seat AI Hub harness standard/server/host-leave scenarios at 150 ms latency, 50 ms jitter and 5% loss. Full suite: 37/37 checks passed. Physical controller, listening quality, real TV and real iOS behavior: unknown.","research":"Atari Combat page and original 1977 manual transcription for mechanics, playfields, vehicles, presentation and tone; published source-sound descriptions; official Three.js/Rapier documentation; AI Hub Session Protocol v1, upstream client and harness. Original audio listening: unknown.","environment":"Codex CLI (headless); Linux (Ubuntu 26.04 on WSL2)","model":"OpenAI, gpt-6.1-sol, reasoning effort max","usage":"added on import"},"testingFeedback":[{"question":"How many issues did testing catch?","answer":"Testing and visual review caught eight issues: jet AI stalemates, a texture-binding error during field changes, phone HUD/title layout overlaps, hidden map lettering, missing remote winner/statistics, an inaccurate direct-shell sight, overlapping attract-mode labels, and keyboard labels on touch prompts. All were fixed."},{"question":"How many would be considered critical issues / game breaking?","answer":"Two were critical: field changes could break the WebGL compatibility renderer, and jet AI duels could stall without scoring. No known critical issue remains after the final checks."},{"question":"What was the most helpful test you ran?","answer":"The complete five-round AI playthrough was most helpful: it exposed a 0–0 jet stalemate. The final run completed every field with 41 total hits. The full suite passed 37/37 checks, including three AI Hub harness scenarios, virtual gamepad, touch, WebKit, WebRTC scoring and offline audio."},{"question":"What was the least helpful test you ran?","answer":"Software-headless WebGPU screenshots and pixel readback were least helpful: the canvas could be blank and GPUBuffer mapping failed. WebGPU renderer/game-state checks and WebGL visual captures provided usable evidence."}],"engineFeedback":[{"question":"What did you like most about the engine?","answer":"Three.js combines direct procedural geometry, composable TSL shading and native animation with a WebGPU renderer that also supports WebGL 2 compatibility."},{"question":"Did you get stuck or guess wrong?","answer":"Aircraft contacts and symmetric steering initially produced a non-scoring jet duel. Sensor hulls, wrap-aware targeting and varied throttle resolved it. Explicit TSL texture nodes and resource cleanup fixed a field-change texture-binding error in the WebGL backend."},{"question":"What was the most important thing you had to build yourself?","answer":"The complete arena rules, AI navigation and bank-shot planning, controller-first menus, procedural audio and shared-world replication."},{"question":"What was the hardest part about using the engine?","answer":"Managing renderer-owned procedural textures and materials during arena swaps, while keeping physics, animation and network state coherent."},{"question":"What did you change in the engine, and why? (none if nothing)","answer":"none"},{"question":"If you could change one thing about the engine, what would it be?","answer":"A built-in small-game input and deterministic multiplayer toolkit would reduce the amount of infrastructure each game must write."}],"promptFeedback":[{"question":"What did you like most about this prompt?","answer":"The distinctive source, procedural audio and ten-foot controller requirements give the game a strong creative direction."},{"question":"What was confusing?","answer":"The boundary between a complete vertical slice and the original cartridge's 27 variants was unspecified; I chose five rounds that cover the main mechanics."},{"question":"What was the hardest thing to do?","answer":"Making standalone and AI Hub multiplayer, touch assistance and several vehicle modes share the same complete interface."},{"question":"What would you change in this prompt?","answer":"Specify a preferred standalone signalling method and a target demo duration."}],"aiHub":{"name":"Combaton","tagline":"Pass the blast.","description":"Out-fox your rival in five ink-and-paper vehicle duels. Bend tank shells, bank impossible shots, disappear, then take the fight into cloud cover with biplanes and jet formations.","type":"Game","genre":"Shooter","source":"Combat (1977)","series":"","players":"1–2","controls":"Left stick/WASD move; right stick/mouse aim; R2/left click fire and guide; L1/Cross/Space trick; Options/Esc pause.","tags":["3d","arcade","versus","top-down","vehicles","retro"]}},"reply":"[**Play Combaton — single HTML**](~/dev/cc-matrix/runs/gpt-6.1-sol-max__20261105-191321__x19207f/work/Combaton-Combat-1977-gpt-6.1-sol-max-20261105-191321.html)\n\nFive fields, solo rivals, local/WebRTC/AI Hub multiplayer, attract mode, and live developer tools. **37/37 checks passed**, followed by passing final visual and package checks.\n\n[Development files and instructions](~/dev/cc-matrix/runs/gpt-6.1-sol-max__20261105-191321__x19207f/work/Combaton-Combat-1977-gpt-6.1-sol-max-20261105-191321/README.md) · [exit-interview.json](~/dev/cc-matrix/runs/gpt-6.1-sol-max__20261105-191321__x19207f/work/exit-interview.json)\n\n**Source Information:** Date: 2026-11-05 19:13:21. Source: [Combat, Atari, 1977](https://atari.com/pages/combat). Plan: none. Genre: arcade vehicle shooter. Perspective: orthographic top-down tanks/jets and side-view biplanes.\n\nTech: Three.js r180, WebGPU with WebGL 2 compatibility, Rapier 0.19.3, Gamepad API, Web Audio, WebRTC, and AI Hub protocol v1. Art: procedural cel shading and ink outlines. Animation: native AnimationMixer clips. Audio: synthesized music, effects, and gibberish voices; music defaults to 10%.\n\nOnline: two-player shared worlds through [AI Hub](https://github.com/michaelcrosato/ai-hub/tree/main/lib/hub), plus direct WebRTC. Research covered manuals, presentation, sound descriptions, and official technical documentation. Testing used headless browsers, a full playthrough, virtual controllers, touch profiles, offline audio, and networking harnesses. Physical controller, listening quality, real TV/iOS behavior, and restrictive-network connectivity: unknown.\n\nEnvironment: Codex CLI, headless Linux. Model: OpenAI gpt-6.1-sol, reasoning effort max. Usage: **added on import**.\n\n**Testing Feedback:** Eight issues were found and fixed; two were critical. The full five-round playthrough was most helpful, exposing a non-scoring jet stalemate. Software-headless WebGPU capture/readback was least helpful; state checks and WebGL captures supplied usable evidence.\n\n**Engine Feedback:** Procedural geometry, TSL, and native animation worked well. Aircraft contacts and texture lifecycles required corrections. I built the rules, AI, input, audio, and replication systems. Resource cleanup during field changes was hardest. Engine changes: none. An integrated input/multiplayer toolkit would help.\n\n**Prompt Feedback:** The source and controller/audio constraints gave clear creative direction. The boundary between a vertical slice and all 27 original variants was unclear. Unifying vehicle modes, touch, and both multiplayer paths was hardest. I would specify standalone signalling and target demo duration.\n\nAll required information and feedback are also included in **About / Credits**."}}</script>
