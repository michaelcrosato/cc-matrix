<!doctype html><meta charset="utf-8"><title>Pressure Buns network test</title>
<script type="module">
import {createNetwork} from './network.js';
window.messages=[];window.inputs=[];window.joins=[];window.events=[];window.snapshot={test:12};
window.net=createNetwork({onInput:(input,seat)=>inputs.push({input,seat}),onState:s=>messages.push(s),onJoin:j=>joins.push(j),onEvent:(name,data)=>events.push({name,data}),getState:()=>snapshot});
setInterval(()=>net.update(.02),20);window.testReady=true;
</script>
