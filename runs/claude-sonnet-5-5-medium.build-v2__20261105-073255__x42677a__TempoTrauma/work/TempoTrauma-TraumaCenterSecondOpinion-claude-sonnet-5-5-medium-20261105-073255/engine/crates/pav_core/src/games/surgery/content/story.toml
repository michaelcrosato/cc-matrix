# Story scenes. Each [[scene]] has a set (backdrop), optional music, and [[scene.line]]s.
# who: mara, pet, bashir, teddy, voss, vane, narrator.  expr: neutral, alarmed, stern, soft.

[[scene]]
id = "s0"
set = "corridor"
music = "tender"
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "Mercy Harbor General. Port Verity. It is raining, as it has rained every night since the Vane Wing opened."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "The attending is elbow-deep in a bus driver, Doctor. This one is yours."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "Mine? Alone? I have only been a resident for fourteen months."
[[scene.line]]
who = "bashir"
expr = "soft"
text = "Anton Deverell, net-mender. Hooks and cable splinters, left forearm. I will be at your elbow the whole time."
[[scene.line]]
who = "mara"
expr = "neutral"
text = "My father tuned pianos. He told me a good hand listens before it moves."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "Then listen, Doctor. Scrub in."
[[scene.line]]
who = "mara"
expr = "soft"
text = "Anton Deverell mends nets. I have never mended anything bigger than a hem."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "A net is only a wound that has learned to hold water, Doctor. Go."

[[scene]]
id = "s0b"
set = "scrub"
music = "tender"
[[scene.line]]
who = "bashir"
expr = "soft"
text = "Your hands were steady."
[[scene.line]]
who = "mara"
expr = "soft"
text = "They were not. I was counting his heartbeats."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "That is the same thing, Doctor. In my experience."
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "The rain keeps its own time against the glass. Somewhere below, a monitor answers it, beat for beat."

[[scene]]
id = "s1"
set = "gallery"
music = "tense"
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "Rosalind Pike. Harbour pilot. Appendix. It is the most routine operation in the history of operations. So why is the Chief in the gallery?"
[[scene.line]]
who = "voss"
expr = "stern"
text = "In my hospital, adequate is a kind of malpractice, Doctor Quill."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "Yes, Chief."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "Scalpel, Doctor. Ignore the glass."
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "I will be on the machines. If anything beeps in a way I do not like, I will say so loudly and with several swear words."
[[scene.line]]
who = "mara"
expr = "neutral"
text = "Please say them quietly."

[[scene]]
id = "s1b"
set = "scrub"
music = "tense"
[[scene.line]]
who = "voss"
expr = "stern"
text = "An artery let go as you closed. You found it, and you tied it. Adequate."
[[scene.line]]
who = "mara"
expr = "soft"
text = "Thank you, Chief."
[[scene.line]]
who = "voss"
expr = "neutral"
text = "It was not a compliment."
[[scene.line]]
who = "bashir"
expr = "soft"
text = "For what it is worth, Doctor, I would not have found the artery that fast."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "Do not tell me that. I will start to believe it."

[[scene]]
id = "s2"
set = "corridor"
music = "tense"
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "A grain terminal burns across the harbour. By midnight the corridors are triage."
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "Gunnar Holt. Foreman. Fifty-two. Shrapnel in the chest, and I am panicking. I would like that noted."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "Noted, Doctor Lark. Doctor Quill. Open him."
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "The corridor smells of smoke and wet wool. Stretchers line the walls like pews."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "There are too many of them."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "There is always one at a time, Doctor. Open him."

[[scene]]
id = "s2b"
set = "scrub"
music = "tender"
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "You said now. Half a beat before the monitor flatlined."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "I heard it go flat. The string was already slack."
[[scene.line]]
who = "bashir"
expr = "soft"
text = "I will not ask what that means. I will only say that I noticed."
[[scene.line]]
who = "teddy"
expr = "soft"
text = "I stopped panicking at minute forty. Did anybody notice? I would like that noted too."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "Noted, Doctor Lark. Twice."

[[scene]]
id = "s3"
set = "atrium"
music = "tender"
[[scene.line]]
who = "vane"
expr = "soft"
text = "Doctor Quill! The Vane Wing is only possible because of nights like this. Please. Take a glass. The rain is lovely from up here."
[[scene.line]]
who = "mara"
expr = "neutral"
text = "I am due in theatre, Miss Vane."
[[scene.line]]
who = "vane"
expr = "soft"
text = "Of course. Go. Save someone. It is what I pay you for."
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "Downstairs a courier waits for a liver mass that every scan swears is benign."
[[scene.line]]
who = "vane"
expr = "soft"
text = "Do you hear the quartet? I commissioned it for the Wing. A little Mozart for the sick. Medicine is half music, Doctor."
[[scene.line]]
who = "mara"
expr = "neutral"
text = "My father said the same about pianos."
[[scene.line]]
who = "vane"
expr = "soft"
text = "Then he was a wise man. Tell him I said so."

[[scene]]
id = "s3b"
set = "theatre"
music = "crisis"
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "It moved."
[[scene.line]]
who = "bashir"
expr = "alarmed"
text = "Masses do not move."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "Bashir. It moved."
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "Guys? The ECG just went into three-four time. That is a waltz. Hearts are not allowed to waltz."
[[scene.line]]
who = "voss"
expr = "stern"
text = "You will wash your hands. You will sign nothing. And you will tell no one what you did not see in this room."
[[scene.line]]
who = "bashir"
expr = "alarmed"
text = "Doctor Quill. Sit down. You are shaking."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "Three-four time, Bashir. Inside a living man. Somebody wrote that."
[[scene.line]]
who = "voss"
expr = "stern"
text = "Nobody wrote anything. Go home. Come back at midnight, by the hidden lift, and tell nobody."

[[scene]]
id = "s4"
set = "nightward"
music = "crisis"
[[scene.line]]
who = "voss"
expr = "stern"
text = "We call it Requiem. Recombinant Enzymatic Quiescent Immuno-Evasive Microfilaria. It is the only organism ever designed to keep time."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "Keep time for what?"
[[scene.line]]
who = "voss"
expr = "stern"
text = "For the end of you, Doctor."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "Rosalind Pike is on the table again, Doctor. It was in her all along. Seeded while she slept."
[[scene.line]]
who = "voss"
expr = "stern"
text = "There is no guidance in this room. You will do this alone."
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "There is a lift behind the morgue. There is an actual lift behind the morgue."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "There are several things behind the morgue, Doctor Lark. This is merely the first you have been introduced to."

[[scene]]
id = "s4b"
set = "nightward"
music = "tender"
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "My hands. They will not open."
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "She is down! Mara is down! Somebody catch the surgeon!"
[[scene.line]]
who = "voss"
expr = "stern"
text = "Then we need a second opinion."
[[scene.line]]
who = "bashir"
expr = "soft"
text = "Rest, Doctor. You did what one pair of hands can do."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "It was not enough. It was only one beat of enough."
[[scene.line]]
who = "teddy"
expr = "soft"
text = "Somebody get her tea. Not the machine tea. Real tea."

[[scene]]
id = "s5"
set = "depot"
music = "tender"
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "A bus depot at three in the morning. A vending machine hums. Beside it, an old woman holds a paper cup of the worst tea in Port Verity."
[[scene.line]]
who = "pet"
expr = "stern"
text = "Chief Voss. You look terrible. And you have brought me a child."
[[scene.line]]
who = "voss"
expr = "stern"
text = "A longshoreman. A shattered femur. A thing in the marrow. And you, Perpetua, who retired."
[[scene.line]]
who = "pet"
expr = "stern"
text = "I have buried better surgeons than you, and I liked them less. Scalpel."
[[scene.line]]
who = "pet"
expr = "stern"
text = "I retired to stop being called at three in the morning. Look at the clock, Ottoline."
[[scene.line]]
who = "voss"
expr = "stern"
text = "It says three in the morning. I apologise to the clock."
[[scene.line]]
who = "pet"
expr = "soft"
text = "Show me the man. And do not tell me he is important. They are all important at three."

[[scene]]
id = "s5b"
set = "scrub"
music = "tense"
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "Doctor Nwosu... there were two of you."
[[scene.line]]
who = "pet"
expr = "soft"
text = "There were always two of me, young man. One of them retired."
[[scene.line]]
who = "voss"
expr = "stern"
text = "Perpetua. I must tell you something about the strain. Where it came f..."
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "Chief Ottoline Voss goes down mid-sentence, as a tree goes down, all at once."
[[scene.line]]
who = "pet"
expr = "stern"
text = "Everyone out. Doctor Lark, you will hold her up. The child sits down and she breathes."
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "Yes, Doctor Nwosu. Right away, Doctor Nwosu. Please do not look at me like that."

[[scene]]
id = "s6"
set = "theatre"
music = "crisis"
[[scene.line]]
who = "voss"
expr = "stern"
text = "I have carried it for eleven years. I helped build it, when Cordelia Vane paid for my laboratory."
[[scene.line]]
who = "pet"
expr = "stern"
text = "Eleven years, and you never once thought to mention it."
[[scene.line]]
who = "voss"
expr = "soft"
text = "If I die on your table, Perpetua, you will have to fill out the form."
[[scene.line]]
who = "pet"
expr = "soft"
text = "I have been looking forward to it."
[[scene.line]]
who = "pet"
expr = "soft"
text = "Eleven years. I held your hand through three of your divorces, Ottoline."
[[scene.line]]
who = "voss"
expr = "stern"
text = "You held my coat. It is not the same."
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "The monitor over the table begins, very quietly, to count in five."

[[scene]]
id = "s6b"
set = "recovery"
music = "tender"
[[scene.line]]
who = "voss"
expr = "soft"
text = "Vane. Cordelia Vane. She was the funder."
[[scene.line]]
who = "pet"
expr = "stern"
text = "Say it again, Ottoline, for the record."
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "Upstairs, the Vane Foundation sends flowers to every member of the operating staff. Lilies, white, a card in a lovely hand."
[[scene.line]]
who = "pet"
expr = "stern"
text = "The Foundation sent lilies. Lilies, in a hospital. I have seen subtler warnings in a mafia film."
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "Should somebody tell the staff not to smell them?"
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "Nobody does. It is the kindest, most terrible bouquet in Port Verity."

[[scene]]
id = "s7"
set = "theatre"
music = "crisis"
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "Bashir collapsed. The flowers. He smelled the flowers, and he just..."
[[scene.line]]
who = "pet"
expr = "stern"
text = "The voice that has guided you all night is on the table, child. Wake up."
[[scene.line]]
who = "mara"
expr = "alarmed"
text = "I am awake. Scrub me in. Scalpel."
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "Nobody hands it to her. Then Teddy does, shaking."
[[scene.line]]
who = "teddy"
expr = "alarmed"
text = "...I will do it. I have seen it done. Mostly."
[[scene.line]]
who = "pet"
expr = "stern"
text = "Child. Listen to me. He taught you to count, and you will count for him."
[[scene.line]]
who = "mara"
expr = "soft"
text = "One. Two. Three. And the fourth beat is mine."

[[scene]]
id = "s7b"
set = "recovery"
music = "tender"
[[scene.line]]
who = "bashir"
expr = "soft"
text = "Clean, Doctor."
[[scene.line]]
who = "mara"
expr = "soft"
text = "Clean, Bashir."
[[scene.line]]
who = "pet"
expr = "soft"
text = "Sit down, child. You are not tall enough to cry standing."
[[scene.line]]
who = "teddy"
expr = "soft"
text = "He is awake. He is awake and he is already correcting my grammar."
[[scene.line]]
who = "bashir"
expr = "neutral"
text = "Doctor Lark. It was \"I will do it.\" Not \"I did it, mostly.\""
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "Outside, the rain stops for the first time since the Wing opened. Nobody in the building quite dares to say so."

[[scene]]
id = "epilogue"
set = "cabin"
music = "crisis"
[[scene.line]]
who = "vane"
expr = "soft"
text = "A promising first movement. Have them tune the orchestra."
[[scene.line]]
who = "narrator"
expr = "neutral"
text = "On a ship a long way out in the rain, a very kind woman puts down the phone and listens to the sea keep time."
[[scene.line]]
who = "vane"
expr = "soft"
text = "They have found my little song, have they not. How lovely. They are going to be so wonderful at the next one."
