# Cases for Tempo Trauma. One [[case]] per operation; [[case.phase]] lists what is on the field.
# spawn strings: "<kind> x z [x2 z2 | r | angle | lvl] [flags]". Kinds are documented in README.md.
# Field: x in -9..9, z in -4..4.2 is playable. `say` lines: "seconds|speaker|text".

[[case]]
id = 0
name = "Barbs"
surgeon = "mara"
plate = "forearm"
timer = 240
par = 6700
patient = "Anton Deverell"
dx = "Fish hooks and cable splinters, left forearm"
fate = "Anton Deverell will mend nets again by spring."
guided = true
ring = [1, 2, 3, 4, 0, 6, 0, 0]

[[case.phase]]
name = "Clear the blood"
now = "SUCTION the pool"
say = ["0.4|bashir|Your first one, Doctor. Take the suction. Hold it over the blood.", "3.0|bashir|Harder pressure, faster flow. Keep the field clear."]
spawn = ["pool -2 0 1.1", "pool 3 1 0.8"]

[[case.phase]]
name = "Remove the barbs"
now = "FORCEPS: pull each barb out along its length"
say = ["0.4|bashir|Forceps, Doctor. Grip the barb. Pull the way it points.", "4.0|bashir|Clean. Again."]
spawn = ["hook -4 -1 20", "hook 1 2.2 -30", "hook -2 0 80 covered"]
checkpoint = true

[[case.phase]]
name = "One more"
now = "FORCEPS: the barb under the blood"
say = ["0.2|mara|There is another one. Under the pool. I felt it.", "2.0|bashir|Then you have good hands. Suction first, Doctor."]
spawn = ["pool -2 0 1.0", "hook -2 0 -60 covered"]

[[case.phase]]
name = "Close the wounds"
now = "SUTURE: zigzag across the wound"
say = ["0.4|bashir|Suture. Cross the wound, side to side. Even stitches.", "8.0|bashir|Doctor, that's healthy tissue. Even spacing."]
spawn = ["lace -4 -1 0 1", "lace 1 2.5 5 2.5"]
checkpoint = true

[[case.phase]]
name = "Burns and dressing"
now = "GEL the inflammation, then DRESS the arm"
say = ["0.4|bashir|Gel on the inflamed tissue. Paint it until the ring fills.", "6.0|bashir|Last. The dressing, Doctor. Draw it along the closure."]
spawn = ["burn 2 -1 1.2", "dress -5 3.4 5 3.4"]

