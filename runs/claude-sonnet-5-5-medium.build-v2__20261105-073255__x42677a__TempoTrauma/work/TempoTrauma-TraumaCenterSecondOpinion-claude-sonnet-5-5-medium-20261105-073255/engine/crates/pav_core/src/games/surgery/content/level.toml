# The stage Tempo Trauma sits on: a small off-screen set (the operating-theatre wide shot).
# The operative field itself is drawn by the surgery view from SurgeryFrame.
name = "Operating theatre"
about = "Tempo Trauma's stage."
entrance = { at = [2, 4], facing = "south" }

[camera]
tilt = 73.0
distance = 19.9

[layout]
origin = [90.0, 0.0, -8.0]

[[layout.layer]]
y = 0
map = '''
########
#......#
#......#
#..P...#
########
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3b4a5c" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3b4a5c" }, { y0 = 0, y1 = 2.5, color = "#2a4a4a" }]

[layout.legend.'P']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3b4a5c" }]
marker = "player"
