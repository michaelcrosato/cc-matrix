<!doctype html>
<html><head><meta charset="utf-8"><title>spike</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head>
<body><canvas id="screen"></canvas>
<script src="../engine/my-3d2dge.js"></script>
<script src="../src/00-core.js"></script>
<script src="../src/10-view3d.js"></script>
<script>
(() => {
const E = My3D2dge, WP = globalThis.WP;
const game = new E.Game({ canvas: 'screen', res: [480, 270] });
const m7 = new E.Mode7({ floor: () => [0, 0, 0], size: [2, 2], sky: new E.Backdrop({ sky: ['#1d1a3a', '#7a3f6e', '#e88a6a', '#f6c48c'], sun: { x: .7, y: .62, r: 18, color: '#ffd6a0' }, layers: [{ kind: 'mountains', color: '#5a3a5e', y: .58, height: .12, parallax: .1 }, { kind: 'sea', color: '#8a5a7a', y: .66 }] }), fog: { color: '#e0a07c', near: 320, far: 1600 } });
// own floor: per pixel
const grass = new Uint32Array(256 * 256);
for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) { const c = E.tex.grass(x, y, {}); grass[y * 256 + x] = (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0]; }
let img = null, buf = null;
m7.drawFloor = function (g, vp) {
  const P = this._P, top = Math.max(vp.y, Math.ceil(P.cy - P.f * P.sp / P.cp)), bot = vp.y + vp.h; if (bot <= top) return;
  const w = vp.w, h = bot - top;
  if (!buf || buf.width !== w || buf.height !== h) { buf = E.mkCanvas(w, h); img = buf.getContext('2d').createImageData(w, h); }
  const out = new Uint32Array(img.data.buffer);
  for (let row = 0; row < h; row++) {
    const D = this.rowDepth(top + row + .5); if (!D) continue;
    const s = (D * P.cp + P.h * P.sp) / P.f, l0 = (vp.x + .5 - P.cx) * s, ux = P.rx * s, uy = P.ry * s, base = row * w;
    let wx = P.x + P.fx * D + P.rx * l0, wy = P.y + P.fy * D + P.ry * l0;
    const dep = WP.Y0 - wy;
    for (let i = 0; i < w; i++, wx += ux, wy += uy) {
      const tx = wx & 255, ty = wy & 255; let c = grass[ty * 256 + tx];
      const dd = WP.Y0 - wy; if (dd > 70 && dd < 110) c = 0xff3a5a7a;
      out[base + i] = c;
    }
  }
  buf.getContext('2d').putImageData(img, 0, 0); g.drawImage(buf, vp.x, top);
  const fog = this.o.fog, fc = E.hex(fog.color), n = fog.near, far = fog.far;
  for (let by = top; by < bot; by++) { const D = this.rowDepth(by + .5), a = D ? clamp((D - n) / (far - n), 0, 1) : 1; if (a > .01) { g.fillStyle = `rgba(${fc[0]},${fc[1]},${fc[2]},${a.toFixed(3)})`; g.fillRect(vp.x, by, vp.w, 1); } }
};
const clamp = E.clamp;
const rigs = [60, 120, 200, 400, 600, 900].map((d, i) => ({ d, rig: new E.Humanoid({ size: 1.3, weapon: 'gun', hat: 'cap', outfit: 'shirt', colors: { cloth: '#b89a62', pants: '#8a7048', hat: '#7a6038' } }), x: 100 + i * 50 }));
const cam = { x: 200, y: WP.Y0, h: 28, angle: -Math.PI / 2, pitch: 6, fov: 60 };
const res = {};
game.debug = { snapshot: () => res };
game.start({ update(dt) { cam.x += dt * 16; for (const r of rigs) r.rig.update(dt, { x: r.x, y: WP.Y0 - r.d, z: 0, facing: Math.PI / 2, point: true }); },
  draw(r) {
    m7.cam = cam;
    for (const q of rigs) m7.rig(q.rig, cam.x - 150 + rigs.indexOf(q) * 60, WP.Y0 - q.d, 0);
    m7.shape('barrel', cam.x + 60, WP.Y0 - 80, 0);
    m7.shape('tree', cam.x + 120, WP.Y0 - 300, 0);
    m7.draw(r);
    r.overlay(g => {
      // calibrate: draw a rig at view scale 1 to an offscreen canvas and measure
      if (!res.done) {
        const c = E.mkCanvas(200, 200), cg = E.ctx2d(c);
        const presets = { r13: { size: 1.3, weapon: 'gun', hat: 'cap' }, b155: { size: 1.55, build: 'bulky', weapon: 'gun' }, h135: { size: 1.35, hat: 'cap', outfit: 'coat' } };
        for (const k in presets) {
          const rig = new E.Humanoid(presets[k]); for (const pose of [null, 'kneel', 'crouch']) {
            rig.update(1, { x: 0, y: 0, z: 0, facing: Math.PI / 2, pose: pose || undefined }); for (let i = 0; i < 60; i++) rig.update(1 / 60, { x: 0, y: 0, z: 0, facing: Math.PI / 2, pose: pose || undefined });
            cg.clearRect(0, 0, 200, 200); rig.draw(cg, 100, 150, m7.view(1));
            const d = cg.getImageData(0, 0, 200, 200).data; let x0 = 999, x1 = -1, y0 = 999, y1 = -1;
            for (let y = 0; y < 200; y++) for (let x = 0; x < 200; x++) if (d[(y * 200 + x) * 4 + 3] > 0) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
            res[k + ':' + (pose || 'stand')] = { top: 150 - y0, bot: y1 - 150, w: x1 - x0 + 1, l: 100 - x0, rr: x1 - 100 };
          }
        }
        res.done = true;
      }
    });
  } });
})();
</script></body></html>
