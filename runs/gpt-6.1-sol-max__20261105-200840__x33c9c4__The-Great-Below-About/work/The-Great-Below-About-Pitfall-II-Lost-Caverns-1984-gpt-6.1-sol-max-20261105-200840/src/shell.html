<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- HUB_CLIENT -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12383f">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="1-4">
<meta name="hub:session-mode" content="ghost">
<meta name="hub:session-goal" content="Find Pip, Marmalade the fox, and the Sunseed Prism. Collect gold and avoid stumbles for the highest expedition score.">
<meta name="hub:session-howto" content="Left stick or WASD: move, climb, swim, steer. Cross / Space: jump and catch balloons. Square / E: let go. Triangle / M: map. Options / Esc: pause.">
<meta name="hub:session-minutes" content="8">
<meta name="description" content="A little lost. A long way down. An ink-and-cel cave expedition for one to four explorers.">
<title>The Great Below-About</title>
<style>/* STYLES */</style>
</head>
<body>
<canvas id="scene" aria-label="The Great Below-About game world"></canvas>
<div id="vignette"></div><div id="grain"></div>
<div id="loading"><div class="loader-compass">✧</div><div class="eyebrow">PREPARING THE EXPEDITION</div><h2>One moment, below…</h2><p id="load-note">Packing a very unreasonable balloon.</p></div>
<div id="hud" hidden>
 <div class="hud-left"><div class="location"><span class="compass-mini">✧</span><div><span class="eyebrow">THE GREAT BELOW-ABOUT</span><strong id="zone-name">Fernfall Porch</strong></div></div><div id="discoveries"><span id="obj-pip" title="Find Pip the cartographer">♙<small>PIP</small></span><span id="obj-fox" title="Find Marmalade the fox">♧<small>FOX</small></span><span id="obj-prism" title="Find the Sunseed Prism">◇<small>PRISM</small></span></div></div>
 <div class="hud-right"><div class="score-label">EXPEDITION SCORE</div><strong id="score">4,000</strong><div class="gold-line"><span>▰</span> <span id="gold">0 / 24</span><span class="hud-divider">│</span><button id="hud-map" aria-label="Open field map">Field map</button><button id="hud-pause" aria-label="Pause game">Ⅱ</button></div></div>
 <div id="trail-standings"></div><div id="context-hint"></div><div id="control-hints"></div><div id="objective-hint">Find Pip, Marmalade & the Sunseed Prism.</div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="zone-banner"><span id="zone-index"></span><strong id="zone-title"></strong><em id="zone-sub"></em></div>
<div id="demo-banner" hidden><span class="live-dot"></span> FIELD DEMONSTRATION <span>Any button returns to camp</span></div>
<div id="overlay"></div>
<div id="touch-ui" hidden><button id="touch-menu" aria-label="Pause game">Ⅱ</button><button id="touch-action" aria-label="Jump">↑</button><div id="touch-stick"><i></i></div></div>
<script type="module">/* GAME_CODE */</script>
</body>
</html>
