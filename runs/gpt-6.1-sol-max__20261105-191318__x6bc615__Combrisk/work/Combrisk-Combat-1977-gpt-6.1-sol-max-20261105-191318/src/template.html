<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HUB_CLIENT-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#182e34">
<title>Combrisk — Little tanks. Big nerve.</title>
<meta name="description" content="A pocket-sized ricochet rivalry. Four arcade heats, ghost tanks, biplanes, and a whole lot of friendly fire. Inspired by Combat (1977).">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="1-4">
<meta name="hub:session-mode" content="shared-world">
<meta name="hub:session-goal" content="Score 5 knockouts before your rivals. Ricochet shells off walls, boost out of danger, and collect power-ups.">
<meta name="hub:session-howto" content="Left stick moves, right stick aims, R2 fires, L1 or Cross boosts. Keyboard: WASD, mouse aim, click or Space fires, Shift boosts. Escape or Options pauses.">
<meta name="hub:session-minutes" content="1.5">
<style>/*GAME_CSS*/</style>
</head>
<body data-input="keyboard">
<canvas id="scene" aria-label="Combrisk three-dimensional battlefield" tabindex="-1"></canvas>
<div class="vignette"></div>
<div id="hud" class="hud" hidden></div>
<button type="button" id="pause-button" class="pause-button" aria-label="Pause game" hidden>Ⅱ</button>
<div id="bottom-hud" class="bottom-hud" hidden></div>
<div id="round-intro" class="round-intro" hidden></div>
<div id="announce" class="announce" role="status" aria-live="polite"></div>
<div id="attract" class="attract" hidden><b>A LITTLE FRIENDLY FIRE.</b><span>DEMO IN PROGRESS · Any input to take the wheel</span></div>
<div id="dev-badge" class="dev-badge"></div>
<main id="screen" class="screen" aria-label="Game menu"></main>
<div id="touch-left" class="touch-stick"><i></i></div>
<div id="touch-right" class="touch-stick"><i></i></div>
<button type="button" id="touch-boost" class="touch-boost" aria-label="Boost">BOOST</button>
<div id="toast" class="toast" role="status"></div>
<div id="boot"><div class="boot-logo">COMBRISK</div><div class="spinner"></div><p id="boot-status">Warming the engines. Sharpening the angles.</p></div>
<script>/*GAME_JS*/</script>
</body></html>
