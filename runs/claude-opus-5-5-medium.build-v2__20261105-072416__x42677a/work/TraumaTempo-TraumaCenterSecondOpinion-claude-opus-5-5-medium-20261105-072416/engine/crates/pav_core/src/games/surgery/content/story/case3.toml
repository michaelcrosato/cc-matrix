[[scene]]
id = "case3_before"
line = [
 { set = "atrium", music = "tender", enter = "vane", x = 3.1, expr = "soft" },
 { enter = "mara", x = -3.1, expr = "alarmed" },
 { who = "narrator", text = "The Vane Wing. Forty million in new surgical suites, one string quartet, and a canape that no one is able to identify." },
 { who = "vane", expr = "soft", text = "You must be the young woman from the terminal fire. No, don't be embarrassed. Doctor Quill, isn't it? Everyone is talking." },
 { who = "mara", expr = "alarmed", text = "Ms. Vane. I didn't, they told me to come in my good coat. This is it. This is my good coat." },
 { who = "vane", expr = "soft", text = "And it has seen something, hasn't it? I can always tell. The ones who've seen something stand a little to one side of the room." },
 { who = "vane", expr = "soft", text = "Cordelia. Please. It's a lovely coat. My mother was a nurse, you know, on this very harbour. All of this is only a very long thank-you note." },
 { who = "vane", expr = "soft", text = "The city needs hands like yours, Doctor. Steady ones. You have my card, should the Foundation ever be able to help." },
 { who = "mara", expr = "soft", text = "That's so kind. Nobody has ever said anything kind to me in this building." },
 { who = "vane", expr = "soft", text = "Steady hands are the rarest thing in the world, you know. I collect them. In a manner of speaking." },
 { who = "mara", expr = "soft", text = "That's what the hospital's for, I suppose. Collecting them." },
 { who = "vane", expr = "soft", text = "Yes. Yes, that's exactly what it's for. Do try the little ones with the fig." },
 { who = "narrator", text = "Above them the quartet turns a page. It is playing a waltz, as quartets do. Nobody in the atrium is counting." },
 { exit = "vane", enter = "bashir", x = 3.1, expr = "neutral" },
 { who = "bashir", expr = "neutral", text = "Doctor. A courier from the Foundation's own office. Benign liver mass, scheduled. Theatre Six is free, and the Chief asks that it be quick." },
 { who = "mara", expr = "neutral", text = "Benign. Scheduled. Quick. Bashir, tonight might be the first normal night of my life." },
]
[[scene]]
id = "case3_after"
line = [
 { set = "nightward", music = "tense", enter = "voss", x = 3.1, expr = "stern" },
 { enter = "mara", x = -3.1, expr = "alarmed" },
 { enter = "bashir", x = 0.0, expr = "stern" },
 { who = "mara", expr = "alarmed", text = "It split. It stepped. It kept time, Chief. In three. I felt the whole room go quiet, and then everything was so slow, and my hands..." },
 { who = "voss", expr = "stern", text = "Theatre Six has been sealed for a gas leak. The logs for tonight show a routine excision." },
 { who = "mara", expr = "alarmed", text = "There's no gas leak." },
 { who = "bashir", expr = "stern", text = "Chief. The courier is stable. She asked if the envelope was all right." },
 { who = "voss", expr = "neutral", text = "How long did your hands go quiet, Doctor? Inside it. How many beats?" },
 { who = "mara", expr = "alarmed", text = "How did you know they went quiet?" },
 { who = "bashir", expr = "neutral", text = "Four. I counted four, Chief. Then the room came back." },
 { who = "voss", expr = "stern", text = "You will wash your hands, you will sign nothing, and you will tell no one what you did not see in this room." },
 { who = "mara", expr = "alarmed", text = "She has a family, Chief. Somebody's going to ask her what was in there." },
 { who = "voss", expr = "neutral", text = "Then somebody will be told four centimetres, benign, and to avoid heavy lifting. You are dismissed, Doctor. Mind the wet floor. It is always wet." },
]
