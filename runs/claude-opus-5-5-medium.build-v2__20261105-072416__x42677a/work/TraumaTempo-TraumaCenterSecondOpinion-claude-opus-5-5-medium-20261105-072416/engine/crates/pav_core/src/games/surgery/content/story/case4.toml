[[scene]]
id = "case4_before"
line = [
 { set = "nightward", music = "tense", enter = "voss", x = 3.1, expr = "stern", cue = "lift" },
 { enter = "mara", x = -3.1, expr = "neutral" },
 { who = "narrator", text = "Below the morgue level there is a lift that stops at a floor with no button. The floor has no name on any plan. The staff call it the Night Ward." },
 { who = "mara", expr = "alarmed", text = "How long has this been here?" },
 { who = "voss", expr = "neutral", text = "Eleven years. Sit down, Doctor. You have met a thing tonight, and it deserves its full name." },
 { who = "voss", expr = "stern", text = "We call it Requiem. Recombinant Enzymatic Quiescent Immuno-Evasive Microfilaria. It is the only organism ever designed to keep time." },
 { who = "mara", expr = "alarmed", text = "Keep time for what?" },
 { who = "voss", expr = "stern", text = "For the end of you, Doctor." },
 { who = "mara", expr = "stern", text = "That isn't a disease. Nothing evolves into a time signature. Somebody wrote that." },
 { who = "voss", expr = "neutral", text = "Now you are thinking like a surgeon, which is to say, too late and with your hands full." },
 { who = "mara", expr = "stern", text = "How many patients, Chief? How many in this city?" },
 { who = "voss", expr = "stern", text = "I have a list. It is shorter than the truth and longer than I can bear, and you will not read it tonight." },
 { who = "voss", expr = "neutral", text = "It entrains to the host's heartbeat, then it conducts. Introit, the first movement, you met in a liver. Each strain has a meter. Each has an appetite." },
 { enter = "teddy", x = 0.0, expr = "alarmed" },
 { who = "teddy", expr = "alarmed", text = "Chief. Sorry, Chief. Sorry, is this, are we allowed down here? The pilot's back. Rosalind Pike. She came in for a cough." },
 { who = "voss", expr = "stern", text = "Seeded during recovery. On my ward. In my hospital." },
 { who = "voss", expr = "neutral", text = "I have no guidance to give you, Doctor Quill. No one has ever finished this operation. Scrub." },
 { who = "mara", expr = "alarmed", text = "Nobody? In eleven years?" },
 { who = "voss", expr = "neutral", text = "There were two others. They were very good. I signed the forms myself. Wash to the elbow, please." },
]
[[scene]]
id = "case4_after"
line = [
 { set = "nightward", music = "tender", enter = "mara", x = -3.1, expr = "soft" },
 { enter = "teddy", x = 3.1, expr = "soft" },
 { who = "teddy", expr = "soft", text = "She's asking for her boat. She's asking whose idea the lung was. Mara, you did it. Nobody's ever... Mara?" },
 { who = "mara", expr = "alarmed", text = "Teddy. I can't open my hands." },
 { who = "narrator", text = "Both hands had closed around instruments no longer in them. Then her knees, without consulting anyone, resigned." },
 { exit = "mara", shake = 1.0, cue = "gasp" },
 { enter = "voss", x = -3.1, expr = "stern" },
 { who = "voss", expr = "stern", text = "Three days' rest, and she will need three weeks. The strains won't wait three days." },
 { who = "teddy", expr = "alarmed", text = "She saved a woman from a lung that was crying, Chief. She's allowed to fall over." },
 { who = "voss", expr = "stern", text = "She is allowed, Doctor Lark. She is not excused. There is a distinction, and it is the whole of medicine." },
 { who = "teddy", expr = "alarmed", text = "Then what do we do? Who else is there? Who else could possibly..." },
 { who = "voss", expr = "neutral", text = "There is one surgeon in this city who has seen worse than this and said so, loudly, in front of the board." },
 { who = "voss", expr = "stern", text = "Then we need a second opinion." },
]
