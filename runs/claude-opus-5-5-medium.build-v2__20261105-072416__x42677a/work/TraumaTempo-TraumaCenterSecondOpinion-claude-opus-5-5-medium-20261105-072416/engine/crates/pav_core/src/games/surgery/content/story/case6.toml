[[scene]]
id = "case6_before"
line = [
 { set = "nightward", music = "tense", enter = "voss", x = 3.1, expr = "soft" },
 { enter = "pet", x = -3.1, expr = "stern" },
 { who = "voss", expr = "soft", text = "Eleven years. It's in the pericardium. The strain is Dies Irae: it runs hot. I have been keeping it down with ice baths and contempt." },
 { who = "pet", expr = "alarmed", text = "Eleven years? How does a person catch a designed parasite eleven years before anyone else?" },
 { who = "voss", expr = "neutral", text = "One doesn't catch it, Perpetua. One injects it. It is what careful people do with the first dose." },
 { who = "pet", expr = "stern", text = "You built it." },
 { who = "voss", expr = "stern", text = "I built the clock. A cure for arrhythmia, a tiny metronome that lives in the blood. Someone very generous paid for my lab. Someone very generous asked what else it could conduct." },
 { who = "voss", expr = "soft", text = "I built the Night Ward to bury what I made. It has taken longer than I expected." },
 { who = "pet", expr = "alarmed", text = "And the two you sent down there before the girl? Did you tell them what they were cutting?" },
 { who = "voss", expr = "stern", text = "I told them what I am telling you. That it keeps time, and that it is not yet finished with us." },
 { who = "voss", expr = "neutral", text = "Thousands of hearts in this city have kept good time because of that clock. I want that on the form." },
 { who = "pet", expr = "stern", text = "And how many are keeping someone else's time, Ottoline? Is there a box for that?" },
 { who = "voss", expr = "soft", text = "Page four. I designed the form as well." },
 { who = "pet", expr = "stern", text = "I ought to leave you on this table." },
 { who = "voss", expr = "soft", text = "Yes. You should scrub first, though. It's only hygienic." },
]
[[scene]]
id = "case6_after"
line = [
 { set = "recovery", music = "tender", enter = "voss", x = 3.1, expr = "soft" },
 { enter = "pet", x = -3.1, expr = "neutral" },
 { who = "voss", expr = "neutral", text = "Your closure is uneven at the third stitch." },
 { who = "pet", expr = "soft", text = "Your face is uneven at the third stitch. Who paid for it, Ottoline? Say the name, or I'll put it all back." },
 { who = "voss", expr = "stern", text = "Her mother was a nurse. On this very harbour. She tells everyone." },
 { who = "pet", expr = "stern", text = "A name, Ottoline. I've had a long night and a short temper, and I still have my scissors." },
 { who = "voss", expr = "stern", text = "Cordelia Vane." },
 { who = "pet", expr = "alarmed", text = "The canape woman? The one on the side of the bus?" },
 { who = "voss", expr = "soft", text = "It's a very long thank-you note, Perpetua. She has been writing it for eleven years." },
 { who = "pet", expr = "stern", text = "And the girl? Does Quill know whose canapes she was eating?" },
 { who = "voss", expr = "neutral", text = "She knows she was told her hands were rare. By an expert. Find her before the expert does." },
 { set = "corridor", music = "tender", enter = "bashir", x = 0.0, expr = "soft" },
 { who = "narrator", text = "That same morning a card arrives for the surgical staff, in a warm and generous hand, with an arrangement of white lilies the size of a child." },
 { who = "bashir", expr = "soft", text = "'To the steadiest hands in Port Verity. With a very long thank-you.' How thoughtful. I'll put them in water." },
]
