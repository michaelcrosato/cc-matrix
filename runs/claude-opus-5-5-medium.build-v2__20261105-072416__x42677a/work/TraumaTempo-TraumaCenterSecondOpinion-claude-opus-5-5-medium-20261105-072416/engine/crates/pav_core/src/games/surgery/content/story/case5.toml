[[scene]]
id = "case5_before"
line = [
 { set = "depot", music = "tender", cue = "thunder", enter = "pet", x = 3.1, expr = "neutral" },
 { who = "narrator", text = "The Harbour Road bus depot, 3 a.m. A tea machine that the transit authority has twice attempted to condemn." },
 { enter = "teddy", x = -3.1, expr = "alarmed" },
 { who = "teddy", expr = "alarmed", text = "Doctor Nwosu? Doctor Perpetua Nwosu? Chief Voss sent me. I've read your paper on crush injuries. I've read it several times. I cried, once, at the tables." },
 { who = "pet", expr = "stern", text = "This tea is the colour of a bruise on day five, young man, and it is the most honest thing that has happened to me since I retired." },
 { who = "teddy", expr = "alarmed", text = "She says you're the only one left who can do it. She said to say please." },
 { who = "pet", expr = "stern", text = "Ottoline Voss has not said please since the Berlin Wall. Hold this." },
 { who = "narrator", text = "She handed him the cup. It was only then, as he took it, that he saw the tea was shivering, and that the cup was not what was shaking it." },
 { who = "pet", expr = "neutral", text = "You saw that. Good. You'll not mention it. Thirty years ago these hands could stitch a mayfly. Now they stitch whatever is nearest." },
 { who = "teddy", expr = "alarmed", text = "I would never mention it. I wouldn't know how to begin. I, is that the one-forty to Salt Quay? Are you waiting for a bus?" },
 { who = "pet", expr = "soft", text = "I have waited for a bus here every night for six years, young man. It has never once been the point." },
 { who = "teddy", expr = "soft", text = "Is the tea any good?" },
 { who = "pet", expr = "stern", text = "It has killed two men and a pigeon. Would you like some?" },
 { who = "pet", expr = "stern", text = "What have you got for me?" },
 { who = "teddy", expr = "soft", text = "A longshoreman with a shattered femur. It's, the femur's a warm-up. Sorry. It's a test. She said you'd know." },
 { who = "pet", expr = "stern", text = "Of course it's a test. Let's see if they still let me fail." },
 { who = "narrator", text = "She finished the cup. She looked at the rain, and at the timetable, and at the young man holding her umbrella the wrong way up. Then she left six years on the bench and did not look round." },
]
[[scene]]
id = "case5_after"
line = [
 { set = "scrub", music = "tense", enter = "pet", x = -3.1, expr = "stern" },
 { enter = "voss", x = 3.1, expr = "stern" },
 { who = "voss", expr = "stern", text = "Your right hand shakes, Perpetua." },
 { who = "pet", expr = "stern", text = "Your right hand signs the budget, Ottoline. We've all got our tremors." },
 { who = "voss", expr = "neutral", text = "There were two sets of hands on that field. I have seen the footage. I am not going to ask." },
 { who = "pet", expr = "neutral", text = "Thirty-three years, and you pick tonight to start not asking. You look terrible. You look like the inside of a..." },
 { who = "voss", expr = "neutral", text = "I asked in 1991, Perpetua. You told me a surgeon's hands are nobody's business, and then you took my registrar and my car park." },
 { who = "pet", expr = "soft", text = "It was a very good car park." },
 { who = "voss", expr = "alarmed", text = "I am quite all right. I merely need to sit for a..." },
 { exit = "voss", shake = 1.0, cue = "gasp" },
 { who = "pet", expr = "alarmed", text = "Ottoline." },
 { who = "pet", expr = "alarmed", text = "Ottoline, you are not allowed. You owe me an apology from 1991. Get up." },
 { who = "pet", expr = "stern", text = "Somebody get a table. And somebody tell me why the Chief of Surgery has a fever of forty-one in a time signature." },
]
