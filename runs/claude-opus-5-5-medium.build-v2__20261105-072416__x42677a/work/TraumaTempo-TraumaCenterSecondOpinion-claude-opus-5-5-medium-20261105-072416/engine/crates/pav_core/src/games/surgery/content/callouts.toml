# In-op callouts: short, clinical, urgent. Triggered by name from the rules; `who` must be a rig.
# Bashir's lines go to Teddy in Case 7, where Bashir is the patient.
[callout.wrong_tool]
who = "bashir"
text = ["Wrong instrument, Doctor.", "Not that one, Doctor.", "Doctor. The other one."]
[callout.healthy]
who = "bashir"
text = ["Doctor, that's healthy tissue.", "That was healthy, Doctor. It was.", "Off the line, Doctor."]
[callout.off_axis]
who = "bashir"
text = ["Along the shaft, Doctor. You tore it.", "Straight out. Straight."]
[callout.vitals_low]
who = "teddy"
text = ["Vitals at forty. Push the IV. Now!", "Forty and falling. I'd like an IV please. Quite soon.", "Pressure's going. Doctor, the IV!"]
[callout.lift_off]
who = "bashir"
text = ["Lift off! Lift off!", "Hands up, Doctor!", "Off the tissue! Now!"]
[callout.overheat]
who = "bashir"
text = ["Too long on the beam. That's a burn.", "You're cooking it, Doctor."]
[callout.frostbite]
who = "bashir"
text = ["Too cold. Frostbite.", "You've frozen healthy wall, Doctor."]
[callout.overdose]
who = "teddy"
text = ["That's too much! That's too much, you're, oh, there it goes.", "Overdose! Overdose! I'm correcting!"]
[callout.sac_burst]
who = "teddy"
text = ["One burst! It's caustic, it's eating the pleura!", "Burst! Suction! Somebody suction!"]
[callout.eye_closed]
who = "bashir"
text = ["It closed. It's weeping again.", "Too late. Here comes another wave."]
[callout.shell_popped]
who = "bashir"
text = ["Shell's off. Forceps. Two beats.", "Open. Pull it. Now."]
[callout.stroke_missed]
who = "pet"
text = ["You dropped a bar, girl. Keep time.", "Late! It doesn't wait for you."]
[callout.tendril_systole]
who = "pet"
text = ["Not on the squeeze! Pull when she lets go!", "Between beats, you butcher. Between beats."]
