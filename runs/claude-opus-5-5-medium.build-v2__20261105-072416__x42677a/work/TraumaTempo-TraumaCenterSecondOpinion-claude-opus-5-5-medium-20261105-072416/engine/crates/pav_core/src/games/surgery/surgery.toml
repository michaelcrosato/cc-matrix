# The OR wide-shot set: a room far from the field, seen only when a story's camera says so.
name = "Operating Theatre"
about = "The wide shot of the OR, with puppets in scrubs."
entrance = { at = [7, 8], facing = "south" }

[layout]
origin = [90.0, 0.0, -8.0]

[[layout.layer]]
y = 0
map = '''
################
#..............#
#..............#
#......TT......#
#......TT......#
#......TT......#
#......TT......#
#..............#
#..............#
#..............#
'''
[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 3.4, color = "#2a4a50" }]
[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#31474c" }]
[layout.legend.'T']
blocks = [{ y0 = -0.5, y1 = 0, color = "#31474c" }, { y0 = 0, y1 = 0.95, color = "#7fa0a6", rounded = true }]

[[npc]]
kind = "biped"
name = "Surgeon"
pos = [6.0, 0, 5.0]
clips = ["MESH2MOTION/Idle_Talking"]
look = { shirt = "#2e9692", pants = "#2e9692", skin = "#f2c8ac" }
[[npc]]
kind = "biped"
name = "Scrub Nurse"
pos = [10.0, 0, 4.0]
clips = ["QUATERNIUS/Idle_Loop"]
look = { shirt = "#3c68a4", pants = "#3c68a4", skin = "#be8e68" }
[[npc]]
kind = "biped"
name = "Anaesthetist"
pos = [10.0, 0, 6.5]
clips = ["QUATERNIUS/Idle_Loop"]
look = { shirt = "#4f8a4a", pants = "#4f8a4a", skin = "#eec9a8" }

[[object]]
