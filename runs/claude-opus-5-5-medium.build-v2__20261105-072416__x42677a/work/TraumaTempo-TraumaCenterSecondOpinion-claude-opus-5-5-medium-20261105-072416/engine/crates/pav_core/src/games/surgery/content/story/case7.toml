[[scene]]
id = "case7_before"
line = [
 { set = "corridor", music = "tense", enter = "teddy", x = 3.1, expr = "alarmed" },
 { enter = "pet", x = -3.1, expr = "alarmed" },
 { who = "teddy", expr = "alarmed", text = "He was changing the water. He said, 'Doctor,' just like that, to nobody, and then he sat down on the floor. Pet. He's in four-four and then he isn't." },
 { who = "pet", expr = "stern", text = "The flowers. Every strain at once, in the pollen. She's sent us the whole Mass in a vase." },
 { who = "teddy", expr = "alarmed", text = "He's the one who, he talks everyone through it. He talks me through breakfast. Who's going to say 'Doctor'?" },
 { who = "pet", expr = "soft", text = "Nobody says it. We do it, and we hear it anyway. Now stop shaking, that's my job. Get the table." },
 { set = "nightward", enter = "pet", x = -3.1, expr = "stern" },
 { enter = "teddy", x = 3.1, expr = "alarmed" },
 { enter = "mara", x = 0.0, expr = "stern", cue = "lift" },
 { who = "mara", expr = "stern", text = "I can hear him from the lift. He's flat. All of him." },
 { who = "pet", expr = "stern", text = "You. You should be on your back with your hands in plaster, girl. I've read your chart." },
 { who = "teddy", expr = "alarmed", text = "Mara, you can't. You collapsed. You collapsed on me, personally. I still have the bruise." },
 { who = "bashir", expr = "soft", text = "...Doc... tor..." },
 { who = "narrator", text = "It was the fifteenth way. Nobody in the room had heard it before, and nobody in the room said anything at all." },
 { who = "mara", expr = "stern", text = "He told me seventy-two was a good number, Teddy. Somebody needs to get him back there." },
 { who = "mara", expr = "soft", text = "My hands hurt, Doctor Nwosu. They hurt in tune. I think I can do this if somebody keeps the other half." },
 { who = "pet", expr = "soft", text = "I have buried better surgeons than you." },
 { who = "pet", expr = "stern", text = "I'd like not to do it tonight. Take the right. I'll take the left." },
 { who = "mara", expr = "soft", text = "You don't even like me." },
 { who = "pet", expr = "stern", text = "I don't have to like you, girl. I only have to count with you. One. Two. Three. Four. Do you hear him under that?" },
 { who = "mara", expr = "stern", text = "Yes. Yes, there he is. He's in there. Seventy-two, under everything." },
 { camera = "or_wide" },
 { who = "narrator", text = "The Night Ward. Two surgeons. One table. A silence where a voice has been, every night, for all of this." },
 { who = "mara", expr = "stern", text = "Scalpel." },
 { who = "narrator", text = "Nobody hands it to her." },
 { camera = "paper" },
 { who = "teddy", expr = "alarmed", text = "...I'll do it. I've seen it done. Mostly." },
]
[[scene]]
id = "case7_after"
line = [
 { set = "recovery", music = "tender", enter = "mara", x = -3.1, expr = "soft" },
 { enter = "pet", x = 3.1, expr = "soft" },
 { enter = "bashir", x = 0.0, expr = "neutral" },
 { who = "narrator", text = "Seven o'clock. It has, against all custom, stopped raining." },
 { who = "bashir", expr = "neutral", text = "Your closure." },
 { who = "mara", expr = "alarmed", text = "Bashir. You're awake. You shouldn't, don't try to..." },
 { who = "bashir", expr = "soft", text = "Clean, Doctor." },
 { who = "narrator", text = "That was the kindest. There turn out to be fifteen." },
 { who = "mara", expr = "soft", text = "You said you weren't asking. All those nights. You never asked." },
 { who = "bashir", expr = "neutral", text = "I am still not asking, Doctor." },
 { who = "bashir", expr = "soft", text = "But if you were to tell me, I would like it noted that I already know." },
 { who = "teddy", expr = "soft", text = "I handed her a scalpel. Handle first. I want that in the record. It's the bravest thing I've ever done, and I did it mostly by accident." },
 { who = "voss", expr = "soft", text = "I have reviewed the closure. All of them. I find it to be a kind of malpractice not to say so." },
 { who = "mara", expr = "alarmed", text = "Say what, Chief?" },
 { who = "voss", expr = "stern", text = "I shall put it in writing. Do not get used to it." },
 { who = "pet", expr = "soft", text = "I'm told this city has a vacancy for a terrible old woman. I'm told there's tea." },
 { set = "cabin", music = "tense", cue = "phone", enter = "vane", x = 0.0, expr = "soft" },
 { who = "narrator", text = "Elsewhere. A very good ship, in very deep water, with a very long view." },
 { who = "vane", expr = "soft", text = "The lilies? Oh, send more lilies. One must always say thank you properly." },
 { who = "vane", expr = "soft", text = "Yes. I saw. Two of them, wasn't it? And such steady hands. No, darling, don't apologise. It was never about the one city." },
 { who = "vane", expr = "soft", text = "A promising first movement. Have them tune the orchestra." },
 { flash = 0.4 },
]
