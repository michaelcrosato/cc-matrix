[[scene]]
id = "case1_before"
line = [
 { set = "office", music = "tense", enter = "voss", x = 3.1, expr = "stern" },
 { enter = "mara", x = -3.1, expr = "neutral" },
 { who = "voss", expr = "stern", text = "Doctor Quill. You closed a forearm in a storm and the patient tells my nurses you are an angel." },
 { who = "mara", expr = "soft", text = "Thank you, Chief. I..." },
 { who = "voss", expr = "neutral", text = "He has asked for your hand in marriage. He has also asked for his boots. I am told only one request is serious." },
 { who = "voss", expr = "stern", text = "That was not a compliment. In my hospital, adequate is a kind of malpractice, and angels are worse. Angels do not chart." },
 { who = "voss", expr = "neutral", text = "This morning you have a harbour pilot with an appendix. A routine appendix. I will be in the gallery." },
 { who = "mara", expr = "alarmed", text = "You'll be watching a routine appendix?" },
 { who = "voss", expr = "stern", text = "There are no routine appendixes, Doctor. There are only surgeons who have not yet been surprised." },
 { who = "mara", expr = "neutral", text = "Yes, Chief. I'll try to be surprised adequately." },
 { who = "voss", expr = "stern", text = "Do not be witty in my office, Doctor Quill. Save it for the morgue, where it is appreciated." },
 { camera = "or_wide", set = "office" },
 { who = "narrator", text = "Operating Theatre Two. Rosalind Pike, who has brought nine thousand ships past the Verity Shoals, counts backward from ten and reaches seven." },
 { camera = "paper" },
]
[[scene]]
id = "case1_after"
line = [
 { set = "scrub", music = "tender", enter = "mara", x = -3.1, expr = "alarmed" },
 { enter = "voss", x = 3.1, expr = "stern" },
 { who = "mara", expr = "alarmed", text = "The artery. It shouldn't have, there was no reason it should have let go. I checked the ligature, I..." },
 { who = "voss", expr = "stern", text = "Adequate." },
 { who = "mara", expr = "alarmed", text = "That's all? Adequate? She nearly bled out, and I got her back, and that's the whole review?" },
 { who = "narrator", text = "Chief Ottoline Voss left the scrub room. Nurses later reported that she had used the word without visible pain." },
 { enter = "teddy", x = 0.0, expr = "soft" },
 { who = "teddy", expr = "soft", text = "That's the nicest thing she's said since the Millennium. I think she's in love with you. I'm so sorry." },
 { who = "mara", expr = "soft", text = "Teddy, why did you go into anaesthesia?" },
 { who = "teddy", expr = "soft", text = "Everyone in the room is asleep but me, and nobody asks me for anything until it's far too late. It suits my temperament." },
 { who = "mara", expr = "neutral", text = "It should have held, though. That ligature. I tied it true. I heard it." },
 { who = "teddy", expr = "alarmed", text = "You heard it. Right. You heard a knot. Get some sleep, Mara." },
 { who = "narrator", text = "She did not sleep. At four she went back and looked at the ligature, in its little steel dish, and it looked like a knot. It looked like a perfectly good knot." },
 { who = "narrator", text = "She put her ear to the dish, and then she took her ear away, and she told no one." },
]
