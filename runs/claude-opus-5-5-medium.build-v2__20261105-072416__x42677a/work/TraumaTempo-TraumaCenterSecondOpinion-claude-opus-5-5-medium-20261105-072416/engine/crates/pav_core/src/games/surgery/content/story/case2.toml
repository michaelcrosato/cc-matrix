[[scene]]
id = "case2_before"
line = [
 { set = "corridor", music = "tense", cue = "thunder", flash = 1.0, shake = 1.0, enter = "teddy", x = 3.1, expr = "alarmed" },
 { who = "narrator", text = "11:40 p.m. Grain Terminal Four goes up with a sound they will hear in the next county." },
 { enter = "mara", x = -3.1, expr = "alarmed" },
 { who = "teddy", expr = "alarmed", text = "We have nineteen in the corridor and two working monitors, and one of them is displaying the weather. It's accurate. I checked." },
 { who = "mara", expr = "alarmed", text = "Who's the worst?" },
 { who = "teddy", expr = "alarmed", text = "The foreman. He walked out carrying a man and then sat down and said he felt a bit odd. He has a bolt in him, Mara. Possibly a lot of bolts." },
 { enter = "bashir", x = 0.0, expr = "stern" },
 { who = "bashir", expr = "stern", text = "Table's ready, Doctor. Teddy, breathe. Through the nose. Not the patient's nose." },
 { who = "teddy", expr = "soft", text = "I'm fine. I joke when I'm scared. That's why you've never heard me not joking." },
 { who = "mara", expr = "stern", text = "Nineteen people, Bashir. Tell me there's someone senior coming." },
 { who = "bashir", expr = "neutral", text = "There is, Doctor. You are the someone. It has been a short night for promotions." },
 { who = "teddy", expr = "alarmed", text = "Monitor Two now says rain, clearing by morning. I've decided to find that comforting." },
]
[[scene]]
id = "case2_after"
line = [
 { set = "recovery", music = "tender", enter = "bashir", x = 3.1, expr = "neutral" },
 { enter = "mara", x = -3.1, expr = "neutral" },
 { who = "mara", expr = "neutral", text = "He'll live. Everyone keeps telling me I did well. Teddy keeps telling me I did something strange." },
 { who = "bashir", expr = "neutral", text = "You said now." },
 { who = "mara", expr = "alarmed", text = "I'm sorry?" },
 { who = "bashir", expr = "neutral", text = "You said 'now,' Doctor. Half a beat before the monitor flatlined. Before the alarm. Before anything in that room could have told you." },
 { who = "mara", expr = "alarmed", text = "I, it went flat. Inside. Like a string going slack. I can't..." },
 { who = "mara", expr = "alarmed", text = "When I was nine I told my father the Bechstein in the church hall had a bad middle C. We were outside. We were in the street. He just looked at me, and bought me an ice." },
 { who = "bashir", expr = "soft", text = "Was it flat, Doctor? The middle C?" },
 { who = "mara", expr = "soft", text = "A quarter-tone. He went and checked, after. He never said a word. He just started taking me to work." },
 { who = "bashir", expr = "soft", text = "I am not asking anything, Doctor." },
 { who = "bashir", expr = "neutral", text = "I wanted you to know that I am not asking." },
 { who = "narrator", text = "Eleven men went home to Terminal Row that week. The twelfth, who had carried them out, was discharged on the Friday and tried to tip the anaesthetist." },
 { who = "teddy", expr = "soft", text = "I took it. I want that known. It was a very good bolt." },
]
