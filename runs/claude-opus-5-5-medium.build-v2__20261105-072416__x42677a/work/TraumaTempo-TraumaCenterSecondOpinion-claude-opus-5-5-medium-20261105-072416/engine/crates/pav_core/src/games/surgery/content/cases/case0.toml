[[phase]]
name = "gel"
repeat = 2
now = "Pick the GEL. Paint the raw skin until the ring is full."
guide = true
checkpoint = true
spawn = [{ kind = "patch", a = [-2.0, 0.4], r = 1.3 }]
say = [
  { who = "bashir", text = "Doctor. Flick to your tray. Gel first, the skin is raw.", at = 0.5 },
  { who = "bashir", text = "Hold and paint. Slowly. It's skin, not a fence.", at = 6.0 },
]

[[phase]]
name = "hooks"
stagger = 5.0
repeat = 2
now = "FORCEPS. Grab each hook and pull along its shaft."
guide = true
spawn = [
  { kind = "object", a = [-3.5, -1.2], ang = 150.0, sub = 0 },
  { kind = "object", a = [1.0, 1.4], ang = 40.0, sub = 0 },
  { kind = "object", a = [3.8, -0.8], ang = -30.0, sub = 2 },
]
say = [
  { who = "bashir", text = "Forceps, Doctor. Lift the hook. ...Doctor.", at = 0.3 },
  { who = "bashir", text = "Along the shaft. A barb tears anything else.", at = 5.0 },
]

[[phase]]
name = "pool"
stagger = 4.0
repeat = 2
now = "SUCTION the blood. Something's under it."
guide = true
spawn = [
  { kind = "pool", a = [0.6, -0.4], r = 1.5 },
  { kind = "object", a = [0.6, -0.3], ang = 100.0, sub = 0 },
]
say = [
  { who = "bashir", text = "One more. Under the pool. I can't see it either. Suction.", at = 0.3 },
  { who = "mara", text = "How did you know?", at = 5.0 },
  { who = "bashir", text = "I've met a hook before, Doctor.", at = 7.5 },
]

[[phase]]
name = "splinters"
stagger = 5.0
repeat = 2
now = "Cable splinters. FORCEPS, along each one. Then GEL what's left raw."
guide = true
spawn = [
  { kind = "object", a = [-5.2, 0.9], ang = 170.0, sub = 2 },
  { kind = "object", a = [-2.4, -1.8], ang = -120.0, sub = 2 },
  { kind = "object", a = [2.6, 1.8], ang = 60.0, sub = 2 },
  { kind = "object", a = [5.4, 0.2], ang = 10.0, sub = 2 },
  { kind = "patch", a = [3.6, -1.6], r = 1.1 },
]
say = [{ who = "bashir", text = "Four more. He says he's had worse. He has not.", at = 0.4 }]

[[phase]]
name = "suture"
stagger = 6.0
repeat = 2
now = "SUTURE. Zigzag across the wounds, one stitch at a time."
guide = true
checkpoint = true
spawn = [
  { kind = "lacer", a = [-4.0, 1.6], b = [-1.2, 0.8] },
  { kind = "lacer", a = [2.2, -1.8], b = [5.0, -0.8] },
]
say = [
  { who = "bashir", text = "They'll bleed until they're closed. Suture. Across, and across.", at = 0.3 },
  { who = "bashir", text = "Even spacing. His wife will see this.", at = 6.0 },
]

[[phase]]
name = "last_bleed"
stagger = 5.0
repeat = 1
now = "One last wound. SUCTION, then SUTURE."
spawn = [
  { kind = "pool", a = [0.2, 1.8], r = 1.1 },
  { kind = "lacer", a = [-1.4, 1.8], b = [1.8, 1.9] },
]
say = [{ who = "mara", text = "I count seventy-four. He's fine. I'm counting. He's fine.", at = 0.4 }]

[[phase]]
name = "close"
now = "Draw the DRESSING along the arm."
guide = true
spawn = [{ kind = "closure", a = [-5.5, 0.5], b = [5.5, 0.2], c = [0.0, 1.0] }]
