[[scene]]
id = "case0_before"
line = [
 { set = "corridor", music = "tense", cue = "thunder", flash = 0.6 },
 { who = "narrator", text = "Port Verity. The storm has been coming for three days, and tonight it has arrived." },
 { who = "narrator", text = "Mercy Harbor General. A public hospital, a teaching hospital, a hospital where half the wings have a benefactor's name and all of the roofs leak." },
 { enter = "mara", x = -3.1, expr = "alarmed" },
 { who = "mara", expr = "alarmed", text = "I'm a second-year. I've assisted. I have never, at any point, been the person the assisting was for." },
 { enter = "bashir", x = 3.1, expr = "neutral" },
 { who = "bashir", expr = "neutral", text = "Net-mender off Pier Nine. Hooks and cable splinters. The whole forearm, Doctor." },
 { who = "mara", expr = "alarmed", text = "Where is Doctor Abara? Where is the attending?" },
 { who = "bashir", expr = "stern", text = "The attending is elbow-deep in a bus driver. This one's yours, Doctor." },
 { who = "mara", expr = "alarmed", text = "Then get someone else. A registrar. A vet. There must be a vet in this building." },
 { who = "bashir", expr = "neutral", text = "There was a vet, Doctor. He is holding the bus driver's other arm." },
 { who = "mara", expr = "neutral", text = "My father tuned pianos. He could hear a flat string through a wall. He told me hands learn what ears already know." },
 { who = "mara", expr = "alarmed", text = "I don't know what that means, Bashir. I just thought someone should hear it, in case." },
 { who = "bashir", expr = "neutral", text = "Doctor, I have stood beside four hundred surgeons at this table. Every one of them was frightened. The good ones were frightened about the patient." },
 { who = "mara", expr = "alarmed", text = "And the others?" },
 { who = "bashir", expr = "stern", text = "They have wings named after them now." },
 { who = "bashir", expr = "soft", text = "Scrub in, Doctor. His pulse is seventy-two. That is a good number. Start there." },
 { music = "none" },
]
[[scene]]
id = "case0_after"
line = [
 { set = "scrub", music = "tender", enter = "mara", x = -3.1, expr = "soft" },
 { enter = "bashir", x = 3.1, expr = "neutral" },
 { who = "bashir", expr = "neutral", text = "He will keep the arm. He has already asked whether we mend nets." },
 { who = "bashir", expr = "soft", text = "Your hands were steady." },
 { who = "mara", expr = "alarmed", text = "I dropped the first hook. I dropped it on the tray, I know, that's where it goes, but I dropped it." },
 { who = "bashir", expr = "neutral", text = "Yes, Doctor. It is the only time this month anything has landed on that tray on purpose." },
 { who = "mara", expr = "neutral", text = "They weren't. I was counting his heartbeats." },
 { who = "bashir", expr = "neutral", text = "Doctor." },
 { who = "narrator", text = "It is a small word. He has fourteen ways of saying it. That was the third-kindest." },
 { who = "mara", expr = "soft", text = "Bashir? Does it ever stop raining here?" },
 { who = "bashir", expr = "soft", text = "It stopped once, Doctor. In 1987. There was an inquiry." },
 { who = "narrator", text = "Down the corridor, a net-mender is explaining to a very tired orderly that he has been stitched by an angel with cold hands." },
]
