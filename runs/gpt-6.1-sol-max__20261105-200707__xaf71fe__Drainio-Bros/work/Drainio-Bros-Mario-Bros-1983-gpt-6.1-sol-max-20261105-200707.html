<script>
/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

:root {
	--ink: #172e32;
	--paper: #f4e8c5;
	--gold: #f2c35e;
	--orange: #ed8d58;
	--mint: #9acbb4;
	--body: "Barlow Condensed", sans-serif;
	--display: "Bungee", sans-serif;
	--u: min(1vw, 1.777778vh);
}
* {
	box-sizing: border-box;
}
html,
body {
	margin: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: #0c2429;
	color: var(--paper);
	font-family: var(--body);
	font-weight: 500;
	touch-action: none;
	user-select: none;
}
button,
input {
	font: inherit;
}
button {
	cursor: pointer;
	-webkit-tap-highlight-color: transparent;
}
button:focus {
	outline: none;
}
a {
	color: inherit;
}
#frame {
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	width: min(100vw, 177.777778vh);
	height: min(100vh, 56.25vw);
	overflow: hidden;
	background: #214b4d;
	border: solid max(2px, 0.24vw) #102a2c;
	box-shadow: 0 0 100px #0008;
}
#stage,
#ui {
	position: absolute;
	inset: 0;
}
#stage canvas {
	display: block;
	width: 100%;
	height: 100%;
}
#ui {
	pointer-events: none;
}
button,
input,
[data-scroll] {
	pointer-events: auto;
}
.hidden {
	display: none !important;
}
.screen {
	position: absolute;
	inset: 0;
	pointer-events: auto;
}
.title {
	background: linear-gradient(
		90deg,
		#123236fa 0%,
		#15383bf7 28%,
		#163b3cbd 43%,
		#163b3c00 63%
	);
}
.title::after {
	content: "";
	position: absolute;
	inset: 0;
	box-shadow: inset 0 0 calc(var(--u) * 7) #102b2d66;
	pointer-events: none;
}
.title-left {
	position: absolute;
	left: 5.1%;
	top: 7.4%;
	width: 40%;
	z-index: 1;
}
.eyebrow {
	font-weight: 800;
	font-size: calc(var(--u) * 1.13);
	letter-spacing: 0.22em;
	color: #b8d2b9;
	margin: 0 0 calc(var(--u) * 0.8);
}
.brand {
	font-family: var(--display);
	margin: 0;
	font-size: calc(var(--u) * 6.1);
	line-height: 1.06;
	letter-spacing: -0.045em;
	transform: rotate(-3deg);
	color: #f1c06a;
	-webkit-text-stroke: calc(var(--u) * 0.17) #142f31;
	paint-order: stroke fill;
	text-shadow:
		calc(var(--u) * 0.25) calc(var(--u) * 0.4) 0 #0b2228,
		calc(var(--u) * 0.35) calc(var(--u) * 0.5) 0 #72a88c;
}
.brand span {
	display: block;
	color: #f3e8c6;
	letter-spacing: 0.03em;
	font-size: 0.71em;
	margin-left: calc(var(--u) * 6.3);
}
.brand-tag {
	display: inline-block;
	transform: rotate(-3deg);
	font-family: var(--display);
	font-size: calc(var(--u) * 0.87);
	letter-spacing: 0.09em;
	background: #e58a54;
	color: var(--ink);
	border: calc(var(--u) * 0.16) solid var(--ink);
	padding: calc(var(--u) * 0.4) calc(var(--u) * 1);
	margin: calc(var(--u) * 1.6) 0 calc(var(--u) * 0.7) calc(var(--u) * 1.3);
	box-shadow: calc(var(--u) * 0.22) calc(var(--u) * 0.24) 0 #0c272a;
}
.title-copy {
	font-size: calc(var(--u) * 1.7);
	line-height: 1.2;
	max-width: 90%;
	margin: calc(var(--u) * 0.5) 0 calc(var(--u) * 1.7);
	color: #d4dfc9;
}
.menu-stack {
	display: grid;
	gap: calc(var(--u) * 0.58);
	max-width: 85%;
}
.menu-button {
	position: relative;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: calc(var(--u) * 1);
	text-align: left;
	width: 100%;
	border: calc(var(--u) * 0.17) solid #102b2d;
	background: #e7dbb9;
	color: var(--ink);
	padding: calc(var(--u) * 0.65) calc(var(--u) * 1.1);
	min-height: calc(var(--u) * 3.85);
	box-shadow: calc(var(--u) * 0.2) calc(var(--u) * 0.22) 0 #0b2529;
	transition:
		background 0.1s,
		transform 0.1s;
	font-weight: 800;
	font-size: calc(var(--u) * 1.65);
	letter-spacing: 0.025em;
}
.menu-button .detail {
	font-weight: 500;
	font-size: 0.75em;
	letter-spacing: 0.015em;
}
.menu-button .icon {
	font-family: var(--display);
	font-size: 0.9em;
}
.menu-button:hover,
.menu-button:focus-visible,
.menu-button.focused,
.pill:hover,
.pill:focus-visible,
.pill.focused,
.tab.focused,
.tab:focus-visible {
	background: var(--gold);
	color: var(--ink);
	transform: translateX(calc(var(--u) * 0.26));
	box-shadow: calc(var(--u) * 0.22) calc(var(--u) * 0.24) 0 #0b2529;
}
.menu-button.primary {
	background: var(--orange);
}
.menu-button.primary:hover,
.menu-button.primary.focused {
	background: var(--gold);
}
.menu-button:disabled {
	opacity: 0.45;
	cursor: default;
}
.title-small {
	display: flex;
	gap: calc(var(--u) * 1);
	margin-top: calc(var(--u) * 1.2);
}
.text-button {
	background: none;
	color: #d5dfc7;
	border: 0;
	border-bottom: calc(var(--u) * 0.1) solid #91b7a0;
	padding: calc(var(--u) * 0.3) calc(var(--u) * 0.5);
	font-weight: 700;
	font-size: calc(var(--u) * 1.25);
}
.text-button:hover,
.text-button.focused,
.text-button:focus-visible {
	color: var(--gold);
	border-color: var(--gold);
}
.station-stamp {
	position: absolute;
	right: 4%;
	top: 5%;
	border: calc(var(--u) * 0.15) solid #9ab49c88;
	color: #bed2b6;
	transform: rotate(3deg);
	text-align: center;
	font-weight: 800;
	font-size: calc(var(--u) * 1.05);
	letter-spacing: 0.16em;
	padding: calc(var(--u) * 0.55) calc(var(--u) * 1.1);
	line-height: 1.35;
}
.station-stamp b {
	font-family: var(--display);
	display: block;
	font-size: 1.4em;
	letter-spacing: 0.05em;
}
.title-bottom {
	position: absolute;
	bottom: 3.3%;
	left: 5.3%;
	right: 4%;
	display: flex;
	align-items: center;
	justify-content: space-between;
	font-size: calc(var(--u) * 1.18);
	color: #bad0b9;
	z-index: 1;
}
.title-bottom .motto {
	font-family: var(--display);
	font-size: calc(var(--u) * 1.6);
	letter-spacing: 0.045em;
	color: #f0d59b;
	text-shadow: 2px 2px #173839;
}
.key {
	display: inline-flex;
	justify-content: center;
	align-items: center;
	min-width: 1.55em;
	height: 1.55em;
	padding: 0 0.22em;
	background: #f2e7c5;
	color: var(--ink);
	border: 1px solid #203b3d;
	border-bottom-width: 3px;
	border-radius: 0.18em;
	font-size: 0.82em;
	font-weight: 800;
	line-height: 1;
	vertical-align: middle;
}
.key.pad {
	border-radius: 50%;
	background: #233e42;
	color: #f2dfb3;
	border-color: #849e91;
}
.hint-line {
	display: flex;
	align-items: center;
	gap: calc(var(--u) * 0.65);
}
.hud {
	position: absolute;
	top: 2.5%;
	left: 3%;
	right: 3%;
	display: flex;
	justify-content: space-between;
	align-items: flex-start;
	gap: calc(var(--u) * 2);
	pointer-events: none;
}
.hud-card {
	background: #f0e3c2;
	border: calc(var(--u) * 0.16) solid #183235;
	box-shadow: calc(var(--u) * 0.2) calc(var(--u) * 0.2) 0 #0d282bcc;
	color: var(--ink);
	padding: calc(var(--u) * 0.5) calc(var(--u) * 1);
	transform: rotate(-1deg);
	min-width: calc(var(--u) * 15);
}
.hud-label {
	font-weight: 800;
	letter-spacing: 0.13em;
	font-size: calc(var(--u) * 0.88);
}
.hud-score {
	font-family: var(--display);
	font-size: calc(var(--u) * 2.1);
	line-height: 1.15;
	letter-spacing: 0.06em;
}
.crew-lives {
	font-weight: 800;
	font-size: calc(var(--u) * 1.1);
	display: flex;
	gap: calc(var(--u) * 1);
}
.crew-lives span {
	white-space: nowrap;
}
.crew-lives i {

<script type="module">import * as THREE from 'three/webgpu';

	speed: 6.2,

	gravity: 30,
	enemySpeed: 1,
	stun: 9,
	spawn: 2.7,
	lives: 5,
	timeScale: 1,
});
const PHASES = [
	{
		name: "FIRST DRIP",
		lesson: "Bump the floor. Flip the pest. Give it the boot!",
		types: ["shell", "shell", "shell", "shell"],
		tint: "#75c7b3",
	},
	{

		tint: "#f1b260",
	},
	{

		duration: 25,
		tint: "#efca68",
	},
	{

		lesson: "Springwings flip only when their feet touch the floor.",
		types: ["hopper", "shell", "hopper", "crab", "hopper", "shell"],
		tint: "#b6a3dc",
	},
	{
		name: "COLD FEET",
		lesson: "Stop the Frosties before they turn the floors to ice!",
		types: ["ice", "crab", "shell", "ice", "hopper", "crab"],
		ice: true,
		tint: "#98dae1",
	},
	{
		name: "PAYDAY PARADE",
		lesson: "The clock is ticking. Leave no coin behind!",
		bonus: true,
		duration: 25,
		tint: "#efca68",
	},
	{
		name: "HOT WATER",
		lesson: "Watch the sparks! Keep moving and use your BOP.",
		types: ["crab", "hopper", "shell", "crab", "hopper", "shell", "crab"],
		fire: true,
		tint: "#ef946d",
	},
	{
		name: "THE BIG CLOG",
		lesson: "Three bumps crack the big lug. Then kick it clean!",
		types: ["boss", "crab", "hopper", "shell", "crab", "hopper"],
		fire: true,
		ice: true,
		finale: true,
		tint: "#e8af72",
	},
];
const PLATFORMS = [
	{ id: "ground", x: 0, y: 0, w: 25, h: 0.65 },
	{ id: "lowL", x: -7.05, y: 3.3, w: 10.7, h: 0.42 },
	{ id: "lowR", x: 7.05, y: 3.3, w: 10.7, h: 0.42 },
	{ id: "mid", x: 0, y: 6.6, w: 15.6, h: 0.42 },
	{ id: "midL", x: -11.65, y: 6.6, w: 1.5, h: 0.42 },
	{ id: "midR", x: 11.65, y: 6.6, w: 1.5, h: 0.42 },
	{ id: "topL", x: -7.15, y: 9.9, w: 10.5, h: 0.42 },
	{ id: "topR", x: 7.15, y: 9.9, w: 10.5, h: 0.42 },
	{ id: "bop", x: 0, y: 2.35, w: 1.22, h: 0.9, special: true },
];
const DT = 1 / 60;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function seeded(a) {
	return () => {
		a |= 0;
		a = (a + 0x6d2b79f5) | 0;
		let t = Math.imul(a ^ (a >>> 15), 1 | a);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

	};

class Shift {

		this.coins = [];
		this.hazards = [];
		this.events = [];
		this.tick = 0;
		this.elapsed = 0;
		this.phase = 0;
		this.phaseTime = 0;
		this.status = "playing";
		this.score = 0;
		this.pow = 3;
		this.combo = 0;
		this.comboTime = 0;
		this.maxCombo = 0;
		this.ice = [];
		this.nextId = 100;
		this.spawned = 0;
		this.cleared = 0;
		this.transition = 0;
		this.intro = 2.4;
		this.cheated = false;
		this.god = attract;
		this.attract = attract;
		this.stats = {
			bumps: 0,
			flips: 0,
			kicks: 0,
			coins: 0,
			jumps: 0,
			wraps: 0,
			hurts: 0,
			bops: 0,
			bonuses: 0,
		};
		this.platforms = PLATFORMS.map((p) => ({
			...p,
			collider: this.world.createCollider(
				RAPIER.ColliderDesc.cuboid(p.w / 2, p.h / 2)
					.setTranslation(p.x, p.y - p.h / 2)
					.setFriction(0)

	event(type, data = {}) {

	}
	body(x, y, hx, hy, group = 2) {
		const body = this.world.createRigidBody(
			RAPIER.RigidBodyDesc.dynamic()
				.setTranslation(x, y)
				.lockRotations()
				.setCcdEnabled(true),
		);
		const collider = this.world.createCollider(
			RAPIER.ColliderDesc.cuboid(hx, hy)
				.setFriction(0)
				.setRestitution(0)

	addPlayer(id) {
		if (this.players.some((p) => p.id === id)) return;
		const x = [-3, 3, -5.5, 5.5][this.players.length % 4];
		const p = {
			id,
			x,
			y: 0.65,
			vx: 0,
			vy: 0,
			dir: x > 0 ? -1 : 1,
			lives: Math.round(this.config.lives),
			score: 0,
			grounded: true,
			ground: "ground",
			invuln: 2,
			dead: 0,
			kick: 0,
			kickCooldown: 0,
			jumpHeld: false,
			actionHeld: false,
			buffer: 0,
			coyote: 0,
			bumpCooldown: 0,

			...this.body(x, 0.65, 0.31, 0.62),

	}

		const p = this.players.find((p) => p.id === id);
		if (p) {
			this.world.removeRigidBody(p.body);

		this.world.free();

	setPosition(p, x, y) {
		p.x = x;
		p.y = y;

	groundFor(e, half) {

	beginPhase(index) {

				p.dead = 0;
				p.collider.setCollisionGroups(0x00020001);

				for (let i = 0; i < count; i++)

						x: p.x - p.w / 2 + 1 + (i * (p.w - 2)) / (count - 1),

	spawnEnemy(type = "shell", where = null) {

			x = 0;
			y = 7.4;

			x = where.x;
			y = where.y;
		}
		const half = type === "boss" ? 0.65 : 0.35;
		const e = {
			id: this.nextId++,
			type,
			x,
			y,
			vx: 0,
			vy: 0,
			dir: side < 0 ? 1 : -1,
			half,
			state: "walk",
			stun: 0,
			armor: type === "crab" ? 2 : type === "boss" ? 3 : 1,
			angry: false,
			age: 0,
			hop: 0.75,
			recoveries: 0,
			grounded: false,
			ground: null,
			...this.body(x, y, type === "boss" ? 0.85 : 0.39, half, 4),
		};

	makeCoin(x, y, bonus = false) {

			id: this.nextId++,
			x,
			y,
			bonus,
			age: 0,
			...this.body(x, y, 0.19, 0.22, 8),
		};

		c.body.setLinvel({ x: (this.rng() - 0.5) * 3, y: 6 }, true);

	}
	award(p, amount) {
		this.score += amount;
		if (p) {
			const prev = Math.floor(p.score / 15000);
			p.score += amount;
			if (Math.floor(p.score / 15000) > prev) {
				p.lives++;
				if (p.lives === 1 && p.dead <= 0) {
					p.dead = 0.01;
					p.body.setGravityScale(1, true);
				}
				this.event("extra", { x: p.x, y: p.y + 1, id: p.id });
			}
		}

	hitEnemy(e, p, power = false) {

		if (!e.grounded && !power) return false;
		if (e.type === "hopper" && !e.grounded) return false;
		if (e.state === "flipped") {
			e.stun = this.config.stun;
			e.body.setLinvel({ x: 0, y: 3.8 }, true);
			return true;
		}
		if (e.type === "ice") {
			this.defeat(e, p, false);
			this.event("shatter", { x: e.x, y: e.y });
			return true;
		}
		e.armor--;
		if (e.armor > 0) {
			e.angry = true;
			e.body.setLinvel({ x: 0, y: 2.4 }, true);
			e.dir *= -1;
			this.event("armor", { x: e.x, y: e.y, armor: e.armor, enemy: e.type });
			return true;

		e.stun = this.config.stun;
		e.body.setLinvel({ x: 0, y: 4.5 }, true);

	bump(platform, x, p) {

			if (
				e.state !== "gone" &&
				Math.abs(e.x - x) < (e.type === "boss" ? 2.4 : 1.8) &&
				Math.abs(e.y - e.half - platform.y) < 0.2

				this.hitEnemy(e, p);
		if (this.ice.includes(platform.id)) {

	bop(p) {

		this.stats.bops++;

	defeat(e, p, coin = true) {

		e.body = null;

			this.combo = this.comboTime > 0 ? this.combo + 1 : 1;
			this.comboTime = 4.5;
			this.maxCombo = Math.max(this.combo, this.maxCombo);
			this.stats.kicks++;
			p.kick = 0.28;

				(e.type === "boss" ? 3000 : e.type === "ice" ? 400 : 500) *
				Math.min(this.combo, 5);

			this.event("kick", {
				id: e.id,
				x: e.x,
				y: e.y,
				dir: p.dir,
				enemy: e.type,
				combo: this.combo,
				points,
			});
		}

	hurt(p) {

		p.invuln = 4.2;
		p.body.setLinvel({ x: -p.dir * 3, y: 9 }, true);
		p.collider.setCollisionGroups(0x00020000);

	collect(c, p) {

		if (c.body) {
			this.world.removeRigidBody(c.body);

	controlPlayer(p, input = {}) {

			e.y = pos.y;
			e.vx = vel.x;
			e.vy = vel.y;

			e.grounded = !!ground;

			if (Math.abs(e.x) > 12.8 || e.y < -1.5) {

					p.dead <= 0 &&

	updateHazards() {

				type: "fire",
				x: side * 12,
				y: 4.3,
				base: [1.15, 4.3, 7.65][Math.floor(this.rng() * 3)],
				dir: -side,
				age: 0,
			});
			this.event("fire", { x: side * 12, y: 4.3 });
		}

			this.nextIcicle += 10;
			const p = this.players.find((p) => p.lives > 0);
			if (p)
				this.hazards.push({
					id: this.nextId++,
					type: "icicle",
					x: p.x,
					y: 12.4,
					age: 0,
					vy: 0,
				});
		}
		for (const h of this.hazards) {
			h.age += DT;
			if (h.type === "fire") {

				h.y += h.vy * DT;
				if (h.y < -0.1) h.gone = true;
			}
			for (const p of this.players)
				if (
					p.lives > 0 &&
					p.dead <= 0 &&
					Math.abs(p.x - h.x) < 0.67 &&
					Math.abs(p.y - h.y) < 0.9 &&
					(h.type === "fire" || h.age > 1.1)
				)
					this.hurt(p);

	completePhase() {

			this.award(
				this.players[0],
				Math.max(0, 1500 - Math.floor(this.phaseTime) * 10),
			);

			phase: this.phase,
			perfect,
			bonus: !!this.phaseDef.bonus,
			collected: this.bonusCollected || 0,
			total: this.bonusTotal || 0,
		});
	}
	finish(won) {
		if (this.status !== "playing") return;

	}
	drainEvents() {

	}
	snapshot() {

			x: p.x,
			y: p.y,
			vx: p.vx,
			vy: p.vy,
			dir: p.dir,
			lives: p.lives,
			score: p.score,

class Showman {
	constructor(game) {

		this.time = 0;
		this.cycle = 0;
		this.target = null;
		this.stage = 0;
		this.cooldown = 0;
	}
	update() {
		const g = this.game;
		this.time += DT;
		this.cooldown -= DT;
		if (g.status !== "playing") {
			g.status = "playing";
			g.beginPhase(0);
		}
		if (g.phaseDef.bonus) {
			const c = g.coins[0];
			if (c && this.cooldown <= 0) {
				const p = g.players[this.cycle++ % g.players.length];
				g.setPosition(p, c.x - 0.5, c.y);
				this.cooldown = 0.5;
				return { [p.id]: { x: 1, jump: true } };
			}
			return {};
		}
		if (g.phaseTime > 22 && !g.transition) {
			for (const e of g.enemies)
				if (e.state !== "gone") {
					e.grounded = true;
					e.armor = 1;
					g.hitEnemy(e, g.players[0], true);
					g.defeat(e, g.players[0]);
				}
			g.spawned = g.phaseDef.types.length;
		}
		const live = g.enemies.filter((e) => e.state !== "gone");
		if (!this.target || this.target.state === "gone") {
			this.target = live[0];
			this.stage = 0;
			this.cooldown = 1;
		}
		const e = this.target;
		if (!e || g.intro > 0 || g.transition > 0) return {};
		const p = g.players[this.cycle % g.players.length];
		if (this.cooldown <= 0) {
			const plat = g.platforms.find((s) => s.id === e.ground);
			if (e.state === "flipped") {
				g.setPosition(p, e.x - 1.25, e.y + 0.25);
				p.dir = 1;
				this.cooldown = 0.75;
				this.cycle++;
				return { [p.id]: { x: 1, action: true } };
			}
			if (plat && !plat.special && plat.y > 2) {
				g.setPosition(p, e.x, plat.y - 2.2);
				p.body.setLinvel({ x: 0, y: 11 }, true);
				p.prevVy = 11;
				this.cooldown = 1.25;
				return { [p.id]: { jump: true } };
			}
			if (e.grounded) {
				e.armor = Math.max(1, e.armor);
				g.hitEnemy(e, p, true);
				this.cooldown = 0.9;
			}
		}
		return {
			[p.id]: {
				x:
					e.state === "flipped"
						? Math.sign(e.x - p.x)
						: Math.sin(this.time) * 0.3,

		};

	ctx,
	output,
	frequency,
	start,
	duration,
	volume = 0.15,
	wave = "triangle",
	slide = null,

		amp = ctx.createGain();

	osc.frequency.setValueAtTime(Math.max(20, frequency), start);

		osc.frequency.exponentialRampToValueAtTime(
			Math.max(20, slide),
			start + duration,
		);

	amp.gain.exponentialRampToValueAtTime(
		Math.max(0.0002, volume),
		start + 0.008,
	);
	amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
	osc.connect(amp).connect(output);
	osc.start(start);
	osc.stop(start + duration + 0.01);

					"ArrowDown",

	bind(root) {

				root
					.querySelectorAll(".focused")

			if (el.dataset.action)
				el.addEventListener("click", () => {

				});
			if (el.dataset.digit !== undefined)
				el.addEventListener("click", () => this.changeDigit(el, 1));
			if (el.matches("input[type=range]"))
				el.addEventListener("input", () => {
					const value = Number(el.value);
					const key = el.dataset.setting || el.dataset.config;
					el.nextElementSibling.textContent = `${el.dataset.setting ? Math.round(value * 100) : Math.round(value * 100) / 100}${el.dataset.setting ? "%" : key === "stun" || key === "spawn" ? "s" : ""}`;
					if (el.dataset.setting) {
						this.settings[key] = value;
						this.saveSettings();

						this.game.cheated = true;
					}
				});
		});

	focus(el) {
		if (!el) return;

	changeDigit(el, delta) {
		const i = Number(el.dataset.digit);
		this.roomDigits[i] = (this.roomDigits[i] + delta + 10) % 10;
		el.textContent = this.roomDigits[i];
		$("room-input").value = this.roomDigits.join("");
	}
	navigate(action) {
		if (
			performance.now() < (this.suppressUntil || 0) ||
			this.screen === "hubended"
		)
			return;
		if (action === "pause") {
			this.pause();
			return;
		}
		if (action === "back") {
			if (this.modal) this.back?.();
			else if (this.screen === "play") this.pause();
			return;
		}
		if (!this.modal && this.screen !== "title") return;
		const root = this.modal ? $("modal") : $("title-screen");
		const all = Array.from(root.querySelectorAll("[data-nav]")).filter(
			(el) => !el.disabled && el.getBoundingClientRect().width > 0,
		);
		if (!all.length) return;
		let current = all.includes(document.activeElement)
			? document.activeElement
			: all[0];
		if (action === "accept") {
			if (current.matches("button")) current.click();
			else if (current.id === "room-input") this.act("join-room");
			return;
		}
		if (
			current.matches("input[type=range]") &&
			["left", "right"].includes(action)
		) {
			current.value =
				Number(current.value) +
				(action === "right" ? 1 : -1) * Number(current.step);
			current.dispatchEvent(new Event("input"));
			return;
		}
		if (
			current.dataset.digit !== undefined &&
			["up", "down"].includes(action)
		) {
			this.changeDigit(current, action === "up" ? 1 : -1);
			return;
		}
		if (
			current.hasAttribute("data-scroll") &&
			["up", "down"].includes(action)
		) {
			const direction = action === "down" ? 1 : -1;
			if (
				(direction > 0 &&
					current.scrollTop <
						current.scrollHeight - current.clientHeight - 2) ||
				(direction < 0 && current.scrollTop > 0)
			) {
				current.scrollBy({
					top: direction * 90,
					behavior: this.settings.reduced ? "instant" : "smooth",
				});
				return;
			}
		}
		const r = current.getBoundingClientRect(),
			cx = r.x + r.width / 2,
			cy = r.y + r.height / 2;
		const horiz = action === "left" || action === "right";
		const sign = action === "right" || action === "down" ? 1 : -1;
		const candidates = all
			.filter((el) => el !== current)
			.map((el) => {
				const b = el.getBoundingClientRect(),
					dx = b.x + b.width / 2 - cx,
					dy = b.y + b.height / 2 - cy;
				return {
					el,
					forward: (horiz ? dx : dy) * sign,
					cross: Math.abs(horiz ? dy : dx),
				};
			})
			.filter((c) => c.forward > 4)
			.sort((a, b) => a.forward + a.cross * 2.5 - (b.forward + b.cross * 2.5));
		this.focus(
			candidates[0]?.el ||
				all[(all.indexOf(current) + sign + all.length) % all.length],
		);
		this.audio.fx("ui");
	}
	act(action) {

			const modes = ["chill", "arcade", "spicy"];

		} else if (action === "debug-draw") {

		} else if (action === "restart-phase") {
			this.game.beginPhase(this.game.phase);

		} else if (action === "lives-refill") {
			for (const p of this.game.players) {
