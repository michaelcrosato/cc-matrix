<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--AIHUB_CLIENT-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163a3b">
<title>Drainio Bros. — The night shift</title>
<meta name="description" content="Bump. Flip. Boot. An ink-and-copper arcade caper for one to four plumbers.">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="1-4">
<meta name="hub:session-mode" content="shared-world">
<meta name="hub:session-goal" content="Clear eight shifts together. Bump floors from below to flip pests, then touch them to boot them away. Three bumps crack the final Big Clog.">
<meta name="hub:session-howto" content="Stick / D-pad or A-D: move. Cross / Space: jump. Square / E: boot or use BOP nearby. Down + Jump: drop. Options / Esc: pause.">
<meta name="hub:session-minutes" content="7">
<style>/*FONTS*//*STYLES*/</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js","@dimforge/rapier2d-compat":"https://cdn.jsdelivr.net/npm/@dimforge/rapier2d-compat@0.19.3/rapier.mjs"}}</script>
<script>window.addEventListener('error',function(e){const el=document.getElementById('load-detail');if(el)el.textContent='The pipes hit a snag: '+e.message;});window.addEventListener('unhandledrejection',function(e){const el=document.getElementById('load-detail');if(el)el.textContent='The pipes hit a snag: '+(e.reason?.message||e.reason);});</script>
</head>
<body>
<div id="frame">
  <div id="stage" aria-label="Drainio Bros arcade arena"></div>
  <div id="ui">
    <div id="title-screen" class="screen title hidden"></div>
    <div id="hud" class="hud hidden"></div>
    <div id="play-footer" class="play-footer hidden"></div>
    <div id="announcement" class="announcement hidden" role="status" aria-live="polite"></div>
    <div id="attract-banner" class="attract-banner hidden"><b>THE CREW’S ON THE CLOCK</b>Demo shift · any input to clock in</div>
    <div id="touch-coach" class="touch-coach hidden">Drag left to move · tap right to jump</div>
    <button id="touch-action" class="touch-action hidden" aria-label="Context action">BOP</button>
    <div id="toast" class="toast hidden" role="status"></div>
    <div id="debug-label" class="debug-label hidden">WORKSHOP SHIFT · Score is unranked</div>
    <div id="modal" class="veil hidden"></div>
    <div class="film-grain"></div>
  </div>
  <div id="loading" class="load-screen"><div><p>THE MUNICIPAL WATERWORKS PRESENTS</p><h1>DRAINIO BROS.</h1><div class="loading-pipe"><i></i></div><p id="load-detail">Warming the pipes…</p></div></div>
</div>
<script type="module">/*GAME_CODE*/</script>
</body>
</html>
