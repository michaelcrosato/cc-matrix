gull_tip = ["Man overboard. Noted. Carry on.", "I saw that. So did the crab. The crab was kinder.", "Back on the board. That is an order. I have never given a better one."]
gull_glass = ["That glass is mine now. It is the law of the sea.", "One overboard. I shall conduct a very thorough inquiry into its contents."]
gull_dive = ["That was a dive. I am legally required to say so.", "We are not here for form. We are here for splash.", "The panel has conferred. The panel is me.", "The water has lodged a complaint. Well done."]
posey_perfect = ["The whole pond has opened. Nobody asked it to. Do not tell it.", "All of them bloomed. I felt it, in the part of me that is a hinge."]
marjorie_all = ["Marjorie: All five! Oh, you are good. Eleven years I have waited for a smoothie.", "Marjorie: Every one. Put them down. They were never for me, but put them down."]
marjorie_some = ["Marjorie: Well, that is some of them. I will have those. The gull can have the rest. He always does.", "Marjorie: Mostly smoothies. Mostly tray. Mostly you. I will take it."]
marjorie_none = ["Marjorie: A tray. Thank you. Lovely tray. I shall treasure it.", "Marjorie: No, it is fine. I have only been waiting since the first Day 5."]
finale_tip = ["Pip: That is all right. Everyone saw. Please climb back on.", "Pip: The crowd has groaned. It was a kind groan. I measured it.", "Pip: The post is still there. It did not fall. It would like that noted."]
finale_card = ["This is the Big Stand. Please stand. That is the whole of the instructions. Then there is a part with no instructions."]
marjorie_1 = [ "Eat something, dear. There isn't anything. But do try.", "You'll want to keep your shoes by the door. Not for any reason.", "The cushion wrote down how you walked in. It does that.", "I came for the sea air. It's very good. I've had a lot of it.", "Nobody tells you the first morning is the easy one. Well. I've told you.", "That's a nice robe. They're all that robe.","Day one? Oh, how nice. I remember my day one. It was a Tuesday, I think. There were more of us.", "Don't mind the cushion, dear. It means well. It means something, anyway."]
marjorie_2 = [ "Mind the clam. It knows what it's owed.", "The gazebo's lovely at this hour. It's always this hour there.", "He'll say you're doing well. He says it to the furniture.", "I lifted a towel once. Felt marvellous. Year two, that was.", "You've got a bit of colour. It'll pass.", "Second day's when people start asking about the boat. I wouldn't.","Have you met the kettle? Lovely man. Never lifted a thing in his life.", "I had a husband when I arrived. I think he got out. Good for him."]
marjorie_3 = [ "That see-through one's always a little better than you. Mine is. She won't speak to me.", "The pink one came by. It's still coming by. You can hear it.", "Have you tried the crab? Don't. They've got rights here.", "Your number's come down. They do, then they think about it.", "I knew a man who beat himself by two points. He's never been the same.", "Halfway, dear. Of what, I've stopped asking.","You'll see yourself on the mat today. Don't wave. It only encourages you.", "The minutes get longer, you know. Around year six they are quite something."]
marjorie_4 = [ "The Commodore took my sandwich in my third year. I'm told it's still under review.", "Don't look at the post yet. It'll only encourage it.", "The rafts come out tonight. I've saved one. It's mine. Get your own.", "You'd be amazed how long thirty seconds goes on. I've counted. I lost count.", "They whisper because it carries better. That's all it is.", "Sleep well tonight. You won't. But it's polite to say.","They'll tell you about the Big Stand. It's just standing, dear. Then it isn't. Then it is again.", "I've been told I was very close, once. Age 41. They were lovely about it."]
marjorie_5 = [ "They'll try to make you press something. Don't. I pressed something in my fourth year.", "I've a good feeling about you. I've had it about eleven people.", "Wave to me from the post. No, don't. You'll fall in.", "If you get out, there's a rowboat. If you don't, there's Tuesday.", "Everyone's here. Everyone's always here. That's rather the trouble.", "Stand nicely, dear. That's all it ever was.","Day five? Oh, I'm on day five as well. Eleven years now.", "Good luck on the post. I'll be on a raft. I've a good raft. I've had the same raft since Day 5."]
marjorie_stand = ["The Big Stand? Not yet, dear. It opens on Day 5. Everything opens on Day 5. I should know."]
tom = [
  "They are a pair. Well. They are a five. I had a difficult summer.",
  "I keep a towel on each shoulder. One is for the sand. The other is for morale.",
  "Check near the path, and by the cabanas. Things go where you are not. That is how lost works.",
