  "There is a rowboat. It has been there the whole time. It is not locked. It was never locked.",
  "Marjorie: Off you go, dear. Send a postcard. They won't deliver it. I'd just like you to have the stamp.",
  "Please leave your towel. Please take your balance. Please do not tell the others about the boat.",
