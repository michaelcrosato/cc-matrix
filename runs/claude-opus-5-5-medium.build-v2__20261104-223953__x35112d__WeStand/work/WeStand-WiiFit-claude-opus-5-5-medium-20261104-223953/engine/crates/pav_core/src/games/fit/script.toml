  "Marjorie: Day five tomorrow, dear. Oh, I'm on day five as well. You'll like it. It comes round a lot.",
  "Please do not be disappointed. We have kept your room. We never did anything else with it.",
  "Goodnight. Everything is open now. You may practise. Come and see me when the number is lower. I will be here. Gently."
