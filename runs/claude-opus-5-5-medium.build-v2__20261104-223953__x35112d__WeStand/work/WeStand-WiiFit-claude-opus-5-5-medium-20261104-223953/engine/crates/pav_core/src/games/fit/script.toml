guests = [
  "I came for the weekend. It has been a very long weekend.",
  "Have you seen the exit? No? It is lovely, I hear.",
  "I am on my third robe. They replace them while you sleep. I do not ask.",
  "My Balance Age is 58. My other age is 31. I try not to introduce them.",
  "They have told me not to look directly at Posey. I do not know why. It has no eyes either.",
  "I am very relaxed. Please tell them I said that. Please tell them soon.",
  "The Clam looked at me earlier. It does not have a way of doing that.",
  "This is the best holiday I have ever been on. I have been told to say that, but I would have said it anyway. I think."
]
story_1 = [
  "That is the first number done. Now go and bank 3 minutes.",
  "The Stillness Studio is open to the north west. Posey is expecting you. Posey has always been expecting you.",
  "Step on a mat to begin, or press for the Schedule. The rest of the island is for finding out about."
]
story_2 = [
  "Today the Iron Gazebo is open. Big Kettle runs it. He has no limbs, and strong opinions about yours.",
  "Your Wardrobe is by the desk. The Clam may have something for you, if you have fed it.",
  "5 minutes today. They are longer than yesterday's. They are the same length. Please do not check."
]
story_3 = [
  "The Boardwalk is open. Bounce has been waiting since dawn, in the sense that Bounce has been bouncing since dawn.",
  "Also, from today, Yesterday You is on the next mat. That is your own best run, slightly see-through.",
  "I am not comparing you. I am simply showing you both at once, and keeping a chart.",
  "7 minutes today, please."
]
story_4 = [
  "The Lagoon is open. Commodore Gull is in charge. He told me so.",
  "Guests have started whispering about the Big Stand. It is tomorrow. It is only standing. That is what the whispers are about.",
  "9 minutes today. Then sleep. Sleep very well. I cannot stress this enough, though I have been told not to."
]
story_5 = [
  "Today is the Big Stand. It is on the post in the bay. Walk down to the red mat by the pier.",
  "Everyone will be there. They have rafts. Some of them have been on the rafts since Tuesday.",
  "There are no minutes today. There is only the number. Good luck. I have already written it down, in pencil."
]
ending_good = [
