  "Good morning! It is Day 1. Your cabana faces the sea. All the cabanas face the sea. The sea has noticed.",
  "Good morning! It is Day 1. Breakfast was at some point. Let us measure you."
]
pip_morning_2 = [
  "Good morning! It is Day 2. You slept 7 hours and 41 minutes. You turned over 19 times. I am told.",
  "Good morning! Day 2. You look rested. I say that to everyone. It is on a card."
