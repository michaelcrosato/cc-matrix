  "Two-Towel Tom, they call me. There was a Three-Towel Tom. We do not speak of what happened.",
  "If you find a sixth, please do not tell me.",
  "The sand is hot. Walking is hard. Do you know what it is to want a flip-flop?",
  "I used to have a job. I think I was a dentist. Or I knew one."
]
twins = [
