<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#bfe9ff" />
    <link rel="icon" href="data:," />
    <title>Wee Tare</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfe9ff;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        outline: none;
        touch-action: none;
      }
      #msg {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5vh;
        font:
          700 4vh ui-rounded,
          'Segoe UI Rounded',
          system-ui,
          sans-serif;
        color: #3a4a55;
        text-align: center;
        white-space: pre-line;
        pointer-events: none;
      }
      #msg[hidden] {
        display: none;
      }
    </style>
    <script>
      window.__engine = { ready: false, errors: [] };
      function gameFailed(message) {
        if (!window.__engine || typeof window.__engine.help === 'function') return;
        var fix = 'the console names the cause';
        var record = { code: 'APP_START', message: 'the page failed to start: ' + message, fix: fix };
        if (window.__engine.errors.length === 0) {
          var msg = document.getElementById('msg');
          if (msg) msg.textContent = 'Wee Tare could not start.\n' + message;
        }
        window.__engine.errors.push(record);
      }
      addEventListener('error', function (event) {
        gameFailed(event.message || 'a script failed');
      });
      addEventListener('unhandledrejection', function (event) {
        gameFailed(String((event.reason && event.reason.message) || event.reason));
      });
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="msg" role="status" aria-live="polite">Calibrating…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
