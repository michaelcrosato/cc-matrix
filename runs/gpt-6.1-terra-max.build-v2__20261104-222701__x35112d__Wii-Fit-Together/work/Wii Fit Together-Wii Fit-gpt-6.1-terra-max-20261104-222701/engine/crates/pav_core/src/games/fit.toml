name = "Tippy Cay"
about = "A tiny island for a very important wobble."
entrance = { at = [8, 7], facing = "south" }

[camera]
tilt = 58.0
distance = 17.0

[view]
sky = "#d6eef6"
exposure = 1.0
saturation = 0.95
bloom = 0.15
bloom_threshold = 1.3
outlines_on = "objects"
outline_px = 1.0
outline_darken = 0.55
rim = 0.3
fog = true
fog_start = 25.0
fog_end = 110.0
wind = 0.5
"light.sun_elevation" = 52.0
"light.sun_azimuth" = 160.0
"light.sun_intensity" = 0.62
"light.ambient" = 1.15
"cutaway.height_cut" = false
"cutaway.front_cut" = false
"cutaway.fade" = false

[layout]
origin = [-9.0, 0.0, -6.5]

[[layout.layer]]
y = 0
map = '''
~~~~~~~~~~~~~~~~~~
~~~~~........~~~~~
~~~............~~~
~~..............~~
~................~
~................~
~.......P........~
~................~
~................~
~~..............~~
~~~............~~~
~~~~~........~~~~~
~~~~~~~~~~~~~~~~~~
'''

[layout.legend.'~']
blocks = [{ y0 = -0.5, y1 = -0.1, color = "#8fdde0" }]

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#f5dfb5" }]

[layout.legend.'P']
blocks = [{ y0 = -0.5, y1 = 0, color = "#f5dfb5" }]
marker = "player"
