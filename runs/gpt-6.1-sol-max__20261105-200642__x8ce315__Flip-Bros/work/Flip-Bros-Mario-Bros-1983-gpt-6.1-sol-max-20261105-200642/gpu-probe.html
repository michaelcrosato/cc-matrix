<!DOCTYPE html><html><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js';
const renderer=window.renderer=new THREE.WebGPURenderer({antialias:true});await renderer.init();renderer.setSize(1000,600);document.body.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('green');scene.add(new THREE.AmbientLight(0xffffff,2));const camera=new THREE.PerspectiveCamera(50,5/3,.1,100);camera.position.z=10;const m=new THREE.Mesh(new THREE.BoxGeometry(),new THREE.MeshToonMaterial({color:0xffddaa}));scene.add(m);await renderer.renderAsync(scene,camera);document.body.dataset.ready='true';renderer.setAnimationLoop(()=>{m.rotation.y+=.01;renderer.render(scene,camera);});
</script></body></html>
