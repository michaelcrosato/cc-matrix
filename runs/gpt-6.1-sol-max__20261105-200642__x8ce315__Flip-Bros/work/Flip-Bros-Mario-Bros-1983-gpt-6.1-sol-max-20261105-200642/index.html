<script>/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

function updateEffects(dt) {
	for (let i = particles.length - 1; i >= 0; i--) {
		const p = particles[i];
		p.t -= dt;
		p.vy -= dt * 10;
		p.x += p.vx * dt;
		p.y += p.vy * dt;
		p.m.position.set(p.x, p.y, p.z);
		p.m.rotation.z += dt * 5;
		p.m.scale.multiplyScalar(1 - dt * 0.5);
		if (p.t <= 0) {
			effectsGroup.remove(p.m);
			particles.splice(i, 1);
		}
	}
	for (let i = floaters.length - 1; i >= 0; i--) {
		const f = floaters[i];
		f.t -= dt;
		f.y += dt * 0.8;
		const v = new THREE.Vector3(f.x, f.y, 1).project(camera);
		f.el.style.left = (v.x * 0.5 + 0.5) * innerWidth + "px";
		f.el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + "px";
		f.el.style.opacity = Math.min(1, f.t * 3);
		if (f.t <= 0) {
			f.el.remove();
			floaters.splice(i, 1);
		}
	}
	for (const p of platforms) p.mixer.update(dt);
	bellMixer.update(dt);

}

		const pts = (e.type === "boss" ? 750 : 200) * this.combo;

		this.coin(e.x, e.y + 0.5, -1.3);
		this.coin(e.x, e.y + 0.5, 1.3);
		if (e.type === "boss" && e.hp > 1) {
			e.hp--;
			e.stun = 0;
			e.immune = 2.3;
			e.dir = -e.dir;
			e.body.setLinvel({ x: 0, y: 5 }, true);
			floatText(e.hp + " LIDS LEFT!", e.x, e.y + 2, "#ffad7c", true);
		} else {
			const dead = enemyModel(e.type);
			dead.position.set(e.x, e.y, 0.1);
			effectsGroup.add(dead);
			const thrown = {
				m: dead,
				x: e.x,
				y: e.y,
				z: 0,
				vx: p.dir * 9,
				vy: 12,
				t: 1.4,
				max: 1.4,

	hurt(p, sourceX) {
		if (p.inv > 0 || p.dash > 0 || balance.invincible || this.attract) return;
		p.inv = 2.3;
		this.lives--;
		this.metrics.hurts++;
		this.combo = 0;
		this.comboTime = 0;
		p.body.setLinvel({ x: (p.x < sourceX ? -1 : 1) * 7, y: 8.5 }, true);
		burst(p.x, p.y, C.red, 20, 6);
		audio.sfx("hurt");
		shake = 0.24;
		floatText("OUCH!", p.x, p.y + 1, "#ff9e8b", true);

		updateHUD();

	bonusRound() {
		this.phase = 2;
		this.bonus = true;
		this.status = "playing";
		this.bonusLeft = 22;
		this.stageTime = 0;
		this.queue = [];
		for (const e of [...this.enemies]) this.removeActor(e, this.enemies);
		for (const c of [...this.coins]) this.removeActor(c, this.coins);
		for (let i = 0; i < 6; i++) this.coin(-11 + i * 4.4, 1.45, 0, true);
		for (const x of [-11, -7, -3.7, 3.7, 7, 11]) this.coin(x, 5.05, 0, true);
		for (const x of [-7, -2.3, 2.3, 7]) this.coin(x, 8.7, 0, true);
		for (const x of [-11, -6, 6, 11]) this.coin(x, 12.25, 0, true);
		this.bonusTotal = this.coins.length;
		notify("PAYDAY! · Grab every coin!", 3);
		audio.sfx("clear");

	finish(won) {
		if (this.status === "won" || this.status === "lost") return;
		this.status = won ? "won" : "lost";
		this.won = won;
		if (won) {
			this.score += this.lives * 250;
			audio.sfx("clear");
			audio.voice("win", 0.6);
		} else audio.sfx("lose");
		if (!this.attract) {
			try {
				if (
					!AIHub.active &&
					this.score > Number(localStorage.getItem("flipbros-best") || 0)
				)
					localStorage.setItem("flipbros-best", String(this.score));
			} catch {}
			finishOnline(won);
			if (!AIHub.active) showResult(won);
		}
		updateHUD();
	}
	autopilot(p, dt) {
		p.botTimer -= dt;
		const available = this.enemies.filter((e) => !this.botClaims?.has(e.id));
		let target = available.find((e) => e.stun > 0) || available[0];
		if (target) this.botClaims?.add(target.id);
		if (this.bonus) {
			const c = this.coins[0];
			if (c) {
				if (p.botTimer <= 0) {
					p.body.setTranslation({ x: c.x - 0.65, y: c.y }, true);
					p.body.setLinvel({ x: 0, y: 0 }, true);
					p.botTimer = 0.5;
				}
				return { x: 1, jump: false, dash: false, bell: false };
			}
			return EMPTY_INPUT();
		}
		if (!target) return EMPTY_INPUT();
		if (p.botTimer <= 0) {
			if (target.stun) {
				p.body.setTranslation({ x: target.x - 1.5, y: target.y + 0.12 }, true);
				p.body.setLinvel({ x: 0, y: 0 }, true);
				p.botTimer = 1;
			} else {
				const f = floorAt(target.x, target.y - target.half + 0.2);
				if (f && f.index > 0) {
					p.body.setTranslation({ x: target.x, y: f.y - 1.5 }, true);
					p.body.setLinvel({ x: 0, y: balance.jump }, true);
					p.botTimer = 0.7;
				} else {
					if (this.charges <= 0) this.charges = 3;
					this.bellCD = 0;
					this.ring(p);
					p.botTimer = 0.5;
				}
			}
		}
		return {
			x: target.stun ? Math.sign(target.x - p.x) : 0,
			jump: false,
			dash: false,
			bell: false,
		};
	}
	step(dt, inputs = {}) {
		if (!this.world || !["playing", "clear"].includes(this.status)) return;
		this.time += dt;
		this.stageTime += dt;
		this.comboTime = Math.max(0, this.comboTime - dt);
		if (this.comboTime === 0) this.combo = 0;
		this.bellCD = Math.max(0, (this.bellCD || 0) - dt);
		this.world.gravity.y = -balance.gravity;

		if (this.status === "clear") {
			this.clearTime -= dt;

		}
		if (this.bonus) {
			this.bonusLeft -= dt;
			if (this.bonusLeft <= 0 || this.coins.length === 0) {
				const perfect = this.coins.length === 0;
				if (perfect) {
					this.score += 1500;
					this.lives = Math.min(12, this.lives + 1);
					notify("PERFECT PAYDAY! +1500 · +1 LIFE", 3);

			p.y = pos.y;
			p.inv = Math.max(0, p.inv - dt);
			p.dashCD = Math.max(0, p.dashCD - dt);
			p.dash = Math.max(0, p.dash - dt);
			p.bumpCD = Math.max(0, p.bumpCD - dt);
			const f = floorAt(p.x, p.y - p.half + 0.12);
			p.grounded = !!f && Math.abs(p.y - p.half - f.y) < 0.14 && vel.y < 1.2;
			p.coyote = p.grounded ? 0.12 : Math.max(0, p.coyote - dt);
			const inp =
				this.attract || balance.autoplay
					? this.autopilot(p, dt)
					: inputs[p.id] || EMPTY_INPUT();
			vel = p.body.linvel();
			const axis = clamp(Number(inp.x) || 0, -1, 1);
			if (Math.abs(axis) > 0.1) p.dir = Math.sign(axis);
			if (inp.jump && !p.prevJump) p.buffer = 0.14;
			else p.buffer = Math.max(0, p.buffer - dt);
			if (inp.bell && !p.prevBell) this.ring(p);

				p.dashCD = 0.95;
				audio.sfx("dash");
				burst(p.x, p.y, C.paper, 5, 3);
			}
			p.prevJump = !!inp.jump;
			p.prevBell = !!inp.bell;
			p.prevDash = !!inp.dash;
			let vy = vel.y;
			if (p.buffer > 0 && p.coyote > 0) {

				p.grounded = false;
				audio.sfx("jump");
			}
			if (
				!inp.jump &&
				p.prevHeldJump &&

				!this.attract &&
				!balance.autoplay

				vy *= 0.65;
			p.prevHeldJump = !!inp.jump;
			const icy = this.ice.some(

			let vx =
				p.dash > 0
					? p.dir * balance.speed * 2.25
					: lerp(vel.x, axis * balance.speed, Math.min(1, dt * accel));
			if (p.inv > 1.8 && Math.abs(vel.x) > balance.speed) vx = vel.x * 0.98;
			p.preY = p.body.translation().y;

		for (const e of this.enemies) {
			e.x = e.body.translation().x;
			e.y = e.body.translation().y;
			e.immune = Math.max(0, e.immune - dt);
			const v = e.body.linvel();
			const f = floorAt(e.x, e.y - e.half + 0.15);
			e.grounded =
				!!f && Math.abs(e.y - e.half - f.y) < 0.18 && Math.abs(v.y) < 1.2;
			if (e.grounded && f && e.lastFloor !== f.index) {

							e.speed *
							balance.enemyPace *
							(e.type === "boss" ? 1 + (3 - e.hp) * 0.22 : 1),
					y: vy,
				},
				true,

			const pos = p.body.translation(),

			p.x = pos.x;

			if (Math.abs(p.x) > 15.2) {

			}
			if (p.y < -0.5) {
				p.body.setTranslation({ x: -4, y: 1.15 }, true);
				p.body.setLinvel({ x: 0, y: 0 }, true);
				this.hurt(p, 0);
			}
			if (p.preVy > 1 && v.y < 1 && p.bumpCD <= 0) {
				const head = p.y + p.half;
				if (Math.abs(head - 2.11) < 0.22 && Math.abs(p.x) < 1.1) {
					this.ring(p);
					p.bumpCD = 0.28;
				} else {
					for (const f of platforms) {
						const underside = f.y - 0.56;
						if (
							f.index > 0 &&
							p.x > f.x - f.w / 2 - 0.25 &&

				}
			}
			for (const e of [...this.enemies]) {
				if (
					Math.abs(e.x - p.x) < (e.type === "boss" ? 1.37 : 0.94) &&

					const pts = c.bonus ? 100 : 50;
					this.score += pts;
					p.points += pts;
					this.metrics.coins++;
					audio.sfx("coin");
					burst(c.x, c.y, C.gold, 6, 2);
					this.removeActor(c, this.coins);
				}
			for (const s of this.sparks)
				if (Math.hypot(s.x - p.x, s.y - p.y) < 0.95) this.hurt(p, s.x);
		}
		for (const e of this.enemies) {
			e.x = e.body.translation().x;
			e.y = e.body.translation().y;
			if (e.y < 1.2 && Math.abs(e.x) > 13.1) {
				const x = Math.sign(e.x) * 11.6;
				e.body.setTranslation({ x, y: 12.2 }, true);
				e.body.setLinvel({ x: -Math.sign(x) * e.speed, y: 0 }, true);

				e.speed = Math.min(3.4, e.speed * 1.08);

			} else if (Math.abs(e.x) > 15.1) {
				e.body.setTranslation({ x: -Math.sign(e.x) * 14.8, y: e.y }, true);

	addIce(x, y) {
		const m = box(actors, 0xb0f1ef, [x, y + 0.03, 0.15], [2.3, 0.09, 1.6]);
		this.ice.push({ x, y, life: 7.5, mesh: m });
	}
	makeSparks() {
		for (let i = 0; i < (this.phase === 4 ? 2 : 1); i++) {
			const m = new THREE.Group();
			ball(m, C.gold, [0, 0, 0], [0.38, 0.38, 0.3]);
			for (let j = 0; j < 8; j++) {
				const a = (j * Math.PI) / 4,
					ray = box(
						m,
						C.copper,
						[Math.cos(a) * 0.5, Math.sin(a) * 0.5, 0],
						[0.38, 0.1, 0.1],
					);
				ray.rotation.z = a;
			}
			actors.add(m);
			this.sparks.push({ x: 0, y: 2.05 + i * 3.6, mesh: m });
		}
		notify("HOT STUFF! Watch the sparks.", 2.5);
	}
	draw(dt) {
		for (const p of this.players) {
			const pos = p.body.translation(),
				v = p.body.linvel(),
				ud = p.m.userData;
			const target = new THREE.Vector3(
				pos.x,
				pos.y - p.half,
				0.25 + p.id * 0.04,
			);
			p.m.position.lerp(target, Math.min(1, dt * 25));
			p.m.rotation.y = lerp(p.m.rotation.y, p.dir * 0.4, Math.min(1, dt * 12));
			p.m.rotation.z = lerp(
				p.m.rotation.z,
				p.dash > 0 ? -p.dir * 0.2 : 0,
				Math.min(1, dt * 14),
			);
			p.m.visible =
				this.status === "idle" || p.inv <= 0 || Math.sin(this.time * 35) > 0.0;
			let anim =
				Math.abs(v.y) > 1.5 ? "jump" : Math.abs(v.x) > 0.7 ? "walk" : "idle";
			if (anim !== ud.current) {
				ud.actions[ud.current].fadeOut(0.1);
				ud.actions[anim].reset().fadeIn(0.1).play();
				ud.current = anim;
			}
			ud.mixer.timeScale =
				anim === "walk" ? Math.max(0.6, Math.abs(v.x) / 5) : 1;
			ud.mixer.update(dt);
			const f = floorAt(pos.x, pos.y - p.half + 0.1);
			p.shadow.visible = !!f;
			p.shadow.position.set(pos.x, (f?.y || 0.45) + 0.035, 0.1);
			p.shadow.scale.setScalar(
				Math.max(0.4, 1 - (pos.y - p.half - (f?.y || 0.45)) * 0.1),
			);
		}
		for (const e of this.enemies) {
			if (e.m.userData.helmet) e.m.userData.helmet.visible = e.armor > 0;
			const pos = e.body.translation();
			e.m.position.lerp(
				new THREE.Vector3(
					pos.x,
					pos.y - e.half + (e.stun ? e.half * 1.8 : 0),
					0.1,
				),
				Math.min(1, dt * 20),
			);
			e.m.rotation.z = lerp(
				e.m.rotation.z,
				e.stun ? Math.PI : 0,
				Math.min(1, dt * 16),
			);
			e.m.rotation.y = lerp(e.m.rotation.y, e.dir * 0.2, dt * 6);
			e.m.userData.mixer.timeScale = e.stun ? 0.12 : balance.enemyPace;
			e.m.userData.mixer.update(dt);
			if (e.stun > 0 && e.stun < 2)
				e.m.visible = Math.sin(this.time * 20) > 0.0;
			else e.m.visible = true;
			const f = floorAt(pos.x, pos.y - e.half + 0.15);
			e.shadow.visible = !!f;
			e.shadow.position.set(pos.x, (f?.y || 0.45) + 0.02, 0.1);
			e.shadow.scale.setScalar(e.type === "boss" ? 1.8 : 1);
		}
		for (const c of this.coins) {
			c.m.position.set(
				c.x,
				c.y + (c.bonus ? Math.sin(this.time * 3 + c.x) * 0.12 : 0),
				0.55,
			);
			c.m.userData.mixer?.update(dt);
		}
		bellVisual.children[1].material = mat(this.charges > 0 ? C.gold : 0x67746a);
	}
	snapshot() {

			phase: this.phase,
			status: this.status,
			won: !!this.won,
			score: this.score,
			lives: this.lives,

			bestCombo: this.bestCombo,

			stageTime: this.stageTime,
			bonus: !!this.bonus,
			bonusLeft: this.bonusLeft || 0,
			remaining: this.queue?.length || 0,

					x: a.x,
					y: a.y,

					inv: p.inv,
					dash: p.dash,
					points: p.points,
				};

			enemies: this.enemies.map((e) => {
				const a = e.body.translation();
				return {
					id: e.id,
					type: e.type,
					x: a.x,
					y: a.y,
					dir: e.dir,
					stun: e.stun,
					armor: e.armor,
					hp: e.hp,
				};
			}),
			coins: this.coins.map((c) => ({
				id: c.id,
				x: c.x,
				y: c.y,
				bonus: c.bonus,
			})),
			ice: this.ice.map((i) => ({ x: i.x, y: i.y, life: i.life })),
			sparks: this.sparks.map((s) => ({ x: s.x, y: s.y })),
		};
	}
	receive(s) {
		if (!this.world) this.reset(s.players);
		this.phase = s.phase;
		this.status = s.status;
		this.won = s.won;

const net = {

function cleanInput(a) {

function roomSend(data, to = null) {

function acceptRoom(token, peer = null) {
	if (!net.host || net.kind !== "room") return;
	let c = net.channels.get(token);
	if (!c) {
		const free = [1, 2, 3].find((id) => !net.members.some((p) => p.id === id));
		if (free === undefined) {
			if (peer?.open) peer.send({ t: "full" });
			else roomSend({ t: "full" }, token);
			return;
		}
		c = { id: free, peer };
		net.channels.set(token, c);
		net.members.push({
			id: free,
			name: ["Axle", "Rivet", "Socket", "Pip"][free],
		});

			game.addPlayer(
				free,
				["Axle", "Rivet", "Socket", "Pip"][free],
				-3 + free * 2,
			);

	if (peer) c.peer = peer;
	const data = {
		t: "welcome",
		id: c.id,
		code: net.code,
		players: net.members,
		started: net.started,

function receiveRoom(data, fromToken = null) {

		return;
	if (net.host) {
		if (data.t === "hello") acceptRoom(fromToken);
		if (data.t === "input") {
			const c = net.channels.get(fromToken);
			if (c)
				net.inputs.set(c.id, {
					input: cleanInput(data.input),
					time: performance.now(),
				});
		}
		if (data.t === "leave") dropRoomPlayer(fromToken);
		return;
	}
	switch (data.t) {
		case "welcome":
			clearTimeout(net.joinTimer);
			net.me = data.id;
			net.members = data.players;
			net.notice = "Connected. Waiting for the host.";
			if (data.started) {
				net.started = true;
				paused = false;
				hideScreen();
			} else showLobby();
			break;
		case "roster":
			net.members = data.players;
			if (screenMode === "lobby") showLobby();
			break;
		case "begin":
			net.started = true;
			net.finished = false;
			net.members = data.players;
			paused = false;
			game.reset(net.members);
			hideScreen();
			notify("CREW CONNECTED · Clocking in!", 2);
			break;
		case "world":
			if (!net.started) break;
			game.receive(data);
			if (["won", "lost"].includes(game.status) && screenMode !== "result")
				showResult(game.status === "won");
			break;
		case "full":
			clearTimeout(net.joinTimer);
			closeNetwork();
			showOnline();
			$("network-status").textContent = "That room is full. Try another crew.";

function dropRoomPlayer(token) {
	const c = net.channels.get(token);
	if (!c) return;
	net.members = net.members.filter((p) => p.id !== c.id);
	net.inputs.delete(c.id);

async function loadPeer() {
	if (window.Peer) return window.Peer;
	if (window.__peerLoading) return window.__peerLoading;
	window.__peerLoading = new Promise((resolve, reject) => {
		const s = document.createElement("script");
		s.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js";
		s.onload = () => resolve(window.Peer);
		s.onerror = () => {
			window.__peerLoading = null;
			reject(new Error("Peer networking library could not load."));
		};
		document.head.appendChild(s);
	});
	return window.__peerLoading;
}
function randomCode() {

function channelFor(code) {

		net.bc = new BroadcastChannel("flipbros-v1-" + code);
		net.bc.onmessage = (e) => {
			if (e.data.sender === net.token || (e.data.to && e.data.to !== net.token))

		};

async function hostRoom() {
	closeNetwork();
	Object.assign(net, {
		kind: "room",
		host: true,
		me: 0,
		code: randomCode(),
		token: crypto.randomUUID(),
		members: [{ id: 0, name: "Axle" }],
		notice: "Opening the internet connection…",
		started: false,
		finished: false,
		ended: false,
	});
	channelFor(net.code);
	showLobby();
	const code = net.code;
	try {
		const Peer = await loadPeer();
		if (net.kind !== "room" || net.code !== code) return;
		const peer = (net.peer = new Peer("flipbros-v1-" + code, { debug: 0 }));
		peer.on("open", () => {
			if (net.peer !== peer) return;
			net.notice = "Room is online. Share the code with your crew.";
			if (screenMode === "lobby") showLobby();
		});
		peer.on("connection", (c) => {
			const token = c.peer;
			c.on("open", () => acceptRoom(token, c));
			c.on("data", (data) => receiveRoom(data, token));
			c.on("close", () => dropRoomPlayer(token));
			c.on("error", () => dropRoomPlayer(token));
		});
		peer.on("error", (e) => {
			net.notice =
				"Internet connection unavailable (" +
				e.type +
				"). Nearby tabs can still join.";
			if (screenMode === "lobby") showLobby();
		});
	} catch (e) {

}
async function joinRoom(raw) {

	if (code.length !== 6) {
		$("network-status").textContent =
			"Enter the six-letter code from your host.";
		return;
	}
	closeNetwork();
	Object.assign(net, {
		kind: "room",
		host: false,
		me: -1,
		code,
		token: crypto.randomUUID(),
		members: [],
		notice: "Finding your crew…",
		started: false,
		finished: false,
		ended: false,
	});
	channelFor(code);
	$("network-status").textContent = "Finding room " + code + "…";
	roomSend({ t: "hello" });
	net.joinTimer = setTimeout(() => {
		if (net.kind === "room" && net.me < 0) {
			closeNetwork();
			showOnline();
			$("network-status").textContent =
				"Could not reach that room. Check the code and keep the host’s page open.";
		}
	}, 14000);
	setTimeout(async () => {
		if (net.kind !== "room" || net.code !== code || net.me >= 0) return;
		try {
			const Peer = await loadPeer();
			if (net.kind !== "room" || net.code !== code || net.me >= 0) return;
			const peer = (net.peer = new Peer(undefined, { debug: 0 }));
			peer.on("open", () => {
				if (net.kind !== "room" || net.me >= 0) return;
				const c = (net.connection = peer.connect("flipbros-v1-" + code, {
					reliable: true,
					serialization: "json",
				}));
				c.on("open", () => c.send({ t: "hello" }));
				c.on("data", (d) => receiveRoom(d));

					if (net.kind === "room") {
						closeNetwork();
						showOnline();
						$("network-status").textContent =
							"The connection to the host closed.";
					}
				});
				c.on("error", () => {
					if ($("network-status"))
						$("network-status").textContent =
							"Connection interrupted. Check the code or try again.";
				});
			});
			peer.on("error", (e) => {
				if ($("network-status"))
					$("network-status").textContent =
						"Could not reach the host (" + e.type + "). Check the room code.";

		me: 0,

		started: false,

async function setupHub() {
