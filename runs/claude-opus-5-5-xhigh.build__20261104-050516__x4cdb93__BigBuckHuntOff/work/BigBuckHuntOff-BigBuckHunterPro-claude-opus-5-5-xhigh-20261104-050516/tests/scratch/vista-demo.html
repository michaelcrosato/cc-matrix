<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head><body>
<canvas id="screen"></canvas>
<script src="../../engine/my-3d2dge.js"></script>
<script src="../../engine/modules/vista.js"></script>
<script>
const E = My3D2dge, M = 16;
const game = new E.Game({ canvas: 'screen', res: [480, 270], expand: true, view: 'side' });
const hf = new E.Heightfield({ N: 1024 });
hf.generate({ seed: 1101, base: { amp: 16, scale: 240, warp: 40, offset: 30 },
  features: [{ kind: 'river', path: [[560, 80], [600, 400], [640, 560], [700, 900]], width: 9, depth: 1.4, banks: 7 },
             { kind: 'clearView', at: [600, 540], yaw: 190, bearings: [-38, 38], dist: [4, 70], eye: 4.5 }],
  types: c => c.water ? 9 : c.mask & 16 ? 6 : c.slope > .6 ? 4 : c.n > .35 ? 2 : c.n2 > .5 ? 1 : 0,
  forest: c => (c.mask & 24) ? 0 : clamp01((c.n + .1) * 2.2), canopy: { min: 10, max: 18 } });
function clamp01(v) { return Math.max(0, Math.min(1, v)); }
hf.bake({ sun: { yaw: -60, elev: 14, color: '#ffe0b0', ambient: '#7080a0' }, canopy: ['#8a3a1a', '#c86a2a', '#6a7a2a'],
  types: { 0: { a: '#7a8a3a', b: '#8a9040', scale: 8 }, 1: { a: '#a89a50', b: '#9a8a4a', scale: 5 }, 2: { a: '#8a5a2a', b: '#a8682a', c: '#c8481a', speck: .1, scale: 4 }, 4: { a: '#7a7470', b: '#8a8480', scale: 4 }, 6: { a: '#5a4a32', b: '#6a5a3a', scale: 3 }, 9: { a: '#3a4a3a' } },
  farTypes: (h, s) => s > .5 ? 4 : 0 });
const micro = {}; for (let t = 0; t < 14; t++) { const a = new Uint8Array(64 * 64); const n = E.makeNoise(t + 9); for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) { let v = n(x / 3, y / 3) * 22; const hsh = E.hash2(x, y + t * 64); a[y * 64 + x] = hsh > .97 ? 128 + 40 : Math.max(0, Math.min(127, 64 + v)) - 64 & 255; } micro[t] = Int8Array.from(a, v => 0); for (let i = 0; i < a.length; i++) micro[t][i] = 0; micro[t] = a.map((v, i) => { const x = i % 64, y = i / 64 | 0; const q = n(x / 3, y / 3); const h = E.hash2(x, y + t * 64); return h > .985 ? 168 : (q * 30) & 255; }); }
const sky = new E.Backdrop({ sky: ['#7aa0d8', '#b8c8e0', '#f0d0a8'], layers: [{ kind: 'mountains', color: '#8a98b8', y: .52, height: .14, parallax: .05 }, { kind: 'hills', color: '#7a8a9a', y: .56, height: .08, parallax: .1 }, { kind: 'clouds', color: '#f4e8e0', y: .2, parallax: .02 }] });
const vista = new E.Vista({ hf, sky, fog: { color: '#c8d0d8', near: 120 * M, far: 1600 * M }, mist: { top: hf.height(600 * M, 500 * M) / M + 3, color: '#e0e4ea', density: .45, range: 140 }, sun: { yaw: -60, elev: 14 }, micro, water: { deep: '#24444a', sky: '#a0b8c8' } });
const imp = new E.Impostors();
imp.define('oak', { size: [5 * M, 15 * M], variants: 3, paint(g, k, v, f, ox, oy) {
  const t = E.tones(['#c8601a', '#d88a2a', '#a8401a'][v]), tr = E.tones('#5a4030'), R = E.rng(v + 3);
  const tw = Math.max(1, 0.5 * M * k); E.px.rect(g, ox - tw / 2, oy - 8 * M * k, tw, 8 * M * k, tr.base); E.px.rect(g, ox - tw / 2, oy - 8 * M * k, Math.max(1, tw / 3), 8 * M * k, tr.sh);
  for (let i = 0; i < 26; i++) { const a = R() * 6.28, rr = R() * 4 * M * k, x = ox + Math.cos(a) * rr, y = oy - 11 * M * k + Math.sin(a) * rr * .7, s = (1.4 + R()) * M * k; E.px.disc(g, x, y, s, t.sh); E.px.disc(g, x - s * .25, y - s * .3, s * .7, t.base); E.px.disc(g, x - s * .4, y - s * .5, s * .3, t.lt); }
} });
const trees = []; const R = E.rng(5);
for (let i = 0; i < 9000; i++) { const x = R() * 1024, y = R() * 1024; if (hf.forestAt(x * M, y * M) > R() * 1.3 + .1) trees.push({ x: x * M, y: y * M, z: hf.height(x * M, y * M), imp, id: 'oak', variant: i % 3 }); }
const L = new E.Lens(); let yaw = 190 * Math.PI / 180, t0 = 0;
const deer = { x: 600 * M + Math.cos(yaw) * 30 * M, y: 540 * M + Math.sin(yaw) * 30 * M };
game.start({ update(dt) { yaw += game.input.move()[0] * dt * .5; vista.time = game.time; },
  draw(r) { const ex = 600 * M, ey = 540 * M; L.setup({ x: ex, y: ey, z: hf.height(ex, ey) + 4.5 * M, yaw, pitch: 3, fov: 34 }, r.W, r.H);
    const items = trees.filter(t => Math.abs(t.x - ex) < 260 * M && Math.abs(t.y - ey) < 260 * M);
    deer.z = hf.height(deer.x, deer.y);
    items.push({ x: deer.x, y: deer.y, z: deer.z, box: [20, 26], draw(g, ox, oy, k) { E.px.rect(g, ox - 14 * k, oy - 16 * k, 28 * k, 8 * k, '#8a6a4a'); E.px.rect(g, ox - 12 * k, oy - 10 * k, 2, 10 * k, '#6a4a2a'); E.px.rect(g, ox + 10 * k, oy - 10 * k, 2, 10 * k, '#6a4a2a'); } });
    vista.draw(r, L, items); r.text('ms ' + (vista.stats.ms || 0).toFixed(1) + ' items ' + vista.stats.items + ' samples ' + vista.stats.samples, 4, 4, '#fff'); } });
window.__ready = true;
</script></body></html>
