<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head><body>
<canvas id="screen"></canvas>
<script src="../../engine/my-3d2dge.js"></script>
<script src="../../engine/modules/vista.js"></script>
<script src="../../engine/modules/quadruped.js"></script>
<script>
const E = My3D2dge, M = 16;
const game = new E.Game({ canvas: 'screen', res: [480, 270], expand: true, view: 'side' });
const q = location.hash.slice(1) || 'whitetail';
const rows = [['walk', 1.3], ['trot', 3.4], ['run', 8.5], ['graze', 0], ['alert', 0], ['dead', 0]];
const rigs = rows.map(([m, v], i) => ({ m, v, rig: new E.Quadruped({ species: q, sex: 'm', antlers: { points: 10, seed: 3, spread: 1 } }), doe: new E.Quadruped({ species: q, sex: 'f' }), x: 0 }));
game.start({ update(dt) { for (const r of rigs) { const sp = (r.v * M) * (q === 'whitetail' ? 1 : (E.QUADRUPEDS[q].speeds[r.m === 'walk' ? 0 : r.m === 'trot' ? 1 : 2] / (r.v || 1))); const vv = r.m === 'walk' || r.m === 'trot' || r.m === 'run' ? (r.m === 'walk' ? E.QUADRUPEDS[q].speeds[0] : r.m === 'trot' ? E.QUADRUPEDS[q].speeds[1] : E.QUADRUPEDS[q].speeds[2]) * M : 0; r.x += vv * dt;
  for (const rig of [r.rig, r.doe]) rig.update(dt, { x: r.x, y: 0, vx: vv, vy: 0, facing: 0, ground: () => 0, graze: r.m === 'graze' ? 1 : 0, alert: r.m === 'alert' ? 1 : 0, dead: r.m === 'dead' && game.time > 1 ? Math.min(1, game.time - 1) : 0, deadSide: 1 }); } },
  draw(r) { r.sky(['#5a7a9a', '#9ab0c0']); r.overlay(g => { rigs.forEach((R, i) => { const cx = 40 + (i % 3) * 150, cy = 110 + Math.floor(i / 3) * 130, k = q === 'whitetail' ? 2.6 : q === 'elk' ? 1.8 : q === 'moose' ? 1.4 : 3.2;
    const v1 = E.vistaView(k, -60, 8), v2 = E.vistaView(k, -100, 14);
    E.px.rect(g, cx - 30, cy, 140, 1, '#3a5a3a');
    R.rig.draw(g, cx + 20, cy, v1); R.doe.draw(g, cx + 90, cy, v2); E.font.text(g, R.m, cx - 28, cy + 6, '#fff'); }); }); } });
</script></body></html>
