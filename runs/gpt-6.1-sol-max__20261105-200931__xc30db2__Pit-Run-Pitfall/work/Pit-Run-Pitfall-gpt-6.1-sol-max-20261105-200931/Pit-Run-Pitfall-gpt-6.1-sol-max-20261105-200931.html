<html lang="en"><head><meta charset="utf-8">
<script>/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#112e28">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="1-4">
<meta name="hub:session-mode" content="shared-world">
<meta name="hub:session-goal" content="Find six treasures together and reach the sunset gate.">
<meta name="hub:session-howto" content="Move: stick / WASD. Jump: Cross / Space. Climb or grab: Up / E.">
<meta name="hub:session-minutes" content="6">
<title>Pit &amp; Run — A jungle jaunt</title>
<style>:root {
	color-scheme: dark;
	--ink: #102b26;
	--cream: #fff2cc;
	--gold: #ffc85a;
	--muted: #bec9a7;
	--panel: #102e29f5;
	font-family: "Trebuchet MS", Arial, sans-serif;
	font-size: clamp(15px, 1.6vw, 26px);
}
* {
	box-sizing: border-box;
}
html,
body {
	margin: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: #102e29;
	color: var(--cream);
	touch-action: none;
}
button,
input,
textarea,
select {
	font: inherit;
}
button {
	cursor: pointer;
	color: inherit;
	border: 0;
}
button:disabled {
	opacity: 0.38;
	cursor: default;
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
	outline: 3px solid var(--gold);
	outline-offset: 5px;
}
[hidden] {
	display: none !important;
}
#game {
	display: block;
	width: 100%;
	height: 100%;
	position: absolute;
	inset: 0;
}
#vignette {
	position: absolute;
	inset: 0;
	pointer-events: none;
	background: radial-gradient(
		ellipse at 55% 45%,
		transparent 45%,
		#051c224d 100%
	);
}
#loading {
	position: absolute;
	inset: 0;
	display: grid;
	align-content: center;
	justify-items: center;
	gap: 1rem;
	background: #102e29;
	z-index: 90;
}
#loading h1 {
	font-family: Impact, "Arial Black", sans-serif;
	font-size: 4.5rem;
	letter-spacing: 0.02em;
	margin: 0;
	color: var(--gold);
}
#loading h1 i {
	font-family: Georgia, serif;
	font-size: 2.5rem;
}
#loading p {
	font-size: 0.8rem;
	color: var(--muted);
}
.loading-compass {
	font-size: 3rem;
	animation: spin 5s linear infinite;
}
.loadline {
	height: 3px;
	width: 13rem;
	background: #ffffff20;
	overflow: hidden;
}
.loadline span {
	display: block;
	width: 40%;
	height: 100%;
	background: var(--gold);
	animation: load 1.5s ease-in-out infinite;
}
@keyframes spin {
	to {
		transform: rotate(360deg);
	}
}
@keyframes load {
	from {
		transform: translateX(-100%);
	}
	to {
		transform: translateX(350%);
	}
}
#screen {
	position: absolute;
	inset: 0;
	z-index: 20;
	display: flex;
	align-items: center;
	padding: 5vh 6vw;
	background: #091f2460;
}
.title-screen {
	background: linear-gradient(
		90deg,
		#0a2927f2 0%,
		#0a2927d9 26%,
		#0a292754 55%,
		transparent 100%
	) !important;
}
.title-layout {
	width: 100%;
	position: relative;
}
.brand-overline {
	display: flex;
	align-items: center;
	gap: 0.7rem;
	font-size: 0.62rem;
	letter-spacing: 0.3em;
	color: #c4d8b4;
	font-weight: bold;
	margin-bottom: 1rem;
}
.brand-overline:before {
	content: "";
	width: 2.4rem;
	height: 2px;
	background: var(--gold);
}
.game-title {
	font-family: Impact, "Arial Black", sans-serif;
	font-size: clamp(74px, 10.4vw, 180px);
	font-weight: 900;
	line-height: 0.82;
	letter-spacing: 0.025em;
	color: var(--gold);
	text-shadow:
		4px 5px 0 #142e29,
		5px 6px 0 #fff2cc40;
	transform: rotate(-3deg);
	margin: 1rem 0 1.4rem;
	max-width: 60vw;
}
.game-title em {
	font-family: Georgia, serif;
	font-size: 0.6em;
	color: var(--cream);
	font-style: italic;
	vertical-align: 0.07em;
}
.title-tagline {
	font-size: 1rem;
	line-height: 1.5;
	margin: 1.4rem 0 1.5rem;
	color: var(--cream);
	max-width: 25rem;
}
.title-tagline span {
	color: #bcd0b0;
	font-size: 0.8em;
}
.title-buttons {
	display: grid;
	gap: 0.45rem;
	width: min(22rem, 41vw);
}
.menu-button {
	min-height: 2.65rem;
	text-align: left;
	padding: 0.6rem 1rem;
	background: #173e35c9;
	border: 1px solid #a2c6a32e;
	transition:
		background 0.12s,
		transform 0.12s;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 1rem;
	font-size: 0.9rem;
	border-radius: 3px;
}
.menu-button:hover,
.menu-button:focus-visible {
	background: #2e5342;
	border-color: var(--gold);
}
.menu-button.primary {
	background: var(--gold);
	color: #14322a;
	font-weight: 900;
	border-color: var(--gold);
}
.menu-button.primary:hover,
.menu-button.primary:focus-visible {
	background: #ffdd8b;
	transform: translateX(3px);
}
.menu-button .arrow {
	font-size: 1.15em;
	opacity: 0.7;
}
.menu-button small {
	font-size: 0.67em;
	color: #b5c7a8;
}
.menu-button.primary small {
	color: #314535;
}
.title-bottom {
	position: absolute;
	left: 0;
	right: 0;
	bottom: -7vh;
	display: flex;
	justify-content: space-between;
	align-items: center;
	font-size: 0.57rem;
	letter-spacing: 0.12em;
	color: #c4d3ae;
}
.title-note {
	position: absolute;
	right: 0;
	top: 5%;
	width: 12rem;
	transform: rotate(4deg);
	padding: 1rem 1.2rem;
	color: #e8e9bb;
	background: #183d32d4;
	border: 1px solid #f2db9960;
	box-shadow: 5px 6px 0 #0b252360;
}

class JungleAudio {
	constructor() {
		this.ctx = null;
		this.music = 0.1;
		this.effects = 0.75;
		this.muted = false;
		this.next = 0;
		this.beat = 0;

			if (!Ctx) return;
			this.ctx = new Ctx();
			this.master = this.ctx.createGain();
			this.master.gain.value = 0.7;
			this.musicBus = this.ctx.createGain();
			this.musicBus.gain.value = this.music;
			this.fxBus = this.ctx.createGain();
			this.fxBus.gain.value = this.effects;
			this.analyser = this.ctx.createAnalyser();
			this.analyser.fftSize = 256;
			this.musicBus.connect(this.master);
			this.fxBus.connect(this.master);

			this.analyser.connect(this.ctx.destination);

		this.fxBus.gain.setTargetAtTime(this.effects, this.ctx.currentTime, 0.03);
		this.master.gain.setTargetAtTime(
			this.muted ? 0 : 0.7,
			this.ctx.currentTime,
			0.03,
		);
	}
	tone(
		freq,
		time,
		length,
		type = "sine",
		gain = 0.2,
		bus = this.fxBus,
		endFreq = 0,
	) {
		if (!this.ctx || !bus) return;

			g = this.ctx.createGain();
		o.type = type;
		o.frequency.setValueAtTime(freq, time);

			o.frequency.exponentialRampToValueAtTime(
				Math.max(25, endFreq),
				time + length,
			);

		g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), time + 0.008);
		g.gain.exponentialRampToValueAtTime(0.0001, time + length);

		g.connect(bus);
		o.start(time);
		o.stop(time + length + 0.02);
	}

		if (!this.ctx) return;
		const b = this.ctx.createBuffer(
				1,
				Math.ceil(this.ctx.sampleRate * length),
				this.ctx.sampleRate,
			),
			d = b.getChannelData(0);

		for (let i = 0; i < d.length; i++) {
			n = (n + Math.random() * 0.8 - 0.4) * 0.75;
			d[i] = n;
		}

			f = this.ctx.createBiquadFilter(),
			g = this.ctx.createGain();
		s.buffer = b;

		f.connect(g);

		this.metrics.effects++;

		if (name === "jump") {
			this.tone(180, t, 0.16, "triangle", 0.24, this.fxBus, 500);
			this.noise(t, 0.09, 0.05);
		}

			g.gain.exponentialRampToValueAtTime(0.0001, time + 0.08);
			o.connect(form);
			form.connect(g);
			g.connect(this.fxBus);
			o.start(time);
			o.stop(time + 0.09);
			this.metrics.syllables++;
		});
	}
	tick(cave = false, active = true) {
		if (!this.ctx || this.ctx.state !== "running" || this.muted || !active)
			return;
		const now = this.ctx.currentTime;
		if (this.next < now - 0.4) this.next = now + 0.03;
		const melody = [
			0, 7, 12, 14, 12, 7, 4, 7, 0, 7, 12, 16, 14, 12, 7, 4, 2, 9, 14, 16, 14,
			9, 5, 9, 7, 4, 2, -1, 0, 4, 7, 12,
		];

					0.28,
					"sine",
					0.5,

				);

					440 * 2 ** (note / 12) * (cave ? 0.5 : 1),
					t,
					0.12,
					"triangle",
					0.12,
					this.musicBus,
				);
				this.metrics.notes++;
			}
			if (i % 8 === 0)
				this.tone(
					[110, 110, 123.47, 82.41][i / 8],
					t,
					0.6,
					"triangle",
					0.45,
					this.musicBus,
				);
			if (i % 4 === 0) this.tone(75, t, 0.11, "sine", 0.5, this.musicBus, 35);
			if (i % 4 === 2)
				this.tone(950, t, 0.03, "square", 0.025, this.musicBus, 500);
			if (i === 13 || i === 29)
				this.tone(1650, t, 0.18, "sine", 0.055, this.musicBus, 2300);
			this.next += 0.137;
			this.beat++;
		}
	}
	rms() {
		if (!this.analyser) return 0;
		const d = new Uint8Array(256);
		this.analyser.getByteTimeDomainData(d);
		return (
			Math.sqrt(d.reduce((s, x) => s + (x - 128) ** 2, 0) / d.length) / 128
		);
	}
}

		this.physics = physics;
		this.root = new THREE.Group();
		scene.add(this.root);
		this.vines = [];
		this.crocs = [];
		this.logs = [];
		this.snakes = [];
		this.scorpions = [];
		this.fires = [];
		this.treasures = [];
		this.flags = [];
		this.waves = [];
		this.bugs = [];
		this.mixers = [];
		this.decor = [];
		this.colliders = [];
		this.particles = [];
		this.buildBackdrop();
		this.buildTerrain();
		this.buildNature();
		this.buildRuins();
		this.buildEncounters();
		this.buildGate();
	}
	fixed(x, y, w, h, z = 0, d = 1.5) {
		const c = this.physics.createCollider(
			RAPIER.ColliderDesc.cuboid(w / 2, h / 2, d / 2)
				.setTranslation(x, y, z)
				.setFriction(0.05),
		);
		this.colliders.push({ c, x, y, w, h, d });
		return c;
	}
	buildBackdrop() {
		const c = document.createElement("canvas");
		c.width = 16;
		c.height = 512;
		const ctx = c.getContext("2d"),
			g = ctx.createLinearGradient(0, 0, 0, 512);
		g.addColorStop(0, "#7fc2b4");
		g.addColorStop(0.4, "#dce5b1");
		g.addColorStop(0.65, "#f5d896");
		g.addColorStop(1, "#3e7d6a");
		ctx.fillStyle = g;
		ctx.fillRect(0, 0, 16, 512);
		const tex = new THREE.CanvasTexture(c);
		tex.colorSpace = THREE.SRGBColorSpace;
		shape(
			this.root,
			"plane",
			new THREE.MeshBasicMaterial({ map: tex }),
			115,
			10,
			-65,
			500,
			95,
			1,
			false,
		);
		this.sun = shape(
			this.root,
			"disc",
			0xffe3a1,
			30,
			12,
			-45,
			4.4,
			4.4,
			1,
			false,
		);
		shape(
			this.root,
			"disc",
			new THREE.MeshBasicMaterial({
				color: 0xffe8aa,
				transparent: true,
				opacity: 0.22,
				depthWrite: false,
			}),
			30,
			12,
			-44.9,
			6,
			6,
			1,
			false,
		);
		for (let layer = 0; layer < 3; layer++) {
			const s = new THREE.Shape();
			s.moveTo(-100, -25);
			s.lineTo(-100, 0);
			for (let x = -100; x < 390; x += rnd(8, 15))
				s.lineTo(x, rnd(2, 7) + layer * 1.2);
			s.lineTo(400, -25);
			s.closePath();
			shape(
				this.root,
				new THREE.ShapeGeometry(s),
				[0x8cb69b, 0x5f9d88, 0x3e826f][layer],
				0,
				0,
				-38 + layer * 8,
				1,
				1,
				1,
				false,
			);
		}
		for (let i = 0; i < 26; i++) {
			const x = i * 13 - 45,
				z = -17 - rnd(0, 8),
				h = rnd(13, 22);
			shape(
				this.root,
				"cylinder",
				0x397762,
				x,
				h / 2 - 2,
				z,
				rnd(0.35, 0.8),
				h,
				0.5,
				false,
			);
			for (let j = 0; j < 3; j++)
				shape(
					this.root,
					"rough",
					0x45866a,
					x + rnd(-3, 3),
					h - 2 + j * 0.5,
					z,
					rnd(3, 5),
					1.5,
					rnd(1.5, 3),
					false,
				);
			if (i % 2 === 0)
				curve(
					this.root,
					[
						[x, h, z],
						[x + 2, 6, z],
						[x + 1, 2, z],
					],
					0.035,
					0x568b64,
				);
		}
		// An uncharted temple silhouette behind the last stretch.
		for (let i = 0; i < 5; i++)
			shape(
				this.root,
				"box",
				0x86a58a,
				228,
				2 + i * 0.75,
				-28,
				14 - i * 2.2,
				1.1,
				5,
				false,
			);
		shape(this.root, "box", 0x547e71, 228, 6.4, -27.9, 1.3, 2.7, 1, false);
		for (let i = 0; i < 14; i++) {
			const b = new THREE.Group();
			b.position.set(rnd(-8, 245), rnd(7, 14), -12);
			this.root.add(b);
			const wing = shape(b, "cone", 0x244f44, 0, 0, 0, 0.3, 0.17, 0.1, false);
			wing.rotation.z = Math.PI / 2;
			shape(b, "cone", 0x244f44, 0.4, 0, 0, 0.3, 0.17, 0.1, false).rotation.z =
				-Math.PI / 2;
			this.bugs.push({
				m: b,
				x: b.position.x,
				y: b.position.y,
				bird: true,
				phase: rnd(0, TAU),
			});
		}
	}
	buildTerrain() {
		const holes = PITS.map((p) => [p.a, p.b])
			.concat(LADDERS.map((x) => [x - 1, x + 1]))
			.sort((a, b) => a[0] - b[0]);
		let start = -8;
		for (const [a, b] of holes) {
			if (a > start) this.land(start, a);
			start = b;
		}
		this.land(start, 246);
		this.fixed(-7, 3, 1, 8);
		this.fixed(244, 3, 1, 8);
		for (const [a, b] of [
			[43, 95],
			[127, 181],
		]) {
			this.fixed((a + b) / 2, -7.6, b - a, 1.2);
			shape(
				this.root,
				"box",
				0x183f3e,
				(a + b) / 2,
				-5.8,
				-2.2,
				b - a,
				5,
				0.7,
				false,
			);
			shape(this.root, "box", 0x456155, (a + b) / 2, -7.6, 1, b - a, 1.2, 4);
			for (let x = a; x < b; x += 1.7) {
				shape(
					this.root,
					"cone",
					0x3b6559,
					x,
					-4.3,
					-1.2,
					rnd(0.2, 0.6),
					rnd(0.5, 1.4),
					0.7,
				).rotation.z = Math.PI;
				shape(
					this.root,
					"rough",
					0x56745d,
					x,
					-7.05,
					0.9,
					rnd(0.3, 0.6),
					0.3,
					0.4,
				);
				if (Math.round(x) % 5 === 0) {
					shape(
						this.root,
						"rough",
						0x82c5a6,
						x,
						-5.7,
						-1.65,
						0.12,
						0.24,
						0.1,
						false,
					);
				}
			}
			for (let x = a + 2; x < b; x += 7) {
				rod(this.root, [x, -6.7, 0.2], [x, -5.5, 0.2], 0.06, 0x73563a);
				const f = shape(
					this.root,
					"rough",
					0xffbd56,
					x,
					-5.3,
					0.2,
					0.18,
					0.35,
					0.18,
					false,
				);
				this.fires.push({
					x,
					y: -5.5,
					mesh: f,
					decor: true,
					phase: rnd(0, TAU),
				});
				shape(
					this.root,
					"disc",
					new THREE.MeshBasicMaterial({
						color: 0xd6a861,
						transparent: true,
						opacity: 0.07,
						depthWrite: false,
					}),
					x,
					-5.3,
					-1.5,
					1.3,
					1.3,
					1,
					false,
				);
			}
		}
		for (const x of LADDERS) {
			const y = -3.5;
			for (const dx of [-0.53, 0.53])
				rod(
					this.root,
					[x + dx, -7, 0.35],
					[x + dx, 0.8, 0.35],
					0.065,
					0xc89c59,
				);
			for (let yy = -6.8; yy < 0.9; yy += 0.48)
				rod(
					this.root,
					[x - 0.58, yy, 0.4],
					[x + 0.58, yy, 0.4],
					0.055,
					0xd9b76e,
				);
			shape(this.root, "box", 0x374f3a, x, -0.15, -1.3, 1.8, 0.3, 0.4);
		}
		for (const p of PITS) {
			if (p.type === "water" || p.type === "tar") {
				const mat = new THREE.MeshBasicMaterial({
					color: p.type === "water" ? 0x397f73 : 0x343e30,
					transparent: true,
					opacity: 0.92,
				});
				const water = shape(
					this.root,
					"box",
					mat,
					(p.a + p.b) / 2,
					-0.55,
					0,
					p.b - p.a,
					0.3,
					4.4,
					false,
				);
				this.waves.push(water);
				shape(
					this.root,
					"box",
					p.type === "water" ? 0x215e51 : 0x222f2b,
					(p.a + p.b) / 2,
					-1.4,
					-0.2,
					p.b - p.a,
					1.5,
					4,
					false,
				);
				for (let i = 0; i < 12; i++)
					shape(
						this.root,
						"box",
						p.type === "water" ? 0x78b69b : 0x738056,
						rnd(p.a, p.b),
						-0.37,
						rnd(-1.6, 1.8),
						rnd(0.1, 0.6),
						0.025,
						0.04,
						false,
					);
			}
			if (p.type === "tar") {
				p.cover = this.fixed((p.a + p.b) / 2, -0.2, p.b - p.a, 0.4);
				p.coverMesh = shape(
					this.root,
					"box",
					0x77894c,
					(p.a + p.b) / 2,
					-0.16,
					0,
					p.b - p.a,
					0.3,
					2.6,
				);
			}
			const vine = {
				x: (p.a + p.b) / 2,
				anchor: 7.4,
				length: 6,
				phase: Math.PI / 2,
				theta: 0,
				end: new THREE.Vector3(),
				pump: 0,
			};
			vine.pivot = new THREE.Group();
			vine.pivot.position.set(vine.x, vine.anchor, 0.15);
			this.root.add(vine.pivot);
			shape(
				vine.pivot,
				"cylinder",
				0x6c7f40,
				0,
				-vine.length / 2,
				0,
				0.055,
				vine.length,
				0.055,
			);
			for (let k = 0; k < 4; k++) {
				const leaf = shape(
					vine.pivot,
					"rough",
					k % 2 ? 0x76a653 : 0x57924a,
					k % 2 ? 0.16 : -0.16,
					-1.3 - k * 1.1,
					0,
					0.28,
					0.12,
					0.08,
					false,
				);
				leaf.rotation.z = k % 2 ? 0.5 : -0.5;
			}
			shape(vine.pivot, "ball", 0xc5b36f, 0, -vine.length, 0, 0.12, 0.12, 0.12);
			this.vines.push(vine);
			curve(
				this.root,
				[
					[p.a - 3, 7.8, -1],
					[vine.x, 7.4, -1],
					[p.b + 3, 8.5, -1],
				],
				0.2,
				0x34553c,
				true,
			);
		}
		for (const x of [103, 106.5, 110]) {
			this.fixed(x, -0.33, 1.7, 0.66);
			shape(this.root, "rough", 0x8a9271, x, -0.55, 0, 1.1, 0.7, 1.5);
			shape(this.root, "box", 0xadac7c, x, -0.07, 0, 1.65, 0.2, 1.7);
		}
		// First gap gives a safe choice of the vine or the crocodiles' backs.
		for (const x of [24, 27, 30, 198, 201, 204]) this.makeCroc(x);
		for (let i = 0; i < CAMPS.length; i++) {
			const x = CAMPS[i],
				g = new THREE.Group();
			g.position.set(x, 0, -0.8);
			this.root.add(g);
			rod(g, [0, 0, 0], [0, 3, 0], 0.055, 0xd4ba77);
			const flag = shape(
				g,
				"box",
				i === 0 ? PALETTE.gold : 0x85a46c,
				0.47,
				2.5,
				0,
				0.9,
				0.55,
				0.055,
			);
			this.flags.push(flag);
			shape(g, "box", 0x917443, 0, 0.15, 0, 0.7, 0.3, 0.8);
			if (i > 0)
				textBoard(this.root, "CAMP " + (i + 1), x, 0.85, -0.3, 1.8, 0.6);
		}
		textBoard(this.root, "EAST?  →", 5, 1.3, 0.35, 2.1, 0.7);
		textBoard(
			this.root,
			"WAIT FOR THE SMILE|TO GO AWAY",
			20,
			2,
			-0.1,
			3.6,
			1.15,
		);
		textBoard(this.root, "↓  THE LOW ROAD", 45, 1.35, 0.6, 3.2, 0.8);
		textBoard(this.root, "IT COMES & GOES", 55, 1.5, 0.5, 2.8, 0.75);
		textBoard(this.root, "↑  BACK TO DAYLIGHT", 87, -5.15, 0.5, 3, 0.8);
		textBoard(this.root, "↓  MOON IDOL", 129, 1.5, 0.4, 2.7, 0.8);
		textBoard(this.root, "↓  CLIMB UP", 173, -5.2, 0.5, 2.8, 0.75);
	}
	land(a, b) {
		const x = (a + b) / 2,
			w = b - a;
		this.fixed(x, -0.65, w, 1.3);
		const reg = REGIONS.reduce((r, v) => (x >= v.x ? v : r), REGIONS[0]);
		shape(this.root, "box", 0x6b5738, x, -2.05, -0.1, w, 4, 4);
		shape(this.root, "box", reg.color, x, -0.11, -0.05, w, 0.23, 4.2);
		shape(this.root, "box", 0x9baa62, x, -0.01, 2.07, w, 0.13, 0.12, false);
		for (let xx = a + 0.5; xx < b; xx += rnd(1.7, 3.8)) {
			shape(
				this.root,
				"rough",
				rand() > 0.5 ? 0x8d744b : 0x4c5034,
				xx,
				-rnd(0.8, 3.8),
				2.025,
				rnd(0.2, 0.65),
				rnd(0.12, 0.35),
				0.035,
				false,
			);
			if (rand() < 0.65)
				curve(
					this.root,
					[
						[xx, -0.2, 2.04],
						[xx + 0.2, -1.1, 2.04],
						[xx - 0.1, -1.9, 2.04],
					],
					0.025,
					0x384c30,
				);
		}
	}
	palm(x, z, h = 9) {
		const g = new THREE.Group();
		g.position.set(x, 0, z);
		this.root.add(g);
		const bend = rnd(-1.8, 1.8);
		curve(
			g,
			[
				[0, 0, 0],
				[bend * 0.3, h * 0.45, 0],
				[bend, h, 0],
			],
			0.35,
			0x486443,
			true,
		);
		for (let j = 0; j < 6; j++) {
			const angle = (j * TAU) / 6,
				r = 3.7;
			const pts = [
				[bend, h, 0],
				[bend + Math.cos(angle) * r * 0.6, h + 0.55, Math.sin(angle) * 1.2],
				[bend + Math.cos(angle) * r, h - 0.9, Math.sin(angle) * 2],
			];
			curve(g, pts, 0.2, j % 2 ? 0x398257 : 0x559954);
			for (let k = 1; k < 5; k++) {
				const t = k / 5,
					xx = lerp(bend, pts[2][0], t),
					yy = h + Math.sin(t * Math.PI) * 0.5 - t * 0.9,
					zz = pts[2][2] * t;
				const m = shape(
					g,
					"rough",
					j % 2 ? 0x3e8653 : 0x70a458,
					xx,
					yy,
					zz,
					0.75 * (1 - t * 0.5),
					0.1,
					0.4,
					false,
				);
				m.rotation.z = -Math.cos(angle) * 0.4;
			}
		}
		for (let i = 0; i < 3; i++)
			shape(
				g,
				"ball",
				0x8f784a,
				bend + rnd(-0.3, 0.3),
				h - 0.4,
				rnd(-0.3, 0.3),
				0.22,
				0.24,
				0.22,
			);
	}
	fern(x, y, z, size = 1) {
		const g = new THREE.Group();
		g.position.set(x, y, z);
		g.scale.setScalar(size);
		this.root.add(g);
		for (let side = -1; side <= 1; side += 2)
			for (let i = 0; i < 4; i++) {
				const angle = 0.25 + i * 0.38;
				const f = shape(
					g,
					"rough",
					i % 2 ? 0x2d7452 : 0x61954c,
					side * Math.sin(angle) * 0.7,
					Math.cos(angle) * 0.7,
					0,
					0.22,
					0.9,
					0.12,
					false,
				);
				f.rotation.z = -side * angle;
			}
	}
	buildNature() {
		for (let x = -6; x < 247; x += rnd(7, 11))
			this.palm(x, rnd(-6, -3), rnd(8.3, 12.5));
		for (let x = -5; x < 246; x += rnd(2.5, 5)) {
			if (
				PITS.some((p) => x > p.a && x < p.b) ||
				LADDERS.some((l) => Math.abs(l - x) < 1.2)
			)
				continue;
			this.fern(x, 0, rnd(-1.3, -0.9), rnd(0.55, 1.1));
			if (rand() < 0.4) {
				shape(
					this.root,
					"rough",
					0x829467,
					x,
					0.12,
					1.5,
					rnd(0.2, 0.5),
					0.3,
					0.4,
				);
			}
			if (rand() < 0.2) {
				for (let i = 0; i < 3; i++) {
					const xx = x + i * 0.22;
					rod(this.root, [xx, 0, 1.5], [xx, 0.6, 1.5], 0.025, 0x709456, false);
					shape(
						this.root,
						"ball",
						0xf3b56c,
						xx,
						0.65,
						1.5,
						0.12,
						0.15,
						0.09,
						false,
					);
				}
			}
		}
		// Foreground leaves frame the diorama without covering the running lane.
		for (let x = -8; x < 248; x += rnd(7, 12)) {
			this.fern(x, -1.5, 4.2, rnd(0.7, 1.15));
			if (rand() < 0.35) {
				const m = shape(
					this.root,
					"rough",
					0x1a5848,
					x,
					8.5,
					3.8,
					2.7,
					1.2,
					0.25,
					false,
				);
				m.rotation.z = rnd(-0.5, 0.5);
			}
		}
		for (let i = 0; i < 55; i++) {
			const m = shape(
				this.root,
				"ball",
				i % 4 === 0 ? 0xffe19a : 0xd3e6a0,
				rnd(-5, 242),
				rnd(0.6, 6),
				rnd(-1, 2),
				0.035,
				0.035,
				0.035,
				false,
			);
			this.bugs.push({
				m,
				x: m.position.x,
				y: m.position.y,
				phase: rnd(0, TAU),
			});
		}
		for (const x of [34, 78, 115, 186, 224]) {
			for (let i = 0; i < 3; i++) {
				const m = shape(
					this.root,
					"cone",
					0xffa95a,
					x + rnd(-1, 1),
					rnd(1, 3),
					-1,
					0.11,
					0.23,
					0.05,
					false,
				);
				this.bugs.push({
					m,
					x: m.position.x,
					y: m.position.y,
					phase: rnd(0, TAU),
				});
			}
		}
	}

	buildRuins() {
		for (const [a, b] of [
			[43, 95],
			[127, 181],
		]) {
			shape(
				this.root,
				"box",
				0x213f36,
				(a + b) / 2,
				-15,
				-0.1,
				b - a,
				14,
				4,
				false,
			);
			for (let x = a + 1; x < b; x += 2.7) {
				shape(
					this.root,
					"rough",
					x % 2 > 1 ? 0x2c4b3d : 0x355448,
					x,
					-9.4 - rnd(0, 1.6),
					2.05,
					rnd(0.4, 0.9),
					rnd(0.2, 0.5),
					0.04,
					false,
				);
				if (rand() > 0.5)
					curve(

	update(t, dt, found = [], hazardSpeed = 1) {
		const ht = t * hazardSpeed;
		this.vines.forEach((v) => {
			v.pump *= Math.exp(-dt * 2);
			v.theta = Math.sin(ht * 0.82 + v.phase) * (0.92 + v.pump);
			v.pivot.rotation.z = v.theta;
			v.end.set(
				v.x + Math.sin(v.theta) * v.length,
				v.anchor - Math.cos(v.theta) * v.length,
				0.15,
			);
		});
		this.crocs.forEach((c) => {
			c.open = Math.sin(ht * 1.55 + c.phase) > 0.25;
			c.jaw.rotation.z = c.open ? 0.66 : 0.01;
		});
		this.logs.forEach((l) => {
			l.x = l.base + Math.sin(ht * 1.2 + l.phase) * 2.8;
			l.m.position.x = l.x;
			l.m.rotation.z = -l.x * 2.2;
			l.body.setNextKinematicTranslation({ x: l.x, y: 0.44, z: 0 });
		});
		this.snakes.forEach((s) => {
			s.g.rotation.z = Math.sin(ht * 2 + s.phase) * 0.045;
			s.head.position.y = 1.02 + Math.sin(ht * 2 + s.phase) * 0.05;
		});
		this.scorpions.forEach((s) => {
			s.x = s.base + Math.sin(ht * 0.9 + s.phase) * 2.3;
			s.g.position.x = s.x;
			s.g.scale.x = Math.cos(ht * 0.9 + s.phase) > 0 ? 1 : -1;
			s.g.position.y = s.y + Math.sin(ht * 12) * 0.015;
		});
		this.fires.forEach((f) => {
			f.on = f.decor || Math.sin(ht * 1.65 + f.phase) > 0.15;
			f.mesh.visible = f.on;
			f.mesh.scale.y = 1 + Math.sin(t * 20 + f.phase) * 0.13;
		});
		for (const p of PITS)
			if (p.type === "tar") {
				p.closed = Math.sin(ht * 0.92) > 0.35;
				p.cover.setEnabled(p.closed);
				p.coverMesh.visible = p.closed;
			}
		this.treasures.forEach((r, i) => {
			r.g.visible = !found[i];
			r.g.rotation.y = t * 0.9;
			r.g.position.y = r.t.y + Math.sin(t * 2 + i) * 0.12;
			r.halo.rotation.z = t * 0.5;
		});
		this.bugs.forEach((b) => {
			b.m.position.y = b.y + Math.sin(t * (b.bird ? 2 : 1) + b.phase) * 0.3;
			b.m.position.x = b.x + Math.sin(t * 0.4 + b.phase) * (b.bird ? 3 : 0.5);
			if (b.bird) b.m.scale.y = 0.6 + Math.abs(Math.sin(t * 4 + b.phase));
		});
		this.flags.forEach((f, i) => {
			f.rotation.y = Math.sin(t * 3 + i) * 0.15;
		});
		this.gateSlots.forEach(
			(s, i) => (s.material = cel(found[i] ? TREASURES[i].color : 0x426651)),
		);
		const all = found.filter(Boolean).length === 6;
		this.barrier.visible = !all;
		this.decor.forEach((d) => {
			if (d.kind === "cache") {
				d.g.visible = !d.taken;
				d.g.rotation.y = t;
			}
		});
		this.waves.forEach((w, i) => {
			w.position.y = -0.55 + Math.sin(t * 1.5 + i) * 0.025;
		});
		for (let i = this.particles.length - 1; i >= 0; i--) {
			const p = this.particles[i];
			p.life -= dt;
			p.m.position.addScaledVector(p.v, dt);
			p.v.y -= dt * 5;
			p.m.rotation.z += dt * 5;
			p.m.scale.setScalar(Math.max(0, p.life) * p.size);
			if (p.life <= 0) {
				this.root.remove(p.m);
				this.particles.splice(i, 1);
			}
		}
	}
	burst(x, y, hex, count = 16) {
		for (let i = 0; i < count; i++) {
			const m = shape(
					this.root,
					"rough",
					hex,
					x,
					y,
					0.5,
					0.1,
					0.1,
					0.05,
					false,
				),
				v = new THREE.Vector3(rnd(-3, 3), rnd(1, 5), rnd(-0.5, 0.5));
			this.particles.push({ m, v, life: rnd(0.4, 1), size: rnd(0.05, 0.13) });
		}
	}
	reset() {
		this.decor.forEach((d) => (d.taken = false));
		this.flags.forEach(
			(f, i) => (f.material = cel(i === 0 ? PALETTE.gold : 0x85a46c)),
		);
	}
}

class Controls {
	constructor(app) {
		this.app = app;
		this.keys = new Set();
		this.device = "keyboard";
		this.pads = [];
		this.padPrevious = [];
		this.lastMenu = 0;
		this.touch = {
			x: 0,
			y: 0,
			jump: false,
			action: false,
			id: null,
			startX: 0,
			startY: 0,
		};
		this.touchJumpUntil = 0;
		this.jumpSerial = 0;
		window.addEventListener("keydown", (e) => {
			if (
				e.target.matches(
					"textarea,input:not([type=range]):not([type=checkbox])",
				)
			)
				return;
			this.activity("keyboard");
			this.app.audio.unlock();
			if (
				["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(
					e.code,
				) &&
				!e.target.matches("input,select")
			)
				e.preventDefault();
			this.keys.add(e.code);
			if (e.code === "Space" && !e.repeat && this.app.state === "playing")
				this.jumpSerial++;
			if (!e.repeat) {
				if (this.app.ui?.current && ["Enter", "Space"].includes(e.code))
					e.preventDefault();
				this.menuKey(e.code);
			}
		});
		window.addEventListener("keyup", (e) => this.keys.delete(e.code));
		window.addEventListener("blur", () => {
			this.keys.clear();
			this.touch.x = 0;
			this.touch.y = 0;
			this.touch.jump = false;
			if (this.app.state === "playing" && !this.app.net.active)
				this.app.ui.pause();
		});
		document.addEventListener("pointerdown", (e) => {
			if (e.pointerType !== "touch") this.activity("keyboard");
			else this.activity("touch");
			this.app.audio.unlock();
		});
		document.addEventListener("pointermove", (e) => {
			if (e.pointerType === "mouse" && (e.movementX || e.movementY)) {
				this.activity("keyboard");
				const el = e.target.closest("button,input,select,textarea");
				if (this.app.ui?.current && el && el !== document.activeElement)
					el.focus({ preventScroll: true });
			}
		});
		document.addEventListener("pointerover", (e) => {
			const el = e.target.closest("button,input,select,textarea");
			if (
				el &&
				this.device !== "gamepad" &&
				e.pointerType !== "touch" &&
				el !== document.activeElement
			)
				el.focus({ preventScroll: true });
		});
		document.addEventListener("pointerdown", (e) => {
			if (e.target !== $("game")) return;
			const canvas = $("game");
			if (e.pointerType !== "touch" || this.app.state !== "playing") return;
			canvas.setPointerCapture(e.pointerId);
			if (e.clientX < innerWidth * 0.52 && this.touch.id === null) {
				this.touch.id = e.pointerId;
				this.touch.startX = e.clientX;
				this.touch.startY = e.clientY;
			} else {
				this.touch.jump = true;
				this.jumpSerial++;
				this.touchJumpUntil = performance.now() + 160;
			}
		});
		document.addEventListener("pointermove", (e) => {
			if (e.pointerId === this.touch.id) {
				this.touch.x = clamp((e.clientX - this.touch.startX) / 55, -1, 1);
				this.touch.y = clamp((e.clientY - this.touch.startY) / 55, -1, 1);
			}
		});
		const end = (e) => {
			if (e.pointerId === this.touch.id) {
				this.touch.id = null;
				this.touch.x = 0;
				this.touch.y = 0;
			}
		};
		document.addEventListener("pointerup", end);
		document.addEventListener("pointercancel", end);
		$("touchAction").addEventListener("pointerdown", (e) => {
			e.stopPropagation();
			this.touch.action = true;
			this.touch.y = this.app.primary()?.layer ? -1 : 1;
		});
		$("touchAction").addEventListener("pointerup", () => {
			this.touch.action = false;
			this.touch.y = 0;
		});
		window.addEventListener("gamepadconnected", () => {
			this.activity("gamepad");
		});
	}
	activity(device) {
		const wasAttract = this.app.state === "attract";
		this.device = device;
		this.app.lastInput = performance.now();
		if (wasAttract) {
			this.keys.clear();
			this.app.title();
			this.app.ignoreInputUntil = performance.now() + 300;
		}
	}
	menuKey(code) {
		const ui = this.app.ui;
		if (!ui) return;
		if (this.app.state === "attract") return;
		if (code === "Escape") {
			if (this.app.state === "playing") ui.pause();
			else if (ui.current) ui.back();
			return;
		}
		if (!ui.current) return;
		if (code === "ArrowDown" || code === "KeyS") ui.moveFocus(1);
		if (code === "ArrowUp" || code === "KeyW") ui.moveFocus(-1);
		if (code === "ArrowLeft" || code === "KeyA") ui.adjust(-1);
		if (code === "ArrowRight" || code === "KeyD") ui.adjust(1);
		if (code === "Space" || code === "Enter") {
			const el = document.activeElement;
			if (el?.matches("button") && !el.disabled) {
				el.click();
			}
		}
	}
	poll() {
		this.pads = Array.from(navigator.getGamepads?.() || []);
		this.pads.forEach((pad, i) => {
			if (!pad) return;
			const prev = this.padPrevious[i] || [],
				down = (n) => !!pad.buttons[n]?.pressed,
				edge = (n) => down(n) && !prev[n];
			const active =
				pad.axes.some((x) => Math.abs(x) > 0.2) ||
				pad.buttons.some((b) => b.pressed);
			if (active) {
				this.activity("gamepad");
				this.app.audio.unlock();
			}
			if (edge(0) && this.app.state === "playing" && !this.app.ui?.current)
				this.jumpSerial++;
			if (edge(9) && !down(8)) {
				if (this.app.ui.current) this.app.ui.back();
				else if (this.app.state === "playing") this.app.ui.pause();
			}
			if (this.app.ui.current) {
				if (edge(1)) this.app.ui.back();
				if (edge(0) && performance.now() > this.app.ignoreInputUntil)
					document.activeElement?.click?.();
				const now = performance.now(),
					dy = down(13)
						? 1
						: down(12)
							? -1
							: Math.abs(pad.axes[1] || 0) > 0.55
								? Math.sign(pad.axes[1])
								: 0,
					dx = down(15)
						? 1
						: down(14)
							? -1
							: Math.abs(pad.axes[0] || 0) > 0.55
								? Math.sign(pad.axes[0])
								: 0;
				if ((dy || dx) && now > this.lastMenu + 210) {
					if (dy) this.app.ui.moveFocus(dy);
					else this.app.ui.adjust(dx);
					this.lastMenu = now;
				}
			}
			this.padPrevious[i] = pad.buttons.map((b) => b.pressed);
		});
		if (performance.now() > this.touchJumpUntil) this.touch.jump = false;
	}
	frame(index = 0) {
		const zero = { x: 0, y: 0, jump: false, action: false };
		if (performance.now() < this.app.ignoreInputUntil) return zero;
		const pad = this.pads[index],
			k = this.keys;
		const couch = this.app.localCount > 1 && !this.app.net.active;
		let x = 0,
			y = 0,
			jump = false,
			action = false;
		if (index === 0) {
			x = (k.has("KeyD") ? 1 : 0) - (k.has("KeyA") ? 1 : 0);
			y = (k.has("KeyS") ? 1 : 0) - (k.has("KeyW") ? 1 : 0);
			if (!couch) {
				x += (k.has("ArrowRight") ? 1 : 0) - (k.has("ArrowLeft") ? 1 : 0);
				y += (k.has("ArrowDown") ? 1 : 0) - (k.has("ArrowUp") ? 1 : 0);
			}
			jump = k.has("Space");
			action = k.has("KeyE");
			if (this.device === "touch") {
				x = this.touch.x;
				y = this.touch.y;
				jump = this.touch.jump;
				action = this.touch.action;
			}
		}
		if (index === 1 && couch) {
			x = (k.has("ArrowRight") ? 1 : 0) - (k.has("ArrowLeft") ? 1 : 0);
			y = (k.has("ArrowDown") ? 1 : 0) - (k.has("ArrowUp") ? 1 : 0);
			jump = k.has("ShiftRight") || k.has("Numpad0");
			action = k.has("ControlRight") || k.has("Numpad1");
		}
		if (pad) {
			if (Math.abs(pad.axes[0] || 0) > 0.18) x = pad.axes[0];
			if (Math.abs(pad.axes[1] || 0) > 0.18) y = pad.axes[1];
			if (pad.buttons[14]?.pressed) x = -1;
			if (pad.buttons[15]?.pressed) x = 1;
			if (pad.buttons[12]?.pressed) y = -1;
			if (pad.buttons[13]?.pressed) y = 1;
			jump ||= !!pad.buttons[0]?.pressed;
			action ||= !!pad.buttons[2]?.pressed;
		}
		return {
			x: clamp(x, -1, 1),
			y: clamp(y, -1, 1),
			jump,
			action,
			touch: this.device === "touch",
		};
	}
	glyph(action) {
		if (this.device === "touch")
			return {
				jump: "TAP RIGHT",
				action: "TOUCH",
				move: "DRAG LEFT",
				pause: "Ⅱ",
			}[action];
		if (this.device === "gamepad") {
			const xbox = this.app.settings.glyphs === "xbox";
			return {
				jump: xbox ? "Ⓐ" : "✕",
				action: xbox ? "Ⓧ" : "□",
				move: "L",
				pause: xbox ? "☰" : "OPTIONS",
			}[action];
		}
		return { jump: "SPACE", action: "E", move: "A D", pause: "ESC" }[action];
	}
	vibrate() {
		if (!this.app.settings.vibration) return;
		for (const p of this.pads)
			try {
				p?.vibrationActuator?.playEffect("dual-rumble", {
					duration: 140,
					weakMagnitude: 0.25,
					strongMagnitude: 0.5,
				});
			} catch {}
	}
}

class ExpeditionNet {
	constructor(app) {
		this.app = app;
		this.mode = "none";
		this.info = null;
		this.isHost = true;
		this.me = 0;
		this.inputs = new Map();
		this.sendClock = 0;
		this.active = false;
		this.ended = false;
		this.finished = false;
		this.remoteSeen = 0;
		this.lastEvent = 0;
		this.departed = new Set();
		this.seq = 0;
		this.connection = null;
		this.channel = null;
		window.addEventListener("beforeunload", () => {
			if (this.bc)
				this.bc.postMessage({ data: { type: "leave" }, from: this.me });
		});
	}
	async hub(info) {
		this.info = info;
		this.active = true;
		this.mode = "hub";
		this.isHost = info.isHost;
		this.me = info.me;
		this.server = info.server;
		AIHub.on("message", (data, from) => this.receive(data, from));
		AIHub.on("start", () => {
			this.app.hubStarted = true;
		});
		AIHub.on("leave", ({ id }) => {
			this.departed.add(id);
			this.app.removePlayer(id);
			this.inputs.delete(id);
			if (this.isHost)
				this.app.notify("EXPEDITION UPDATE", "A scout has left the trail.");
		});
		AIHub.on("time-up", () => {
			if (this.isHost) this.finish(false);
		});
		AIHub.on("end", () => {
			this.ended = true;
			this.app.state = "ended";
			this.app.audio.muted = true;
			this.app.audio.levels();
			this.app.ui.close();
			$("hubCountdown").hidden = true;
		});
		this.app.start(info.players);
		this.app.state = "hubwaiting";
		AIHub.ready();
	}
	send(data, to) {
		if (this.ended) return;
		if (this.mode === "hub") AIHub.send(data, { to, reliable: true });
		else if (this.channel?.readyState === "open")
			this.channel.send(JSON.stringify(data));
		else if (this.bc) this.bc.postMessage({ data, from: this.me });
	}
	receive(data, from) {
		if (!data || this.ended) return;
		if (
			data.type === "input" &&
			this.isHost &&
			from !== this.me &&
			this.app.players.some((p) => p.id === from)
		) {
			if (typeof data.x !== "number" || typeof data.y !== "number") return;
			this.inputs.set(from, {
				x: clamp(data.x, -1, 1),
				y: clamp(data.y, -1, 1),
				jump: !!data.jump,
				action: !!data.action,
				jumpSerial: Number.isSafeInteger(data.jumpSerial) ? data.jumpSerial : 0,
				stamp: performance.now(),
			});
		}
		if (data.type === "snapshot" && !this.isHost) {
			this.remoteSeen++;
			this.app.applySnapshot(data);
			for (const e of data.events || []) {
				if (e.id > this.lastEvent) {
					this.lastEvent = e.id;
					this.app.eventEffect(e);
				}
			}
		}
		if (data.type === "leave" && this.bc) {
			if (this.isHost) {
				this.app.removePlayer(from);
				this.app.notify("BACK TO SOLO", "Your friend left the trail.");
			} else {
				this.disconnect();
				this.app.title();
			}
			return;
		}
		if (data.type === "hello" && this.bc) {
			if (this.isHost) {
				this.app.start([
					{ id: 0, name: "Scout", color: "#ed9e50" },
					{ id: 1, name: "Pal", color: "#70bad0" },
				]);
				this.send({ type: "welcome" });
			}
		}
		if (data.type === "welcome" && !this.isHost) {
			this.app.start([
				{ id: 0, name: "Scout", color: "#ed9e50" },
				{ id: 1, name: "Pal", color: "#70bad0" },
			]);
		}
	}
	tick(dt) {
		if (!this.active || this.ended) return;
		this.sendClock += dt;
		if (this.sendClock < 1 / 15) return;
		this.sendClock = 0;
		if (this.isHost) {
			this.send(this.app.snapshot());
		} else {
			const f =
				this.app.state === "playing" && !this.app.ui.current
					? this.app.controls.frame(0)
					: { x: 0, y: 0, jump: false, action: false };
			this.send(
				{ type: "input", ...f, jumpSerial: this.app.controls.jumpSerial },
				this.mode === "hub" ? this.info.host : undefined,
			);
		}
	}
	input(id) {
		const f = this.inputs.get(id);
		return f && performance.now() - f.stamp < 650
			? f
			: { x: 0, y: 0, jump: false, action: false };
	}
	finish(won) {
		if (this.ended || !this.isHost || this.finished) return;
		this.finished = true;
		const ids = (
			this.mode === "hub"
				? this.info.players.filter((p) => !this.departed.has(p.id))
				: this.app.players
		).map((p) => p.id);
		if (this.mode === "hub") {
			const scores = {},
				stats = {};
			for (const p of this.app.players) {
				scores[p.id] = this.app.score;
				stats[p.id] = {
					Treasures: this.app.found.filter(Boolean).length,
					Rescues: this.app.stats.rescues,
					"Time left": Math.floor(this.app.timeLeft),
				};
			}
			AIHub.finish({ standings: [ids], scores, won, stats });
		}
	}
	async createPeer(host, code = "") {
		this.disconnect();
		this.mode = "link";
		this.isHost = host;
		this.me = host ? 0 : 1;
		const pc = new RTCPeerConnection({
			iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
		});
		this.connection = pc;
		const setup = (ch) => {
			this.channel = ch;
			ch.onmessage = (e) => {
				try {
					this.receive(JSON.parse(e.data), host ? 1 : 0);
				} catch {}
			};
			ch.onopen = () => {
				this.active = true;
				this.ended = false;
				this.finished = false;
				this.app.start([
					{ id: 0, name: "Scout", color: "#ed9e50" },
					{ id: 1, name: "Pal", color: "#70bad0" },
				]);
			};
			ch.onclose = () => {
				if (this.active) {
					this.active = false;
					this.app.notify(
						"LINK CLOSED",
						"Your friend left. The trail is yours.",
					);
					if (!host) this.app.title();
					else this.app.removePlayer(1);
				}
			};
		};
		pc.onconnectionstatechange = () => {
			if (pc.connectionState === "failed")
				this.app.ui.netStatus(
					"The direct link could not connect. Try an AI Hub session or a different network.",
				);
		};
		if (host) {
			setup(pc.createDataChannel("pit-and-run", { ordered: true }));
			await pc.setLocalDescription(await pc.createOffer());
		} else {
			pc.ondatachannel = (e) => setup(e.channel);
			await pc.setRemoteDescription(this.decode(code));
			await pc.setLocalDescription(await pc.createAnswer());
		}
		await this.gather(pc);
		return btoa(JSON.stringify(pc.localDescription));
	}
	async answer(code) {
		if (!this.connection) throw Error("Create an invite first.");
		await this.connection.setRemoteDescription(this.decode(code));
	}
	decode(code) {
		try {
			const v = JSON.parse(atob(code.trim()));
			if (!v.sdp || !["offer", "answer"].includes(v.type)) throw Error();
			return v;
		} catch {
			throw Error("That code is incomplete. Copy the entire invite or reply.");
		}
	}
	async gather(pc) {
		if (pc.iceGatheringState === "complete") return;
		await new Promise((resolve) => {
			const timer = setTimeout(resolve, 5500);
			pc.addEventListener("icegatheringstatechange", () => {
				if (pc.iceGatheringState === "complete") {
					clearTimeout(timer);
					resolve();
				}
			});
		});
	}
	localRelay(room, host) {
		this.disconnect();
		this.mode = "relay";
		this.active = true;
		this.isHost = host;
		this.me = host ? 0 : 1;
		this.bc = new BroadcastChannel("pit-run-" + room);
		this.bc.onmessage = (e) => this.receive(e.data.data, e.data.from);
		if (host) {
			this.app.start([{ id: 0, name: "Scout", color: "#ed9e50" }]);
		} else {
			this.app.ui.close();
			this.app.state = "linkwaiting";
			this.send({ type: "hello" });
		}
	}
	disconnect() {
		if (this.bc)
			this.bc.postMessage({ data: { type: "leave" }, from: this.me });
		this.active = false;
		this.ended = false;
		this.finished = false;
		if (this.channel) {
			this.channel.onclose = null;
			this.channel.close();
		}
		this.connection?.close();
		this.bc?.close();
		this.channel = null;
		this.connection = null;
		this.bc = null;
		this.mode = "none";
		this.isHost = true;
		this.me = 0;
		this.server = false;
		this.inputs.clear();
		this.lastEvent = 0;
		this.departed.clear();
	}
}

const DEFAULT_TUNING = {
	speed: 6.2,
	jump: 10.8,
	gravity: 25,
	hazardSpeed: 1,
	timeLimit: 360,
	timeScale: 1,
};
const DEFAULT_SETTINGS = {
	music: 0.1,
	effects: 0.75,
	glyphs: "playstation",
	vibration: true,
	shake: true,
};
const PLAYER_COLORS = [0xe8a04d, 0x6eb7ce, 0xa1c66c, 0xc496ce];
class PitRun {
	constructor() {
		this.state = "loading";
		this.players = [];
		this.localCount = 1;
		this.lastInput = performance.now();
		this.ignoreInputUntil = 0;
		this.found = Array(6).fill(false);
		this.score = 0;
		this.simTime = 0;
		this.timeLeft = 360;
		this.teamCamp = 0;
		this.stats = { jumps: 0, swings: 0, hits: 0, rescues: 0, caches: 0 };
		this.events = [];
		this.eventId = 0;
		this.tuning = { ...DEFAULT_TUNING };
		this.settings = { ...DEFAULT_SETTINGS };
		this.dev = { god: false, fly: false, collisions: false, telemetry: false };
		this.roundId = 0;
		this.remoteRound = null;
		this.testInput = null;
		this.manual = false;
		this.hubStarted = false;
		this.cameraX = 22;
		this.cameraY = 3.5;
		this.shake = 0;
		this.toastUntil = 0;
		this.audio = new JungleAudio();
		this.net = new ExpeditionNet(this);
		this.controls = new Controls(this);
		try {
			this.settings = {
				...DEFAULT_SETTINGS,
				...JSON.parse(localStorage.getItem("pitrun-settings") || "{}"),
			};
			this.saved = JSON.parse(localStorage.getItem("pitrun-save") || "null");
			this.best = Number(localStorage.getItem("pitrun-best") || 0);
		} catch {
			this.best = 0;
		}
		this.audio.music = this.settings.music;
		this.audio.effects = this.settings.effects;
	}
	async init() {
		await RAPIER.init();
		this.physics = new RAPIER.World({ x: 0, y: -this.tuning.gravity, z: 0 });
		this.physics.timestep = 1 / 60;
		this.scene = new THREE.Scene();
		this.scene.background = new THREE.Color(0x9abf9b);
		this.scene.fog = new THREE.Fog(0x96b99c, 48, 95);
		this.camera = new THREE.OrthographicCamera(-15, 15, 8.5, -8.5, 0.1, 180);
		this.renderer = new THREE.WebGPURenderer({
			canvas: $("game"),
			antialias: true,
			powerPreference: "high-performance",
			forceWebGL:
				new URLSearchParams(location.search).get("renderer") === "webgl",
		});
		try {
			await this.renderer.init();
		} catch (error) {
			console.warn(
				"WebGPU unavailable. Trying the Three.js WebGL compatibility backend.",
				error.message,
			);
			try {
				this.renderer.dispose();
			} catch {}
			const fresh = $("game").cloneNode(false);
			$("game").replaceWith(fresh);
			this.renderer = new THREE.WebGPURenderer({
				canvas: $("game"),
				antialias: true,
				forceWebGL: true,
			});
			await this.renderer.init();
		}
		this.backend = this.renderer.backend.isWebGPUBackend
			? "WebGPU"
			: "WebGL 2 compatibility";
		this.renderer.outputColorSpace = THREE.SRGBColorSpace;
		this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
		this.world = new JungleWorld(this.scene, this.physics);
		this.demoRig = createExplorer();
		this.scene.add(this.demoRig.root);
		this.demoRig.animate("swing");
		this.ui = new Menus(this);
		this.resize();
		window.addEventListener("resize", () => this.resize());
		$("pauseButton").onclick = () => this.ui.pause();
		this.lastTick = performance.now();
		this.accumulator = 0;
		this.frames = 0;
		this.fps = 0;
		this.fpsTime = 0;

		$("loading").hidden = true;

	resize() {
		const a = innerWidth / innerHeight;
		this.aspect = a;
		const h = Math.max(17, 20 / a);
		this.viewH = h;
		this.cameraH = h;
		this.camera.left = (-h * a) / 2;
		this.camera.right = (h * a) / 2;
		this.camera.top = h / 2;
		this.camera.bottom = -h / 2;
		this.camera.updateProjectionMatrix();
		this.renderer?.setSize(innerWidth, innerHeight);
	}
	primary() {
		return this.players.find((p) => p.id === this.net.me) || this.players[0];
	}
	addPlayer(desc, index) {
		const rig = createExplorer(
			desc.color
				? new THREE.Color(desc.color).getHex()
				: PLAYER_COLORS[index % 4],
		);
		this.scene.add(rig.root);
		const body = this.physics.createRigidBody(
			RAPIER.RigidBodyDesc.dynamic()
				.setTranslation(1 + index * 0.9, 0.74, 0)
				.lockRotations()
				.setCanSleep(false)
				.setCcdEnabled(true),
		);
		const collider = this.physics.createCollider(
			RAPIER.ColliderDesc.capsule(0.45, 0.26)
				.setFriction(0)
				.setRestitution(0)
				.setCollisionGroups(0x00020001),
			body,
		);
		const debugMat = new THREE.MeshBasicMaterial({

		});
		const debugCollider = shape(
			rig.root,
			new THREE.CapsuleGeometry(0.26, 0.9, 4, 8),
			debugMat,
			0,
			0.71,
			0,
			1,
			1,
			1,
			false,
		);
		debugCollider.visible = this.dev.collisions;
		const p = {

			[12, 36, 0, "run"],

			[48, 132, -7, "climb"],

				}

				(this.primary()?.x || 0).toFixed(2) +
				"  y " +
				(this.primary()?.y || 0).toFixed(2) +
				"\nstate " +

				this.simTime.toFixed(1) +

	updateCamera(dt) {

			ty = 3.7;

				const xs = this.players.map((a) => a.x),
					ys = this.players.map((a) => a.y);

					this.viewH,

	context(p) {

				text = this.controls.glyph("jump") + "  LEAP · MOVE TO PUMP";

			} else if (p.climb !== null) {
				text = "MOVE UP / DOWN · " + this.controls.glyph("jump") + "  LET GO";
				action = "CLIMB";
			} else if (
				LADDERS.some((x) => Math.abs(x - p.x) < 1.9) &&
				((p.y > -0.5 && p.y < 1) || p.y < -5.5)

					this.controls.glyph("action") +

					(p.layer ? "CLIMB TO DAYLIGHT" : "TAKE THE LOW ROAD");
				action = p.layer ? "UP" : "DOWN";

					(v) => Math.hypot(v.end.x - p.x, v.end.y - p.y - 1.8) < 2.3,

	moveFocus(dir) {
		const all = this.focusables();
		if (!all.length) return;
		let i = all.indexOf(document.activeElement);
		i = (i + dir + all.length) % all.length;
		all[i].focus();
		all[i].scrollIntoView({ block: "nearest" });
		this.app.audio.sfx("menu");
	}
	focusables() {
		return [
			...$("screen").querySelectorAll(
				"button:not(:disabled),input,select,textarea",

	adjust(dir) {
		const el = document.activeElement;
		if (!el) return;
		if (el.matches("input[type=range]")) {
			el.value = String(
				clamp(
					Number(el.value) + dir * Number(el.step || 1),
					Number(el.min),
					Number(el.max),
				),
			);
			el.dispatchEvent(new Event("input", { bubbles: true }));
		}
		if (el.matches("select")) {
			el.selectedIndex = clamp(
				el.selectedIndex + dir,
				0,
				el.options.length - 1,
			);
			el.dispatchEvent(new Event("change", { bubbles: true }));
		}
		if (el.matches("input[type=checkbox]")) {
			el.checked = !el.checked;
			el.dispatchEvent(new Event("change", { bubbles: true }));
		}
	}
	back() {
		if (this.current === "title") return;
		if (this.current === "pause") {
			this.action("resume");
			return;
		}
		if (this.current === "dev") {
			this.pause();
			return;
		}
		if (["host", "join", "relay"].includes(this.current)) {
			this.app.net.disconnect();
			this.link();
			return;
		}
		if (this.current === "link") {
			this.party();
			return;
		}
		if (this.current === "party") {
			this.app.title();
			return;
		}
		if (this.current === "results") {
			if (this.app.net.mode !== "hub") this.action("quit");
			return;
		}
		if (this.origin === "pause" && this.app.players.length) this.pause();

	input(el) {

			group = el.dataset.group;

			el.type === "checkbox"
				? el.checked
				: el.tagName === "SELECT"
					? el.value
					: Number(el.value);

			this.app.settings[key] = ["music", "effects"].includes(key)
				? value / 100
				: value;
			this.app.audio.music = this.app.settings.music;
			this.app.audio.effects = this.app.settings.effects;
			this.app.audio.levels();
			this.app.saveSettings();
			this.prompts();
		}
		if (group === "tuning") this.app.tune(key, value);
		if (group === "dev") {
			this.app.dev[key] = value;
			if (key === "collisions") this.app.collisionView(value);

				for (const p of this.app.players) {
					p.collider.setSensor(false);
					p.body.setGravityScale(1, true);
				}

		if (out) out.textContent = value + (el.dataset.unit || "");
	}
	async action(action, el) {

		else if (action === "back") this.back();
		else if (action === "settings") {
			if (this.current === "title") this.origin = "title";
			this.settings();
		} else if (action === "guide") {
			if (this.current === "title") this.origin = "title";
			this.guide();
		} else if (action === "about") {
			if (this.current === "title") this.origin = "title";
			this.about();
		} else if (action === "aboutTab") this.about(el.dataset.tab);
		else if (action === "party") {
			this.origin = "title";
			this.party();
		} else if (action === "fewer" || action === "more") {
			this.partyCount = clamp(
				this.partyCount + (action === "more" ? 1 : -1),
				1,
				4,
			);
			$("partyCount").textContent = this.partyCount;
		} else if (action === "couch") {
			a.net.disconnect();
			a.start(this.partyCount);
		} else if (action === "link") this.link();
		else if (action === "host") this.linkPage(true);
		else if (action === "join") this.linkPage(false);
		else if (action === "relay") this.relay();
		else if (action === "relayHost" || action === "relayJoin")
			a.net.localRelay(
				$("relayRoom").value.trim() || "jungle",
				action === "relayHost",
			);
		else if (action === "makeInvite" || action === "makeReply") {
			const input = $("netInput")?.value || "";
			this.netStatus("Marking the trail…");
			el.disabled = true;
			try {
				const code = await a.net.createPeer(action === "makeInvite", input);
				if ($("netOutput")) $("netOutput").value = code;
				this.netStatus(
					action === "makeInvite"
						? "Invite ready. Send it, then paste your friend’s reply."
						: "Reply ready. Send it to the host. Keep this page open.",
				);
			} catch (error) {
				this.netStatus(error.message);
			} finally {
				el.disabled = false;
			}
		} else if (action === "acceptReply") {
			try {
				await a.net.answer($("netInput").value);
				this.netStatus("Connecting to your friend…");
			} catch (error) {
				this.netStatus(error.message);
			}
		} else if (action === "copyCode") {
			const out = $("netOutput");
			try {
				await navigator.clipboard.writeText(out.value);
				this.netStatus("Code copied.");
			} catch {
				out.focus();
				out.select();
				this.netStatus("Code selected. Press Ctrl+C to copy.");
			}
		} else if (action === "cancelLink") {
			a.net.disconnect();
			this.link();
		} else if (action === "quit") {
			if (a.net.mode === "hub") return;
			a.net.disconnect();
			a.title();
		} else if (action === "restart") {
			if (a.net.mode === "hub") return;
			const roster = a.players.map((p) => ({ id: p.id, name: p.name }));
			a.start(roster);
		} else if (action === "retry") a.retry();
		else if (action === "fullscreen") {
			try {
				if (document.fullscreenElement) await document.exitFullscreen();
				else await document.documentElement.requestFullscreen();
			} catch {
				a.notify("STAY A WHILE", "Fullscreen is unavailable in this view.");
			}
		} else if (action === "dev") this.dev();
		else if (action === "warp") {
			const i = Number($("warpSelect").value),
				point =
					i === 6 ? [63, -7] : i === 7 ? [147, -7] : [REGIONS[i].x + 2, 0.05];
			for (const p of a.players) a.teleport(p, point[0] + p.id * 0.5, point[1]);
			a.cameraX = point[0] + 4;
			a.cameraY = point[1] + 3;
			a.notify("DEVELOPER TRAVEL", "Trail position updated.");
		} else if (action === "heal") {
			a.players.forEach((p) => {
				p.health = 3;
				p.invuln = 2;
			});
			a.notify("FRESH LEGS", "Hearts restored.");
		} else if (action === "grant") {
			a.found.fill(true);
			a.score = Math.max(a.score, 6000);
			a.notify("SIX OF THE BEST", "The sunset gate is open.");
		} else if (action === "refill") {
			a.timeLeft = a.tuning.timeLimit;
			a.notify("A LONGER AFTERNOON", "Daylight restored.");
		} else if (action === "resetTuning") {
			for (const [k, v] of Object.entries(DEFAULT_TUNING)) a.tune(k, v);
			this.dev();
		} else if (action === "reel") {
			a.net.disconnect();
			a.attract();
		}
	}

	await app.init();
	const info = await hubInfo;
	if (info) await app.net.hub(info);
	app.renderer.setAnimationLoop((t) => app.frame(t));
	window.__gameReady = true;
} catch (error) {
	console.error(error);
	$("loading").hidden = false;
	$("loadMessage").textContent =
		"The trail could not load. " +
		error.message +
		" Check the connection and use a WebGPU or WebGL 2 browser.";
	if (AIHub.active) AIHub.fail(error.message);
}
</script>
</body></html>
