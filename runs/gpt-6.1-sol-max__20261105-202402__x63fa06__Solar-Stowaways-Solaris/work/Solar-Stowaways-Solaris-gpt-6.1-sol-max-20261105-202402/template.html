<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--HUB_CLIENT-->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08171e">
<meta name="hub:session" content="1">
<meta name="hub:session-players" content="1-4">
<meta name="hub:session-mode" content="ghost">
<meta name="hub:session-goal" content="Bring three stranded pilots home and destroy the Corsair carrier. Highest flight score wins.">
<meta name="hub:session-howto" content="Left stick / WASD: fly. Right stick / mouse: aim. R2 / click: fire. L2 / E: tractor. L1 / Q: pulse. R1 / Shift: boost. Triangle / Tab: chart.">
<meta name="hub:session-minutes" content="7">
<title>Solar Stowaways</title>
<style>/*STYLE*/</style>
</head>
<body>
<div id="game"><canvas id="space" aria-label="Solar Stowaways space flight"></canvas><canvas id="instruments" aria-hidden="true"></canvas></div>
<div id="wash"></div><div id="vignette"></div><div id="noise"></div>
<div id="hud" hidden>
 <div class="hudtop"><div class="brandmark">S<span>✦</span>S <small>FRONTIER / RESCUE DIVISION</small></div><div id="flighttag"></div><button id="pauseButton" aria-label="Pause flight">Ⅱ</button></div>
 <div class="objective"><span id="sectorLabel" class="eyebrow"></span><h2 id="objectiveText"></h2><div id="objectiveDetail"></div></div>
 <div id="targetHint"></div>
 <div class="vitals"><div class="vital"><span>SHIELD</span><div class="track"><i id="shieldBar"></i></div><b id="shieldNum"></b></div><div class="vital"><span>HULL</span><div class="track"><i id="hullBar"></i></div><b id="hullNum"></b></div><div class="vital fuel"><span>FUEL</span><div class="track"><i id="fuelBar"></i></div><b id="fuelNum"></b></div></div>
 <div id="scoreHud"><span class="eyebrow">FLIGHT SCORE</span><b id="scoreNum">000000</b><span id="comboText"></span></div>
 <div id="radio"><div class="radioicon">◖◗</div><div><span id="radioWho" class="eyebrow"></span><p id="radioText"></p></div></div>
 <div id="controlHints"></div><div id="wingHud"></div>
 <button id="touchAction" hidden>TRACTOR</button>
 <div id="heat"><span>HEAT</span><i></i><b></b></div>
</div>
<div id="attractBanner" hidden><span>FLIGHT RECORDER / AUTOPILOT</span><b>ANY INPUT TO TAKE THE HELM</b></div>
<div id="notice" role="status"></div>
<main id="menu"></main>
<div id="loading"><div class="loadingmark">✦</div><b>SOLAR STOWAWAYS</b><span id="loadStatus">IGNITING THE STAR DRIVE</span><i></i></div>
<script>/*CREDITS*/</script>
<script>/*GAME*/</script>
</body></html>
