# ---------------------------------------------------------------- Posey: serene, short, oddly poetic

"posey.breath" = [
  "Breathe in the sea. Not literally.",
  "The lotus opens. It was going to anyway.",
  "In. Out. There is no third direction.",
  "You are a tide. A small one. Local.",
  "Let the last breath be long. It has nowhere to be.",
]
"posey.pose_start" = [
  "Be the heron. The heron does not check the score.",
  "Stand as if someone has asked you a difficult question and left.",
  "Let your spine remember. It was a tree. It was not. Let it remember anyway.",
]
"posey.pose_next" = [
  "Another shape. The body is mostly opinions.",
  "Fold. Unfold. Apologise to no one. Except the knee.",
  "Good. This one is harder. I have no eyes, and I can see that.",
  "Be the lighthouse. It is tired too. It stays on.",
  "This pose has no name in any language. We have given it one anyway.",
]
"posey.gull" = ["There is a bird on you. Accept the bird."]
"posey.tip" = [
  "You have moved. Nobody saw. I have no eyes.",
  "The floor caught you. It was waiting.",
  "A fall is only a very fast pose.",
  "Return. The pose did not go anywhere.",
]
"posey.talk" = [
  "I have no eyes. I have never blinked. This has not been discussed.",
  "I was carved to show how people stand. I have seen how people stand. I am sorry.",
  "Stillness is not the absence of movement. It is mostly the absence of movement.",
  "Do you hear the sea? It has been saying the same thing for a long time. I admire that.",
  "My joints are wooden. Yours will be too, later, in a sense.",
  "I do not sleep. I fold at night. It is similar.",
  "Inhale. No, you may stop. That was only an example.",
  "A heron stands on one leg because the other leg is not its concern.",
  "You look at me as if I were going to say something. I am not. That was it.",
  "Before I was a coach, I was a reference. Nobody asks after a reference.",
  "Someone drew me once. They got the hands wrong. I have forgiven them. Their hands were wrong as well.",
  "The body is a guest in the body.",
  "I teach you to do nothing with great care. It is a career.",
]

# ---------------------------------------------------------------- Big Kettle: booming, gentle, no arms

"kettle.squat_start" = ["Lift with your legs. I cannot. I have none. Lift for both of us.", "DOWN slowly, little friend. UP gently. I AM SO PROUD OF YOU ALREADY."]
"kettle.squat_rep" = [
  "That is ONE. I believe in you.", "That is TWO. I have never done two.", "THREE. Your knees are speaking. I hear them. They are proud.",
  "FOUR. I would clap. I am sixteen kilos of iron with a handle.", "FIVE. Halfway. I have no idea what halfway feels like.",
  "SIX. Beautiful. I am weeping, in rust.", "SEVEN. Keep your back straight. I have no back. Keep yours.",
  "EIGHT. You are stronger than me. I am very heavy and I cannot move.", "NINE. One more. I would never lie to you.",
  "That is TEN. Well done, little friend.",
]
"kettle.squat_end" = ["Ten. Also eleven.", "There was no eleven. I got excited."]
"kettle.plank_start" = ["Now we have a plank. Hold both, and do not fall. I will talk. It helps me."]
"kettle.plank_talk" = [
  "Did I tell you about the time I was lifted? It was 2019. It was brief.",
  "Your arms are shaking. That is called love. I think. I have only read about arms.",
  "Do not look down. Down is where I live. It is fine. It is just not for you.",
]
"kettle.plank_joke" = ["What do you call a kettlebell with no handle? A BALL! HA HA HA HA HA oh. Oh no. Sorry. HA HA!"]
"kettle.plank_win" = ["A FULL MINUTE! I have never been so moved. I have never been moved."]
"kettle.plank_fail" = ["You lay down! I also am lying down. We are the same now. It is very peaceful."]
"kettle.talk" = [
  "HELLO, LITTLE FRIEND. I am Big Kettle. I am supportive. I am also a doorstop on weekends.",
  "You have such long arms. Two of them! What do you do with the second one?",
  "I have never lifted anything. I have only been lifted. It gives you perspective. Low perspective.",
  "Protein is important. I do not know why. I am a solid sphere.",
  "Tell me about your knees. I have always wanted to know about knees.",
  "When you go home, lift something for me. Something small. A soup.",
  "BREATHE, LITTLE FRIEND. I do not breathe. I am told it is popular.",
  "Rust is just iron having a feeling.",
  "The gazebo is white and I am black. People say we make a handsome pair. Only the gazebo says it.",
  "I am so glad you came. Nobody comes. They are brought.",
  "My handle is my only feature. Please do not stare at it. Please do stare at it.",
  "I do not know what a gym is. I am told I live in one. This one has a nice breeze.",
]

