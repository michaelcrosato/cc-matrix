"card.breath_bloom" = ["Hold to breathe in, release to breathe out, and follow the ring. Keep the dot in the middle.", "Breathe in the sea. Not literally."]
"card.pose_parade" = ["Hold each pose while the dot stays in a drifting ring. Stay in and your streak climbs.", "Be the heron. The heron does not check the score."]
"card.tempo_squats" = ["Hold to go down, release to rise, in time with the bar. Keep the dot in the band.", "Lift with your legs. I cannot. I have none. Lift for both of us."]
"card.plank_standoff" = ["Hold both step buttons and keep the dot in the ring for as long as you can stand it.", "I will be right here. I am always right here. I weigh eleven kilos and have no plans."]
"card.step_party" = ["Step on the footprints as the notes land. Left, right, or both.", "Left right left right is that your heartbeat? Mine is just air!"]
"card.floatie_spin" = ["Circle your lean to keep the rings up. When a guest throws one, catch it on that side.", "Round and round and round and switch and round!"]
"card.morning_lap" = ["Alternate your feet to set a pace, stay in the green, and lean to dodge. Grab ribbons.", "Catch me catch me you can't actually I'm a ball!"]
"card.tide_table" = ["Your lean tilts the raft. Roll the hermit crabs into the tide pools. Fast shells skip right over.", "The crabs have signed a waiver. The crabs cannot read."]
"card.paddle_slalom" = ["Lean left and right to steer through the gates. Lean forward to go faster. Lean less to stay dry.", "That is a channel. You will pass through the gates. I am legally required to say so."]
"card.tray_trek" = ["Walk the pier with five smoothies. Tilt the tray to keep the glasses from sliding off.", "Marjorie ordered these in the spring. Do not keep her waiting. Again."]
"card.cannonball_cup" = ["Press at the bottom of three bounces, then leap on the fourth. Hold to tuck. Enter tucked.", "We are not here for form. We are here for splash."]
"card.big_stand" = ["Five phases, on one small post, in front of everyone. The last one is the hard one.", "Please stand on the post. Gently. It remembers everything too."]

# ---------------------------------------------------------------- Pip: front desk, scorekeeper

"pip.intro" = [
  "Welcome to Tippy Cay! You have won a complimentary stay. You did not enter. Nobody enters.",
  "I am Pip. I am a cushion, and I am the front desk. I keep records of everything. Please do not read them.",
  "Your stay is five days. To check out, you need a Balance Age of 40 or better. Nobody has asked to leave yet.",
  "Each morning you will stand on me. Gently. I remember everything. Then you will do exercises and get a stamp.",
  "Your cabana is ready. It was ready before you were born. Good night, {name}.",
]
"pip.morning1" = ["Good morning, {name}! It is Day 1 of five. I counted them for you.", "Please come and stand on me. It takes about a minute. It takes me longer to get over it."]
"pip.morning2" = ["Good morning! It is Day 2. You came back. They usually do, there is only the one path.", "The Iron Gazebo has opened. Big Kettle has been told you are coming. Please stand on me."]
"pip.morning3" = ["Good morning! Day 3. You look well. That is a thing I say to everyone, as a courtesy.", "The Boardwalk is open. Someone new will be following you around today. It is you. Please stand on me."]
"pip.morning4" = ["Good morning! Day 4. The guests have begun whispering about the Big Stand. I told them to.", "The Lagoon is open, under the command of a seabird. Please stand on me."]
"pip.morning5" = ["Good morning. It is Day 5. I want you to know I have enjoyed recording you.", "After this morning's check, the Big Stand waits in the bay. Please stand on me. One last time this stay."]
"pip.absence1" = [
  "You were away for 1 day. I did not count it. There was 1.",
  "You were gone for a day. The clam asked about you. It did not. I am being kind.",
  "Welcome back. It has been a day. I kept your towel. I kept all of your towels.",
]
"pip.absence" = [
  "You were away for {n} days. I did not count them. There were {n}.",
  "You were gone for {n} days. The clam asked about you. It did not. I am being kind.",
  "Welcome back. {n} days have passed. I kept your towel. I kept all of your towels.",
  "It has been {n} days. Your wobble has not missed you. I checked with it.",
  "{n} days away. Did you know? Standing still for {n} days burns calories. Not many. Did you know that, though?",
]
"pip.back" = ["Welcome back, {name}. Your day is where you left it. Nothing has moved. I checked.", "Oh, you again. Good. Your minutes are all still here. I counted them while you were gone.", "Hello, {name}. I told everyone you had stepped out. They did not ask."]
"pip.check_test" = [
  "Stand still. This is the whole test. Please do not do anything else.",
  "Now lean where I tell you. I will say a percentage. It will seem very exact. It is.",
  "Now close your eyes. I will do it for you. Listen to the tone. Lower is left. It is a little sad.",
  "Now eight steps. To this tick. I find it soothing. You may not.",
]
