# ---------------------------------------------------------------- Commodore Gull: dry, officious, steals snacks

"gull.tide_start" = ["The raft tilts when you do. The crabs roll where it tilts. This is called command. Do not let it go to your head."]
"gull.tide_board" = ["", "Board two. Five crabs. One pool has been told to move about. It was not my idea.", "Board three. Seven crabs. The tide is coming in. It has a permit. You do not."]
"gull.paddle_start" = ["That is a channel. You will pass through the gates. I am legally required to say so."]
"gull.paddle_tip" = ["Man overboard. I have noted the time.", "You have entered the water without authorisation.", "That was not a gate.", "Again. I shall need a larger logbook."]
"gull.paddle_miss" = ["That gate was missed. Two seconds have been added, with regret.", "Gate. Missed. The buoy will recover.", "The gates are the things you go between. For the record."]
"gull.tray_start" = ["Five smoothies for Marjorie. Walk straight. Mind the waves. The gulls are not mine. The gulls are mine."]
"gull.tray_spill" = ["One overboard. A fine smoothie. It was delicious, I assume.", "Spillage. I shall be investigating, with my beak.", "That is a glass in the sea. It has been added to the sea.", "Do you know what these cost? Neither do I. I do not pay."]
"gull.dive_start" = ["We are not here for form. We are here for splash. Press at the bottom of each bounce."]
"gull.dive_push" = ["The board has had enough of waiting.", "A gentle nudge from the authorities.", "You have been launched, for administrative reasons."]
"gull.dive_after" = [
  "That was a dive. I am legally required to say so.",
  "A modest disturbance of the water. The judges have seen wetter.",
  "That was a splash. A small one. It has been filed.",
  "Sir or madam, that is a respectable quantity of water.",
  "Good heavens. Several crabs have moved house.",
  "I am soaked. I have never been so professionally satisfied.",
  "The harbour has requested a warning next time.",
  "That was a dive. I am legally required to say so. I am also required to sit down.",
]
"gull.talk" = [
  "Commodore Gull. Tippy Cay Lagoon Authority. Is that a sandwich?",
  "I outrank everyone on this island. I have a hat.",
  "Your balance is a matter of maritime concern.",
  "Snacks left unattended are considered salvage. Under the code. My code.",
  "I have sailed everywhere. I have flown, I should say. Nobody asked me to sail.",
  "The tide comes in at six. I will be issuing it a warning.",
  "Do not feed the gulls. That is an order from a gull. Feed me.",
  "I was given this cap by an admiral. He did not give it to me. It was unattended.",
  "A clear day. Wind from the south. Your chips, from the left.",
  "Permission to come aboard the island is denied. You appear to be on it already. I shall write that up.",
  "The sea has no rules. That is why I am here.",
  "I once saluted a boat. It left without me.",
]

# ---------------------------------------------------------------- Guests

"marjorie.talk1" = ["Day five? Oh, I'm on day five as well. Eleven years now.", "New, are you? They give you a lovely towel. Don't get attached. It's your towel forever.", "The smoothies are very good. I ordered one in the spring.", "I wouldn't look at the number too closely, dear. It looks back."]
"marjorie.talk2" = ["Big Kettle will tell you about the time he was lifted. Ask him about it. He'd like that. Ask him twice.", "My Balance Age was 41 once. Very close. That was the Tuesday of the year of the shrimp.", "Have you tried the wardrobe? I went for the turban. It's for life, but it's a good turban."]
"marjorie.talk3" = ["There's someone following you, dear. It looks like you, but it's doing better.", "The ball is sweet. Don't let it near a nail. There was an incident. We don't speak of Bounce the First.", "Yesterday You is the worst of them. She never gets tired, you see."]
"marjorie.talk4" = ["They'll have told you about the Big Stand. Don't hold your breath. Well. You will have to, for a bit.", "The Commodore owes me for a bread roll. Since the nineties.", "You stand on a post. Then you stand on a post some more. That's all I'll say. I was very good."]
"marjorie.talk5" = ["Today, is it? Good luck, dear. I'll be on the raft, in my usual spot.", "The last part is the hardest. You'll see. You'll do nothing, and you'll know you did it.", "If you get the boat, wave. If you don't, I've saved you a chair."]
"marjorie.talk" = ["Eleven years. It flies.", "I'm not unhappy, dear. I've got a robe.", "I did try leaving, once. I got as far as the pier. There's nice shade on the pier.", "The clam knows my birthday."]
"marjorie.tray" = [
  "An empty tray. Lovely. I'll have what you've had.",
  "One smoothie. For eleven years I've waited. It's very good.",
  "Two smoothies. Well, that's one for later. I do like a later.",
  "Three! Somebody's mother would be proud. Not mine, she's on Day 5 as well.",
  "Four smoothies. You spilled the one I wanted. You couldn't know. It's fine.",
  "All five! Nobody's ever brought me all five. I don't even like them. Thank you, dear.",
]

"tom.talk1" = ["Name's Tom. Two-Towel Tom. One for the top, one for the rest. I've lost my flip-flops. All five of them.", "Five flip-flops. I had a system. If you find any lying about, I'm around the cabanas. Being brave about it.", "They're somewhere on this island. They've gone hiding. They do that."]
"tom.talk2" = ["Still no flip-flops. I walked on the hot sand this morning. I did it for nobody. I want that known.", "One towel's for drying. The other's for dignity.", "Look near the pavilions. Look behind things. Look where you'd go if you were a flip-flop and you'd had enough."]
"tom.talk3" = ["You've got that look of someone who's found something. No? Just your face then.", "I saw one near the sand, once. Then I blinked. Then there was a gull.", "A man needs his flip-flops. That's what I say. Nobody asks."]
"tom.talk4" = ["The Commodore says he hasn't got them. He said it very quickly.", "Five flip-flops is two pairs and a spare. It's only sensible.", "Keep your eyes on the ground, that's what I say. Also, watch your head."]
"tom.talk5" = ["Big day for you. Big day for me too, if you've got my flip-flops.", "I'll be watching from the raft. In my towels.", "Whatever happens out there, your feet will have shoes. That's more than some."]
"tom.talk" = ["Nice day for feet.", "One towel's never been enough for me.", "The sand here gets hot about noon. I've kept notes."]
"tom.progress" = ["", "One flip-flop! Ha! {n} to go. You're doing the Lord's work, or at least a lifeguard's.", "That's two. {n} left. A pair is a pair, I always said. I never said that.", "Three, by the look of it. {n} more and I'm a whole man.", "Four! Only {n} left. I can almost feel the sand not burning."]
"tom.reward" = ["All five! You've gone and done it. I don't know what to say.", "I'll say this: you take these. The golden ones. Won them in a raffle. Too good for me.", "They're yours now. Golden Flip-Flops. Look after them. They don't do anything, but they do it beautifully."]

"twins.talk1" = ["We are the Twins. / Twins, we are. Do you like it here? / Here, do you like it?", "We do everything together. / Together we do. Except breathe. / We breathe in turns.", "We came for a weekend. / A weekend, we came for. Which weekend? / We never asked."]
"twins.talk2" = ["We lifted the kettle. / Together, we lifted it. It lifted us. / Emotionally.", "Do you squat alone? / Alone, do you squat? That must be very quiet. / Very quiet.", "Our Balance Age is the same. / The same, it is. We average it. / We round down."]
"twins.talk3" = ["Who is that with you? / That's her with you. She looks like you. / But better.", "We have a ghost as well. / One ghost. We share. / We take turns being haunted.", "The ball said hello. / Hello, the ball said. Forty times. / We said it back forty times. Each."]
"twins.talk4" = ["The bird took our sandwich. / Our sandwich, the bird took. It had a hat. / So we let it.", "We've been told about the Big Stand. / The Big Stand, we've been told. There's a band. / We're in the band.", "We play the same instrument. / At the same time. / Same instrument."]
"twins.talk5" = ["Today is the day. / The day it is. We are on the raft. / On the same raft. We tip it.", "Good luck. / Luck, good. We mean it. / We mean it twice.", "You look very balanced. / Balanced, you look. To one of us. / We'll discuss it."]
"twins.talk" = ["Nice to see you. / You, nice to see.", "We're fine. / Fine, we are. / She's fine.", "Have you seen the other one of us? / The other one? / Oh. There she is."]
