  "Your Balance Age is {age}. It went up. That is allowed. It is also recorded.",
  "{age}. A larger number than yesterday. It happens. It happened to you.",
  "{age}. Did something happen? You don't have to tell me. I already have it in the file.",
  "Your wobble has aged overnight. {age}. It sends its regards.",
]
"pip.report_same" = [
  "Your Balance Age is {age}. Much the same. Consistency is a kind of skill. It is a kind.",
  "{age}. No real change. You are a very stable person, in a narrow sense.",
  "{age}. I could say this number again tomorrow, if you like.",
]
"pip.worst0" = [
  "You drifted while standing still. Standing still is the one where you don't.",
