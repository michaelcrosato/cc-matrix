<script>
/*! aihub-session 1.4.0 — AI Hub Session Protocol v1 client. Paste it into your game unmodified. */
(function (root) {
  'use strict';
  if (root.AIHub) return;

  var VERSION = '1.4.0';
  var HELLO_EVERY_MS = 500;
  var HELLO_TIMEOUT_MS = 10000;
  var PROGRESS_EVERY_MS = 1000;
  /** The hub's welcome may change these; a newer hub never needs a newer copy of this file for it. */
  var limits = { maxBytes: 16384, ratePerS: 20, burst: 40 };

  var framed = false;
  try {
    framed = root.parent && root.parent !== root;
  } catch (e) {
    framed = true;
  }
  var search = String(root.location && root.location.search);
  var flagged = /[?&]aihub=/.test(search);
  var seedArg = /[?&]aihub-seed=(\d+)/.exec(search);

  var hub = {
    version: VERSION,
    protocol: 1,
    /** True when the hub launched this page for a session (?aihub=1 inside a frame). */
    active: !!(flagged && framed),
    me: null,
    host: null,
    isHost: false,
    players: [],
    mode: null,
    seed: 0,
    limitMs: 0,
    round: 0,
    /** True when the hub shows the round's splash and collects every player's ready: call ready() once loaded, with no prompt. */
    splash: false,
    /** True when the hub seeded Math.random for this round (side by side): every copy draws the same numbers. */
    seeded: false,
  };

  /** A storage that lives and dies with the page: the Storage methods, and items as properties too. */
  function memoryStorage() {
    var data = Object.create(null);
    var api = {
      getItem: function (k) {
        k = String(k);
        return k in data ? data[k] : null;
      },
      setItem: function (k, v) {
        data[String(k)] = String(v);
      },
      removeItem: function (k) {
        delete data[String(k)];
      },
      clear: function () {
        for (var k in data) delete data[k];
      },
      key: function (i) {
        var keys = Object.keys(data);
        return i >= 0 && i < keys.length ? keys[i] : null;
      },
    };
    if (typeof Proxy !== 'function') return api;
    return new Proxy(api, {
      get: function (t, k) {
        if (k === 'length') return Object.keys(data).length;
        if (typeof k === 'symbol' || k in t) return t[k];
        return k in data ? data[k] : undefined;
      },
      set: function (t, k, v) {
        if (typeof k !== 'symbol') data[k] = String(v);
        return true;
      },
      has: function (t, k) {
        return k in data || k in t;
      },
      deleteProperty: function (t, k) {
        delete data[k];
        return true;
      },
      ownKeys: function () {
        return Object.keys(data);
      },
      getOwnPropertyDescriptor: function (t, k) {
        return k in data ? { value: data[k], writable: true, enumerable: true, configurable: true } : undefined;
      },
    });
  }

  /** mulberry32: numbers in [0, 1), the same sequence everywhere for the same 32-bit start. */
  function generator(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A fair start: in a session the game gets an empty storage of its own, so
  // every round starts as a first launch (no saved unlocks, upgrades or runs),
  // and nothing the round saves touches the player's own saves.
  if (hub.active) {
    for (var s = 0, stores = ['localStorage', 'sessionStorage']; s < stores.length; s++) {
      try {
        Object.defineProperty(root, stores[s], { configurable: true, value: memoryStorage() });
      } catch (e) {
        warn('could not give the game a fresh ' + stores[s]);
      }
    }
  }

  // Side by side: before any of the game's own scripts run, Math.random becomes
  // a generator seeded by the hub, so every copy builds the same start.
  var realRandom = Math.random;
  var seededRandom = null;
  if (hub.active && seedArg) {
    Math.random = seededRandom = generator(Number(seedArg[1]) >>> 0);
    hub.seeded = true;
  }

  // In a session the hub owns fullscreen: a game that asks for it gets the
  // hub's whole page, so the scoreboard and the hub's cards stay on top. The
  // hub says when its page goes in and out, so the game's own toggle and its
  // fullscreenchange listeners work as they always did.
  var fullscreenOn = false;
  if (hub.active && root.Element && root.document) {
    var asks = function (on) {
      return function () {
        post('fullscreen', { on: on });
        return Promise.resolve();
      };
    };
    var proto = root.Element.prototype;
    proto.requestFullscreen = proto.webkitRequestFullscreen = asks(true);
    root.document.exitFullscreen = root.document.webkitExitFullscreen = asks(false);
    var shown = function () {
      return fullscreenOn ? root.document.documentElement || null : null;
    };
    try {
      Object.defineProperty(root.document, 'fullscreenElement', { configurable: true, get: shown });
      Object.defineProperty(root.document, 'webkitFullscreenElement', { configurable: true, get: shown });
    } catch (e) {}
  }

  /**
   * No hub after all: play on, with Math.random the page's own again. The
   * empty storage stays: the game has read it already, and what it writes
   * must never land on the player's real saves.
   */
  function standAlone() {
    hub.active = false;
    if (seededRandom && Math.random === seededRandom) Math.random = realRandom;
    hub.seeded = false;
  }

  var origin = '*';
  var welcomed = false;
  var ended = false;
  var connecting = null;
  var goAt = null;
  var sentReady = false;
  var reported = false;
  var handlers = {};
  var pending = {};
  var tokens = limits.burst;
  var refilled = now();
  var probeFn = null;
  var lastProgress = -Infinity;
  var nextProgress = null;
  var progressTimer = null;

  function now() {
    return root.performance && root.performance.now ? root.performance.now() : Date.now();
  }

  function warn(text) {
    if (root.console) root.console.warn('[AIHub] ' + text);
  }

  function own(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k);
  }

  /** This client's own fields, which no welcome may overwrite. */
  var KEEP = { aihub: 1, type: 1, version: 1, protocol: 1, active: 1, seeded: 1 };

  /** A plain JSON copy, or undefined when it is not JSON. */
  function json(value) {
    try {
      var text = JSON.stringify(value);
      return text === undefined ? undefined : JSON.parse(text);
    } catch (e) {
      return undefined;
    }
  }

  function post(type, fields) {
    var msg = { aihub: 1, type: type };
    for (var key in fields) if (own(fields, key)) msg[key] = fields[key];
    try {
      root.parent.postMessage(msg, origin);
    } catch (e) {
      warn('could not reach the hub: ' + e.message);
    }
  }

  function emit(type, args) {
    var list = handlers[type];
    if (!list || !list.length || pending[type]) {
      (pending[type] = pending[type] || []).push(args);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      try {
        list[i].apply(null, args);
      } catch (e) {
        setTimeout(function () {
          throw e;
        });
      }
    }
  }

  function onMessage(event) {
    if (event.source !== root.parent) return;
    var m = event.data;
    if (!m || m.aihub !== 1 || typeof m.type !== 'string') return;
    if (m.type === 'welcome') {
      if (welcomed) return;
      welcomed = true;
      origin = event.origin && event.origin !== 'null' ? event.origin : '*';
      // Every field the hub sends is kept, so a newer hub can add one without a newer client.
      for (var key in m) {
        if (!own(m, key) || KEEP[key] || typeof hub[key] === 'function') continue;
        hub[key] = m[key];
      }
      hub.players = (m.players || []).slice();
      hub.seed = m.seed >>> 0;
      hub.isHost = m.me === m.host;
      hub.splash = m.splash === true;
      if (m.limits) {
        for (var l in limits) if (own(limits, l) && Number(m.limits[l]) > 0) limits[l] = Number(m.limits[l]);
        tokens = limits.burst;
      }
      if (connecting) connecting.resolve(info());
      return;
    }
    if (m.type === 'fullscreen') {
      fullscreenOn = m.on === true;
      try {
        root.document.dispatchEvent(new root.Event('fullscreenchange'));
      } catch (e) {}
      return;
    }
    if (!welcomed || ended) return;
    if (m.type === 'start') {
      goAt = now() + Number(m.in || 0);
      emit('start', [{ in: Number(m.in || 0) }]);
    } else if (m.type === 'message') {
      emit('message', [m.data, m.from]);
    } else if (m.type === 'leave') {
      hub.players = hub.players.filter(function (p) {
        return p.id !== m.id;
      });
      emit('leave', [{ id: m.id, reason: m.reason }]);
    } else if (m.type === 'time-up') {
      emit('time-up', [{ graceMs: m.graceMs }]);
    } else if (m.type === 'end') {
      ended = true;
      if (progressTimer) clearTimeout(progressTimer);
      emit('end', [{ reason: m.reason, standings: m.standings || null }]);
    } else {
      // An event this client has never heard of: hand it on as it came.
      var detail = {};
      for (var k in m) if (own(m, k) && k !== 'aihub' && k !== 'type') detail[k] = m[k];
      emit(m.type, [detail]);
    }
  }

  function info() {
    var out = {};
    for (var key in hub) if (own(hub, key) && typeof hub[key] !== 'function' && !KEEP[key]) out[key] = hub[key];
    out.players = hub.players.slice();
    return out;
  }

  /** Join the session. Resolves with the round's info, or null when there is no hub: play normally. */
  hub.connect = function (opts) {
    if (connecting) return connecting.promise;
    var done;
    var promise = new Promise(function (resolve) {
      done = resolve;
    });
    connecting = { promise: promise, resolve: done };
    if (!hub.active) {
      done(null);
      return promise;
    }
    opts = opts || {};
    root.addEventListener('message', onMessage);
    var started = now();
    var hello = function () {
      if (welcomed) return;
      if (now() - started > HELLO_TIMEOUT_MS) {
        standAlone();
        warn('no hub answered; playing normally');
        done(null);
        return;
      }
      post('hello', { v: 1, client: VERSION, mode: opts.mode || null, seats: opts.seats || null, card: opts.card === true });
      setTimeout(hello, HELLO_EVERY_MS);
    };
    hello();
    return promise;
  };

  /** Everything is loaded: at once when info.splash, otherwise from the player's ready gesture. */
  hub.ready = function () {
    if (!welcomed || sentReady || ended) return;
    sentReady = true;
    post('ready', {});
  };

  /** On the game's own card (connect({ card: true })): this player is 'ready', or asks for 'more' time (again takes it back). */
  hub.answer = function (what) {
    if (!welcomed || ended || goAt !== null) return;
    if (what !== 'ready' && what !== 'more') return warn('answer is ready or more');
    post('answer', { answer: what });
  };

  hub.on = function (type, fn) {
    (handlers[type] = handlers[type] || []).push(fn);
    if (pending[type] && !pending[type].flushing) {
      pending[type].flushing = true;
      setTimeout(function () {
        var queued = pending[type];
        delete pending[type];
        for (var i = 0; i < queued.length; i++) emit(type, queued[i]);
      });
    }
    return function () {
      var list = handlers[type] || [];
      var at = list.indexOf(fn);
      if (at !== -1) list.splice(at, 1);
    };
  };

  /** Send JSON data to every other player, or to one with {to: id}. {reliable: false} may drop or reorder. */
  hub.send = function (data, opts) {
    if (!welcomed || ended) return false;
    opts = opts || {};
    var text;
    try {
      text = JSON.stringify(data);
    } catch (e) {
      warn('send: data is not JSON');
      return false;
    }
    if (text === undefined) return false;
    if (text.length > limits.maxBytes) {
      warn('send: message over ' + limits.maxBytes + ' bytes dropped');
      return false;
    }
    var t = now();
    tokens = Math.min(limits.burst, tokens + ((t - refilled) / 1000) * limits.ratePerS);
    refilled = t;
    if (tokens < 1) {
      warn('send: over ' + limits.ratePerS + ' messages a second, dropped');
      return false;
    }
    tokens -= 1;
    var fields = { data: JSON.parse(text), reliable: opts.reliable !== false };
    if (opts.to !== undefined && opts.to !== null) fields.to = opts.to;
    post('send', fields);
    return true;
  };

  /** Milliseconds since the synchronized start: negative during the countdown, -Infinity before start. */
  hub.time = function () {
    return goAt === null ? -Infinity : now() - goAt;
  };

  /** A seeded random number generator (0 ≤ n < 1), the same sequence on every device for the same label. */
  hub.rng = function (label) {
    var h = 2166136261;
    var s = String(label === undefined ? '' : label);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return generator((hub.seed ^ h) >>> 0);
  };

  /** A number the hub can rank: finite, given as a number or as text. Not null, '' or true, which JSON or Number would make 0. */
  function finite(v) {
    return (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && isFinite(v);
  }

  /**
   * The whole outcome as plain JSON, field by field: the hub checks and trims
   * it, so new optional fields need no new client. A field that is not JSON
   * (a cycle, a BigInt) is left out, not the whole outcome.
   */
  function outcomeOf(outcome) {
    if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) {
      warn('the outcome is not a plain object');
      return null;
    }
    var copy = {};
    for (var key in outcome) {
      if (!own(outcome, key)) continue;
      var value = json(outcome[key]);
      if (value !== undefined) copy[key] = value;
      else if (outcome[key] !== undefined) warn('the outcome\'s ' + key + ' is not JSON: left out');
    }
    return copy;
  }

  /** Race and side by side: report your own outcome once, {time: ms} (lower wins) or {score: n} (higher wins), with optional stats and awards. */
  hub.result = function (outcome) {
    if (!welcomed || ended || reported) return;
    var fields = outcomeOf(outcome);
    if (!fields) return;
    var given = outcome || {};
    delete fields.time;
    delete fields.score;
    if (finite(given.time)) fields.time = Number(given.time);
    if (finite(given.score)) fields.score = Number(given.score);
    if (!own(fields, 'time') && !own(fields, 'score')) return warn('result needs a finite time or score');
    reported = true;
    if (progressTimer) clearTimeout(progressTimer);
    post('result', fields);
  };

  /** Versus and co-op: the host reports the standings once, best first, ties grouped: [[2], [0, 3], [1]]. */
  hub.finish = function (outcome) {
    if (!welcomed || ended || reported) return;
    if (!hub.isHost) return warn('finish is for the host only');
    var fields = outcomeOf(outcome);
    if (!fields) return;
    if (!Array.isArray(fields.standings)) return warn('finish needs standings');
    reported = true;
    post('finish', fields);
  };

  function sendProgress() {
    progressTimer = null;
    if (!nextProgress || ended || reported) return;
    lastProgress = now();
    post('progress', nextProgress);
    nextProgress = null;
  }

  /** Your standing during play, for the hub's scoreboard: {score, label}. Call it as often as you like; the hub hears it about once a second. */
  hub.progress = function (p) {
    if (!welcomed || ended || reported || !p || !finite(p.score)) return;
    nextProgress = { score: Number(p.score) };
    if (p.label != null) nextProgress.label = String(p.label).slice(0, 24);
    var wait = lastProgress + PROGRESS_EVERY_MS - now();
    if (wait <= 0) sendProgress();
    else if (!progressTimer) progressTimer = setTimeout(sendProgress, wait);
  };

  /** For the harness, in or out of a session: fn() → { scene, menu, world, input }, read with inspect(). */
  hub.probe = function (fn) {
    probeFn = typeof fn === 'function' ? fn : null;
  };

  hub.inspect = function () {
    if (!probeFn) return null;
    try {
      return JSON.parse(JSON.stringify(probeFn()));
    } catch (e) {
      return { error: String((e && e.message) || e) };
    }
  };

  /** The game cannot run here (no WebGL, failed load): the hub skips it. */
  hub.fail = function (message) {
    if (!hub.active) return;
    post('error', { message: String(message || 'error').slice(0, 500), fatal: true });
  };

  root.AIHub = hub;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

		this.muted = !!value;
		if (this.master)
			this.master.gain.setTargetAtTime(
				this.muted ? 0 : 0.78,
				this.ctx.currentTime,
				0.025,
			);
	}

	_tone(
		freq,
		time,
		duration,
		gain,
		type = "triangle",
		bus = this.sfxBus,
		endFreq = null,
	) {
		const c = this.ctx;
		const o = c.createOscillator();
		const v = c.createGain();
		o.type = type;
		o.frequency.setValueAtTime(Math.max(20, freq), time);
		if (endFreq != null)
			o.frequency.exponentialRampToValueAtTime(
				Math.max(20, endFreq),
				time + duration,
			);
		v.gain.setValueAtTime(0, time);
		v.gain.linearRampToValueAtTime(
			gain,
			time + Math.min(0.008, duration * 0.1),
		);
		v.gain.exponentialRampToValueAtTime(0.0001, time + duration);
		o.connect(v);
		v.connect(bus);
		o.start(time);
		o.stop(time + duration + 0.02);
		this.nodes++;
		o.onended = () => {
			o.disconnect();
			v.disconnect();
			this.nodes--;
		};
	}

	_noise(
		time,
		duration,
		gain,
		cutoff = 5000,
		highpass = false,
		bus = this.sfxBus,
	) {
		const c = this.ctx;
		const n = c.createBufferSource();
		const f = c.createBiquadFilter();
		const v = c.createGain();
		n.buffer = this.noise;
		f.type = highpass ? "highpass" : "lowpass";
		f.frequency.value = cutoff;
		v.gain.setValueAtTime(gain, time);
		v.gain.exponentialRampToValueAtTime(0.0001, time + duration);
		n.connect(f);
		f.connect(v);
		v.connect(bus);
		n.start(time, this._random() * 0.1, duration);
		this.nodes++;
		n.onended = () => {
			n.disconnect();
			f.disconnect();
			v.disconnect();
			this.nodes--;
		};
	}

	_kick(time) {
		this._tone(145, time, 0.18, 0.48, "sine", this.musicBus, 39);
		this._noise(time, 0.018, 0.06, 1700, false, this.musicBus);
	}

	_snare(time) {
		this._noise(time, 0.12, 0.19, 1400, true, this.musicBus);
		this._tone(185, time, 0.08, 0.12, "triangle", this.musicBus, 95);
	}

	_note(midi) {
		return 440 * 2 ** ((midi - 69) / 12);
	}

	/** Call from the game's frame loop. Optional context: {intensity: 0..1, paused: boolean}. */
	tick(_dt = 0, context = {}) {
		if (
			!this.enabled ||
			!this.ctx ||
			this.ctx.state === "closed" ||
			!this.musicEnabled
		)
			return;
		this.intensity = Math.max(0, Math.min(1, Number(context.intensity) || 0));
		const now = this.ctx.currentTime;
		if (this.nextBeat < now - 0.15) this.nextBeat = now + 0.025;
		let safety = 0;
		while (this.nextBeat < now + 0.16 && safety++ < 8) {
			this._musicStep(this.step++, this.nextBeat);
			this.nextBeat += 60 / this.tempo / 4;
		}
	}

	_musicStep(step, time) {
		const i = step % 16;
		const bar = Math.floor(step / 16) % 8;
		// A minor 9 / D minor 9 / F major 7 / E7: warm arcade-lounge harmony.
		const chords = [
			[45, 60, 64, 67, 71],
			[45, 60, 64, 67, 71],
			[50, 62, 65, 69, 72],
			[50, 62, 65, 69, 72],
			[41, 60, 64, 69, 72],
			[41, 60, 64, 69, 72],
			[40, 59, 62, 68, 71],
			[40, 59, 62, 68, 71],
		];
		const chord = chords[bar];
		if (i % 4 === 0) this._kick(time);
		if (i === 4 || i === 12) this._snare(time);
		if (i % 2 === 0)
			this._noise(
				time,
				i === 14 ? 0.13 : 0.035,
				i % 4 === 2 ? 0.075 : 0.045,
				6500,
				true,
				this.musicBus,
			);
		if ([0, 3, 6, 8, 10, 14].includes(i)) {
			const interval = i === 6 || i === 14 ? 12 : i === 10 ? 7 : 0;
			this._tone(
				this._note(chord[0] + interval),
				time,
				0.17,
				0.24,
				"triangle",
				this.musicBus,
			);
			this._tone(
				this._note(chord[0] + interval + 12),
				time,
				0.08,
				0.045,
				"sine",
				this.musicBus,
			);
		}
		if (i === 2 || i === 10) {
			chord
				.slice(1)
				.forEach((n, j) =>
					this._tone(
						this._note(n),
						time + j * 0.007,
						0.15,
						0.065,
						"triangle",
						this.musicBus,
					),
				);
		}
		const melody = [
			76,
			null,
			79,
			null,
			81,
			79,
			76,
			null,
			74,
			null,
			72,
			74,
			76,
			null,
			71,
			null,
		];
		if ((bar % 2 === 1 || this.intensity > 0.5) && melody[i] != null) {
			const offset = bar >= 6 ? -1 : bar >= 4 ? 0 : bar >= 2 ? -2 : 0;
			this._tone(
				this._note(melody[i] + offset),
				time,
				0.15,
				0.075,
				"sine",
				this.musicBus,
			);
			this._tone(
				this._note(melody[i] + offset + 12),
				time,
				0.11,
				0.018,
				"triangle",
				this.musicBus,
			);
		}
		this.events.music++;
	}

	play(type, strength = 1) {
		if (!this.enabled || !this.ctx || this.ctx.state === "closed") return;
		const t = this.ctx.currentTime + 0.002;
		const s = Math.max(0.1, Math.min(2, Number(strength) || 1));
		this.events.sfx++;
		switch (type) {
			case "hit":
			case "paddle":
				this._tone(
					330 + this._random() * 100,
					t,
					0.09,
					0.18 * s,
					"triangle",
					this.sfxBus,
					150,
				);
				this._tone(950, t, 0.035, 0.055 * s, "sine", this.sfxBus, 450);
				this._noise(t, 0.035, 0.045 * s, 3300);
				break;
			case "wall":
			case "bounce":
				this._tone(185, t, 0.07, 0.11 * s, "sine", this.sfxBus, 80);
				this._noise(t, 0.025, 0.025 * s, 2200);
				break;
			case "bank":
			case "bonus":
				[784, 988, 1175].forEach((f, i) =>
					this._tone(f, t + i * 0.045, 0.16, 0.1, "triangle"),
				);
				break;
			case "goal":
			case "point":
			case "score":
				[523, 659, 784, 1047].forEach((f, i) =>
					this._tone(f, t + i * 0.075, 0.23, 0.16, "triangle"),
				);
				this._noise(t + 0.24, 0.3, 0.07, 4500, true);
				break;
			case "win":
			case "medal":
				[60, 64, 67, 72, 71, 74, 79, 84].forEach((n, i) => {
					this._tone(this._note(n), t + i * 0.105, 0.32, 0.14, "triangle");
					if (i === 7)
						[72, 76, 79].forEach((m) =>
							this._tone(this._note(m), t + i * 0.105, 0.9, 0.07, "sine"),
						);
				});
				this.speak("win");
				break;
			case "lose":
				[64, 62, 59, 57].forEach((n, i) =>
					this._tone(this._note(n), t + i * 0.15, 0.25, 0.13, "triangle"),
				);
				this.speak("lose");
				break;
			case "charge":
				this._tone(240, t, 0.28, 0.1, "sawtooth", this.sfxBus, 790);
				break;
			case "boost":
			case "power":
			case "smash":
				this._noise(t, 0.22, 0.12, 2800);
				this._tone(160, t, 0.25, 0.12, "sawtooth", this.sfxBus, 740);
				this._tone(1047, t + 0.05, 0.14, 0.09, "sine", this.sfxBus, 1568);
				break;
			case "serve":
			case "start":
				[392, 523, 784].forEach((f, i) =>
					this._tone(f, t + i * 0.07, 0.14, 0.11, "triangle"),
				);
				break;
			case "countdown":
				this._tone(660, t, 0.11, 0.12, "sine");
				break;
			case "error":
				this._tone(140, t, 0.14, 0.1, "square", this.sfxBus, 100);
				break;
			case "menu":
			case "select":
			case "click":
				this._tone(880, t, 0.055, 0.075, "sine", this.sfxBus, 1175);
				break;
			default:
				this._tone(660, t, 0.06, 0.07, "triangle");
		}
	}

	/** Short voiced, formant-filtered gibberish. Never uses SpeechSynthesis or recordings. */
	speak(mood = "happy") {
		if (!this.enabled || !this.ctx || this.ctx.state === "closed") return;
		const now = this.ctx.currentTime;
		if (now - this.lastVoice < 1.1) return;
		this.lastVoice = now;
		const vowels = [
			[780, 1150, 2650],
			[360, 2100, 2850],
			[540, 920, 2400],
			[430, 1500, 2500],
			[300, 870, 2250],
		];
		const upbeat = !["lose", "sad"].includes(mood);
		const count = mood === "win" ? 6 : 4;
		for (let i = 0; i < count; i++) {
			const time = now + 0.04 + i * 0.105;
			const dur = i === count - 1 ? 0.16 : 0.075;
			const base = (upbeat ? 220 : 160) * [1, 1.17, 0.94, 1.4, 1.2, 1.6][i];
			const o = this.ctx.createOscillator();
			o.type = "sawtooth";
			o.frequency.setValueAtTime(base, time);
			o.frequency.exponentialRampToValueAtTime(
				base * (upbeat ? 1.08 : 0.85),
				time + dur,
			);
			const v = this.ctx.createGain();
			v.gain.setValueAtTime(0, time);
			v.gain.linearRampToValueAtTime(0.052, time + 0.012);
			v.gain.setValueAtTime(0.045, time + dur * 0.65);
			v.gain.linearRampToValueAtTime(0, time + dur);
			const filters = vowels[(i + (upbeat ? 0 : 2)) % vowels.length].map(
				(freq, j) => {
					const f = this.ctx.createBiquadFilter();
					f.type = "bandpass";
					f.frequency.value = freq;
					f.Q.value = 5 + j * 2;
					o.connect(f);
					f.connect(v);
					return f;
				},
			);
			v.connect(this.voiceBus);
			o.start(time);
			o.stop(time + dur + 0.01);
			this.nodes++;
			o.onended = () => {
				o.disconnect();
				filters.forEach((f) => f.disconnect());
				v.disconnect();
				this.nodes--;
			};
			// Unvoiced consonant edges make the otherwise simple vowel bleeps feel spoken.
			this._noise(time, 0.018, 0.02, 3600, true, this.voiceBus);
		}
		this.events.voice++;
	}

	getDiagnostics() {
		let peak = 0;
		if (this.analyser) {
			const a = new Float32Array(this.analyser.fftSize);
			this.analyser.getFloatTimeDomainData(a);
			for (const n of a) peak = Math.max(peak, Math.abs(n));
		}
		return {
			state: this.ctx?.state || "locked",
			musicVolume: this.musicVolume,
			sfxVolume: this.sfxVolume,
			muted: this.muted,
			activeNodes: this.nodes,
			peak,
			events: { ...this.events },
		};
	}

	/** Offline browser test: returns audible output statistics without requiring speakers. */
	static async renderProbe() {
		const Offline =
			globalThis.OfflineAudioContext || globalThis.webkitOfflineAudioContext;
		if (!Offline) return { supported: false };
		const ctx = new Offline(1, 48000 * 2, 48000);
		const audio = new AudioEngine({ context: ctx });
		for (let i = 0; i < 12; i++) audio._musicStep(i, 0.04 + i * 0.125);
		audio.play("hit");
		audio.play("boost");
		audio.speak("win");
		const rendered = await ctx.startRendering();
		const samples = rendered.getChannelData(0);
		let sum = 0,
			peak = 0,
			nonzero = 0,
			finite = true;
		for (const s of samples) {
			sum += s * s;
			peak = Math.max(peak, Math.abs(s));
			if (Math.abs(s) > 0.00001) nonzero++;
			if (!Number.isFinite(s)) finite = false;
		}
		return {
			supported: true,
			finite,
			rms: Math.sqrt(sum / samples.length),
			peak,
			nonzero,
			samples: samples.length,
			musicVolume: audio.musicVolume,
			events: { ...audio.events },
		};
	}

	async destroy() {
		this.enabled = false;
		if (this.ctx && this.ctx.close && this.ctx.state !== "closed")
			await this.ctx.close();
	}
}

/** Paddle Royale: AI Hub shared-world adapter and standalone peer rooms. */
function createNetwork(callbacks = {}) {
	const cb = Object.assign(
		{
			onRole() {},
			onInput() {},
			onSnapshot() {},
			onStatus() {},
			onStart() {},
			onEnd() {},
			onTimeUp() {},
			onLeave() {},
		},
		callbacks,
	);
	const uniqueId = () =>
		Array.from(crypto.getRandomValues(new Uint8Array(8)), (v) =>
			v.toString(16).padStart(2, "0"),
		).join("");
	const tabId = uniqueId();
	let state = {
		active: false,
		mode: "offline",
		role: "host",
		isHost: true,
		me: 0,
		localSeat: 0,
		server: false,
		players: [],
		code: "",
		connected: false,
		transport: "none",
	};

		peer = null,
		connection = null,
		remoteId = null,
		remoteTab = null,
		heartbeat = null,
		joinTimer = null,
		peerTimer = null,
		joinDeadline = null,
		lastSeen = 0,
		generation = 0,
		hubFinished = false,
		hubEnded = false,
		lastScores = [0, 0],
		lastInput = 0,
		lastSnapshot = 0;

			channel.close();
			channel = null;

			connection.close();

	let loadingPeer = null;

				return;
			}

		});

			if (token !== generation || !packet || state.transport === "local")

			if (packet.kind === "full") {

				return;

	};

				(state.connected && state.transport === "local")

				code: "",
				connected: true,
				transport: "hub",
			};
			hubFinished = hubEnded = false;
			publish();
			status("Waiting for the AI Hub round.");
			AIHub.on("start", (event) => {
				if (hubEnded) return;
				cb.onStart(
					{ mode: "versus", court: 0 },
					{ hub: true, countdownMs: Number(event?.in) || 3000 },
				);
			});
			AIHub.on("message", (packet, from) => {
				if (hubEnded || !packet || typeof packet !== "object") return;
				if (state.isHost && packet.kind === "input") {
					const seat = state.players.findIndex((p) => p.id === from);
					if (seat >= 0) cb.onInput(packet.data, seat);
				} else if (
					!state.isHost &&
					from === AIHub.host &&
					packet.kind === "snapshot"
				)
					cb.onSnapshot(packet.data);
			});
			AIHub.on("leave", (event) => {
				const seat = state.players.findIndex((p) => p.id === event.id);
				if (seat >= 0) cb.onLeave(seat);
			});
			AIHub.on("time-up", () => {
				if (hubEnded) return;
				cb.onTimeUp();
				if (state.isHost && !hubFinished) api.finish(lastScores);
			});
			AIHub.on("end", (event) => {
				hubEnded = true;
				cb.onEnd(event?.reason || "finished");
				status("AI Hub round complete.");
			});
			return { ...state };
		},
		ready() {
			if (state.mode === "hub") AIHub.ready();
		},
		host() {
			if (window.AIHub?.active) return "";
			cleanStandalone();
			state = {
				active: true,
				mode: "standalone",
				role: "host",
				isHost: true,
				me: 0,
				localSeat: 0,
				server: false,
				players: [
					{ id: 0, name: "CORAL" },
					{ id: 1, name: "MINT" },
				],
				code: roomCode(),
				connected: false,
				transport: "none",
			};
			openChannel(state.code);
			publish();
			status("Room " + state.code + " created. Opening internet connection…");
			openPeer(true, generation);
			return state.code;
		},
		join(code) {
			if (window.AIHub?.active) return false;
			code = String(code || "")
				.toUpperCase()
				.replace(/[^A-Z0-9]/g, "");
			if (code.length !== 6) {
				status("Room codes have six letters and numbers.");
				return false;
			}
			cleanStandalone();
			state = {
				active: true,
				mode: "standalone",
				role: "guest",
				isHost: false,
				me: 1,
				localSeat: 1,
				server: false,
				players: [
					{ id: 0, name: "CORAL" },
					{ id: 1, name: "MINT" },
				],
				code,
				connected: false,
				transport: "none",
			};
			openChannel(code);
			publish();
			status("Looking for room " + code + "…");
			const knock = () => channel?.postMessage({ kind: "join", from: tabId });
			knock();
			joinTimer = setInterval(knock, 250);
			const token = generation;
			peerTimer = setTimeout(() => openPeer(false, token), 650);
			joinDeadline = setTimeout(() => {
				if (token === generation && !state.connected)
					status("Could not connect. Check the room code and try again.");
				clearInterval(joinTimer);
			}, 22000);
			return true;
		},
		start(config) {
			if (state.mode === "hub" || !state.isHost || !state.connected)
				return false;
			send("start", config);
			cb.onStart(config, { hub: false, countdownMs: 0 });
			return true;
		},
		sendInput(input) {
			if (hubEnded) return false;
			if (state.mode === "hub") {
				if (state.isHost || state.localSeat === null) return false;
				const now = performance.now();
				if (now - lastInput < 65) return false;
				lastInput = now;
				return AIHub.send(
					{ kind: "input", data: input },
					{ to: AIHub.host, reliable: false },
				);
			}
			return send("input", input);
		},
		sendSnapshot(snapshot) {
			if (hubEnded || !state.isHost) return false;
			if (snapshot?.scores) lastScores = snapshot.scores;
			if (state.mode === "hub") {
				const now = performance.now();
				if (now - lastSnapshot < 65) return false;
				lastSnapshot = now;
				return AIHub.send(
					{ kind: "snapshot", data: snapshot },
					{ reliable: false },
				);
			}
			return send("snapshot", snapshot);
		},
		finish(scores = [0, 0]) {
			if (state.mode !== "hub" || !state.isHost || hubFinished || hubEnded)
				return false;
			const entries = state.players
				.map((p, i) => ({ id: p.id, score: Number(scores[i]) || 0 }))
				.sort((a, b) => b.score - a.score);
			const standings = [];
			for (const entry of entries) {
				const prev = standings.at(-1);
				if (prev && entries.find((v) => v.id === prev[0]).score === entry.score)
					prev.push(entry.id);
				else standings.push([entry.id]);
			}
			hubFinished = true;
			AIHub.finish({
				standings,
				scores: Object.fromEntries(entries.map((e) => [e.id, e.score])),
			});
			return true;
		},
		disconnect() {
			if (state.mode === "hub") return false;
			send("leave", null);
			cleanStandalone();
			state = {
				active: false,
				mode: "offline",
				role: "host",
				isHost: true,
				me: 0,
				localSeat: 0,
				server: false,
				players: [],
				code: "",
				connected: false,
				transport: "none",
			};
			publish();
			return true;
		},
	};
	window.addEventListener("pagehide", () => {
		if (state.mode === "standalone") {
			send("leave", null);
			cleanStandalone();
		}
	});
	return api;
}

function createWorld() {
	if (world) world.free();
	world = new RAPIER.World({ x: 0, y: 0, z: 0 });
	world.timestep = 1 / 120;
	paddleBodies = [];
	paddleColliders = [];
	bankBodies = [];
	endBodies = [];
	const fixedBox = (x, z, hx, hz) => {
		const rb = world.createRigidBody(
			RAPIER.RigidBodyDesc.fixed().setTranslation(x, 0.5, z),
		);
		world.createCollider(
			RAPIER.ColliderDesc.cuboid(hx, 0.8, hz).setRestitution(1).setFriction(0),
			rb,
		);
		return rb;
	};
	fixedBox(0, -6.25, 12, 0.25);
	fixedBox(0, 6.25, 12, 0.25);
	for (let i = 0; i < 2; i++) {
		const rb = world.createRigidBody(
			RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(
				i === 0 ? -9 : 9,
				0.5,
				G.paddles[i].z,
			),
		);
		paddleBodies.push(rb);
		paddleColliders.push(
			world.createCollider(
				RAPIER.ColliderDesc.cuboid(0.22, 0.6, params.paddleSize).setSensor(
					true,
				),
				rb,
			),
		);
	}
	if (G.court === 1)
		for (const [x, z] of [
			[-3, -2.5],
			[3, 2.5],
		]) {
			const rb = world.createRigidBody(
				RAPIER.RigidBodyDesc.fixed().setTranslation(x, 0.5, z),
			);
			world.createCollider(
				RAPIER.ColliderDesc.cylinder(0.6, 0.58)
					.setRestitution(1)
					.setFriction(0),
				rb,
			);
			bankBodies.push(rb);
		}
	if (G.court === 2)
		for (const x of [-10.3, 10.3])
			for (const z of [-4.2, 4.2]) endBodies.push(fixedBox(x, z, 0.25, 1.8));
	ballBody = world.createRigidBody(
		RAPIER.RigidBodyDesc.dynamic()
			.setTranslation(0, 0.5, 0)
			.enabledTranslations(true, false, true)
			.enabledRotations(false, false, false)
			.setCcdEnabled(true)
			.setLinearDamping(0),
	);
	ballCollider = world.createCollider(
		RAPIER.ColliderDesc.ball(0.28)
			.setRestitution(1)
			.setFriction(0)
			.setDensity(0.1),
		ballBody,
	);
	syncBall();
}
function syncBall() {
	const p = ballBody.translation(),

function newServe(direction = 0) {
	G.phase = "serve";

	G.serveTimer = 1.5;
	G.rally = 0;
	G.trail = [];
	G.ball = { x: 0, z: 0, vx: 0, vz: 0 };
	ballBody.setTranslation({ x: 0, y: 0.5, z: 0 }, true);
	ballBody.setLinvel({ x: 0, y: 0, z: 0 }, true);

function launch() {
	if (G.phase !== "serve") return;
	const angle = (Math.random() - 0.5) * 0.8;
	const sign = G.serve === 0 ? -1 : 1;
	ballBody.setLinvel(
		{
			x: sign * params.ballSpeed * Math.cos(angle),
			y: 0,
			z: params.ballSpeed * Math.sin(angle),
		},
		true,
	);
	G.phase = "play";
	audio.play("serve");
	center("LET’S RALLY", 650);
}
function burst(x, z, color, count = 15) {
	for (let i = 0; i < count; i++) {
		const a = Math.random() * Math.PI * 2,
			s = 1.8 + Math.random() * 4;
		G.particles.push({
			x,
			z,
			y: 0.4,
			vx: Math.cos(a) * s,
			vz: Math.sin(a) * s,
			vy: 1 + Math.random() * 3,
			life: 0.45 + Math.random() * 0.5,
			color,
		});
	}
	if (G.particles.length > 100) G.particles.splice(0, G.particles.length - 100);
}
function scorePoint(seat) {
	if (!["play", "serve", "pause"].includes(G.phase)) return;
	G.scores[seat]++;
	G.stats.points++;
	G.stats.bestRally = Math.max(G.stats.bestRally, G.rally);
	best.rally = Math.max(best.rally, G.rally);
	save();
	burst(
		seat === 0 ? 10 : -10,
		G.ball.z,
		seat === 0 ? "#ed7055" : "#6bb6a4",
		35,
	);
	audio.play("goal");
	audio.speak(seat === 0 ? "point" : "surprise");
	vibrate(0.7);
	G.flash = 1;
	showToast(
		(seat === 0 ? "CORAL" : "MINT") +
			" SCORES!" +
			(G.rally >= 8 ? ` ${G.rally}-HIT RALLY!` : ""),
		2200,
	);

		finishMatch(seat);
		return;
	}
	G.nextServe = seat === 0 ? 1 : 0;

s complete.\n\n## Source Information\nCRITICAL: Put Source Information, Testing Feedback, Engine Feedback and Prompt Feedback in your chat reply and an in-game About/Credits screen. Write \"unknown\" for anything you can't confirm.\n- Date: 2026-11-06 01:12:17\n- Source: the work it's based on\n- Plan: the file name of the plan you were given to build from, or none\n- Genre and Perspective: genre and camera perspective used\n- Tech: stack, libraries/engines, with versions if applicable\n- Art Direction: style used\n- Animation: system used\n- Audio: music, sound effects and voice used\n- Online: network features used, or none\n- Testing: testing parameters allowed\n- Research: research done, or none\n- Environment: Codex CLI (headless); Linux\n- Model: OpenAI, gpt-6.1-sol, reasoning effort ultra\n- Usage: write \"added on import\". You can't see your own cost, so don't estimate it: the runner records the real cost, tokens and time, and the agent that imports the game into AI Hub puts them on your About/Credits screen.\n\nExit interview: before you finish, also save these answers as exit-interview.json in this folder's root, beside the game's .html: one JSON object in exactly the shape below, every value filled in (\"unknown\" for anything you can't confirm). Tools read it (the game's run record and the AI Hub catalogue), so write plain text, and check that the file parses as JSON.\n{\n  \"sourceInformation\": {\"date\": \"\", \"source\": \"\", \"plan\": \"\", \"genre\": \"\", \"perspective\": \"\", \"tech\": \"\", \"artDirection\": \"\", \"animation\": \"\", \"audio\": \"\", \"online\": \"\", \"testing\": \"\", \"research\": \"\", \"environment\": \"\", \"model\": \"\", \"usage\": \"added on import\"},\n  \"testingFeedback\": [\"your answer to each Testing Feedback question, in order\"],\n  \"engineFeedback\": [\"your answer to each Engine Feedback question, in order\"],\n  \"promptFeedback\": [\"your answer to each Prompt Feedback question, in order\"],\n  \"aiHub\ ented with no TODOs, placeholders or stubs, exit-interview.json in this folder's root parses as JSON and answers every field, and your final reply contains the Source Information, Testing Feedback, Engine Feedback and Prompt Feedback sections.","hash":"7559d614"}}},"interview":{"file":"exit-interview.json","answers":{"sourceInformation":{"date":"2026-11-06 01:12:17","source":"Video Olympics (1977)","plan":"none","genre":"Arcade sports; paddle-sports tournament","perspective":"Oblique top-down orthographic 3D","tech":"Three.js r180 (0.180.0), WebGPURenderer with WebGL2 fallback; Rapier 3D compat 0.19.3; Gamepad API; Web Audio; AI Hub session 1.4.0; PeerJS 1.5.4; HTML/CSS/JavaScript","artDirection":"Procedural cel-style flat shading, bold ink outlines, warm paper, coral, mint, and brass; miniature stadium","animation":"Three.js AnimationMixer, AnimationClip and keyframe tracks for crowd and flags; procedural ball, paddle and particle motion","audio":"Code-written Web Audio disco/lounge music at 10% default, synthesized effects and jingles, formant-filtered gibberish voices; no audio files","online":"Two-player host-authoritative AI Hub shared-world sessions; standalone PeerJS WebRTC room codes with BroadcastChannel same-device transport; local versus","testing":"Headless Chromium WebGPU and WebGL2, scripted full cup, input and physics checks, controller and touch emulation, synthesized audio analysis, two-page multiplayer, AI Hub harness; visual screenshots for layout","research":"No source research or internet searches. Native model knowledge; only supplied AI Hub integration code and downloadable dependencies accessed.","environment":"Codex CLI (headless); Linux / Ubuntu on WSL2","model":"OpenAI, gpt-6.1-sol, reasoning effort ultra","usage":"added on import"},"testingFeedback":[{"question":"How many issues did testing catch?","answer":"6 issues found in browser tests, visual checks and integration review: stale mouse prompts, incorrect Hub metadata, audio/input after Hub end, portrait HUD overlap, title-caption contrast, and pause ignored during point celebrations. All fixed."},{"question":"How many would be considered critical issues / game breaking?","answer":"0 core gameplay failures or startup blockers. The Hub metadata compatibility defect was fixed before conformance testing."},{"question":"What was the most helpful test you ran?","answer":"The natural-physics playthrough of all three Cup events, complemented by the official AI Hub harness with 150 ms latency, 50 ms jitter and 5% packet loss. Final aggregate: 73 checks, 0 failures; the three Hub scenarios also passed all 40 internal assertions."},{"question":"What was the least helpful test you ran?","answer":"Headless WebGPU screenshots were blank despite valid rendering; backend/frame assertions and WebGL2 screenshots provided useful verification instead."}],"engineFeedback":[{"question":"What did you like most about the engine?","answer":"Three.js makes procedural geometry and native clip animation straightforward; Rapier supplies stable elastic contacts."},{"question":"Did you get stuck or guess wrong?","answer":"Headless WebGPU screenshots can be blank; visuals are checked with WebGL2 while renderer state verifies WebGPU."},{"question":"What was the most important thing you had to build yourself?","answer":"The paddle-sports rules, controller-first interface, cup progression, procedural audio and host-authoritative networking."},{"question":"What was the hardest part about using the engine?","answer":"Coordinating WebGPU rendering, fixed-step Rapier physics and responsive input in a single portable HTML file."},{"question":"What did you change in the engine, and why? (none if nothing)","answer":"none"},{"question":"If you could change one thing about the engine, what would it be?","answer":"A built-in deterministic headless image capture path for WebGPU."}],"promptFeedback":[{"question":"What did you like most about this prompt?","answer":"The source, tactile controls and clear delivery requirements encourage a complete original arcade game."},{"question":"What was confusing?","answer":"The broad source collection leaves the exact event selection open; three distinct paddle sports were chosen."},{"question":"What was the hardest thing to do?","answer":"Combining single-file delivery, two networking environments and controller/touch support into a coherent finished slice."},{"question":"What would you change in this prompt?","answer":"Separate required conformance checks from optional platform coverage, and explicitly distinguish integration documentation from source research."}],"aiHub":{"name":"Paddle Royale","tagline":"A little court. A lot of glory.","description":"A warm, ink-outlined paddle-sports club inspired by Video Olympics. Charge power returns, dash for saves, and claim the crown across three courts, solo or with a rival.","type":"Game","genre":"Sports","source":"Video Olympics (1977)","series":"","players":"1–2","controls":"Move: W/S, arrows, mouse or left stick; aim: A/D or stick; charge: Space, left click or ×/A; dash: Shift, right click or R1/RB; pause: Esc/Options; touch: drag to move, second finger to dash.","tags":["3d","arcade","sports","versus","retro","top-down"]}},"reply":"[**Play Paddle Royale**](./Paddle-Royale-Video-Olympics-gpt-6.1-sol-ultra-20261106-011217.html) · [Exit interview](./exit-interview.json)\n\nComplete three-event cup with solo AI, local versus, online rooms, controller/touch controls, attract mode, and live dev tools. Open the HTML directly; dependencies load from CDNs.\n\n**Source Information**\n\n- **Date:** 2026-11-06 01:12:17. **Source:** Video Olympics (1977). **Plan:** none.\n- **Genre:** arcade paddle sports. **Perspective:** oblique top-down orthographic 3D.\n- **Tech:** Three.js r180, WebGPU with WebGL2 fallback, Rapier 0.19.3, Gamepad API, Web Audio, AI Hub Session 1.4.0, PeerJS 1.5.4.\n- **Art:** cel-style shading, ink outlines, warm paper, coral, mint, and brass.\n- **Animation:** native AnimationMixer clips plus procedural gameplay motion.\n- **Audio:** synthesized music at 10% default, effects, jingles, and gibberish voices; no audio files.\n- **Online:** host-authoritative AI Hub sessions and standalone WebRTC rooms, with BroadcastChannel for same-device tabs.\n- **Testing:** headless gameplay, emulated controller/touch, physics, audio analysis, multiplayer, Hub conformance, and visual layout checks.\n- **Research:** native source knowledge; supplied integration documentation only.\n- **Environment:** Codex CLI, headless Linux/WSL2. **Model:** OpenAI gpt-6.1-sol, ultra reasoning. **Usage:** added on import.\n\n**Testing Feedback**\n\n1. Six issues found and fixed.\n2. Zero core game-breaking issues.\n3. Most helpful: natural-physics cup playthrough and network conformance tests. **73 checks passed**, plus all **40 internal Hub assertions**.\n4. Least helpful: blank headless WebGPU captures; renderer assertions and WebGL2 screenshots verified them instead.\n\n**Engine Feedback**\n\n1. Procedural geometry and native animation clips worked well.\n2. Blank WebGPU screenshots required a verification workaround.\n3. Built the sports rules, interface, progression, audio, and networking.\n4. Hardest part: coordinating rendering, physics, and input.\n5. Engine changes: none.\n6. Desired improvement: reliable headless WebGPU image capture.\n\n**Prompt Feedback**\n\n1. Clear creative direction and delivery requirements.\n2. Event selection was open-ended.\n3. Hardest requirement: combining both networking environments with single-file delivery.\n4. Suggested change: separate mandatory conformance checks from optional platform coverage.\n\nAll four sections are also included in-game under **About**."}}</script>
