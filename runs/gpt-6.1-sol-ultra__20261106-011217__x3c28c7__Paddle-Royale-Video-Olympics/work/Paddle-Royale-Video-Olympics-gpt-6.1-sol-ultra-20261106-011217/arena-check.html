<html><meta charset="utf-8"><style>body{margin:0}canvas{width:100vw;height:100vh}</style><canvas id="v"></canvas><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js";async function createArena(THREE, canvas) {
  const C={ink:0x183b3c,paper:0xf5edce,white:0xfff9e6,coral:0xf16b50,mint:0x64bea5,gold:0xf2bc44,muted:0x9aab91,deep:0x2f6257,blue:0x6ca0b2};

  sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-19;sun.shadow.camera.right=19;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;sun.shadow.normalBias=.05;sun.shadow.bias=-.0003;scene.add(sun);

  function textTexture(text,width=1024,height=128,bg=null,fg='#183b3c',size=72){const c=document.createElement('canvas');c.width=width;c.height=height;const cx=c.getContext('2d');if(bg){cx.fillStyle=bg;cx.fillRect(0,0,width,height);}cx.fillStyle=fg;cx.font=`900 ${size}px "Arial Black",Arial,sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(text,width/2,height/2);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
  function label(text,x,y,z,w,h,{rotation=0,color='#183b3c',bg=null,size=72}={}){const tex=textTexture(text,1024,192,bg,color,size);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:!bg,depthWrite:!!bg}));m.position.set(x,y,z);m.rotation.x=rotation;scene.add(m);return m;}
  // A miniature arena cut from layers of painted wood and heavy ink.
  const backdrop=box(0,-1.55,0,300,.12,300,C.paper,scene,0);backdrop.receiveShadow=true;
  box(0,-.95,0,27,.7,19.1,C.ink,scene,.006);
  box(0,-.53,0,26.6,.28,18.7,C.gold,scene,.008);
  box(0,-.27,0,26.15,.28,18.25,C.white,scene,.008);
  box(0,-.09,0,22.5,.24,13.8,C.ink,scene,.006);

  // Paper-print striping, borders, and scoring marks.
  const stripes=[];
  for(let i=0;i<10;i++){const m=line(-9+i*2,0,1.98,11.9,i%2?0xefe5c1:0xf5edce,.098);stripes.push(m);}
  line(0,-6,20.3,.11);line(0,6,20.3,.11);line(-10,0,.11,12);line(10,0,.11,12);
  for(let z=-5.6;z<6;z+=.7)line(0,z,.08,.33,C.ink,.113);
  const centerCircle=new THREE.Mesh(new THREE.RingGeometry(1.59,1.63,64),mat(C.ink));centerCircle.rotation.x=-Math.PI/2;centerCircle.position.y=.117;scene.add(centerCircle);
  disc(0,.12,0,.13,.016,C.ink,scene,0);
  for(const side of [-1,1]){

    for(let z=-5;z<=5;z+=1)line(side*9.6,z,.18,.035,C.ink,.12);
    const p=label(side<0?'01':'02',side*7.45,.14,4.7,1.5,.35,{rotation:-Math.PI/2,size:82});

  }
  label('P A D D L E   /   R O Y A L E',0,.15,7.85,10.6,.58,{rotation:-Math.PI/2,size:70});
  label('SPORTING CLUB  •  EST. 1977',0,.15,-7.5,9,.38,{rotation:-Math.PI/2,size:62});
  for(const side of [-1,1]){
    box(0,.35,side*6.18,20.6,.52,.24,C.ink,scene,.01);
    box(0,.64,side*6.18,20.6,.1,.29,C.white,scene,.02);
    for(let x=-9;x<=9;x+=2.25){box(x,.36,side*6.32,.65,.55,.13,x<0?C.coral:C.mint,scene,.03);}
  }
  // The two paddle athletes have little sneakers and a wrap-around sweatband.
  const paddles=[];
  for(let i=0;i<2;i++){
    const side=i?1:-1,color=i?C.mint:C.coral,g=new THREE.Group();g.position.set(side*9,0,0);scene.add(g);
    const shadow=new THREE.Mesh(new THREE.CircleGeometry(1,32),softInk);shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.126,.16);shadow.scale.set(.9,1.3,1);g.add(shadow);
    const body=box(0,.57,0,.5,.81,1.86,color,g,.06);
    box(0,.9,0,.54,.12,1.94,C.white,g,.045);
    box(-side*.265,.56,0,.026,.26,.58,C.white,g,0);
    for(const z of [-.62,.62]){
      box(side*.06,.2,z,.61,.24,.46,C.ink,g,.035);
      box(-side*.12,.25,z,.25,.13,.36,C.white,g,.05);
    }

    const ring=new THREE.Mesh(new THREE.RingGeometry(.68,.76,36),new THREE.MeshBasicMaterial({color:C.gold,transparent:true,opacity:0,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.14;ring.scale.set(1,1.6,1);g.add(ring);
    const aim=box(-side*.95,.2,0,.75,.025,.055,color,g,0);aim.visible=false;
    paddles.push({g,body,ring,aim,side});
  }
  const ballGroup=new THREE.Group();scene.add(ballGroup);
  const ball=sphere(0,.52,0,.29,C.gold,ballGroup);
  const ballStripe=disc(0,.52,0,.3,.07,C.white,ballGroup,.01);ballStripe.rotation.z=.65;
  const ballShadow=new THREE.Mesh(new THREE.CircleGeometry(.35,24),softInk);ballShadow.rotation.x=-Math.PI/2;ballShadow.position.y=.13;scene.add(ballShadow);
  const trail=[];for(let i=0;i<22;i++){const m=sphere(0,.32,0,.18*(1-i/25),i%3?C.gold:C.white);m.castShadow=false;m.visible=false;trail.push(m);}
  const sparkMeshes=[];for(let i=0;i<90;i++){const m=mesh(gHead,i%3===0?C.coral:i%3===1?C.gold:C.mint,scene,0);m.scale.setScalar(.075);m.visible=false;sparkMeshes.push(m);}
  const bankGroup=new THREE.Group();scene.add(bankGroup);
  const bumpers=[];
  for(const [x,z] of [[-3,-2.5],[3,2.5]]){
    disc(x,.18,z,1.05,.13,C.ink,bankGroup,.01);disc(x,.25,z,.95,.1,C.white,bankGroup,.015);
    const target=new THREE.Mesh(new THREE.RingGeometry(.76,.79,40),mat(C.coral));target.rotation.x=-Math.PI/2;target.position.set(x,.31,z);bankGroup.add(target);
    const b=disc(x,.56,z,.58,.55,C.gold,bankGroup,.055);disc(x,.87,z,.42,.1,C.coral,bankGroup,.03);disc(x,.93,z,.19,.04,C.white,bankGroup,.03);bumpers.push(b);
    for(let a=0;a<4;a++){const angle=a*Math.PI/2;const mark=line(x+Math.cos(angle)*1.18,z+Math.sin(angle)*1.18,.2,.04,C.ink,.13,bankGroup);mark.rotation.y=-angle;}
  }
  bankGroup.visible=false;
  const goalGroup=new THREE.Group();scene.add(goalGroup);
  for(const side of [-1,1]){
    const color=side<0?C.coral:C.mint;
    for(const z of [-4.2,4.2]){
      box(side*10.05,.54,z,.3,.85,3.25,color,goalGroup,.035);
      for(let j=-1;j<=1;j++)box(side*9.87,.98,z+j,.37,.08,.24,C.white,goalGroup,.025);
    }
    // A small proper net stretches off the edge of the table.
    for(const z of [-2.4,2.4]){box(side*10.15,.88,z,.17,1.7,.17,C.white,goalGroup,.07);box(side*11.25,.75,z,.12,1.45,.12,C.ink,goalGroup,.04);}
    box(side*10.15,1.68,0,.18,.18,4.98,C.white,goalGroup,.035);
    box(side*11.25,1.44,0,.1,.1,4.9,C.ink,goalGroup,.025);
    for(let z=-2.4;z<=2.41;z+=.4){box(side*11.25,.76,z,.035,1.35,.035,C.white,goalGroup,0);box(side*10.7,1.55,z,1.2,.03,.035,C.white,goalGroup,0);}
    for(let y=.2;y<1.5;y+=.26)box(side*11.25,y,0,.035,.035,4.8,C.white,goalGroup,0);
    const arc=new THREE.Mesh(new THREE.RingGeometry(2.7,2.75,48,1,side<0?-Math.PI/2:Math.PI/2,Math.PI),mat(C.ink));arc.rotation.x=-Math.PI/2;arc.position.set(side*10,.13,0);goalGroup.add(arc);
  }

  const crowdGroups=[];
  const crowdColors=[C.coral,C.mint,C.gold,C.white,C.blue];
  for(let row=0;row<3;row++){

        const body=box(x,.24,z,.36,.44,.32,color,g,.07);
        sphere(x,.62,z,.22,C.paper,g,gHead);
        box(x,.77,z,.42,.1,.3,color,g,.04);
        const a=box(x-.24,.4,z,.1,.34,.1,color,g,.08);a.rotation.z=.7;
        const b=box(x+.24,.4,z,.1,.34,.1,color,g,.08);b.rotation.z=-.7;
      }

      const track=new THREE.NumberKeyframeTrack('.position[y]',[0,dur*.25,dur*.5,dur*.75,dur],[g.position.y,g.position.y+.09,g.position.y,g.position.y+.03,g.position.y]);
      const clip=new THREE.AnimationClip('terrace-bounce',dur,[track]);mixer.clipAction(clip).play();mixer.setTime(cluster*.22+row*.33);mixers.push(mixer);
    }
  }
  // Far side scoreboard, expressive advertising panels, flags, and floodlights.
  for(const x of [-5.5,5.5])box(x,1.3,-11.1,.22,2.6,.22,C.ink,scene,.03);
  box(0,3.02,-11.1,12.7,1.8,.28,C.ink,scene,.02);
  box(0,3.03,-10.93,12.3,1.45,.055,C.gold,scene,.02);
  label('GOOD SPORT. GREAT SHOT.',0,3.1,-10.88,11.3,.75,{size:75});
  for(const x of [-6,6])sphere(x,3.02,-10.87,.15,C.coral);
  for(const [x,z] of [[-12.6,-7.2],[12.6,-7.2],[-12.6,7.7],[12.6,7.7]]){
    box(x,2.75,z,.16,5.5,.16,C.ink,scene,.03);box(x,5.5,z,1.7,.65,.28,C.ink,scene,.03);
    for(let j=0;j<3;j++){const lamp=box(x+(j-1)*.48,5.5,z+.18,.33,.4,.1,C.white,scene,.04);}
    const base=disc(x,.12,z,.38,.28,C.ink,scene,.02);
  }
  for(const side of [-1,1]){
    for(let j=0;j<3;j++){
      const x=side*(8.5+j*1.45),z=-11.6;
      box(x,2.15,z,.06,4.3,.06,C.ink,scene,.02);
      const flag=new THREE.Group();flag.position.set(x,4.13,z);scene.add(flag);
      const shape=new THREE.Shape();shape.moveTo(0,0);shape.lineTo(.95,-.27);shape.lineTo(0,-.56);shape.closePath();
      const m=mesh(new THREE.ShapeGeometry(shape),j%2?C.gold:side<0?C.coral:C.mint,flag,0);m.material=mat(j%2?C.gold:side<0?C.coral:C.mint,{side:THREE.DoubleSide});
      const mixer=new THREE.AnimationMixer(flag);const d=2.4+j*.25;
      const track=new THREE.NumberKeyframeTrack('.rotation[y]',[0,d*.25,d*.5,d*.75,d],[0,.35,0,-.25,0]);mixer.clipAction(new THREE.AnimationClip('pennant-flutter',d,[track])).play();mixer.setTime(j*.4);mixers.push(mixer);
    }
  }
  // Club pennants along the near apron.
  for(let j=-5;j<=5;j++){
    const shp=new THREE.Shape();shp.moveTo(-.33,0);shp.lineTo(.33,0);shp.lineTo(0,-.58);shp.closePath();const flag=mesh(new THREE.ShapeGeometry(shp),j%2?C.coral:C.mint,scene,0);flag.material=mat(j%2?C.coral:C.mint,{side:THREE.DoubleSide});flag.position.set(j*1.65,.12,8.35);flag.rotation.x=-.18;
  }
  // Decorative clipped-corner club crests.
  for(const side of [-1,1]){
    const g=new THREE.Group();g.position.set(side*12.35,.2,4.7);scene.add(g);
    const d=disc(0,.06,0,.6,.1,C.ink,g,.015);disc(0,.13,0,.48,.07,C.gold,g,.01);
    for(let i=0;i<3;i++){const b=box((i-1)*.21,.2,0,.11,.05,.49,C.white,g,.01);b.rotation.y=.4;}
  }
  let elapsed=0,lastMode='',cameraOffset=0,frame=0;
  function resize(){const w=innerWidth,h=innerHeight,aspect=w/h;const viewHeight=aspect<1?29:aspect<1.4?24.5:23;camera.left=-viewHeight*aspect/2;camera.right=viewHeight*aspect/2;camera.top=viewHeight/2;camera.bottom=-viewHeight/2;camera.updateProjectionMatrix();renderer.setSize(w,h);}
  resize();

      const p=paddles[i],s=pds[i]||{};p.g.position.z=s.z||0;
      p.body.rotation.x=(s.velocity||0)*.006;p.body.scale.y=.81*(1+Math.sin(elapsed*8)*.015);
      const charge=Math.max(0,Number(s.charge)||0);p.ring.material.opacity=charge*.85;p.ring.rotation.z=elapsed*2;p.ring.scale.set(1+charge*.5,(1+charge*.5)*1.6,1);

    const sparks=state.particles||[];sparkMeshes.forEach((m,i)=>{const p=sparks[i];m.visible=!!p&&p.life>0;if(p){m.position.set(p.x,(p.y??.45),p.z);m.scale.setScalar(.05+Math.max(0,p.life)*.1);m.rotation.x+=dt*8;m.rotation.z+=dt*5;if(p.color!==undefined)m.material=mat(p.color);}});

}

window.errors=[];try{window.arena=await createArena(THREE,document.querySelector("canvas"));function loop(){arena.update(.016,{phase:"play",mode:"bank"});requestAnimationFrame(loop)}loop();window.ready=true}catch(e){window.errors.push(e.stack);console.error(e)}</script></html>
