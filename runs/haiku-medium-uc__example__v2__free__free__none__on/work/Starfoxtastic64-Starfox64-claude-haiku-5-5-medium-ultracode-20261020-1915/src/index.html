<!--@@BUILD_NOTES@@-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starfoxtastic 64</title>
<style>
  :root {
    --ink: #05060c;
    --panel: rgba(8, 14, 32, 0.9);
    --line: #7fd4ff;
    --amber: #ffb24a;
    --red: #ff5c7a;
    --green: #7dffa0;
    --text: #e8f1ff;
    --dim: #8ea3c4;
    --hud-scale: 1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  .hidden { display: none !important; }
  #stage, #stage canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  /* Boot and fatal screens */
  #boot p { font-size: clamp(1.1rem, 2.4vmin, 1.6rem); letter-spacing: 0.2em; color: var(--dim); }
  #fatal { background: var(--ink); flex-direction: column; gap: 1rem; text-align: center; padding: 2rem; pointer-events: auto; }
  #fatal h1 { color: var(--red); font-size: clamp(1.6rem, 4vmin, 2.8rem); margin: 0; }
  #fatal p { max-width: 42rem; font-size: clamp(1rem, 2.2vmin, 1.4rem); color: var(--dim); line-height: 1.5; }

  /* Title */
  #title {
    flex-direction: column;
    gap: 0.6rem;
    text-align: center;
    background: radial-gradient(ellipse at 50% 60%, rgba(30, 40, 90, 0.2), rgba(5, 6, 12, 0.7) 70%);
  }
  .logo { display: flex; align-items: baseline; gap: 0.6vmin; font-weight: 900; letter-spacing: 0.04em; text-shadow: 0 0 2.4vmin rgba(127, 212, 255, 0.6); }
  .logo span { font-size: clamp(2.4rem, 9vmin, 7.5rem); color: #fff; }
  .logo b { font-size: clamp(3.4rem, 13vmin, 11rem); color: var(--amber); }
  .tagline { font-size: clamp(1rem, 2.8vmin, 1.8rem); color: var(--dim); margin: 0; letter-spacing: 0.12em; }
  .press { margin-top: 5vmin; font-size: clamp(1.2rem, 3.6vmin, 2.4rem); letter-spacing: 0.3em; animation: blink 1.6s steps(2, start) infinite; }
  .foot { font-size: clamp(0.9rem, 2vmin, 1.25rem); color: var(--dim); margin: 0; }
  @keyframes blink { to { visibility: hidden; } }

  /* HUD */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    font-size: calc(clamp(12px, 1.9vmin, 22px) * var(--hud-scale));
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 0.6em rgba(0, 0, 0, 0.9);
  }
  #hud > div { position: absolute; }
  #hud .label { color: var(--dim); font-size: 0.8em; letter-spacing: 0.15em; margin-right: 0.8em; }
  #hud-top-left { left: 3vmin; top: 3vmin; width: 36vmin; }
  #hud-top-right { right: 3vmin; top: 3vmin; text-align: right; }
  #hud-top-right .label { margin-right: 0; margin-left: 0.8em; }
  #hud-top-left .row2, #hud-top-right .row2, #hud-top-right .score { display: flex; align-items: center; gap: 0.6em; margin-top: 0.5em; }
  #hud-top-right .score { justify-content: flex-end; font-size: 1.6em; font-weight: 800; }
  #hud-top-right .row2 { justify-content: flex-end; }
  .gauge { display: flex; align-items: center; gap: 0.6em; font-size: 1.1em; }
  .bar { flex: 1; height: 1.1em; border: 2px solid var(--line); background: rgba(5, 10, 24, 0.7); border-radius: 0.2em; overflow: hidden; }
  .bar.wide { width: 100%; }
  .bar > div { height: 100%; width: 100%; background: linear-gradient(90deg, #4fc3ff, var(--green)); transition: width 0.12s linear; }
  #hud-shield-fill[data-state="low"] { background: linear-gradient(90deg, #ff5c7a, #ffb24a) !important; }
  #hud-shield-fill.pulse { filter: brightness(1.6); }
  #hud-shield-text { min-width: 3ch; text-align: right; font-weight: 800; }
  #hud-bombs { display: flex; gap: 0.35em; }
  .bomb { width: 1.1em; height: 1.1em; border: 2px solid var(--line); border-radius: 0.15em; transform: skewX(-12deg); }
  .bomb.on { background: #66b8ff; box-shadow: 0 0 0.6em #66b8ff; }
  #hud-laser { color: var(--green); font-weight: 700; }
  #hud-score, #hud-kills, #hud-time { font-weight: 800; }
  #hud-stage {
    top: 26%;
    left: 0;
    right: 0;
    text-align: center;
    animation: stage-card 3.2s ease-out forwards;
  }
  #hud-stage-name { font-size: clamp(1.6rem, 5vmin, 3.8rem); font-weight: 900; letter-spacing: 0.08em; }
  #hud-stage-sub { font-size: clamp(1rem, 2.4vmin, 1.5rem); color: var(--dim); letter-spacing: 0.2em; }
  @keyframes stage-card { 0% { opacity: 0; transform: translateY(1.5vmin); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
  #hud-boss { top: 3vmin; left: 50%; transform: translateX(-50%); width: min(60vw, 80vmin); text-align: center; }
  #hud-boss-name { font-weight: 800; color: var(--red); letter-spacing: 0.2em; margin-bottom: 0.4em; }
  #hud-boss .bar { border-color: var(--red); height: 1.2em; }
  #hud-boss .bar > div { background: linear-gradient(90deg, #ff5c7a, #ffb24a); }
  #hud-route { bottom: 26vmin; left: 0; right: 0; display: flex; justify-content: center; gap: 4vmin; font-weight: 800; letter-spacing: 0.12em; opacity: 0.55; }
  #hud-route .blue { color: #4fc3ff; }
  #hud-route .orange { color: #ff7a3b; }
  #hud-route[data-side="left"] .blue { opacity: 1; text-shadow: 0 0 1em #4fc3ff; }
  #hud-route[data-side="right"] .orange { opacity: 1; text-shadow: 0 0 1em #ff7a3b; }
  #hud-radio {
    bottom: 4vmin;
    left: 50%;
    transform: translateX(-50%);
    width: min(78vw, 120vmin);
    background: var(--panel);
    border-left: 0.5em solid var(--line);
    border-radius: 0.3em;
    padding: 0.8em 1.1em;
  }
  #hud-radio-who { font-weight: 900; letter-spacing: 0.2em; font-size: 0.9em; }
  #hud-radio-text { font-size: 1.15em; line-height: 1.4; margin-top: 0.3em; }
  #hud-toast { top: 22%; left: 50%; transform: translateX(-50%); font-size: 1.6em; font-weight: 900; letter-spacing: 0.15em; white-space: nowrap; }
  #hud-lock-status { bottom: 36vmin; left: 50%; transform: translateX(-50%); color: var(--amber); font-weight: 800; letter-spacing: 0.2em; font-size: 1.1em; }
  #hud-aim, .hud-lock {
    position: absolute;
    width: 3.4em;
    height: 3.4em;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }
  #hud-aim { border: 2px solid rgba(127, 212, 255, 0.85); }
  #hud-aim::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0.2em; height: 0.2em; background: #7fd4ff; transform: translate(-50%, -50%); }
  .hud-lock { border: 3px solid #ffe066; box-shadow: 0 0 0.8em #ffe066; border-radius: 0.2em; width: 2.6em; height: 2.6em; display: none; }
  .hud-lock.on { display: block; }
  #hud-pops { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); }
  .hud-pop { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 900; color: #ffe066; animation: pop 0.9s ease-out forwards; }
  @keyframes pop { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -6vmin); } }
  #hud-damage { inset: 0; position: absolute; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 40, 60, 0.7) 100%); }
  #hud-flash { inset: 0; position: absolute; opacity: 0.45; }
  #hud-attract { top: 1.8vmin; left: 50%; transform: translateX(-50%); color: var(--amber); font-weight: 800; letter-spacing: 0.2em; animation: blink 1.4s steps(2, start) infinite; }

  /* Menus and panels */
  #menu {
    background: radial-gradient(ellipse at 40% 50%, rgba(5, 6, 12, 0.2), rgba(5, 6, 12, 0.85));
    pointer-events: auto;
    padding: 4vmin;
  }
  #menu .panel {
    width: min(94vw, 980px);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 2px solid rgba(127, 212, 255, 0.35);
    border-radius: 0.8em;
    padding: 3.2vmin 3.6vmin;
    box-shadow: 0 0 4vmin rgba(0, 0, 0, 0.6);
  }
  #menu-title { margin: 0; font-size: clamp(1.8rem, 5vmin, 3.2rem); letter-spacing: 0.1em; font-weight: 900; }
  #menu-sub { margin: 0.4em 0 1.2em; color: var(--dim); font-size: clamp(1rem, 2.4vmin, 1.4rem); }
  #menu-body { overflow: auto; font-size: clamp(0.95rem, 2.2vmin, 1.25rem); line-height: 1.5; margin-bottom: 1.4em; padding-right: 0.6em; min-height: 0; flex: 1 1 auto; }
  #menu-list { overflow: auto; min-height: 0; flex: 0 1 auto; display: flex; flex-direction: column; gap: 0.5em; }
  .row {
    display: flex;
    align-items: baseline;
    gap: 1.2em;
    width: 100%;
    padding: 0.8em 1.1em;
    font: inherit;
    font-size: clamp(1.1rem, 3vmin, 1.7rem);
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
    border: 2px solid transparent;
    border-radius: 0.3em;
    text-align: left;
    cursor: pointer;
    flex-wrap: wrap;
  }
  .row.focus { border-color: var(--line); background: rgba(127, 212, 255, 0.14); box-shadow: 0 0 2vmin rgba(127, 212, 255, 0.25); }
  .row.disabled { opacity: 0.4; cursor: default; }
  .row-label { font-weight: 700; }
  .row-value { margin-left: auto; color: var(--amber); font-weight: 800; }
  .row-hint { color: var(--dim); font-size: 0.7em; flex-basis: 100%; }
  #menu-footer { margin: 1.2em 0 0; color: var(--dim); font-size: clamp(0.85rem, 1.9vmin, 1.1rem); }
  .help h3, .about h3 { margin: 1em 0 0.4em; color: var(--line); font-size: 1.1em; letter-spacing: 0.1em; }
  .help dl, dl.src { display: grid; grid-template-columns: minmax(10rem, max-content) 1fr; gap: 0.3em 1.4em; margin: 0; }
  .help dt, dl.src dt { font-weight: 800; color: var(--text); }
  .help dd, dl.src dd { margin: 0; color: var(--dim); }
  .about > p { margin-top: 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4em 2em; margin-bottom: 1em; }
  .stats div { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(127, 212, 255, 0.2); padding-bottom: 0.2em; }
  .stats span { color: var(--dim); }
  .stats b { color: var(--text); }
  .medal { font-size: 1.6em; font-weight: 900; letter-spacing: 0.1em; margin: 0.4em 0 0; text-align: center; }
  .medal.gold { color: #ffe066; text-shadow: 0 0 1em #ffe066; }
  .medal.silver { color: #d6e6ff; }
  .medal.bronze { color: #e0a070; }
  .medal.none { color: var(--dim); }

  @media (max-width: 700px) {
    .row { font-size: 1.05rem; }
    .help dl, dl.src, .stats { grid-template-columns: 1fr; }
    #hud-top-left { width: 52vmin; }
    #hud-route { bottom: 30vmin; }
  }
</style>
</head>
<body data-state="boot">
  <div id="stage"></div>

  <div id="boot" class="overlay"><p>LOADING</p></div>

  <div id="fatal" class="overlay hidden">
    <h1 id="fatal-title"></h1>
    <p id="fatal-text"></p>
  </div>

  <section id="title" class="overlay hidden">
    <div class="logo"><span>STARFOXTASTIC</span><b>64</b></div>
    <p class="tagline">An original spiritual successor</p>
    <p class="press">PRESS START / ENTER</p>
    <p class="foot">Controller recommended (PS5 layout). Keyboard works too.</p>
  </section>

  <section id="hud" class="hidden">
    <div id="hud-top-left">
      <div class="gauge"><span class="label">SHIELD</span><div class="bar"><div id="hud-shield-fill"></div></div><span id="hud-shield-text">100</span></div>
      <div class="row2"><span class="label">BOMBS</span><div id="hud-bombs"></div></div>
      <div class="row2"><span class="label">LASER</span><span id="hud-laser">SINGLE</span></div>
    </div>
    <div id="hud-top-right">
      <div class="score"><span class="label">SCORE</span><span id="hud-score">0000000</span></div>
      <div class="row2"><span class="label">DOWNED</span><span id="hud-kills">00 / 00</span></div>
      <div class="row2"><span class="label">TIME</span><span id="hud-time">00:00</span></div>
    </div>
    <div id="hud-stage" class="hidden">
      <div id="hud-stage-name"></div>
      <div id="hud-stage-sub"></div>
    </div>
    <div id="hud-boss" class="hidden">
      <div id="hud-boss-name"></div>
      <div class="bar wide"><div id="hud-boss-fill"></div></div>
    </div>
    <div id="hud-route" class="hidden"><span class="blue">BLUE GATE: KESSAR BELT</span><span class="orange">RED GATE: SOLACE CANYON</span></div>
    <div id="hud-radio" class="hidden">
      <div id="hud-radio-who"></div>
      <div id="hud-radio-text"></div>
    </div>
    <div id="hud-toast" class="hidden"></div>
    <div id="hud-lock-status" class="hidden"></div>
    <div id="hud-aim"></div>
    <div id="hud-locks"></div>
    <div id="hud-pops"></div>
    <div id="hud-damage" class="hidden"></div>
    <div id="hud-flash" class="hidden"></div>
    <div id="hud-attract" class="hidden">ATTRACT MODE: PRESS ANY BUTTON</div>
  </section>

  <section id="menu" class="overlay hidden">
    <div class="panel">
      <h1 id="menu-title"></h1>
      <p id="menu-sub" class="hidden"></p>
      <div id="menu-body" class="hidden"></div>
      <div id="menu-list"></div>
      <p id="menu-footer"></p>
    </div>
  </section>

<!--@@SCRIPT@@-->
</body>
</html>
