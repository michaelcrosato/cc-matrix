# Tippy Cay, loaded on its own for Wobble Minutes. Small on purpose: the sim steps this
# thousands of times in tests.
name = "Tippy Cay"
about = "A bright deck, a mat, and a lagoon that thinks it is a sports field."
entrance = { at = [2, 10], facing = "south" }

[camera]
tilt = 16.0
distance = 8.5
fov = 36.0
yaw = 0.0

[view]
sky = "#c9e7ff"
"light.sun_elevation" = 62.0
"light.sun_intensity" = 1.15
"light.ambient" = 0.55
"cutaway.height_cut" = false

[layout]
origin = [-8.0, 0.0, -6.0]

[[layout.layer]]
y = 0
map = '''
################
#..............#
#..............#
#....wwwwww....#
#....wwwwww....#
#..............#
#......P.......#
#..............#
#..............#
#..............#
#..............#
################
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0.0, color = "#f0d7a8" }]
grass = { color = "#b7e0a4", height = 0.16, density = 2.0 }

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0.0, color = "#f0d7a8" }, { y0 = 0.0, y1 = 0.35, color = "#f7b7c8", rounded = true }]

[layout.legend.'w']
blocks = [{ y0 = -0.7, y1 = -0.02, color = "#7fd0ea" }]

[layout.legend.'P']
blocks = [{ y0 = -0.5, y1 = 0.0, color = "#ffe8b0" }]
marker = "player"

# Beach dressing. body "none" so the props are visible and the bot's walk stays clear.
[[object]]
name = "rowboat"
asset = "LIB/core/rowboat"
pos = [4.2, 0.0, 3.5]
yaw = 18
body = "none"

[[object]]
name = "bench"
asset = "LIB/core/park_bench"
pos = [12.2, 0.0, 7.6]
yaw = -12
body = "none"

[[object]]
name = "lamp"
asset = "LIB/core/lamp_post"
pos = [2.3, 0.0, 2.2]
body = "none"

[[object]]
name = "stall"
asset = "LIB/core/market_stall"
pos = [13.0, 0.0, 2.3]
body = "none"

[[object]]
name = "table"
asset = "LIB/core/round_table"
pos = [10.6, 0.0, 9.3]
body = "none"

[[object]]
name = "chair"
asset = "LIB/core/chair"
pos = [11.8, 0.0, 9.5]
yaw = 200
body = "none"

[[object]]
name = "wobble_mat"
shape = { type = "box", half = [0.7, 0.04, 0.45] }
pos = [5.0, 0.05, 8.3]
color = "#f4e7d4"
body = "none"

[[object]]
name = "lagoon_mat"
shape = { type = "box", half = [0.7, 0.04, 0.45] }
pos = [9.4, 0.05, 8.3]
color = "#b7e0d4"
body = "none"

[[object]]
name = "clam"
shape = { type = "sphere", radius = 0.28 }
pos = [3.5, 0.22, 8.8]
color = "#f7e2c2"
body = "none"

[[object]]
name = "calendar_board"
shape = { type = "box", half = [0.55, 0.42, 0.05] }
pos = [13.3, 1.05, 6.1]
color = "#fff6e4"
body = "none"
