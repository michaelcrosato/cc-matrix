names = ["Avery", "Blair", "Casey", "Devon", "Eden", "Finley", "Gray", "Harper", "Indigo", "Jules", "Kai", "Lane", "Marlow", "Nico", "Oak", "Piper", "Quinn", "Reese", "Sage", "Tatum", "Umber", "Vesper", "Winter", "Yael", "Zephyr", "Ash", "Bay", "Cove", "Dell", "Echo", "Fern", "Glen", "Haze", "Isle", "Jory", "Kit", "Lark", "Moss", "Nell", "Orla"]
titles = ["Human Soup", "Acceptable Human", "Certified Lean-To", "Wobble Enthusiast", "Seasoned Tilter", "Stillness Intern", "Professional Standing Person", "Alarmingly Balanced", "Soft Architecture", "Temporary Tower", "Polite Collapse", "Almost a Statue", "Guest of Gravity", "Mildly Vertical", "The Lean Years", "Upright Citizen", "Foam and Fortune", "Unbothered", "Quiet Furniture", "Balance Curious", "Practised Sway", "Harbour of Knees", "Steady Enough", "The Long Blink", "Kind to the Floor", "Not a Statue Yet", "Vertical-ish", "Champion of Standing Around", "Inner Puddle", "Buoyant Citizen", "Resort-Grade Upright", "Golden Pause"]
skins = ["Sand", "Seafoam", "Coral", "Dusk", "Foam", "Kelp"]
