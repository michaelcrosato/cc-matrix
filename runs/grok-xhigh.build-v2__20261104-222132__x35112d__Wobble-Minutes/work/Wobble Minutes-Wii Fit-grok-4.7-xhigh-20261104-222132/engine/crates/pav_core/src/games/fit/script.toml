[[lines]]
speaker = "Pip"
tag = "intro"
text = "Welcome ashore. The mat remembers nothing yet."

[[lines]]
speaker = "Pip"
tag = "intro"
text = "The deck is warm. You do not have to be."

[[lines]]
speaker = "Pip"
tag = "intro"
text = "Hold the rail if you like. It does not judge."

[[lines]]
speaker = "Pip"
tag = "intro"
text = "Morning. I saved you the shady side of the board."

[[lines]]
speaker = "Pip"
tag = "wake1"
text = "Breathe like the tide is a suggestion, not a boss."

[[lines]]
speaker = "Pip"
tag = "wake1"
text = "Your feet are doing a conversation. Let them finish."

[[lines]]
speaker = "Pip"
tag = "wake2"
text = "We measure balance here, and then we stop measuring."

[[lines]]
speaker = "Pip"
tag = "wake2"
text = "A tip is a comma. The stay continues."

[[lines]]
speaker = "Pip"
tag = "wake3"
text = "Stars are compliments. Minutes are the rent."

[[lines]]
speaker = "Pip"
tag = "wake3"
text = "The rowboat leaves when the week says you can stand in it."

[[lines]]
speaker = "Pip"
tag = "wake4"
text = "If the week is not finished with you, the hammock is."

[[lines]]
speaker = "Pip"
tag = "wake4"
text = "I am a small coach with a large belief in standing."

[[lines]]
speaker = "Pip"
tag = "wake5"
text = "Posey will ask you to pose. The pose can be ordinary."

[[lines]]
speaker = "Pip"
tag = "wake5"
text = "Kettle counts reps the way a kettle counts boils. Patiently, then suddenly."

[[lines]]
speaker = "Pip"
tag = "sleep"
text = "Bounce thinks every heartbeat is a party invitation."

[[lines]]
speaker = "Pip"
tag = "sleep"
text = "The Commodore has never been on time and never been wrong about water."

[[lines]]
speaker = "Pip"
tag = "reveal"
text = "Marjorie will hand you a tray. The tray has opinions."

[[lines]]
speaker = "Pip"
tag = "reveal"
text = "Tom is writing the brochure. He is on sentence one."

[[lines]]
speaker = "Pip"
tag = "ending"
text = "The twins are sharing one pair of sunglasses and two plans."

[[lines]]
speaker = "Pip"
tag = "ending"
text = "Flip-flops wander off. If you find five, the gold pair finds you."

[[lines]]
speaker = "Pip"
tag = "credits"
text = "Yesterday you left a faint copy on the deck. It does not keep score."

[[lines]]
speaker = "Pip"
tag = "credits"
text = "Close your eyes when I ask. I will keep mine open."

[[lines]]
speaker = "Pip"
tag = "credits"
text = "The dot in the disc is your centre, not your worth."

[[lines]]
speaker = "Pip"
tag = "credits"
text = "Lean is the whole verb. The island supplies the nouns."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Guests come and go. The mat stays slightly damp."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Stamp the day when the minutes are met, not when you are tired of me."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "I will not hurry the last half-minute. Stillness is the trick question."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "If a button says skip, it is a liar with a nice font."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "The gull is not a coach. The gull is a weather system."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Tea is at four. Tea does not care about your personal best."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "The lagoon is a sports field that apologises in waves."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Paddle as if the gates were polite. They are not."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Shells want the pools. You are only the tide's assistant."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "A cannonball is a conversation with the surface. Tuck, then listen."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Step on the beat the box believes in. It believes in ninety-six."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Two steps a second is a walk, not a rescue."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Ribbons are optional. Crabs are a footnote with claws."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Spin the ring the way a slow record spins. Catch what they throw."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Brace means both hands on the day. One hand is a nap."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Down for two, up for one. The band is a small country. Stay in it."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "The ring will shrink. You may shrink your plans to match."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Accept the bird. It has no ticket and excellent timing."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "In for four, out for four. The flower is a clock."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "If your lungs and the guide disagree, believe the slower one."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "I kept your name on a shell. Shells are the filing system."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Four hammocks, four names, one very calm ledger."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Play Together is one mat and a queue of brave people."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Pass the pad like a relay baton made of plastic and trust."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "The medley is three water games and one shared seed of chaos."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Dev mode is the broom closet. The sliders are labelled. Reset is a promise."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Music sits low, like a band behind a hedge. You can invite it closer."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Glyphs follow the last thing you touched. The mat does not play favourites."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "A keyboard leans the way a tide comes in. Release, and it goes home."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "The mouse is a long arm. The centre of the glass is neutral."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Touch is for the settings card and nothing else. Bring a controller when you can."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Attract mode is the island showing off. It saves nothing, not even a blush."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Ten quiet seconds and the brochure plays itself. Any real input sends it away."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "I do not own a scale. I own a mat, a whistle, and office hours."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Age here is a party trick with a formula. Lower is calmer, not smaller."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Days open in order: still, strong, quick, then the lagoon."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Day five is everything once, and then a long nothing. Do the nothing."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Inner peace is a bonus, not a doorway. Pressing skips the bonus, not the stay."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "You can retry a game. You cannot retry a kindness. We only stock the first."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Personal bests live in the slot with your name. They wave at Yesterday."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "If you were gone, I noticed. The pier kept your spot anyway."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Free play means the schedule unlocks. The coaches still want to chat."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Credits roll for the rowboat and for the extended hammock. Both are a finish."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "I will be here in the morning whether you check out or not."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Stand on the disc. I will stand on the sentence."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "The pastel is intentional. The wobble is also intentional."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "When the dot hunts you, that is physics. When you hunt it, that is practice."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "A good rep sounds like a small bell. A bad rep sounds like me being kind."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "The tray holds five glasses. The pier holds a grudge."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Judges at the pool brought cards. Their faces brought nothing."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Big Kettle's plank is a dare with a soft landing. Tips cost time, not the week."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Pose three is when the bird arrives. Pose four does not exist. Breathe."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "I counted your stamps. I did not count your sighs."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "The golden shoes are a rumour until the fifth flip-flop."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Wave at a coach if you have a spare thumb. They live for it."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "Schedule is the map. The island is the long way, and it is allowed."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "End the day when the minutes say so. The sunset is not on the payroll."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "You are doing a rare sport called remaining upright near water."

[[lines]]
speaker = "Pip"
tag = "pip"
text = "That is the whole lesson. The rest is company."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Soften the knees. The pose is a place, not a test."

[[lines]]
speaker = "Posey"
tag = "card"
text = "The ring drifts like a polite ghost. Stay inside it."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Chin easy. Shoulders down. The bird is not a grade."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Hold the shape you already have. I am not collecting new ones."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Breathe into the side that feels forgotten."

[[lines]]
speaker = "Posey"
tag = "card"
text = "If you wobble, you are still in the pose. Motion is allowed."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Arms where they rest. Heroic arms are a different class."

[[lines]]
speaker = "Posey"
tag = "card"
text = "The flower opens on your breath, not on my whistle."

[[lines]]
speaker = "Posey"
tag = "card"
text = "In for four. The room can wait."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Out for four. The room can also wait."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Match the guide. Do not race it. It has nowhere to be."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Eyes soft. The mirror is a suggestion box."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Pose two is the same pose with more faith."

[[lines]]
speaker = "Posey"
tag = "card"
text = "When the ring shrinks, you shrink the extra. Keep the centre."

[[lines]]
speaker = "Posey"
tag = "card"
text = "I brought a towel. I did not bring a correction."

[[lines]]
speaker = "Posey"
tag = "card"
text = "The gull is a guest. Guests land. We continue."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Your stillness has a texture. I like this one."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Switch sides when I nod, not when you panic."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Balance is a duet. You lead. The dot follows late, on purpose."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Beautiful is the wrong word. Present will do."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Stay. The pose finishes itself if you let the clock help."

[[lines]]
speaker = "Posey"
tag = "card"
text = "I will count in flowers, not in faults."

[[lines]]
speaker = "Posey"
tag = "card"
text = "Shoulders over hips, hips over the kind part of the mat."

[[lines]]
speaker = "Posey"
tag = "card"
text = "If a tip comes, we restart the breath, not the friendship."

[[lines]]
speaker = "Posey"
tag = "card"
text = "There. That ordinary shape is the one I wrote down."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Ten squats. Down two, up one. I have boiled water with less fuss."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Keep the dot in the band or the rep is a rumour."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Brace. Both sides. A plank with one oar is a swim."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "I am not shouting. This is my indoor voice. It fills a bay."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Tempo is a promise you made to the bell."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "If you flop, you flop. The mat is the landing and the lesson."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Depth, then stand. Do not live in the basement of the rep."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "The ring gets smaller because comfort is a thief."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Hold. Holding is the exercise. Shaking is just weather."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Rep four is where people invent a new hobby. Stay here."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "I count a rep when it is finished, not when it is hoped."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Elbows soft. The floor is not a suspect."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Breathe out on the way up. The kettle whistles, you do not have to."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Again. Again is the whole speech."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "A tip costs you a second and a little pride. Spend both."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "The standoff ends when time says, or when you set the brace down."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "I brought one bell. It only knows how to be proud of you."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Keep the knees tracking the same rumour as the toes."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Slow is not weak. Slow is how the count stays honest."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Last rep. Make it look like the first one paid tuition."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Brace like you are carrying a sleeping gull. No sudden heroics."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "I will not add reps. I will add silence. Use it."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "The band is narrow. So is the path to the kettle. You are on it."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Done is a number, not a feeling. You can have the feeling after."

[[lines]]
speaker = "Kettle"
tag = "card"
text = "Good. Put the day down gently. It is hot."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Left, right, sometimes both. The box has a social life."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Ninety-six beats. Your feet are invited to all of them."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Miss a step and the song forgives you faster than I do. I forgive you immediately."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Spin. Not a sprint. A spin. The ring is the dance floor."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Catch the hoop they throw. It is a compliment with physics."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Two steps a second. Think of a song you can hum without gasping."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Ribbons are for showing off. Crabs are for humility."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "The lagoon path is a lap. The lap is a party with a dress code of shoes."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "If your rate leaves the zone, come back. The zone left the light on."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Both feet means both feet. The chart is not being metaphorical."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "I clapped. That was a perfect. Perfects make me louder."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Direction change! The floatie does not do encores the same way."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Lean in a circle. Your centre is the record spindle."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "The crab has unionised. Give it the lane."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Almost. Almost is my favourite genre. Then we do it again."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Step party rule one: the box does not wait. Rule two: I do."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "You are on beat. I am on a different, worse beat. Ignore me."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Catch seven and I will tell the Commodore you are seaworthy."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "A bump is a crab handshake. You do not have to return it."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Keep the spin inside the band. Too fast is just falling with style."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Lap ribbon ahead. Optional. Your pride is not optional. Mine is."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "Left. Right. Left. The song is a very small novel."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "I brought confetti and then I remembered it was morning. Imaginary confetti."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "The beat missed you and would like to try again."

[[lines]]
speaker = "Bounce"
tag = "card"
text = "There. That was a run. Smile with your ankles."

[[lines]]
speaker = "Gull"
tag = "card"
text = "The shells desire the pools. Tilt the world until desire becomes geography."

[[lines]]
speaker = "Gull"
tag = "card"
text = "A moving pool is still a pool. It simply has ambitions."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Paddle. The gates are suggestions with consequences."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Lean ahead to go. Lean aside to apologise to a gate."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Par is a rumour I started. Beat the rumour."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Wind on the straight. It is not personal. It is Tuesday."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Three boards. More shells each time, because I am a host."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Do not scoop the shells. You are a tide, not a waiter. Marjorie is the waiter."

[[lines]]
speaker = "Gull"
tag = "card"
text = "The splash is the exam. The bounce is the study hall."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Four presses at the bottom. Then leave the board. Commit."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Tuck is a moral stance. Hold it until the water agrees."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Judges have cards and no adjectives. Splash loudly enough to earn a number."

[[lines]]
speaker = "Gull"
tag = "card"
text = "My hat is the only uniform. The lagoon is the only field."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Miss a gate and I add two seconds to your legend. Choose."

[[lines]]
speaker = "Gull"
tag = "card"
text = "The wake behind you should look like you meant it."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Board two drifts. Drift with it. Heroes fight tides and eat sand."

[[lines]]
speaker = "Gull"
tag = "card"
text = "I have never lost a shell. I have misplaced several oceans."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Cannonball scoring is secret. The secret is: be round, be brave, be done."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Three dives. The third one is the one the brochure uses."

[[lines]]
speaker = "Gull"
tag = "card"
text = "If you tip the raft off the map, the map tips back. Stay aboard."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Stars on the water still count. I checked with the resort."

[[lines]]
speaker = "Gull"
tag = "card"
text = "The slalom is straight if you are. This is unfair and traditional."

[[lines]]
speaker = "Gull"
tag = "card"
text = "I salute your splash. I salute it from a safe, dry, higher rock."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Bring the shells home. Then bring yourself. In that order."

[[lines]]
speaker = "Gull"
tag = "card"
text = "Commodore Gull, signing the wind. Try not to capsize the signature."

[[lines]]
speaker = "Marjorie"
tag = "card"
text = "Five glasses. They are smoothies in the way a story is a smoothie. Vaguely."

[[lines]]
speaker = "Marjorie"
tag = "card"
text = "The pier jolts. I did not design the pier. I designed the glasses."

[[lines]]
speaker = "Marjorie"
tag = "card"
text = "Keep them upright and I will keep your secret, which is that you are trying."

[[lines]]
speaker = "Marjorie"
tag = "card"
text = "A spilled glass is a small tragedy with a straw. We continue."

[[lines]]
speaker = "Marjorie"
tag = "card"
text = "Walk the length. The view is free. The balance is not."

[[lines]]
speaker = "Marjorie"
tag = "card"
text = "I named the glasses. You do not need the names. They need you."

[[lines]]
speaker = "Marjorie"
tag = "card"
text = "If all five arrive, the kitchen owes you nothing and I owe you a nod."

[[lines]]
speaker = "Marjorie"
tag = "card"
text = "The jolt is on a schedule. So am I. The glasses are the only innocents."

[[lines]]
speaker = "Tom"
tag = "card"
text = "Brochure sentence: Tippy Cay, where standing is a leisure activity."

[[lines]]
speaker = "Tom"
tag = "card"
text = "I wrote 'azure'. The water wrote back 'not quite'."

[[lines]]
speaker = "Tom"
tag = "card"
text = "Hold still. I am sketching the idea of you, not the wobble."

[[lines]]
speaker = "Tom"
tag = "card"
text = "The slogan cannot be 'please do not tip'. Legal said so."

[[lines]]
speaker = "Tom"
tag = "card"
text = "Day four sells itself. I am only here to hold the adjectives."

[[lines]]
speaker = "Tom"
tag = "card"
text = "If you look majestic, blink twice. The pamphlet needs a masthead."

[[lines]]
speaker = "Tom"
tag = "card"
text = "I will not write about speed. I will write about the pause before it."

[[lines]]
speaker = "Tom"
tag = "card"
text = "Quote me as saying the lagoon was cooperative. It was not. Print it anyway."

[[lines]]
speaker = "Twins"
tag = "card"
text = "We brought one plan and a spare."

[[lines]]
speaker = "Twins"
tag = "card"
text = "Left twin says lean. Right twin says later. Split the difference."

[[lines]]
speaker = "Twins"
tag = "card"
text = "We are not lost. We are auditing the path."

[[lines]]
speaker = "Twins"
tag = "card"
text = "The crab knows us. We respect the crab."

[[lines]]
speaker = "Twins"
tag = "card"
text = "Pass us the pad when the story gets good."

[[lines]]
speaker = "Twins"
tag = "card"
text = "We counted the flip-flops. We will not say the number. It is five."

[[lines]]
speaker = "Twins"
tag = "card"
text = "Our sunglasses have two opinions."

[[lines]]
speaker = "Twins"
tag = "card"
text = "Tell Pip we waved. We did. It counted."

