<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#243846}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}</style></head><body><canvas id="screen"></canvas><script src="../vendor/engine-repo/dist/handoff/my-3d2dge.js"></script><script src="../content/tower.js"></script><script src="../src/simulation.js"></script><script src="../src/presentation.js"></script><script>
const E=My3D2dge;const game=window.game=new E.Game({canvas:'screen',res:[640,480],view:'side',input:'PLATFORMER',loop:false,menu:false,corner:false,fullscreen:false});
const sim=window.sim=new TallTale.Simulation(E,{players:[1]});const p=window.present=new TallTale.Presentation(E,game);game.start({update(dt){game.focus(160,0,128);sim.step(dt,{1:sim.botIntent(1)});p.update(dt,sim);},draw(r){p.draw(r,sim,{title:false});}});
window.nextWindow=()=>{for(let i=0;i<6000&&!sim.actors[0].traversal;i++)game.advance(1/120);game.advance(0,{draw:true});return{tick:sim.tick,traversal:sim.actors[0].traversal,errors:game.errors}};
window.seekThrow=()=>{for(let i=0;i<6000&&!sim.hazards.some(h=>h.type==='boulder'&&h.state==='telegraph');i++)game.advance(1/120);return{tick:sim.tick,hazards:sim.hazards,errors:game.errors}};
</script></body></html>
