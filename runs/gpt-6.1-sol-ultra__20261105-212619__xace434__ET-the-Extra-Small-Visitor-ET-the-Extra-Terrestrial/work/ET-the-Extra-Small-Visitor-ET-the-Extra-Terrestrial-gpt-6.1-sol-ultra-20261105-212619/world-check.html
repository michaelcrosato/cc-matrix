<!doctype html><title>Extra-Small Visitor World Check</title><style>body{margin:0;background:#172d46}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js"}}</script><script type="module">
import * as THREE from 'three';import {createWorld,createKid,createAlien,createGuard,createBike,createProp} from './world.js';
const renderer=new THREE.WebGPURenderer({antialias:true});renderer.setSize(1280,800);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);await renderer.init();
const scene=new THREE.Scene(),world=createWorld(scene);const kid=createKid();kid.root.position.set(0,0,22);scene.add(kid.root);const alien=createAlien();alien.root.position.set(2,0,20);scene.add(alien.root);const guard=createGuard();guard.root.position.set(-3,0,5);scene.add(guard.root);const bike=createBike();bike.root.position.set(6,0,19);scene.add(bike.root);for(const [k,x,z] of [['toy',-22,10],['record',22,4],['antenna',-16,-12]]){let p=createProp(k);p.position.set(x,.4,z);scene.add(p);}
const camera=new THREE.PerspectiveCamera(43,1280/800,.1,500);camera.position.set(26,28,49);camera.lookAt(0,3,1);await renderer.renderAsync(scene,camera);window.worldCheck={ok:true,backend:renderer.backend.isWebGPUBackend?'WebGPU':'WebGL',objects:0};scene.traverse(o=>{if(o.isMesh)window.worldCheck.objects++});window.renderView=async(x,y,z,tx=0,ty=2,tz=10)=>{camera.position.set(x,y,z);camera.lookAt(tx,ty,tz);world.update(.016,1);kid.animate(.1,{moving:true});alien.animate(.1,{});bike.animate(.1,{moving:true});await renderer.renderAsync(scene,camera)};
</script>
