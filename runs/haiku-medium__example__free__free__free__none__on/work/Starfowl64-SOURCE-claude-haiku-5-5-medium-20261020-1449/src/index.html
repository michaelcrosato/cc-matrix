<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Starfowl 64</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="overlay" class="overlay hidden"></div>

  <div id="touch-block" class="screen hidden">
    <div class="panel">
      <h1>Starfowl 64</h1>
      <p class="big">Controller or keyboard required</p>
      <p>This demo is designed for a PS5-compatible controller or a keyboard. Touch controls are not supported.</p>
      <button class="btn" data-action="settings">Settings</button>
    </div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
