[[line]]
set = "corridor"
[[line]]
music = "tense"
[[line]]
cue = "thunder"
[[line]]
flash = 1
[[line]]
shake = 1
[[line]]
who = "narrator"
text = "At 2:40 in the morning, Grain Terminal Two stops being a building. They hear it at Mercy Harbor before they see it. The windows on the east side bow in, consider it, and hold."
[[line]]
enter = "teddy"
at = "right"
[[line]]
who = "teddy"
expr = "alarmed"
text = "Okay! Okay okay okay. That's eleven. Eleven on trolleys, and they're lining them up by the lifts, and someone's asked me for a form, and I don't think we have that form!"
[[line]]
enter = "mara"
at = "left"
[[line]]
who = "mara"
expr = "alarmed"
text = "Who's worst?"
[[line]]
who = "teddy"
expr = "alarmed"
text = "Foreman. Gideon Marr. He went back in. For the lunch tins, Mara. For the night shift's lunch tins. He's got most of a conveyor in his chest."
[[line]]
who = "mara"
expr = "alarmed"
text = "For the lunch tins."
[[line]]
who = "teddy"
expr = "alarmed"
text = "Eleven tins! He had them all in his coat! He wouldn't let the paramedics take the coat!"
[[line]]
enter = "bashir"
at = "centre"
[[line]]
who = "bashir"
expr = "stern"
text = "There is no attending, Doctor. There is no theatre, either: we are setting up behind that curtain. This is a corridor with ambitions."
[[line]]
who = "mara"
expr = "neutral"
text = "Then get me a scanner and get me a light. Teddy. Breathe."
[[line]]
who = "teddy"
expr = "soft"
text = "I'm breathing. I'm the only one here who's supposed to be doing it for someone else, but I'm breathing."
