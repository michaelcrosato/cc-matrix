[[line]]
set = "nightward"
[[line]]
music = "tense"
[[line]]
enter = "voss"
at = "right"
[[line]]
enter = "mara"
at = "left"
[[line]]
who = "narrator"
text = "Below the morgue level there is a lift the building's plans do not include. It smells of cold iron and old rain. It stops at a floor with no number."
[[line]]
who = "mara"
expr = "alarmed"
text = "This isn't on the fire map."
[[line]]
who = "voss"
expr = "neutral"
text = "Very little of importance is. Mercy Harbor's founders built this theatre for cases that could not exist. We call it the Night Ward, because we are not a poetic profession."
[[line]]
who = "voss"
expr = "stern"
text = "We call it Requiem. Recombinant Enzymatic Quiescent Immuno-Evasive Microfilaria. It is the only organism ever designed to keep time."
[[line]]
who = "mara"
expr = "alarmed"
text = "Keep time for what?"
[[line]]
who = "voss"
expr = "stern"
text = "For the end of you, Doctor."
[[line]]
who = "voss"
expr = "neutral"
text = "It entrains to the host's heartbeat and it waits. Each strain plays in its own meter. Introit, three-four, you have met. There are others, named by someone with a sense of occasion."
[[line]]
who = "mara"
expr = "alarmed"
text = "Someone made this?"
[[line]]
who = "voss"
expr = "stern"
text = "Someone paid for it to be made. It is not the same thing. It is a good deal worse."
[[line]]
who = "mara"
expr = "neutral"
text = "And when it went quiet. When everything slowed, and I could hear the one note. What was that?"
[[line]]
who = "voss"
expr = "stern"
text = "That was you, Doctor. It has a name in my notes. I call it the Hush. It is why you are here, and it is what will put you on the floor, so I would be sparing with it."
[[line]]
who = "voss"
expr = "neutral"
text = "Tonight's patient you know. Rosalind Pike came back for a follow-up, and someone seeded her in recovery, in my hospital, on my floor. She is on the table. No guidance this time. There is nobody left who knows how, except, it would appear, you."
[[line]]
who = "mara"
expr = "soft"
text = "I can't hear it from here. I could if I were closer."
[[line]]
who = "voss"
expr = "stern"
text = "Then go and be closer."
