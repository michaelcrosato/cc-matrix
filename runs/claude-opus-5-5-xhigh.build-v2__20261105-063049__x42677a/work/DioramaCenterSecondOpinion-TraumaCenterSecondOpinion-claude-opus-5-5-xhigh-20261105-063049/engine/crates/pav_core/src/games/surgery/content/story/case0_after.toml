[[line]]
set = "scrub"
[[line]]
music = "tender"
[[line]]
enter = "bashir"
at = "right"
[[line]]
enter = "mara"
at = "left"
[[line]]
who = "bashir"
expr = "soft"
text = "Your hands were steady."
[[line]]
who = "mara"
expr = "soft"
text = "They weren't. I was counting his heartbeats."
[[line]]
who = "bashir"
expr = "neutral"
text = "Most people count sutures."
[[line]]
who = "mara"
expr = "alarmed"
text = "Is that wrong? Is that something I should stop doing?"
[[line]]
who = "bashir"
expr = "soft"
text = "I've seen surgeons count their pension, Doctor. Count what you like."
[[line]]
who = "mara"
expr = "neutral"
text = "Seventy-two. He was seventy-two when we started. A little sharp around the second hook, then he came back. Did you hear it?"
[[line]]
who = "bashir"
expr = "neutral"
text = "I heard a monitor, Doctor."
[[line]]
who = "mara"
expr = "soft"
text = "Yes. Of course. So did I."
[[line]]
who = "bashir"
expr = "neutral"
text = "The porters are saying your name, Doctor."
[[line]]
who = "mara"
expr = "alarmed"
text = "Which name?"
[[line]]
who = "bashir"
expr = "neutral"
text = "They're still working on it."
[[line]]
who = "narrator"
text = "Anton Deverell's hand opened and closed at 4:10 in the morning. He asked who to thank. Nobody on the night shift was willing to be named."
