# In-op callouts, by trigger. `nurse` is whoever is calling the operation: Bashir, until he is the
# patient. One line is picked at random each time.
[wrong_tool]
lines = [["nurse", "Wrong instrument, Doctor."], ["nurse", "Not that one, Doctor."], ["nurse", "Doctor. The other one."]]
[healthy]
lines = [["nurse", "Doctor, that's healthy tissue."], ["nurse", "That was healthy, Doctor. It was."]]
[off_axis]
lines = [["nurse", "Along the barb, Doctor. Along it."], ["nurse", "You tore it. Steady."]]
[sloppy_suture]
lines = [["nurse", "That stitch will leak, Doctor."]]
[overheat]
lines = [["nurse", "Too long. You've burned him."], ["nurse", "Let go sooner, Doctor."]]
[overdose]
lines = [["teddy", "Whoa, whoa, that's too much, that's a lot of drug, that's all the drug."]]
[found]
lines = [["nurse", "There. On the monitor."], ["nurse", "Found one. Eight seconds, Doctor."]]
[immaculate]
lines = [["nurse", "Clean. Again."], ["nurse", "Immaculate, Doctor."], ["nurse", "...Doctor."], ["teddy", "Okay. Okay! Who is she?"]]
[clean]
lines = [["nurse", "Clean."], ["nurse", "Good hands, Doctor."], ["nurse", "Next."]]
[burst]
lines = [["nurse", "Burst! Caustic on the field!"], ["teddy", "That one's crying acid! That's new! I hate that!"]]
[eye_open]
lines = [["nurse", "The eye! Across it, Doctor. Now."], ["mara", "It's looking at me. Bashir, it's looking at me."]]
[missed_pull]
lines = [["nurse", "Too slow. The shell's back."]]
[lift_off]
lines = [["pet", "Lift off! Lift off!"], ["nurse", "Lift off! Lift off!"]]
[scorched]
lines = [["nurse", "Hands up on the ring, Doctor."], ["pet", "I said lift. It's a very short word."]]
[diastole]
lines = [["pet", "Not against the beat! Wait for it to breathe!"], ["teddy", "Diastole! Pull in diastole! The squishy part!"]]
[vitals_forty]
lines = [["nurse", "Vitals at forty. Push the IV. Now!"], ["teddy", "Forty! Forty and falling! IV, IV, IV!"]]
[code]
lines = [["teddy", "He's flat! Paddles, paddles, paddles!"], ["nurse", "Charge. Both triggers. On the ghost."]]
[code_back]
lines = [["teddy", "Sinus rhythm! Oh, I love you. I love all of you."], ["nurse", "We have a rhythm, Doctor."]]
[code_again]
lines = [["nurse", "Again. Charge it first, then let go on the line."]]
[next_shock]
lines = [["teddy", "Still flat! Again!"], ["pet", "Again. It's listening. Make it hear you."]]
[defib_miss]
lines = [["teddy", "That didn't take! On the line, on the line!"]]
[time_up]
lines = [["nurse", "That's the time, Doctor."]]
[codeblue_tempo]
lines = [["teddy", "It's getting faster! Why is it getting faster!"], ["nurse", "Pace is up. Stay with it."]]
[codeblue_finale]
lines = [["nurse", "Something's moving under there. Scanner's clean. It's the waltz."]]
