at = "left"
[[line]]
who = "bashir"
expr = "alarmed"
text = "Exhaustion. Her pressure's in the floor. She held the Hush for eleven minutes on no sleep. Chief, nobody's built for this."
[[line]]
who = "voss"
expr = "stern"
text = "No."
[[line]]
who = "bashir"
expr = "stern"
text = "She's twenty-eight, Chief. She asked me last week if it was normal to hear the radiators."
[[line]]
who = "voss"
expr = "neutral"
text = "And what did you tell her?"
[[line]]
who = "bashir"
expr = "neutral"
text = "I told her they want bleeding."
[[line]]
who = "voss"
expr = "neutral"
text = "There are three more strains, Mr. Haddad, and I have one surgeon, and she is on the floor. Get your coat."
[[line]]
who = "bashir"
expr = "neutral"
text = "Where are we going, Chief?"
[[line]]
who = "voss"
expr = "stern"
text = "To the bus depot on Cooper Street. We need a second opinion."
