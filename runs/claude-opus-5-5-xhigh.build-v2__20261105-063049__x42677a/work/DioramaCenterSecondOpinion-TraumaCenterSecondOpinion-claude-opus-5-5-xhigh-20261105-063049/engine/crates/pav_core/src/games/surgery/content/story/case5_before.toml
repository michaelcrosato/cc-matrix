[[line]]
set = "depot"
[[line]]
music = "tender"
[[line]]
cue = "thunder"
[[line]]
who = "narrator"
text = "Three in the morning, the Cooper Street bus depot. The last route stopped running in the spring. The tea machine has not been told."
[[line]]
enter = "pet"
at = "right"
[[line]]
who = "pet"
expr = "stern"
text = "This tea is an insult. I've been coming here for it for six years. Don't sit there, young man, that's the bench I'm disappointed on."
[[line]]
enter = "bashir"
at = "left"
[[line]]
who = "bashir"
expr = "neutral"
text = "Dr. Nwosu. My name is Bashir Haddad. I was told you would say no."
[[line]]
who = "pet"
expr = "neutral"
text = "I say no to everyone. Look. No."
[[line]]
who = "bashir"
expr = "neutral"
text = "I've read your Ostend notes, Doctor. Forty-one hours, eleven tables, on a ferry listing nine degrees."
[[line]]
who = "pet"
expr = "stern"
text = "Then you've read fiction. It was twelve tables, and it was fourteen degrees, and I was sick in a bucket between the seventh and the eighth."
[[line]]
enter = "voss"
at = "centre"
[[line]]
who = "pet"
expr = "stern"
text = "Ah. Ottoline. I smelled the starch from the road."
[[line]]
who = "voss"
expr = "stern"
text = "Perpetua."
[[line]]
who = "pet"
expr = "stern"
text = "You've got old. It suits you. It's the first thing that has."
[[line]]
who = "voss"
expr = "neutral"
text = "I have a longshoreman with a shattered femur, and on his second film something is growing in the marrow, and it is keeping time."
[[line]]
who = "pet"
expr = "alarmed"
text = "...In what meter?"
[[line]]
who = "voss"
expr = "stern"
text = "That's why I'm here."
[[line]]
who = "bashir"
expr = "neutral"
text = "Three minutes, Doctor. You lasted three minutes."
[[line]]
who = "pet"
expr = "stern"
text = "Be quiet, young man. I'm being appalled."
[[line]]
who = "pet"
expr = "neutral"
text = "I have buried better surgeons than you, and I liked them less. Look at this hand. Go on, look at it. It shakes. It has shaken since the Ostend ferry. I haven't held a scalpel in nine years."
[[line]]
who = "bashir"
expr = "soft"
text = "I'll hold it for you, Doctor. Until you want it."
[[line]]
who = "pet"
expr = "soft"
text = "...Hm. You're the one who says Doctor."
[[line]]
who = "pet"
expr = "stern"
text = "Scalpel. Oh, don't look so pleased. And somebody bring that machine's tea, I'm not done hating it."
