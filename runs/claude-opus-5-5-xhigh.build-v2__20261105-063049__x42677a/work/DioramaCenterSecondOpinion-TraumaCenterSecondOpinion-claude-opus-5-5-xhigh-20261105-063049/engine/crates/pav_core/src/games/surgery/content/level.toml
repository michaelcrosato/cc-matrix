# The operating room for the wide shots, far from the field, so it is on screen only when a story
# camera looks at it. Puppets in scrubs stand around a table built from blocks.
# Check it with `pav room_check path=crates/pav_core/src/games/surgery/content/level.toml`.
name = "The Operating Room"
about = "Mercy Harbor General, theatre three."
entrance = { at = [8, 12], facing = "south" }

[view]
sky = "#10282c"

[layout]
origin = [86.0, 0.0, -9.0]

[[layout.layer]]
y = 0
map = '''
################
#..............#
#.ss........ss.#
#..............#
#.....TTTT.....#
#.....TTTT.....#
#..............#
#..............#
#.ll........ll.#
#..............#
#..............#
#..............#
################
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2f5a5c" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2f5a5c" }, { y0 = 0, y1 = 4.5, color = "#7fa3a0" }]

[layout.legend.'T']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2f5a5c" }, { y0 = 0, y1 = 0.95, color = "#2f7f84", rounded = true }]

[layout.legend.'s']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2f5a5c" }, { y0 = 0, y1 = 1.5, color = "#5c6a70", rounded = true }]

[layout.legend.'l']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2f5a5c" }, { y0 = 0, y1 = 0.8, color = "#a0aab0" }]

[[npc]]
name = "surgeon"
pos = [5.5, 0, 3.6]
yaw = 180
clips = ["MESH2MOTION/Idle_Talking"]
look = { shirt = "#2e9692", pants = "#2e9692", skin = "#f2c8ac" }

[[npc]]
name = "nurse"
pos = [10.5, 0, 3.6]
yaw = 180
clips = ["QUATERNIUS/Idle_Loop"]
look = { shirt = "#3c68a4", pants = "#3c68a4", skin = "#be8e68" }

[[npc]]
name = "gas"
pos = [8.0, 0, 7.4]
yaw = 0
clips = ["QUATERNIUS/Idle_Loop"]
look = { shirt = "#5c8a54", pants = "#5c8a54", skin = "#e0b896" }

[[npc]]
name = "chief"
pos = [13.2, 0, 8.6]
yaw = 300
clips = ["MESH2MOTION/Idle_Talking"]
look = { shirt = "#c8ccd4", pants = "#30343c", skin = "#e8c8b0" }

[[object]]
