[[line]]
set = "corridor"
[[line]]
music = "tense"
[[line]]
cue = "thunder"
[[line]]
flash = 0.8
[[line]]
who = "narrator"
text = "Port Verity. Mercy Harbor General. The storm has been in the city for nine days, and the city has stopped expecting anything else."
[[line]]
enter = "mara"
at = "left"
[[line]]
who = "mara"
expr = "neutral"
text = "Second year. Four hundred and twelve nights in this building, and I can still tell you which radiator is flat by a semitone. It is the one outside Theatre Three. It has never once been fixed."
[[line]]
enter = "bashir"
at = "right"
[[line]]
who = "bashir"
expr = "neutral"
text = "Doctor."
[[line]]
who = "mara"
expr = "alarmed"
text = "Bashir. Where's Dr. Oyelaran? The board says there's a hand on the way up. A forearm. The board says \"attending.\""
[[line]]
who = "bashir"
expr = "stern"
text = "The attending is elbow-deep in a bus driver. This one's yours, Doctor."
[[line]]
who = "mara"
expr = "alarmed"
text = "Mine. As in... by myself. Solo. With the hands I have."
[[line]]
who = "bashir"
expr = "neutral"
text = "Those are the ones I'd bring."
[[line]]
who = "mara"
expr = "alarmed"
text = "I once dropped a retractor into a patient's lunch."
[[line]]
who = "bashir"
expr = "soft"
text = "He enjoyed the lunch. A net-mender off Pier Nine, Doctor. A winch let go in the wind. He has hooks in him to the elbow and he is apologising to the porters."
[[line]]
who = "mara"
expr = "neutral"
text = "What's his pressure?"
[[line]]
who = "bashir"
expr = "neutral"
text = "Ask him. He'll apologise for it."
[[line]]
who = "mara"
expr = "soft"
text = "My father tuned pianos, Bashir. In this city, in this weather. He used to say a string doesn't care how frightened you are. It only cares where you put your hand."
[[line]]
who = "bashir"
expr = "neutral"
text = "Then put it where I tell you. Scrub in. I'll hand you everything but the nerve."
