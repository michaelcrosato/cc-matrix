[[line]]
set = "corridor"
[[line]]
music = "tense"
[[line]]
cue = "alarm"
[[line]]
flash = 0.8
[[line]]
enter = "teddy"
at = "right"
[[line]]
who = "teddy"
expr = "alarmed"
text = "He just went down. He was reading the card, and he said \"Doctor,\" and he went down. Bashir's on the floor. He's got everything. Pet says everything. All of them at once, in his chest, and the monitor's changing key."
[[line]]
enter = "pet"
at = "centre"
[[line]]
who = "pet"
expr = "stern"
text = "The flowers. Very nice. She sent them to the man who hands us our instruments."
[[line]]
who = "teddy"
expr = "alarmed"
text = "They're still up there. They're on the table in the scrub room. They smell amazing. I smelled them! Should I be worried? I smelled them a lot!"
[[line]]
who = "pet"
expr = "neutral"
text = "Burn them. Then come back and be useful."
[[line]]
enter = "mara"
at = "left"
[[line]]
who = "mara"
expr = "neutral"
text = "Where is he?"
[[line]]
who = "teddy"
expr = "alarmed"
text = "Mara! You're... you were in a coma! Sort of! You should be sitting!"
[[line]]
who = "mara"
expr = "stern"
text = "I heard him. Through two floors. He's a whole step flat, and he's never flat. Where is he?"
[[line]]
who = "pet"
expr = "neutral"
text = "So you're the frightened child."
[[line]]
who = "mara"
expr = "stern"
text = "Yes."
[[line]]
who = "pet"
expr = "soft"
text = "Good. Stay that way. It's the ones who stop that kill people."
[[line]]
who = "mara"
expr = "neutral"
text = "He told me a string doesn't care how frightened you are. No. That was my father. Bashir told me to scrub in."
[[line]]
who = "pet"
expr = "stern"
text = "Both sound like sensible men. Scrub in."
[[line]]
camera = "or"
[[line]]
who = "narrator"
text = "Theatre Three. The light comes on. For the first time in twenty-two years there is no one standing at the tray."
[[line]]
camera = "paper"
[[line]]
who = "mara"
expr = "stern"
text = "Scalpel."
[[line]]
who = "narrator"
text = "Nobody hands it to her."
[[line]]
who = "teddy"
expr = "soft"
text = "...I'll do it. I've seen it done. Mostly."
[[line]]
who = "mara"
expr = "soft"
text = "Thank you, Teddy."
[[line]]
who = "pet"
expr = "stern"
text = "Well? Your hands, my dear. My hands. There's a man on that table who would have corrected both of us by now. Let's not keep him waiting."
