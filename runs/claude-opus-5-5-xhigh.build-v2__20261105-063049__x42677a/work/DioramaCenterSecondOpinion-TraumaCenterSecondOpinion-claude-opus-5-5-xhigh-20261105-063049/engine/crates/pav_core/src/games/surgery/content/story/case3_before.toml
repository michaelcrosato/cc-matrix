[[line]]
set = "atrium"
[[line]]
music = "tender"
[[line]]
enter = "vane"
at = "right"
[[line]]
who = "vane"
expr = "soft"
text = "To the night staff of Mercy Harbor. No, don't get up, don't you dare, you've been on your feet since the terminal. I only wanted to see the people who do it."
[[line]]
enter = "mara"
at = "left"
[[line]]
who = "mara"
expr = "alarmed"
text = "Mrs. Vane. It's... I'm only here for the canapés. I should be on the ward, I'm not really dressed for a wing."
[[line]]
who = "vane"
expr = "soft"
text = "You must be Dr. Quill. Eleven men from Grain Terminal Two wrote to my Foundation about you. Handwritten. Do you know how rarely anyone handwrites a thing to money?"
[[line]]
who = "mara"
expr = "soft"
text = "I had a good nurse."
[[line]]
who = "vane"
expr = "soft"
text = "Everyone says that. Almost no one means it. Do have the little ones with the fig. I had them flown in, and I've been told that's obscene."
[[line]]
who = "vane"
expr = "soft"
text = "You had good hands. I can always tell. My whole life I've been around people who make things keep time: clockmakers, conductors. You have a lovely ear, Doctor. I do hope you're looked after."
[[line]]
who = "narrator"
text = "Cordelia Vane smiled, and a wing of the hospital smiled with her. It was the warmest thing that had happened to Mara Quill all year."
[[line]]
enter = "teddy"
at = "farright"
[[line]]
who = "teddy"
expr = "soft"
text = "I've had nine of the fig things. Does anyone know what they cost? I'm asking as a person who just ate about a car."
[[line]]
exit = "teddy"
[[line]]
exit = "vane"
[[line]]
enter = "bashir"
at = "right"
[[line]]
who = "bashir"
expr = "neutral"
text = "Doctor. Courier from the Foundation, as it happens. Ines Calloway. A benign mass of the liver: elective, forty minutes, home for breakfast."
[[line]]
who = "mara"
expr = "neutral"
text = "Benign."
[[line]]
who = "bashir"
expr = "neutral"
text = "It says so on the film. In three places."
[[line]]
who = "mara"
expr = "neutral"
text = "That's a lot of places to say it."
[[line]]
who = "bashir"
expr = "neutral"
text = "Yes, Doctor. That's what I thought."
