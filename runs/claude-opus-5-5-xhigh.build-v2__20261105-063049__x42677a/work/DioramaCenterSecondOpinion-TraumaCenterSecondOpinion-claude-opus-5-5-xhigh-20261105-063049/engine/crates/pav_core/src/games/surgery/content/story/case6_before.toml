[[line]]
set = "nightward"
[[line]]
music = "tense"
[[line]]
enter = "pet"
at = "left"
[[line]]
enter = "voss"
at = "right"
[[line]]
who = "pet"
expr = "stern"
text = "A pericardium full of embers. Eleven years, by that scar tissue. You've been walking around with this for eleven years, and you've been lecturing people about adequate."
[[line]]
who = "voss"
expr = "neutral"
text = "Eleven years, four months. I know, because I built its entrainment. The Foundation paid for my lab, and it was the finest lab I ever saw, and I was forty-seven and I wanted to be the first to make a thing that keeps time. I never asked what it was timing."
[[line]]
who = "pet"
expr = "alarmed"
text = "You made this."
[[line]]
who = "voss"
expr = "neutral"
text = "Say it however you like, Perpetua. I have said it to myself more ways than you know."
[[line]]
who = "voss"
expr = "stern"
text = "I made its heart. And when I tried to stop, it was explained to me what would happen. I was shown a very small sample, and then I was shown a very small scar."
[[line]]
who = "pet"
expr = "stern"
text = "Give me one reason."
[[line]]
who = "voss"
expr = "soft"
text = "You'll need my notes. I can only dictate them if I'm breathing."
[[line]]
who = "pet"
expr = "stern"
text = "You'll dictate them awake, then. Local only. I want to see your face."
[[line]]
who = "voss"
expr = "soft"
text = "You always did have such a lovely bedside manner."
[[line]]
enter = "teddy"
at = "farright"
[[line]]
who = "teddy"
expr = "alarmed"
text = "Her temperature's doing something. It's going up in fives. Like, on purpose. It's counting."
[[line]]
who = "voss"
expr = "stern"
text = "If I die on your table, Perpetua, you'll have to fill out the form."
[[line]]
who = "pet"
expr = "soft"
text = "I have been looking forward to it."
