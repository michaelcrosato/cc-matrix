at = "centre"
[[line]]
who = "teddy"
expr = "soft"
text = "She said it to me once. Well. She said \"you again.\" I had it put on a mug."
[[line]]
who = "mara"
expr = "soft"
text = "Bashir. The artery. I knew a full second before it went. Is that... do people get that?"
[[line]]
who = "bashir"
expr = "neutral"
text = "People get all sorts of things at four in the morning, Doctor. Mostly soup."
