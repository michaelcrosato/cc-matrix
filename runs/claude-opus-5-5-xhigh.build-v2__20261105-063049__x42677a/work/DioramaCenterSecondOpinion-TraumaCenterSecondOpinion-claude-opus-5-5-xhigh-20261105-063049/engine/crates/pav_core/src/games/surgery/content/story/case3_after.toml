[[line]]
who = "mara"
expr = "alarmed"
text = "It moved. You saw it. It split, and it walked, and it kept time, Bashir, it was keeping time with her heart!"
[[line]]
who = "teddy"
expr = "alarmed"
text = "I would like it noted that I said waltz. On the record. Is there a record?"
[[line]]
enter = "voss"
at = "centre"
[[line]]
who = "voss"
expr = "stern"
text = "There is no record."
[[line]]
who = "bashir"
expr = "stern"
text = "Chief, the patient..."
[[line]]
who = "voss"
expr = "neutral"
text = "Is alive, and will be told she had a very ordinary morning. See that she has one."
[[line]]
who = "voss"
expr = "stern"
text = "Theatre Three is sealed until morning. The film is lost. The specimen was benign. You will wash your hands, you will sign nothing, and you will tell no one what you did not see in this room."
[[line]]
who = "mara"
expr = "alarmed"
text = "Chief. Time stopped. There was a... it went quiet, everything went quiet, and I could hear..."
[[line]]
who = "voss"
expr = "neutral"
text = "Yes. I know what you could hear."
[[line]]
exit = "voss"
[[line]]
who = "teddy"
expr = "soft"
text = "Did she just... did she say she knows?"
[[line]]
who = "mara"
expr = "soft"
text = "She wasn't surprised. Bashir. A liver got up and walked, and she came down in her good shoes."
[[line]]
who = "bashir"
expr = "neutral"
text = "Wash your hands, Doctor."
